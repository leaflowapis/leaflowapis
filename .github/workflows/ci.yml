name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install pyyaml
      - run: |
          python3 - <<'PY'
          import pathlib, sys, yaml
          bad = []
          specs = sorted(pathlib.Path(".").glob("leaflow/**/openapi.yaml"))
          if not specs:
              sys.exit("No contracts found. Expected layout: leaflow/<service>[/<subpackage>]/<version>/openapi.yaml")
          for spec in specs:
              try:
                  doc = yaml.safe_load(spec.read_text(encoding="utf-8"))
              except yaml.YAMLError as err:
                  bad.append(f"{spec}: failed to parse: {err}")
                  continue
              for key in ("openapi", "info", "paths"):
                  if key not in doc:
                      bad.append(f"{spec}: missing {key}")
              print(f"{spec}  {len(doc.get('paths') or {})} paths")
          if bad:
              print("\n".join(bad), file=sys.stderr)
              sys.exit(1)
          PY
      - name: Check SWAS contract
        run: python3 tests/test_swas_contract.py .
