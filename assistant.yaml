        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 上传图片
      tags:
        - Attachment
  /v1/attachments/{attachment}:
    get:
      description: 按附件 id 取回原始字节，可直接作为 <img> 的地址使用。响应带长期缓存头，附件内容不会变化。附件不存在或不属于当前用户时返回 404。
      operationId: download-attachment
      parameters:
        - in: path
          name: attachment
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 取回图片
      tags:
        - Attachment
  /v1/bindings:
    get:
      description: 接入面那张表按通道列出各自绑了谁时用 channelId 过滤。
      operationId: list-bindings
      parameters:
        - description: 这一页最多返回多少条
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: 这一页最多返回多少条
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - description: 跳过多少条。要翻得更深请改用游标翻页的接口
          explode: false
          in: query
          name: offset
          schema:
            description: 跳过多少条。要翻得更深请改用游标翻页的接口
            format: int64
            maximum: 10000
            minimum: 0
            type: integer
        - explode: false
          in: query
          name: platform
          schema:
            type: string
        - explode: false
          in: query
          name: channelId
          schema:
            format: uuid
            type: string
        - description: 仅返回处于活跃状态的绑定
          explode: false
          in: query
          name: active
          schema:
            description: 仅返回处于活跃状态的绑定
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LengthAwarePageBindingResource"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 列出绑定
      tags:
        - Onboarding
  /v1/bindings/{binding}:
    delete:
      operationId: delete-binding
      parameters:
        - in: path
          name: binding
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 解除绑定
      tags:
        - Onboarding
    get:
      operationId: get-binding
      parameters:
        - in: path
          name: binding
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindingResource"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 查看绑定
      tags:
        - Onboarding
  /v1/channels:
    get:
      operationId: list-channels
      parameters:
        - description: 这一页最多返回多少条
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: 这一页最多返回多少条
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - description: 跳过多少条。要翻得更深请改用游标翻页的接口
          explode: false
          in: query
          name: offset
          schema:
            description: 跳过多少条。要翻得更深请改用游标翻页的接口
            format: int64
            maximum: 10000
            minimum: 0
            type: integer
        - explode: false
          in: query
          name: platform
          schema:
            type: string
        - description: 仅返回处于启用状态的通道
          explode: false
          in: query
          name: active
          schema:
            description: 仅返回处于启用状态的通道
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LengthAwarePageChannelResource"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 列出通道
      tags:
        - Onboarding
    post:
      description: 回调密钥归谁定由平台决定，见 list-platforms 的 secretSource：generated 的平台不要传 webhookSecret，我们生成的那把仅在本次响应中返回一次、之后无法再次取回，错过了只能调轮换接口换一把新的；supplied 的平台必须把平台后台那把传进来，此时响应里的webhookSecret 为 null。
      operationId: create-channel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelRequestBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelWithSecretResponseBody"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 创建通道
      tags:
        - Onboarding
  /v1/channels/{channel}:
    delete:
      description: 删除后该通道不再接收入站消息，其上的绑定一并失效。项目处于停服或清理状态时本接口仍然可用。
      operationId: delete-channel
      parameters:
        - in: path
          name: channel
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 删除通道
      tags:
        - Onboarding
    get:
      operationId: get-channel
      parameters:
        - in: path
          name: channel
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelResource"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 查看通道
      tags:
        - Onboarding
    patch:
      description: 只修改传了的字段。senderPolicy 与 allowFrom 是一对，由 senderPolicy 决定是否替换；改动对常驻连接要等连接重建后才生效，回调型平台立即生效。
      operationId: update-channel
      parameters:
        - in: path
          name: channel
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChannelRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelResource"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 修改通道
      tags:
        - Onboarding
  /v1/channels/{channel}/binding-codes:
    post:
      description: 生成一个一次性绑定码交给待绑定的人，他在该平台上用自己的账号把这个码发给助手即完成绑定。绑定只能由本人以这种方式建立，不能直接指定平台账号。绑定码有有效期，过期后需重新签发。
      operationId: create-binding-code
      parameters:
        - in: path
          name: channel
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindingCodeResponseBody"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 签发绑定码
      tags:
        - Onboarding
  /v1/channels/{channel}/rejections:
    get:
      description: 排查「发了消息但助手没有响应」时使用。按时间倒序返回最近被这条通道拒绝的入站消息及其拒绝原因，最常见的原因是发送方尚未绑定。
      operationId: list-channel-rejections
      parameters:
        - in: path
          name: channel
          required: true
          schema:
            format: uuid
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 100
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RejectionListResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 查看最近被拒绝的入站消息
      tags:
        - Onboarding
  /v1/channels/{channel}/secret:
    post:
      description: 换一把新的回调密钥，旧的立即失效，通道降回待平台确认状态。密钥归谁定由平台决定，见 list-platforms 的 secretSource：generated 的平台不要传请求体，新密钥仅在本次响应中返回、之后无法再次取回；supplied 的平台必须把平台后台那把新密钥传进来。
      operationId: rotate-channel-secret
      parameters:
        - in: path
          name: channel
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateSecretRequestBody"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSecretResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 轮换回调密钥
      tags:
        - Onboarding
  /v1/channels/{channel}/sender-check:
    get:
      description: 改完发件人策略之后用来自查，不发送任何消息、也不改变任何状态：它走的是和真实入站完全相同的那份判定，并说明结论由哪一条规则得出。无法推演绑定码那一条——是否是绑定码取决于对方发来的内容。
      operationId: check-sender
      parameters:
        - in: path
          name: channel
          required: true
          schema:
            format: uuid
            type: string
        - description: 平台上那个人的 id，和绑定、被拒记录里的是同一个值
          explode: false
          in: query
          name: peerId
          required: true
          schema:
            description: 平台上那个人的 id，和绑定、被拒记录里的是同一个值
            type: string
        - description: 仅 Telegram 这类有用户名的平台填得出来，不带 @。留空即当作没有用户名
          explode: false
          in: query
          name: username
          schema:
            description: 仅 Telegram 这类有用户名的平台填得出来，不带 @。留空即当作没有用户名
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SenderCheckResource"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 推演一个发件人会不会被放行
      tags:
        - Onboarding
  /v1/channels/{channel}/weixin-logins:
    post:
      description: 微信个人号通道需要本人扫码登录后才能收发消息。本接口返回二维码，之后轮询 `GET /v1/weixin-logins/{login}` 获取进度；状态提示需要验证码时，调用 `POST /v1/weixin-logins/{login}/verify-code` 补交。
      operationId: begin-weixin-login
      parameters:
        - in: path
          name: channel
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResource"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 发起微信扫码登录
      tags:
        - Onboarding
  /v1/models:
    get:
      description: 返回本平台当前提供的模型及其上下文窗口、推理档位和支持的输入类型。用于填充对话设置里的模型选择。
      operationId: list-models
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelListResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 列出可用模型
      tags:
        - Thread
  /v1/platforms:
    get:
      description: 返回本平台当前支持接入的即时通讯平台，以及各自建通道时要走的流程和要填的凭据字段。新建通道表单完全由这份响应驱动：setupMethod 决定展示录入表单还是扫码流程，credentialFields 是要填的字段，secretSource 决定要不要有回调密钥那一栏。
      operationId: list-platforms
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformListResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 列出可接入的平台
      tags:
        - Onboarding
  /v1/threads:
    get:
      description: 按最近活动排序，只返回当前账号在当前项目里的对话。archived 是一个二选一的开关而不是「包含归档」：归档的对话不出现在默认列表里，要看它们就把这个参数打开。
      operationId: list-threads
      parameters:
        - description: 按标题搜索，大小写不敏感。留空则返回最近的对话
          explode: false
          in: query
          name: q
          schema:
            description: 按标题搜索，大小写不敏感。留空则返回最近的对话
            maxLength: 100
            type: string
        - description: 为真时**只**返回已归档的对话，否则只返回未归档的
          explode: false
          in: query
          name: archived
          schema:
            description: 为真时**只**返回已归档的对话，否则只返回未归档的
            type: boolean
        - explode: false
          in: query
          name: limit
          schema:
            format: int64
            maximum: 200
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadListResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 列出对话
      tags:
        - Thread
    post:
      operationId: create-thread
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateThreadRequestBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadSummaryResource"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 创建对话
      tags:
        - Thread
  /v1/threads/{thread}:
    get:
      description: 对话的完整当前状态，用于首屏渲染。文档中的 stream 给出实时输出地址和入场票据，流推送的是对这份文档的增量编辑，可直接套用同一套渲染逻辑。
      operationId: get-thread
      parameters:
        - in: path
          name: thread
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResource"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 取回对话文档
      tags:
        - Thread
    patch:
      description: 可修改模型、推理档位、审批模式和归档状态。改动从下一次 turn 起生效，正在执行的 turn 沿用它启动时的设置。reasoningEffort 仅在同时提供 model 时生效。
      operationId: update-thread
      parameters:
        - in: path
          name: thread
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateThreadRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadSummaryResource"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 修改对话设置
      tags:
        - Thread
  /v1/threads/{thread}/approvals/{batch}:
    post:
      description: 批次 id 来自对话文档的 wait 字段。本接口是幂等的：重复提交同一批次不会改变已经生效的决定，也不会报错。批次不属于该对话时返回 404。
      operationId: decide-approval
      parameters:
        - in: path
          name: thread
          required: true
          schema:
            type: string
        - in: path
          name: batch
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideRequestBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 批准或拒绝一批工具调用
      tags:
        - Thread
  /v1/threads/{thread}/earlier:
    get:
      description: 首屏只给对话最新的那一段，再往上的内容用本接口按需取回，一次一段。before 用文档里的 earlier.before，响应里的 earlier 是再往上那一段的游标，为 null 表示已经到顶。返回的条目和文档里的 items 是同一种形状，顺序也一样（由旧到新），直接接在现有内容前面即可。
      operationId: list-earlier-items
      parameters:
        - in: path
          name: thread
          required: true
          schema:
            type: string
        - description: 来自文档里的 earlier.before，取这个序号之前的条目
          explode: false
          in: query
          name: before
          required: true
          schema:
            description: 来自文档里的 earlier.before，取这个序号之前的条目
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EarlierResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 取回更早的对话内容
      tags:
        - Thread
  /v1/threads/{thread}/interrupt:
    post:
      description: 对没有正在执行的 turn 的对话调用同样返回 204，不视为错误——用户点击停止与 turn 自然结束之间存在竞争，两种结果一致。项目处于停服或清理状态时本接口仍然可用。
      operationId: interrupt-thread
      parameters:
        - in: path
          name: thread
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 中断正在执行的 turn
      tags:
        - Thread
  /v1/threads/{thread}/messages:
    post:
      description: 立即返回 turnId，不等待执行完成——一次 turn 可能持续数十分钟。执行进度通过对话文档中 stream 指向的实时流获取，不在本响应里。
      operationId: send-message
      parameters:
        - in: path
          name: thread
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequestBody"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnIDResponseBody"
          description: Accepted
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 发送消息并触发一次 turn
      tags:
        - Thread
  /v1/threads/{thread}/questions/{item}:
    post:
      description: 问题 id 来自对话文档的 wait 字段。已被回答过的问题同样返回 204——可能是另一个页面提交在先，也可能是自动应答窗口已到期，两种情况下 turn 都已带着答案继续执行。
      operationId: answer-question
      parameters:
        - in: path
          name: thread
          required: true
          schema:
            type: string
        - in: path
          name: item
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerRequestBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 回答助手提出的问题
      tags:
        - Thread
  /v1/threads/{thread}/read:
    post:
      operationId: mark-thread-read
      parameters:
        - in: path
          name: thread
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 标记对话已读
      tags:
        - Thread
  /v1/threads/{thread}/revert:
    post:
      description: 撤回 ordinal 及其之后的全部条目。被撤回的条目仍留在逐字稿中并标记 reverted，序号不会重排。返回实际撤回的条目数。
      operationId: revert-thread
      parameters:
        - in: path
          name: thread
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevertRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevertedCountResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 从指定位置起撤回
      tags:
        - Thread
  /v1/weixin-logins/{login}:
    get:
      description: 轮询本接口直到状态变为成功或失败。状态提示需要验证码时，调用补交验证码接口。
      operationId: get-weixin-login
      parameters:
        - in: path
          name: login
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResource"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 查询扫码登录状态
      tags:
        - Onboarding
  /v1/weixin-logins/{login}/verify-code:
    post:
      description: 微信在扫码后要求短信或设备验证码时使用。验证码由登录发起人在自己手机上获取。
      operationId: submit-weixin-verify-code
      parameters:
        - in: path
          name: login
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyCodeRequestBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResource"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 补交登录验证码
      tags:
        - Onboarding
security:
  - bearerAuth: []

