      required:
        - code
        - expiresAt
      type: object
    BindingResource:
      additionalProperties: false
      properties:
        channelId:
          format: uuid
          type: string
        connState:
          enum:
            - logged_out
            - qr_pending
            - online
            - expired
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        peerName:
          type: string
        platform:
          type: string
        status:
          enum:
            - pending
            - active
            - revoked
          type: string
        verifiedAt:
          format: date-time
          type:
            - string
            - "null"
      required:
        - id
        - channelId
        - platform
        - peerName
        - status
        - connState
        - verifiedAt
        - createdAt
      type: object
    ChannelResource:
      additionalProperties: false
      properties:
        allowFrom:
          items:
            type: string
          type:
            - array
            - "null"
        connState:
          description: 平台接入状态。只有 online 才收得到消息、也才签得出绑定码
          enum:
            - logged_out
            - qr_pending
            - online
            - expired
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        name:
          type: string
        platform:
          type: string
        runtimeState:
          description: 常驻连接此刻的状态。回调型平台恒为 stopped
          enum:
            - stopped
            - running
          type: string
        senderPolicy:
          enum:
            - bound_only
            - open
          type: string
        status:
          enum:
            - active
            - suspended
            - disabled
          type: string
        updatedAt:
          format: date-time
          type: string
        webhookPath:
          description: 回调路径，网关配置和排查时用
          type: string
        webhookUrl:
          description: 填到平台后台的回调地址。部署未声明公网入口时为 null
          type:
            - string
            - "null"
      required:
        - id
        - platform
        - name
        - status
        - connState
        - runtimeState
        - senderPolicy
        - allowFrom
        - webhookUrl
        - webhookPath
        - createdAt
        - updatedAt
      type: object
    ChannelWithSecretResponseBody:
      additionalProperties: false
      properties:
        allowFrom:
          items:
            type: string
          type:
            - array
            - "null"
        connState:
          description: 平台接入状态。只有 online 才收得到消息、也才签得出绑定码
          enum:
            - logged_out
            - qr_pending
            - online
            - expired
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        name:
          type: string
        platform:
          type: string
        runtimeState:
          description: 常驻连接此刻的状态。回调型平台恒为 stopped
          enum:
            - stopped
            - running
          type: string
        senderPolicy:
          enum:
            - bound_only
            - open
          type: string
        status:
          enum:
            - active
            - suspended
            - disabled
          type: string
        updatedAt:
          format: date-time
          type: string
        webhookPath:
          description: 回调路径，网关配置和排查时用
          type: string
        webhookSecret:
          description: 我们生成的那把回调密钥，拿去粘到平台后台。**之后无法再次取回**，只能轮换出新的一把。密钥由平台生成（secretSource=supplied）或该平台不走回调时为 null
          type:
            - string
            - "null"
        webhookUrl:
          description: 填到平台后台的回调地址。部署未声明公网入口时为 null
          type:
            - string
            - "null"
      required:
        - webhookSecret
        - id
        - platform
        - name
        - status
        - connState
        - runtimeState
        - senderPolicy
        - allowFrom
        - webhookUrl
        - webhookPath
        - createdAt
        - updatedAt
      type: object
