# Protobuf contracts in this repository: the Fleet protocol spoken by the
# Leaflow Fleet Agent, participants and the Fleet service, and its desktop
# feature, VirtualDesktop. The OpenAPI contracts are not part of this module.
version: v2
modules:
  - path: .
deps:
  - buf.build/googleapis/googleapis
lint:
  use:
    - STANDARD
breaking:
  use:
    - FILE
