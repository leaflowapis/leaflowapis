          type: boolean
        id:
          format: uuid
          type: string
        key_type:
          type: string
        name:
          type: string
        owner_user_id:
          description: 归属人；不给表示这把钥匙归项目本身
          type: string
        public_key:
          type: string
        purposes:
          description: 用途标签。平台自己生成的那把是 platform
          items:
            type: string
          type:
            - array
            - "null"
        status:
          enum:
            - ACTIVE
            - REVOKED
          type: string
      required:
        - id
        - name
        - public_key
        - fingerprint
        - key_type
        - status
        - created_at
        - purposes
        - has_private_key
      type: object
    SetMemberRolesRequestBody:
      additionalProperties: false
      properties:
        roles:
          description: 这个人应当持有的**全部**角色编码。OWNER 不能出现在这里
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - roles
      type: object
    SubmitIdentityVerificationRequestBody:
      additionalProperties: false
      properties:
        id_number:
          description: 证件号码。同上，而且同一个号码不能挂在两个账号上
          maxLength: 64
          minLength: 6
          type: string
        real_name:
          description: 真实姓名。敏感个人信息，加密入库，任何接口都不会再把它读出来
          maxLength: 128
          type: string
      required:
        - real_name
        - id_number
      type: object
    TransferOwnershipRequestBody:
      additionalProperties: false
      properties:
        to_user_id:
