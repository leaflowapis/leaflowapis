  /api/v1/register:
    post:
      description: |-
        在 auth.leaflow.net 登录之后调它，带上账号令牌。姓名和邮箱取自登录信息，不从请求体收。

        `consents` 要覆盖 `GET /api/v1/agreements` 返回的每一份，版本号也要一致；漏一份答 400，版本对不上答 409（多半是页面开着的时候条款改版了，重新拉一次清单即可）。已经注册过的答 409。
      operationId: register
      parameters:
        - description: auth.leaflow.net 签发的账号令牌，形如 Bearer <token>
          in: header
          name: Authorization
          required: true
          schema:
            description: auth.leaflow.net 签发的账号令牌，形如 Bearer <token>
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequestBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResource"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 注册账号
      tags:
        - Account
