      type: object
    IssueInvitationRequestBody:
      additionalProperties: false
      properties:
        email:
          format: email
          maxLength: 320
          type: string
        roles:
          description: 兑现时授予的角色编码。必须是这个项目已经定义的，OWNER 不行
          items:
            type: string
          minItems: 1
          type:
            - array
            - "null"
      required:
        - email
        - roles
      type: object
    IssuedInvitationResponseBody:
      additionalProperties: false
      properties:
        invitation:
          $ref: "#/components/schemas/InvitationResource"
        token:
          description: 兑现用的明文，**只在这一次响应里出现**。库里只有它的哈希，丢了只能撤销重发
          type: string
