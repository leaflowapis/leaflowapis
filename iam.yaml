components:
  schemas:
    AcceptConsentsRequestBody:
      additionalProperties: false
      properties:
        consents:
          items:
            $ref: "#/components/schemas/ConsentBody"
          type:
            - array
            - "null"
      required:
        - consents
      type: object
    AcceptInvitationByTokenRequestBody:
      additionalProperties: false
      properties:
        token:
          maxLength: 128
          minLength: 1
          type: string
      required:
        - token
      type: object
    AcceptedInvitationResponseBody:
      additionalProperties: false
      properties:
        project:
          $ref: "#/components/schemas/ProjectResource"
      required:
        - project
      type: object
    AccountResource:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        email:
          type: string
        email_verified_at:
          format: date-time
          type:
            - string
            - "null"
        first_name:
          description: 来自登录信息，可能为空
          type: string
        id:
          description: 身份提供方签发的 subject
          type: string
        last_name:
          description: 来自登录信息，可能为空
          type: string
        pending_agreements:
          items:
            $ref: "#/components/schemas/AgreementResource"
          type:
            - array
            - "null"
        status:
          enum:
            - ACTIVE
            - SUSPENDED
            - BANNED
            - DELETING
          type: string
      required:
        - id
        - email
        - first_name
        - last_name
        - status
        - email_verified_at
        - created_at
        - pending_agreements
      type: object
    AgreementListResponseBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/AgreementResource"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    AgreementResource:
      additionalProperties: false
      properties:
        effective_at:
          description: 从这一刻起注册必须同意这一版
          format: date-time
          type: string
        type:
          enum:
            - TERMS
            - PRIVACY
            - DPA
          type: string
        url:
          description: 正文发布在哪
          type: string
        version:
          description: 同意时原样回传这个值
          type: string
      required:
        - type
        - version
        - url
        - effective_at
      type: object
    ConsentBody:
      additionalProperties: false
      properties:
        type:
          enum:
            - TERMS
            - PRIVACY
            - DPA
          type: string
        version:
          maxLength: 32
          type: string
      required:
        - type
        - version
      type: object
    ConsentListResponseBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/ConsentResource"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    ConsentResource:
      additionalProperties: false
      properties:
        consented_at:
          format: date-time
          type: string
        method:
          description: OFFLINE 是线下签的，由运营录入
          enum:
            - CLICKWRAP
            - OFFLINE
          type: string
        type:
          enum:
            - TERMS
            - PRIVACY
            - DPA
          type: string
        version:
          type: string
      required:
        - type
        - version
        - consented_at
        - method
      type: object
    CreateProjectRequestBody:
      additionalProperties: false
      properties:
        description:
          maxLength: 2000
          type: string
        name:
          maxLength: 128
          minLength: 1
          type: string
      required:
        - name
      type: object
    CreateRoleRequestBody:
      additionalProperties: false
      properties:
        code:
          description: 小写字母开头，可含数字和下划线。建好之后不能改——成员绑定和邀请都指着它
          maxLength: 64
          type: string
        description:
          maxLength: 255
          type: string
        name:
          maxLength: 64
          type: string
        permissions:
          description: 权限名。OwnerOnly 的那几条会被拒绝：绑上去也不会生效
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - code
        - name
      type: object
    CreateSSHKeyRequestBody:
      additionalProperties: false
      properties:
        name:
          maxLength: 128
          type: string
        owner:
          default: me
          description: 这把钥匙归谁
          enum:
            - me
            - project
          type: string
        public_key:
          description: OpenSSH 格式的公钥。类型和指纹从它算出来，都不可改
          maxLength: 16384
          type: string
        purposes:
          description: 用途标签，比如 ci、bastion
          items:
            type: string
          maxItems: 16
          type:
            - array
            - "null"
      required:
        - name
        - public_key
      type: object
    Error:
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        meta:
          additionalProperties: {}
          type: object
        status:
          format: int64
          type: integer
      required:
        - status
        - message
      type: object
    GrantResource:
      additionalProperties: false
      properties:
        admin:
          type: boolean
        owner:
          type: boolean
        permissions:
          description: 持有的全部自定义角色的权限并集，已去重排序
          items:
            type: string
          type:
            - array
            - "null"
        roles:
          description: 持有的角色编码，只用于展示
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - owner
        - admin
        - permissions
        - roles
      type: object
    IdentityVerificationResource:
      additionalProperties: false
      properties:
        reject_reason:
          type: string
        status:
          description: PERSONAL 和 ENTERPRISE 是两类主体而不是两个等级，别拿它们比大小
          enum:
            - UNVERIFIED
            - PENDING
            - PERSONAL
            - ENTERPRISE
            - REJECTED
          type: string
        submitted_at:
          format: date-time
          type:
            - string
            - "null"
        verified_at:
          format: date-time
          type:
            - string
            - "null"
      required:
