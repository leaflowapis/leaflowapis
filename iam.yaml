          type: string
        name:
          maxLength: 128
          type: string
      type: object
    UpdateRoleRequestBody:
      additionalProperties: false
      properties:
        description:
          maxLength: 255
          type: string
        name:
          maxLength: 64
          type: string
        permissions:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - name
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: 项目令牌。先在 auth.leaflow.net 登录拿到账号令牌，再用它向 IAM 换取项目令牌（POST /api/v1/projects/{projectId}/token）——一张项目令牌同时说明当前用户和当前项目。
      scheme: bearer
      type: http
info:
  description: |-
    用户和项目自己用的接口：账号、项目、成员、角色、邀请、SSH 公钥。

    ## 两种令牌

    1. 在 auth.leaflow.net 登录，拿到**账号令牌**；
    2. 带着它调 `GET /api/v1/projects` 列出参与的项目。首次调用会自动登记账号，姓名与邮箱取自登录信息；
    3. 选定项目后调 `POST /api/v1/projects/{projectId}/token` 换取**项目令牌**，后续请求一律使用它。

    两种令牌都放在 `Authorization: Bearer` 里。

    项目令牌过期后重新执行第 3 步；账号令牌过期则先在 auth.leaflow.net 续期。没有单独的项目令牌续期接口。

    ## 成员关系只给事实

    `GET /projects/{projectId}/membership` 返回的是这个人在项目里持有哪些角色和权限，不返回「能否执行某个操作」的结论——那需要一份「哪个操作要哪条权限」的对照表，而它由各个服务分别声明。
  title: Leaflow IAM 用户 API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/agreements:
    get:
      description: |-
        注册页显示它，用户同意之后把每一项的 `type` 和 `version` 原样回传给 `POST /api/v1/register`。

        不需要令牌。还没有任何文件生效时返回空数组，那时注册不需要提交 `consents`。
      operationId: list-agreements
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgreementListResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 列出注册必须同意的文件
      tags:
        - Agreement
  /api/v1/me:
    get:
      description: "`pending_agreements` 是还没同意的文件，非空就要先引导用户同意，再调 `POST /api/v1/me/consents`。"
      operationId: get-account
      parameters:
        - description: Bearer 令牌。选定项目之前用 auth.leaflow.net 签发的账号令牌，选定之后用项目令牌
          in: header
          name: Authorization
          required: true
          schema:
            description: Bearer 令牌。选定项目之前用 auth.leaflow.net 签发的账号令牌，选定之后用项目令牌
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResource"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 查看当前账号
      tags:
        - Account
  /api/v1/me/consents:
    get:
      description: 全部记录，最新的在前，包括已经不是当前版本的那些。
      operationId: list-consents
      parameters:
        - description: Bearer 令牌。选定项目之前用 auth.leaflow.net 签发的账号令牌，选定之后用项目令牌
          in: header
          name: Authorization
          required: true
          schema:
            description: Bearer 令牌。选定项目之前用 auth.leaflow.net 签发的账号令牌，选定之后用项目令牌
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentListResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 列出我同意过的文件
      tags:
        - Agreement
    post:
      description: |-
        条款改版之后用它重新同意，`GET /api/v1/me` 的 `pending_agreements` 非空时就该调。

        只收当前生效的版本，签旧版答 409。重复提交同一版不报错，第一次那条记录会留着。
      operationId: accept-agreements
      parameters:
        - description: Bearer 令牌。选定项目之前用 auth.leaflow.net 签发的账号令牌，选定之后用项目令牌
          in: header
          name: Authorization
          required: true
          schema:
            description: Bearer 令牌。选定项目之前用 auth.leaflow.net 签发的账号令牌，选定之后用项目令牌
