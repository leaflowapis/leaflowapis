  /api/v1/projects/{projectId}/token:
    post:
      description: |-
        选定一个项目后，用账号令牌换取该项目的令牌。

        **只接受 auth.leaflow.net 签发的账号令牌，不接受项目令牌。** 项目令牌过期后，先在 auth.leaflow.net 续期账号令牌，再重新调用这个接口。

        换取时会确认账号可用、项目存在，且**调用者是该项目的成员**。非成员无法换取。

        令牌只表明身份（用户与项目），**不包含权限**：权限在每次请求时实时判定，所以角色调整立即生效，不必等待令牌过期。

        项目处于停用、封禁或删除中时**仍可换取令牌**：这些状态限制的是写入，不影响查看项目当前状况。
      operationId: exchange-project-token
      parameters:
        - description: Bearer 令牌。选定项目之前用 auth.leaflow.net 签发的账号令牌，选定之后用项目令牌
          in: header
          name: Authorization
          required: true
          schema:
            description: Bearer 令牌。选定项目之前用 auth.leaflow.net 签发的账号令牌，选定之后用项目令牌
            type: string
        - in: path
          name: projectId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectTokenResponseBody"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: 换一张项目令牌
      tags:
        - ProjectToken
