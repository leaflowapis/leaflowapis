paths:
  /api/v1/threads:
    get:
      summary: List email threads across project inboxes
      description: |-
        Cursor-paged conversation threads across the authenticated project, ordered by most recent
        message first. Service account tokens are automatically restricted to their own inbox.
      operationId: list-threads
      tags:
        - Thread
      parameters:
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Limit
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Cursor
        - name: inbox_id
          in: query
          required: false
          description: Optional filter to a single inbox.
          explode: false
          schema:
            type: string
            format: uuid
        - name: unread_only
          in: query
          required: false
          explode: false
          schema:
            type: boolean
        - name: flagged_only
          in: query
          required: false
          explode: false
          schema:
            type: boolean
        - name: keyword
          in: query
          required: false
          description: Case-insensitive substring search across thread subject and snippet.
          explode: false
          schema:
            type: string
            maxLength: 255
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ThreadListResponseBody
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/inboxes/{inboxId}/threads:
    get:
      summary: List email threads in an inbox
      description: |-
        Cursor-paged conversation threads belonging to the specified inbox, ordered by most recent
        message first.
      operationId: list-inbox-threads
      tags:
        - Thread
      parameters:
        - $ref: ./openapi.yaml#/components/parameters/InboxIdPath
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Limit
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Cursor
        - name: unread_only
          in: query
          required: false
          explode: false
          schema:
            type: boolean
        - name: flagged_only
          in: query
          required: false
          explode: false
          schema:
            type: boolean
        - name: keyword
          in: query
          required: false
          description: Case-insensitive substring search across thread subject and snippet.
          explode: false
          schema:
            type: string
            maxLength: 255
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ThreadListResponseBody
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/inboxes/{inboxId}/threads/{threadId}:
    get:
      summary: Get a thread in an inbox
      operationId: get-thread
      tags:
        - Thread
      parameters:
        - $ref: ./openapi.yaml#/components/parameters/InboxIdPath
        - $ref: ./openapi.yaml#/components/parameters/ThreadIdPath
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ThreadResource
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/inboxes/{inboxId}/threads/{threadId}/messages:
    get:
      summary: List messages in a thread
      description: |-
        Returns lightweight message summaries in chronological order (oldest first) for thread
        rendering. Call `get-message` for full bodies and attachments.
      operationId: list-thread-messages
      tags:
        - Thread
      parameters:
        - $ref: ./openapi.yaml#/components/parameters/InboxIdPath
        - $ref: ./openapi.yaml#/components/parameters/ThreadIdPath
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Limit
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Cursor
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/MessageSummaryListResponseBody
        default:
          $ref: ./openapi.yaml#/components/responses/Error
