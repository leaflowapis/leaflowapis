paths:
  /api/v1/mailboxes:
    get:
      summary: List project mailboxes and allocation states
      description: |-
        Lists mailboxes in the authenticated project together with each mailbox's email address
        allocation status and outbound state. Returns an empty list before the project enables the
        mail service. When called with a service account token, only that service account's own
        mailbox is returned.
      operationId: list-mailboxes
      tags:
        - Mailbox
      parameters:
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
        - name: service_account_id
          in: query
          required: false
          description: Restricts the result to the mailbox bound to the given service account.
          explode: false
          schema:
            type: string
            format: uuid
        - name: allocation_status
          in: query
          required: false
          description: Only mailboxes in these allocation statuses; omit for every status. Comma-separated, for example `allocation_status=pending,allocated`.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 5
            uniqueItems: true
            items:
              $ref: ./openapi.yaml#/components/schemas/AllocationStatus
        - name: outbound_status
          in: query
          required: false
          description: Only mailboxes in these outbound statuses; omit for every status. Comma-separated, for example `outbound_status=active,paused_for_reputation`.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 5
            uniqueItems: true
            items:
              $ref: ./openapi.yaml#/components/schemas/OutboundStatus
        - name: keyword
          in: query
          required: false
          description: Case-insensitive substring match against display name or allocated address.
          explode: false
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailboxListResponseBody"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
    post:
      summary: Allocate or retry default mailbox for a service account
      description: |-
        Idempotently allocates a default mailbox address for an active service account in the
        project, or retries a previously failed allocation. Requires the project mail service to be
        enabled (412 `MAIL_SERVICE_NOT_ENABLED` otherwise). If the service account already holds an
        allocated mailbox, returns it with 200.
      operationId: allocate-mailbox
      tags:
        - Mailbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllocateMailboxRequestBody"
      responses:
        "200":
          description: Existing allocated mailbox returned unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailboxResource"
        "201":
          description: Mailbox allocated or queued for allocation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailboxResource"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/mailboxes/{mailboxId}:
    get:
      summary: Get a project mailbox
      description: |-
        Returns a single mailbox's address allocation status, outbound state, and unread count.
      operationId: get-mailbox
      tags:
        - Mailbox
      parameters:
        - $ref: ./openapi.yaml#/components/parameters/MailboxIdPath
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailboxResource"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/mailboxes/{mailboxId}:pauseOutbound:
    post:
      summary: Pause outbound sending on a mailbox
      description: |-
        Immediately prevents outbound sending from this mailbox while keeping inbound delivery
        active. Useful for stopping a runaway automated sender.
      operationId: pause-mailbox-outbound
      tags:
        - Mailbox
      parameters:
        - $ref: ./openapi.yaml#/components/parameters/MailboxIdPath
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailboxResource"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/mailboxes/{mailboxId}:resumeOutbound:
    post:
      summary: Resume outbound sending on a mailbox
      description: |-
        Resumes outbound sending on a mailbox paused by the project or paused automatically for
        reputation protection. Operator suspensions cannot be cleared here and return 412
        `MAIL_MAILBOX_PAUSED`.
      operationId: resume-mailbox-outbound
      tags:
        - Mailbox
      parameters:
        - $ref: ./openapi.yaml#/components/parameters/MailboxIdPath
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailboxResource"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
components:
  schemas:
    MailboxResource:
      type: object
      required:
        - id
        - service_account_id
        - display_name
        - address
        - allocation_status
        - allocation_error
        - inbound_enabled
        - outbound_status
        - pause_reason
        - paused_at
        - unread_count
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        service_account_id:
          description: Service account associated with this mailbox.
          type:
            - string
            - "null"
          format: uuid
        display_name:
          description: Display name used when formatting outbound `From` headers.
          type: string
        address:
          description: Full allocated email address; null while allocation is pending or failed.
          type:
            - string
            - "null"
          format: email
        allocation_status:
          $ref: ./openapi.yaml#/components/schemas/AllocationStatus
        allocation_error:
          description: Machine-readable reason when `allocation_status` is `failed`; null otherwise.
          type:
            - string
            - "null"
        inbound_enabled:
          description: Whether inbound mail is currently accepted for this mailbox.
          type: boolean
        outbound_status:
          $ref: ./openapi.yaml#/components/schemas/OutboundStatus
        pause_reason:
          anyOf:
            - $ref: ./openapi.yaml#/components/schemas/PauseReason
            - type: "null"
        paused_at:
          type:
            - string
            - "null"
          format: date-time
        unread_count:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MailboxListResponseBody:
      type: object
      required:
        - items
        - pagination
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MailboxResource"
        pagination:
          $ref: ./openapi.yaml#/components/schemas/OffsetPagination
    AllocateMailboxRequestBody:
      type: object
      required:
        - service_account_id
      additionalProperties: false
      properties:
        service_account_id:
          description: Active service account in the current project to allocate a default mailbox for.
          type: string
          format: uuid
