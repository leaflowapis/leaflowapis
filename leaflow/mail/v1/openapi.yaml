openapi: 3.2.1
info:
  title: Leaflow Mail API
  version: 1.0.0
  description: |-
    Project member inboxes, threaded email retrieval, attachment storage, billed outbound sending,
    optional email forwarding, service enablement, and delivery tracking.

    ## Authentication

    Every request carries an IAM scoped token (`bearerAuth`). Neither the path nor the headers
    carry a `project_id`: the current project is asserted by the token.

    ## Conventions

    - **Project member inboxes**: Enabling Mail on a project (`create-enablement`) provisions an
      inbox (`@onleaflow.cloud`) for every active project member — both human members and service
      accounts are IAM users and are modeled uniformly by `(project_id, user_id)`. Callers may also
      provision an inbox synchronously with `create-inbox`.
    - **Inbound is free; outbound is billed per accepted recipient**: Inbound delivery and optional
      forwarding to a member's verified email address are free. Outbound sends and replies from a
      project inbox are billed per accepted recipient (`to` + `cc` + `bcc`, up to 50).
    - **AgentMail-style nested resource hierarchy**: Threads, messages, replies, and attachments
      live directly under `/api/v1/inboxes/{inboxId}/...`. A project-wide `GET /api/v1/threads`
      endpoint is also provided for cross-inbox overview and supervision.
    - **Lightweight lists vs. full message detail**: List endpoints (`list-messages`,
      `list-thread-messages`) return `MessageSummaryResource` rows without body payloads. Retrieve
      full plain text, server-sanitized HTML, attachments, and per-recipient deliveries from
      `get-message`, raw RFC 5322 headers from `/headers`, and original `.eml` bytes from `/raw`.
    - **Idempotency (Resend-style)**: Supply `Idempotency-Key` when sending or replying so retries
      after transient 429 or 503 responses (carrying `retry_delay`) do not send or bill duplicates.
      Reusing a key with a different payload fails with 409 `MAIL_IDEMPOTENCY_KEY_REUSED`.
    - **Service account isolation**: A service account token may only read, update, or send from
      its own inbox; attempts to act on another inbox fail with 403 `MAIL_INBOX_SCOPE_FORBIDDEN`.
    - **Attachments are uploaded before reference**: Upload bytes to
      `POST /api/v1/inboxes/{inboxId}/attachments`, then pass the returned IDs in `attachment_ids`.
servers:
  - url: https://mail.leaflow.cloud
    description: Project Mail API
security:
  - bearerAuth: []
tags:
  - name: Enable
    description: Project mail service enablement.
  - name: Inbox
    description: Project member inboxes, forwarding preferences, and outbound controls.
  - name: Thread
    description: Conversation threads within an inbox or across the project.
  - name: Message
    description: Inbound retrieval, search, batch updates, and billed outbound sending.
  - name: Attachment
    description: Email attachment upload and download scoped to an inbox.
  - name: Usage
    description: Project outbound delivery statistics and suppression visibility.
paths:
  /api/v1/enablement:
    $ref: ./enablement.yaml#/paths/~1api~1v1~1enablement
  /api/v1/inboxes:
    $ref: ./inboxes.yaml#/paths/~1api~1v1~1inboxes
  /api/v1/inboxes/{inboxId}:
    $ref: ./inboxes.yaml#/paths/~1api~1v1~1inboxes~1{inboxId}
  /api/v1/inboxes/{inboxId}:pauseOutbound:
    $ref: ./inboxes.yaml#/paths/~1api~1v1~1inboxes~1{inboxId}:pauseOutbound
  /api/v1/inboxes/{inboxId}:resumeOutbound:
    $ref: ./inboxes.yaml#/paths/~1api~1v1~1inboxes~1{inboxId}:resumeOutbound
  /api/v1/threads:
    $ref: ./threads.yaml#/paths/~1api~1v1~1threads
  /api/v1/inboxes/{inboxId}/threads:
    $ref: ./threads.yaml#/paths/~1api~1v1~1inboxes~1{inboxId}~1threads
  /api/v1/inboxes/{inboxId}/threads/{threadId}:
    $ref: ./threads.yaml#/paths/~1api~1v1~1inboxes~1{inboxId}~1threads~1{threadId}
  /api/v1/inboxes/{inboxId}/threads/{threadId}/messages:
    $ref: ./threads.yaml#/paths/~1api~1v1~1inboxes~1{inboxId}~1threads~1{threadId}~1messages
  /api/v1/inboxes/{inboxId}/messages:
    $ref: ./messages.yaml#/paths/~1api~1v1~1inboxes~1{inboxId}~1messages
  /api/v1/inboxes/{inboxId}/messages:batchUpdate:
    $ref: ./messages.yaml#/paths/~1api~1v1~1inboxes~1{inboxId}~1messages:batchUpdate
  /api/v1/inboxes/{inboxId}/messages/{messageId}:
    $ref: ./messages.yaml#/paths/~1api~1v1~1inboxes~1{inboxId}~1messages~1{messageId}
  /api/v1/inboxes/{inboxId}/messages/{messageId}:reply:
    $ref: ./messages.yaml#/paths/~1api~1v1~1inboxes~1{inboxId}~1messages~1{messageId}:reply
  /api/v1/inboxes/{inboxId}/messages/{messageId}/headers:
    $ref: ./messages.yaml#/paths/~1api~1v1~1inboxes~1{inboxId}~1messages~1{messageId}~1headers
  /api/v1/inboxes/{inboxId}/messages/{messageId}/raw:
    $ref: ./messages.yaml#/paths/~1api~1v1~1inboxes~1{inboxId}~1messages~1{messageId}~1raw
  /api/v1/inboxes/{inboxId}/attachments:
    $ref: ./attachments.yaml#/paths/~1api~1v1~1inboxes~1{inboxId}~1attachments
  /api/v1/inboxes/{inboxId}/attachments/{attachmentId}/content:
    $ref: ./attachments.yaml#/paths/~1api~1v1~1inboxes~1{inboxId}~1attachments~1{attachmentId}~1content
  /api/v1/usage:
    $ref: ./usage.yaml#/paths/~1api~1v1~1usage
  /api/v1/suppressions:
    $ref: ./usage.yaml#/paths/~1api~1v1~1suppressions
components:
  securitySchemes:
    bearerAuth:
      $ref: ../../type/v1/security.yaml#/components/securitySchemes/ScopedToken
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  parameters:
    InboxIdPath:
      name: inboxId
      in: path
      required: true
      description: Inbox identifier.
      schema:
        type: string
        format: uuid
    ThreadIdPath:
      name: threadId
      in: path
      required: true
      description: Thread identifier.
      schema:
        type: string
        format: uuid
    MessageIdPath:
      name: messageId
      in: path
      required: true
      description: Message identifier.
      schema:
        type: string
        format: uuid
    AttachmentIdPath:
      name: attachmentId
      in: path
      required: true
      description: Attachment identifier.
      schema:
        type: string
        format: uuid
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: |-
        Optional caller-generated idempotency key (1 to 255 visible ASCII characters), scoped to
        the sending inbox. Reusing the same key with an identical payload returns the original
        message; reusing it with a different payload fails with 409 `MAIL_IDEMPOTENCY_KEY_REUSED`.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    IncludeHtmlQuery:
      name: include_html
      in: query
      required: false
      description: Include the server-sanitized HTML body in the response. Defaults to true; pass false to return plain text only.
      explode: false
      schema:
        type: boolean
        default: true
    FilenameQuery:
      name: filename
      in: query
      required: true
      description: Original file name to record and serve when downloaded.
      explode: false
      schema:
        type: string
        minLength: 1
        maxLength: 255
    InlineQuery:
      name: inline
      in: query
      required: false
      description: Render in the browser instead of downloading when the detected content type can be rendered safely.
      explode: false
      schema:
        type: boolean
  schemas:
    Error:
      $ref: ../../type/v1/error.yaml#/components/schemas/Error
    OffsetPagination:
      $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
    CursorPagination:
      $ref: ../../type/v1/pagination.yaml#/components/schemas/CursorPagination
    EmailAddress:
      type: object
      required:
        - address
      additionalProperties: false
      properties:
        address:
          type: string
          format: email
          maxLength: 320
        name:
          type: string
          maxLength: 255
    OutboundStatus:
      type: string
      description: Current outbound sending state for an inbox.
      enum:
        - active
        - paused
        - suspended
    PauseReason:
      type: string
      enum:
        - manual
        - complaint
        - bounce_rate
        - operator
    SpamFilterMode:
      type: string
      enum:
        - standard
        - strict
    MessageDirection:
      type: string
      enum:
        - inbound
        - outbound
    MessageStatus:
      type: string
      enum:
        - received
        - accepted
        - deferred
        - delivered
        - partially_delivered
        - bounced
        - failed
        - rejected
    DeliveryStatus:
      type: string
      enum:
        - accepted
        - deferred
        - delivered
        - bounced
        - failed
        - rejected
        - complained
    AttachmentDisposition:
      type: string
      description: "`attachment` for regular downloadable files; `inline` for embedded MIME parts such as `cid:` images."
      enum:
        - attachment
        - inline
    AttachmentResource:
      type: object
      required:
        - id
        - filename
        - content_type
        - size_bytes
        - sha256
        - disposition
        - content_id
        - created_at
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        content_type:
          description: Content type determined by inspecting the uploaded or received bytes.
          type: string
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        sha256:
          description: Lowercase hex-encoded SHA-256 digest of the file bytes.
          type: string
        disposition:
          $ref: "#/components/schemas/AttachmentDisposition"
        content_id:
          description: MIME Content-ID without surrounding angle brackets when referenced inline via `cid:`; null otherwise.
          type:
            - string
            - "null"
        created_at:
          type: string
          format: date-time
    MessageHeader:
      type: object
      required:
        - name
        - value
      additionalProperties: false
      properties:
        name:
          type: string
        value:
          type: string
    MessageHeadersResource:
      description: Ordered RFC 5322 headers preserved from the raw message, retaining duplicate header names such as `Received`.
      type: object
      required:
        - message_id
        - headers
      additionalProperties: false
      properties:
        message_id:
          type: string
          format: uuid
        headers:
          type: array
          items:
            $ref: "#/components/schemas/MessageHeader"
    MessageDelivery:
      type: object
      required:
        - recipient
        - status
        - bounce_type
        - bounce_classification
        - smtp_code
        - updated_at
      additionalProperties: false
      properties:
        recipient:
          type: string
          format: email
        status:
          $ref: "#/components/schemas/DeliveryStatus"
        bounce_type:
          type:
            - string
            - "null"
          enum:
            - hard
            - soft
            - null
        bounce_classification:
          type:
            - string
            - "null"
        smtp_code:
          type:
            - string
            - "null"
        updated_at:
          type: string
          format: date-time
    MessageSummaryResource:
      description: Lightweight message row returned by list endpoints without full body payloads.
      type: object
      required:
        - id
        - inbox_id
        - thread_id
        - direction
        - status
        - from
        - sender
        - to
        - subject
        - snippet
        - has_attachments
        - size_bytes
        - billed_recipients
        - read_at
        - flagged
        - created_at
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        thread_id:
          type: string
          format: uuid
        direction:
          $ref: "#/components/schemas/MessageDirection"
        status:
          $ref: "#/components/schemas/MessageStatus"
        from:
          $ref: "#/components/schemas/EmailAddress"
        sender:
          description: Present when the RFC 5322 `Sender` header differs from `From` (on-behalf-of sender); null otherwise.
          anyOf:
            - $ref: "#/components/schemas/EmailAddress"
            - type: "null"
        to:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        subject:
          type: string
        snippet:
          description: Short plain-text preview excerpt of the message body.
          type: string
        has_attachments:
          description: True when the message contains at least one non-inline attachment.
          type: boolean
        size_bytes:
          description: Total encoded RFC 5322 message size in bytes.
          type: integer
          format: int64
          minimum: 0
        billed_recipients:
          description: Number of billable recipients accepted for outbound delivery. Zero for inbound messages.
          type: integer
          format: int64
          minimum: 0
        read_at:
          type:
            - string
            - "null"
          format: date-time
        flagged:
          type: boolean
        created_at:
          type: string
          format: date-time
    MessageSummaryListResponseBody:
      type: object
      required:
        - items
        - pagination
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MessageSummaryResource"
        pagination:
          $ref: "#/components/schemas/CursorPagination"
    MessageResource:
      type: object
      required:
        - id
        - inbox_id
        - thread_id
        - direction
        - status
        - rfc_message_id
        - in_reply_to
        - references
        - from
        - sender
        - to
        - cc
        - bcc
        - reply_to
        - subject
        - snippet
        - text
        - html
        - has_attachments
        - size_bytes
        - attachments
        - deliveries
        - billed_recipients
        - read_at
        - flagged
        - created_at
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        thread_id:
          type: string
          format: uuid
        direction:
          $ref: "#/components/schemas/MessageDirection"
        status:
          $ref: "#/components/schemas/MessageStatus"
        rfc_message_id:
          type: string
        in_reply_to:
          type:
            - string
            - "null"
        references:
          description: Ordered list of RFC 5322 `References` Message-IDs for thread reconstruction.
          type: array
          items:
            type: string
        from:
          $ref: "#/components/schemas/EmailAddress"
        sender:
          description: Present when the RFC 5322 `Sender` header differs from `From` (on-behalf-of sender); null otherwise.
          anyOf:
            - $ref: "#/components/schemas/EmailAddress"
            - type: "null"
        to:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        cc:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        bcc:
          description: Present on outbound messages only; empty array on inbound messages.
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        reply_to:
          anyOf:
            - $ref: "#/components/schemas/EmailAddress"
            - type: "null"
        subject:
          type: string
        snippet:
          description: Short plain-text preview excerpt of the message body.
          type: string
        text:
          type:
            - string
            - "null"
        html:
          description: Server-sanitized HTML body safe for display; null when the message has no HTML part or `include_html=false`.
          type:
            - string
            - "null"
        has_attachments:
          type: boolean
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/AttachmentResource"
        deliveries:
          description: Per-recipient delivery states for outbound messages; empty array on inbound messages.
          type: array
          items:
            $ref: "#/components/schemas/MessageDelivery"
        billed_recipients:
          description: Number of billable recipients accepted for outbound delivery. Zero for inbound messages.
          type: integer
          format: int64
          minimum: 0
        read_at:
          type:
            - string
            - "null"
          format: date-time
        flagged:
          type: boolean
        created_at:
          type: string
          format: date-time
    UpdateMessageRequestBody:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        read:
          description: Set to true to mark the message as read, or false to mark it as unread.
          type: boolean
        flagged:
          description: Set to true to star/flag the message, or false to unflag it.
          type: boolean
    BatchUpdateMessagesRequestBody:
      type: object
      required:
        - message_ids
      additionalProperties: false
      properties:
        message_ids:
          description: Message IDs to update (1 to 200). At least one of `read` or `flagged` must be supplied.
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: string
            format: uuid
        read:
          type: boolean
        flagged:
          type: boolean
    BatchUpdateMessagesResponseBody:
      type: object
      required:
        - updated_count
      additionalProperties: false
      properties:
        updated_count:
          type: integer
          format: int64
          minimum: 0
    ThreadResource:
      type: object
      required:
        - id
        - inbox_id
        - subject
        - snippet
        - participants
        - message_count
        - unread_count
        - flagged
        - has_attachments
        - replyable
        - last_message_at
        - created_at
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        inbox_id:
          type: string
          format: uuid
        subject:
          type: string
        snippet:
          type: string
        participants:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
        message_count:
          type: integer
          format: int64
          minimum: 0
        unread_count:
          type: integer
          format: int64
          minimum: 0
        flagged:
          description: True when at least one message in the thread is flagged.
          type: boolean
        has_attachments:
          description: True when at least one message in the thread has a non-inline attachment.
          type: boolean
        replyable:
          description: Whether the thread has an external counterparty eligible for a reply.
          type: boolean
        last_message_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    ThreadListResponseBody:
      type: object
      required:
        - items
        - pagination
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ThreadResource"
        pagination:
          $ref: "#/components/schemas/CursorPagination"
    EnablementResource:
      $ref: ./enablement.yaml#/components/schemas/EnablementResource
    CreateEnablementRequestBody:
      $ref: ./enablement.yaml#/components/schemas/CreateEnablementRequestBody
    CreateEnablementResponseBody:
      $ref: ./enablement.yaml#/components/schemas/CreateEnablementResponseBody
    CheckoutOptions:
      $ref: ./enablement.yaml#/components/schemas/CheckoutOptions
    InboxForwarding:
      $ref: ./inboxes.yaml#/components/schemas/InboxForwarding
    InboxResource:
      $ref: ./inboxes.yaml#/components/schemas/InboxResource
    InboxListResponseBody:
      $ref: ./inboxes.yaml#/components/schemas/InboxListResponseBody
    CreateInboxRequestBody:
      $ref: ./inboxes.yaml#/components/schemas/CreateInboxRequestBody
    UpdateInboxRequestBody:
      $ref: ./inboxes.yaml#/components/schemas/UpdateInboxRequestBody
    SendMessageRequestBody:
      $ref: ./messages.yaml#/components/schemas/SendMessageRequestBody
    ReplyMessageRequestBody:
      $ref: ./messages.yaml#/components/schemas/ReplyMessageRequestBody
    UsageResource:
      $ref: ./usage.yaml#/components/schemas/UsageResource
    ProjectSuppressionReason:
      $ref: ./usage.yaml#/components/schemas/ProjectSuppressionReason
    ProjectSuppressionResource:
      $ref: ./usage.yaml#/components/schemas/ProjectSuppressionResource
    ProjectSuppressionListResponseBody:
      $ref: ./usage.yaml#/components/schemas/ProjectSuppressionListResponseBody
