paths:
  /api/v1/usage:
    get:
      summary: Get project outbound usage summary
      description: |-
        Returns aggregate outbound delivery counters for the authenticated project over a time
        range spanning at most 90 days. Monetary amounts are not returned here; consult Billing for
        charges and invoices.
      operationId: get-usage
      tags:
        - Usage
      parameters:
        - name: from
          in: query
          required: true
          description: Start of the range, inclusive (RFC 3339 with timezone offset).
          explode: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: End of the range, exclusive (RFC 3339 with timezone offset).
          explode: false
          schema:
            type: string
            format: date-time
        - name: mailbox_id
          in: query
          required: false
          description: Restricts the summary to a single mailbox.
          explode: false
          schema:
            type: string
            format: uuid
        - name: service_account_id
          in: query
          required: false
          description: Restricts the summary to a single service account's mailbox.
          explode: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageResource"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/suppressions:
    get:
      summary: List suppressed recipients observed by the project
      description: |-
        Read-only listing of external recipient addresses that have entered suppression following
        hard bounces or complaints from this project's outbound sends.
      operationId: list-suppressions
      tags:
        - Usage
      parameters:
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
        - name: recipient
          in: query
          required: false
          description: Case-insensitive substring filter on recipient address.
          explode: false
          schema:
            type: string
            maxLength: 320
        - name: reason
          in: query
          required: false
          description: Only suppressions with these reasons; omit for every reason. Comma-separated, for example `reason=hard_bounce,complaint`.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 4
            uniqueItems: true
            items:
              $ref: "#/components/schemas/ProjectSuppressionReason"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSuppressionListResponseBody"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
components:
  schemas:
    UsageResource:
      type: object
      required:
        - from
        - to
        - billed_recipients
        - delivered_recipients
        - deferred_recipients
        - soft_bounced_recipients
        - hard_bounced_recipients
        - complained_recipients
        - rejected_recipients
      additionalProperties: false
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        billed_recipients:
          description: Total outbound recipients accepted for delivery and reported as billable usage.
          type: integer
          format: int64
          minimum: 0
        delivered_recipients:
          type: integer
          format: int64
          minimum: 0
        deferred_recipients:
          type: integer
          format: int64
          minimum: 0
        soft_bounced_recipients:
          type: integer
          format: int64
          minimum: 0
        hard_bounced_recipients:
          type: integer
          format: int64
          minimum: 0
        complained_recipients:
          type: integer
          format: int64
          minimum: 0
        rejected_recipients:
          type: integer
          format: int64
          minimum: 0
    ProjectSuppressionReason:
      type: string
      enum:
        - hard_bounce
        - soft_bounce
        - complaint
        - unknown
    ProjectSuppressionResource:
      type: object
      required:
        - recipient
        - reason
        - first_seen_at
        - last_seen_at
        - expires_at
      additionalProperties: false
      properties:
        recipient:
          type: string
          format: email
        reason:
          $ref: "#/components/schemas/ProjectSuppressionReason"
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type:
            - string
            - "null"
          format: date-time
    ProjectSuppressionListResponseBody:
      type: object
      required:
        - items
        - pagination
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectSuppressionResource"
        pagination:
          $ref: ./openapi.yaml#/components/schemas/OffsetPagination
