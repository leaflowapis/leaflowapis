paths:
  /api/v1/account/mailbox:
    get:
      summary: Get personal account mailbox
      description: |-
        Returns the caller's personal mailbox allocation status, default email address, forwarding
        preferences, daily reply quota usage, and outbound state. Inbound mail, forwarding to the
        account's verified email address, and replies to existing inbound threads are free.
      operationId: get-account-mailbox
      tags:
        - Account
      security:
        - accessTokenAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountMailboxResource"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
    patch:
      summary: Update personal account mailbox preferences
      description: |-
        Updates forwarding and inbound spam filtering preferences for the caller's personal
        mailbox. Unsupplied fields are left unchanged.
      operationId: update-account-mailbox
      tags:
        - Account
      security:
        - accessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountMailboxRequestBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountMailboxResource"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/account/mailbox:activate:
    post:
      summary: Activate personal account mailbox
      description: |-
        Idempotently allocates the caller's default personal mailbox address if it has not yet been
        provisioned. Free of charge and requires no billing account.
      operationId: activate-account-mailbox
      tags:
        - Account
      security:
        - accessTokenAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountMailboxResource"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/account/threads:
    get:
      summary: List personal account email threads
      description: Cursor-paged threads in the caller's personal mailbox, most recent first.
      operationId: list-account-threads
      tags:
        - Account
      security:
        - accessTokenAuth: []
      parameters:
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Limit
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Cursor
        - name: unread_only
          in: query
          required: false
          explode: false
          schema:
            type: boolean
        - name: flagged_only
          in: query
          required: false
          explode: false
          schema:
            type: boolean
        - name: q
          in: query
          required: false
          description: Case-insensitive keyword search across subject and participant addresses.
          explode: false
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ThreadListResponseBody
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/account/threads/{threadId}:
    get:
      summary: Get a personal account email thread
      operationId: get-account-thread
      tags:
        - Account
      security:
        - accessTokenAuth: []
      parameters:
        - $ref: ./openapi.yaml#/components/parameters/ThreadIdPath
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ThreadResource
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/account/threads/{threadId}/messages:
    get:
      summary: List messages in a personal account thread
      description: Cursor-paged lightweight message summaries belonging to the personal thread, oldest first.
      operationId: list-account-thread-messages
      tags:
        - Account
      security:
        - accessTokenAuth: []
      parameters:
        - $ref: ./openapi.yaml#/components/parameters/ThreadIdPath
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Limit
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Cursor
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/MessageSummaryListResponseBody
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/account/threads/{threadId}:reply:
    post:
      summary: Reply to an inbound personal account thread
      description: |-
        Sends a free single-recipient reply from the caller's personal mailbox to the verified
        external sender of an existing inbound thread. The recipient is fixed by the thread and
        cannot be overridden; subject to hourly and daily anti-abuse limits.
      operationId: reply-account-thread
      tags:
        - Account
      security:
        - accessTokenAuth: []
      parameters:
        - $ref: ./openapi.yaml#/components/parameters/ThreadIdPath
        - $ref: ./openapi.yaml#/components/parameters/IdempotencyKeyHeader
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplyAccountThreadRequestBody"
      responses:
        "201":
          description: Accepted for delivery.
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/MessageResource
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/account/messages:
    get:
      summary: List and search personal account messages
      description: Cursor-paged lightweight message summaries in the caller's personal mailbox, newest first.
      operationId: list-account-messages
      tags:
        - Account
      security:
        - accessTokenAuth: []
      parameters:
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Limit
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Cursor
        - name: thread_id
          in: query
          required: false
          explode: false
          schema:
            type: string
            format: uuid
        - name: direction
          in: query
          required: false
          description: Only messages in these directions; omit for every direction. Comma-separated, for example `direction=inbound,outbound`.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 2
            uniqueItems: true
            items:
              $ref: ./openapi.yaml#/components/schemas/MessageDirection
        - name: status
          in: query
          required: false
          description: Only messages in these statuses; omit for every status. Comma-separated, for example `status=received,delivered`.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 8
            uniqueItems: true
            items:
              $ref: ./openapi.yaml#/components/schemas/MessageStatus
        - name: from_address
          in: query
          required: false
          explode: false
          schema:
            type: string
            maxLength: 320
        - name: q
          in: query
          required: false
          description: Keyword search across subject, snippet, plain-text body, and addresses.
          explode: false
          schema:
            type: string
            maxLength: 500
        - name: unread_only
          in: query
          required: false
          explode: false
          schema:
            type: boolean
        - name: flagged_only
          in: query
          required: false
          explode: false
          schema:
            type: boolean
        - name: has_attachments
          in: query
          required: false
          explode: false
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/MessageSummaryListResponseBody
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/account/messages:batchUpdate:
    post:
      summary: Batch update read or flagged state on personal account messages
      operationId: batch-update-account-messages
      tags:
        - Account
      security:
        - accessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./openapi.yaml#/components/schemas/BatchUpdateMessagesRequestBody
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/BatchUpdateMessagesResponseBody
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/account/messages/{messageId}:
    get:
      summary: Get a personal account message
      operationId: get-account-message
      tags:
        - Account
      security:
        - accessTokenAuth: []
      parameters:
        - $ref: ./openapi.yaml#/components/parameters/MessageIdPath
        - $ref: ./openapi.yaml#/components/parameters/IncludeHtmlQuery
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/MessageResource
        default:
          $ref: ./openapi.yaml#/components/responses/Error
    patch:
      summary: Update read or flagged state of a personal account message
      operationId: update-account-message
      tags:
        - Account
      security:
        - accessTokenAuth: []
      parameters:
        - $ref: ./openapi.yaml#/components/parameters/MessageIdPath
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./openapi.yaml#/components/schemas/UpdateMessageRequestBody
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/MessageResource
        default:
          $ref: ./openapi.yaml#/components/responses/Error
    delete:
      summary: Delete a personal account message
      operationId: delete-account-message
      tags:
        - Account
      security:
        - accessTokenAuth: []
      parameters:
        - $ref: ./openapi.yaml#/components/parameters/MessageIdPath
      responses:
        "204":
          description: No Content
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/account/messages/{messageId}/headers:
    get:
      summary: Get raw RFC 5322 headers of a personal account message
      operationId: get-account-message-headers
      tags:
        - Account
      security:
        - accessTokenAuth: []
      parameters:
        - $ref: ./openapi.yaml#/components/parameters/MessageIdPath
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/MessageHeadersResource
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/account/messages/{messageId}/raw:
    get:
      summary: Download raw RFC 5322 `.eml` source of a personal account message
      operationId: download-account-message-raw
      tags:
        - Account
      security:
        - accessTokenAuth: []
      parameters:
        - $ref: ./openapi.yaml#/components/parameters/MessageIdPath
      responses:
        "200":
          description: Raw RFC 5322 message stream.
          headers:
            Content-Disposition:
              description: Always `attachment` carrying `<messageId>.eml`.
              schema:
                type: string
          content:
            message/rfc822:
              schema:
                type: string
                format: binary
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/account/attachments:
    post:
      summary: Upload a personal account reply attachment
      description: |-
        Uploads raw file bytes (`application/octet-stream`) for use in `reply-account-thread`.
        Unreferenced attachments are removed automatically after 24 hours.
      operationId: upload-account-attachment
      tags:
        - Account
      security:
        - accessTokenAuth: []
      parameters:
        - $ref: ./openapi.yaml#/components/parameters/FilenameQuery
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              contentMediaType: application/octet-stream
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/AttachmentResource
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/account/attachments/{attachmentId}/content:
    get:
      summary: Download a personal account attachment
      operationId: download-account-attachment
      tags:
        - Account
      security:
        - accessTokenAuth: []
      parameters:
        - $ref: ./openapi.yaml#/components/parameters/AttachmentIdPath
        - $ref: ./openapi.yaml#/components/parameters/InlineQuery
      responses:
        "200":
          description: OK
          headers:
            Content-Disposition:
              description: "`inline` when requested and safe for the detected content type, `attachment` otherwise."
              schema:
                type: string
          content:
            "*/*":
              schema:
                type: string
                format: binary
        default:
          $ref: ./openapi.yaml#/components/responses/Error
components:
  schemas:
    SpamFilterMode:
      type: string
      description: "`standard` filters known spoofing and unauthenticated bulk mail before forwarding; `strict` forwards only messages passing strict sender authentication."
      enum:
        - standard
        - strict
    AccountMailboxResource:
      type: object
      required:
        - id
        - address
        - allocation_status
        - allocation_error
        - forward_to
        - forward_email_verified
        - forwarding_enabled
        - spam_filter_mode
        - outbound_status
        - pause_reason
        - reply_daily_limit
        - reply_used_today
        - unread_count
        - created_at
        - updated_at
      additionalProperties: false
      properties:
        id:
          description: Personal mailbox identifier; null until activated.
          type:
            - string
            - "null"
          format: uuid
        address:
          description: Allocated personal email address; null while unallocated, pending, or failed.
          type:
            - string
            - "null"
          format: email
        allocation_status:
          $ref: ./openapi.yaml#/components/schemas/AllocationStatus
        allocation_error:
          type:
            - string
            - "null"
        forward_to:
          description: Account's external email address synchronized from IAM that receives forwarded inbound mail.
          type:
            - string
            - "null"
          format: email
        forward_email_verified:
          description: Forwarding and reply-by-email require the external email address to be verified.
          type: boolean
        forwarding_enabled:
          type: boolean
        spam_filter_mode:
          $ref: "#/components/schemas/SpamFilterMode"
        outbound_status:
          $ref: ./openapi.yaml#/components/schemas/OutboundStatus
        pause_reason:
          anyOf:
            - $ref: ./openapi.yaml#/components/schemas/PauseReason
            - type: "null"
        reply_daily_limit:
          type: integer
          format: int64
          minimum: 0
        reply_used_today:
          type: integer
          format: int64
          minimum: 0
        unread_count:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type:
            - string
            - "null"
          format: date-time
        updated_at:
          type:
            - string
            - "null"
          format: date-time
    UpdateAccountMailboxRequestBody:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        forwarding_enabled:
          type: boolean
        spam_filter_mode:
          $ref: "#/components/schemas/SpamFilterMode"
    ReplyAccountThreadRequestBody:
      type: object
      additionalProperties: false
      properties:
        in_reply_to_message_id:
          description: Specific inbound message in this thread to reply to; defaults to the latest inbound message.
          type: string
          format: uuid
        text:
          description: Plain-text reply body. At least one of `text` or `html` is required.
          type: string
        html:
          description: HTML reply body. At least one of `text` or `html` is required; plain text is auto-derived when omitted.
          type: string
        attachment_ids:
          description: Pre-uploaded attachment IDs from `upload-account-attachment`.
          type: array
          maxItems: 10
          items:
            type: string
            format: uuid
