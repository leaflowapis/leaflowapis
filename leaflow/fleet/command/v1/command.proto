syntax = "proto3";

package leaflow.fleet.command.v1;

import "google/protobuf/duration.proto";

option go_package = "github.com/leaflowapis/leaflow-go/fleet/command/v1;commandv1";

// Commands the platform runs on a machine through its Agent, instead of
// logging in over SSH: no open port, no key to distribute and no address to
// reach, since the Agent's control connection (leaflow.fleet.control.v1)
// already leads to the machine. Every call fails with the reasons of each
// method in a google.rpc.ErrorInfo of the domain "fleet.leaflow.cloud".
//
// A command is one line for the account's login shell, as `ssh host
// 'command'` runs it (RFC 4254 §6.5 "exec"): pipes, redirection and `&&`
// work, and there is no terminal and no standard input. The Agent runs it as
// the account, through the account and session stacks of its PAM service,
// so expired and locked accounts, and directory accounts that may not log
// in, are refused as they would be over SSH.
//
// Neither the command nor its output is confidential to the platform: do
// not put secrets into either.
//
// Feature "leaflow.fleet.command.v1" (leaflow.fleet.machine.v1 Feature):
// AVAILABLE whenever the Agent runs.

// Runs commands. Served by the daemon; the service calls it.
service CommandService {
  // Runs one command and returns once it exited or was killed, with what it
  // wrote. A command that fails is still a successful call: its exit status
  // is its result.
  //
  // Fails with:
  //   - INVALID_ARGUMENT and reason INVALID_REQUEST for an empty command,
  //     one longer than 65536 bytes or one containing a NUL byte, or a
  //     timeout outside 1 to 300 seconds;
  //   - NOT_FOUND and reason ACCOUNT_NOT_FOUND for an unknown account;
  //   - PERMISSION_DENIED and reason ACCOUNT_NOT_ALLOWED when PAM refuses the
  //     account, with metadata "pamMessage", the text PAM gave;
  //   - INTERNAL and reason COMMAND_START_FAILED when the shell could not
  //     start; nothing ran.
  rpc RunCommand(RunCommandRequest) returns (RunCommandResponse);
}

// The request of RunCommand.
message RunCommandRequest {
  // The account to run as, a local account or a directory account of the
  // machine (leaflow.fleet.directory.v1).
  string username = 1;
  // The command line for the account's login shell (`shell -c command`).
  string command = 2;
  // Kills the command, and every process it started, this long after it
  // started. 1 to 300 seconds; unset: 60 seconds.
  google.protobuf.Duration timeout = 3;
}

// The response of RunCommand.
message RunCommandResponse {
  // How the command ended.
  oneof termination {
    // It exited with this status (wait(2) WEXITSTATUS), 0 being success.
    // Any other value is the command's own verdict.
    int32 exit_status = 1;
    // A signal ended it (wait(2) WTERMSIG), such as 9 when the timeout
    // killed it.
    int32 signal = 2;
  }
  // The timeout ended it.
  bool timed_out = 3;
  // What it wrote to standard output, at most 1 MiB; the rest is discarded.
  bytes stdout = 4;
  // stdout is cut short.
  bool stdout_truncated = 5;
  // What it wrote to standard error, at most 1 MiB; the rest is discarded.
  bytes stderr = 6;
  // stderr is cut short.
  bool stderr_truncated = 7;
}
