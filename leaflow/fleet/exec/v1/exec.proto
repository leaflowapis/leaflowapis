syntax = "proto3";

package leaflow.fleet.exec.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "google/rpc/status.proto";
import "leaflow/fleet/control/v1/control.proto";

option go_package = "github.com/leaflowapis/leaflow-go/fleet/exec/v1;execv1";

// Programs run without a terminal as the session's user, never as root (RFC
// 4254 §6.5 "exec", with an argument vector instead of a command line).
//
// Channel type "leaflow.fleet.exec.v1", lane "bulk": opened by the participant,
// one per run and at most four at a time per connection. The participant sends
// ClientMessage, starting with ExecStart; the session sends ServerMessage: the
// output as the program writes it, then exactly one ExecExit, and closes the
// channel. Closing the channel with CANCELLED, or the end of the connection,
// kills the program's process group and nothing else. Output beyond the
// channel's credit waits, so a participant that reads slowly slows the program
// down.
//
// Neither the arguments nor the output enter logs. Needs ExecPolicy;
// read-only participants open none.
//
// Channel type "leaflow.fleet.exec.v1.background", lane "bulk": uses the
// same messages for a process owned by the Fleet session. The participant
// starts with ExecStart and receives ExecStarted. Closing the channel detaches
// without stopping the process; a later participant sends ExecAttach with the
// returned token. It ends only with ExecStop, StopExecution, process exit,
// session end or authorization revocation. This channel type is separate so an
// older Agent cannot silently treat a background request as a foreground run.
//
// Background execution inspection and lifecycle events:
//   - ExecService is served by the session process over its control connection
//     so Fleet can list, inspect, read persisted output files of, and stop
//     background executions on behalf of an authorized caller without holding a
//     database of process state. Because these requests and responses are
//     forwarded by Fleet over the control connection, the arguments, output and
//     metadata they carry are visible to Fleet (never logged).
//   - ExecEventService is served by Fleet on the session process's control
//     connection so the session process can report periodic running heartbeats
//     (every 30 minutes) and terminal exit events (including exit status or
//     signal) for real-time EventBus delivery.
//   - Background executions live only in the session process and its per-boot
//     runtime storage (for example under /run/user/<uid>); once the machine
//     reboots or the session ends, no running executions remain.

// Inspects and controls background executions owned by a session. Served by the
// session process on its control connection; Fleet calls it with a control-only
// SignedAuthorization carrying ExecPolicy.
service ExecService {
  // Lists background executions currently tracked by the session process,
  // newest first. Includes recently exited executions retained until the
  // session ends so callers can read their final status and output files.
  rpc ListExecutions(ListExecutionsRequest) returns (ListExecutionsResponse);

  // Returns the current metadata and status of one background execution.
  // Fails with NOT_FOUND and reason EXECUTION_NOT_FOUND when unknown.
  rpc GetExecution(GetExecutionRequest) returns (GetExecutionResponse);

  // Reads a bounded slice of a background execution's persisted output file by
  // tail lines, line range, or byte offset.
  // Fails with NOT_FOUND and reason EXECUTION_NOT_FOUND when unknown.
  rpc ReadExecutionOutput(ReadExecutionOutputRequest) returns (ReadExecutionOutputResponse);

  // Stops a running background execution owned by the session. Stopping an
  // execution that has already exited succeeds and returns its current info.
  // Fails with NOT_FOUND and reason EXECUTION_NOT_FOUND when unknown, or
  // PERMISSION_DENIED when the authorization is read-only.
  rpc StopExecution(StopExecutionRequest) returns (StopExecutionResponse);
}

// Receives background execution lifecycle reports from a session process and
// forwards them to EventBus. Served by Fleet on the session process's control
// connection; reports are not persisted in Fleet's database.
service ExecEventService {
  // Reports a periodic running heartbeat (typically every 30 minutes) or a
  // terminal exit event for a background execution. The session process retains
  // unacknowledged EXITED events in memory and retries after reconnecting until
  // answered with success; missed RUNNING heartbeats are not replayed.
  rpc ReportExecutionEvent(ReportExecutionEventRequest) returns (ReportExecutionEventResponse);
}

// A message from the participant.
message ClientMessage {
  // The message.
  oneof message {
    // Starts the program. The first message.
    ExecStart start = 1;
    // Bytes for the program's standard input, when ExecStart.stdin is
    // set.
    ExecInput input = 2;
    // Closes the program's standard input (RFC 4254 §5.3 "eof").
    ExecInputEnd input_end = 3;
    // Reattaches to a background process. Only on the background channel.
    ExecAttach attach = 4;
    // Stops a background process. Only on the background channel.
    ExecStop stop = 5;
  }
}

// A message from the session.
message ServerMessage {
  // The message.
  oneof message {
    // Bytes the program wrote.
    ExecOutput output = 1;
    // The program ended, or never ran. The last message.
    ExecExit exit = 2;
    // Identifies a background process for later attachment.
    ExecStarted started = 3;
  }
}

// Starts a program. No shell interprets the arguments; a participant that wants
// one runs it, such as ["/bin/sh", "-lc", "ls | wc -l"].
message ExecStart {
  // The program and its arguments. argv[0] is looked up in PATH unless it
  // contains "/".
  repeated string argv = 1;
  // The working directory. Empty: the user's home directory.
  string working_directory = 2;
  // The requested execution timeout, at most 10 minutes. Unset: 120 seconds
  // for foreground execution. A background execution with
  // ExecPolicy.unlimited_lifetime may leave this unset to run until it exits,
  // is explicitly stopped, the session ends, or its authorization is revoked.
  google.protobuf.Duration timeout = 3;
  // The program reads standard input from ExecInput. Otherwise its
  // standard input is empty.
  bool stdin = 4;
  // Environment variables added to the session's.
  map<string, string> environment = 5;
}

// Bytes for the program's standard input.
message ExecInput {
  // At most 64 KiB.
  bytes data = 1;
}

// Closes the program's standard input.
message ExecInputEnd {}

// A background process handle.
message ExecStarted {
  // 16-byte UUID identifying the background execution. ExecService, REST APIs
  // and EventBus represent this same identifier in canonical lowercase UUID
  // string form.
  bytes execution_id = 1;
  // Opaque token required for ExecAttach on the WebRTC background channel.
  bytes attach_token = 2;
  // Absolute path on the machine where the session persists combined output
  // for this background execution, when file persistence is enabled.
  string output_path = 3;
}

// Reattaches to a background process.
message ExecAttach {
  bytes execution_id = 1;
  bytes attach_token = 2;
}

// Stops a background process owned by the session.
message ExecStop {}

// Bytes the program wrote (RFC 4254 §5.2 data and extended data). Each
// stream keeps its own order. The output limit comes from ExecPolicy.
message ExecOutput {
  // Where it wrote them.
  OutputStream stream = 1;
  // At most 64 KiB.
  bytes data = 2;
}

// An output stream of a program.
enum OutputStream {
  OUTPUT_STREAM_UNSPECIFIED = 0;
  // Standard output.
  OUTPUT_STREAM_STDOUT = 1;
  // Standard error (SSH_EXTENDED_DATA_STDERR).
  OUTPUT_STREAM_STDERR = 2;
  // Merged standard output and standard error in write order.
  OUTPUT_STREAM_COMBINED = 3;
}

// How the program ended (RFC 4254 §6.10).
message ExecExit {
  // How it ended. Unset when it never ran.
  oneof status {
    // It exited with this code, 0 to 255, including a nonzero one
    // ("exit-status").
    uint32 exit_code = 1;
    // A signal ended it, named without "SIG", such as "KILL"
    // ("exit-signal").
    string signal_name = 2;
  }
  // The signal dumped core.
  bool core_dumped = 3;
  // Why the session could not start it or killed it: NOT_FOUND for a missing
  // program, DEADLINE_EXCEEDED after the timeout, CANCELLED, or
  // RESOURCE_EXHAUSTED beyond the output limit. Unset when it ended by
  // itself, whatever its exit code.
  google.rpc.Status error = 4;
}

// Allows a participant to run commands. Carried in the participant's signed
// authorization. Limits that are absent use the Agent's defaults. The
// unlimited flags explicitly remove the corresponding application limit.
message ExecPolicy {
  uint32 max_processes = 1;
  google.protobuf.Duration max_lifetime = 2;
  uint64 max_output_bytes = 3;
  bool unlimited_lifetime = 4;
  bool unlimited_output = 5;
  bool background_allowed = 6;
  // Allows the Agent to start the process without PR_SET_NO_NEW_PRIVS. This
  // is required when it must invoke sudo or another set-user-ID helper. Any
  // elevation still goes through the machine's PAM and Fleet approval policy.
  bool allow_privilege_escalation = 7;
}

// Lifecycle state of a background execution.
enum ExecutionState {
  EXECUTION_STATE_UNSPECIFIED = 0;
  // Process is still running.
  EXECUTION_STATE_RUNNING = 1;
  // Process has exited or was terminated; metadata and output remain readable
  // until the session ends or the retention limit is reached.
  EXECUTION_STATE_EXITED = 2;
}

// Kind of lifecycle event reported by a session process.
enum ExecutionEventKind {
  EXECUTION_EVENT_KIND_UNSPECIFIED = 0;
  // Periodic heartbeat while the execution continues to run (every 30 minutes).
  EXECUTION_EVENT_KIND_RUNNING = 1;
  // Terminal notification once the execution exits or is terminated.
  EXECUTION_EVENT_KIND_EXITED = 2;
}

// Metadata and current status of a background execution.
message ExecutionInfo {
  // Canonical lowercase UUID matching ExecStarted.execution_id.
  string execution_id = 1;
  // Full argument vector passed to ExecStart.
  repeated string argv = 2;
  // Resolved working directory where the process was started.
  string working_directory = 3;
  // Platform user UUID owning the session.
  string user_id = 4;
  // Effective OS username running the process on the machine.
  string username = 5;
  ExecutionState state = 6;
  google.protobuf.Timestamp started_at = 7;
  // Set when state is EXECUTION_STATE_EXITED.
  google.protobuf.Timestamp finished_at = 8;
  // Elapsed wall time since started_at (while running) or total runtime (once exited).
  google.protobuf.Duration duration = 9;
  // Terminal exit status or signal. Set when state is EXECUTION_STATE_EXITED.
  ExecExit exit = 10;
  // Absolute path on the machine where combined output is persisted so callers
  // and AI tools can search or inspect it locally.
  string output_path = 11;
  // Total bytes written to the combined output file so far.
  uint64 output_bytes = 12;
  // Total lines written to the combined output file so far.
  uint64 output_lines = 13;
  // Output was capped at the policy limit and further bytes were discarded.
  bool output_truncated = 14;
}

message ListExecutionsRequest {
  // Optional filter. Unspecified returns both running and retained exited
  // executions.
  ExecutionState state = 1;
  // Required when Fleet forwards over the session control connection;
  // Authorization.control_only must be true.
  leaflow.fleet.control.v1.SignedAuthorization authorization = 2;
}

message ListExecutionsResponse {
  repeated ExecutionInfo executions = 1;
}

message GetExecutionRequest {
  string execution_id = 1;
  leaflow.fleet.control.v1.SignedAuthorization authorization = 2;
}

message GetExecutionResponse {
  ExecutionInfo execution = 1;
}

// Line-based slice of an output file.
message LineRange {
  // 1-based starting line number.
  uint64 start_line = 1;
  // Maximum lines to return.
  uint32 max_lines = 2;
}

// Byte-based slice of an output file.
message ByteRange {
  // 0-based byte offset.
  uint64 offset = 1;
  // Maximum bytes to return.
  uint32 max_bytes = 2;
}

message ReadExecutionOutputRequest {
  string execution_id = 1;
  // Output stream to read. Unspecified defaults to OUTPUT_STREAM_COMBINED.
  OutputStream stream = 2;
  // Slice of the output file to read. Unset defaults to the last 200 lines.
  oneof range {
    // Return at most the last N lines.
    uint32 tail_lines = 3;
    // Return lines starting at a 1-based line number.
    LineRange line_range = 4;
    // Return bytes starting at a 0-based byte offset.
    ByteRange byte_range = 5;
  }
  leaflow.fleet.control.v1.SignedAuthorization authorization = 6;
}

message ReadExecutionOutputResponse {
  // Output bytes in the requested slice, capped by the transfer budget (at most
  // 256 KiB per response).
  bytes data = 1;
  // 1-based first line returned (0 when data is empty).
  uint64 start_line = 2;
  // 1-based last line returned (0 when data is empty).
  uint64 end_line = 3;
  // Total lines currently in the requested stream.
  uint64 total_lines = 4;
  // 0-based byte offset where data starts.
  uint64 start_offset = 5;
  // 0-based byte offset immediately after data, usable as the next offset.
  uint64 next_offset = 6;
  // Total bytes currently in the requested stream.
  uint64 total_bytes = 7;
  // More output exists beyond the returned slice.
  bool has_more = 8;
  // The underlying output file was truncated at the policy limit.
  bool output_truncated = 9;
  // Absolute path on the machine for the persisted output file.
  string output_path = 10;
}

message StopExecutionRequest {
  string execution_id = 1;
  leaflow.fleet.control.v1.SignedAuthorization authorization = 2;
}

message StopExecutionResponse {
  ExecutionInfo execution = 1;
}

// A lifecycle event for one background execution.
message ExecutionEvent {
  // Must match the session_id of the reporting session process connection.
  string session_id = 1;
  string execution_id = 2;
  ExecutionEventKind kind = 3;
  // Strictly increasing per execution_id (starting at 1) to order events and
  // deduplicate retries.
  uint64 sequence = 4;
  google.protobuf.Timestamp observed_at = 5;
  ExecutionInfo execution = 6;
}

message ReportExecutionEventRequest {
  ExecutionEvent event = 1;
}

message ReportExecutionEventResponse {}
