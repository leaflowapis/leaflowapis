paths:
  /api/v1/elastic-ip-lines:
    get:
      operationId: list-elastic-ip-lines
      summary: List and search elastic IP lines
      tags:
      - elastic-ip-lines
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElasticIPLineListResponseBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
      description: Lists the lines on sale. A line is the network an elastic IP is bought on, with the bandwidth that
        can be chosen and the two Billing Plans its elastic IPs are paid under. Region is optional. Prices, commercial
        terms and checkout are read directly from Billing. `q` searches the names and descriptions of the lines on
        sale; filters combine with AND, and pagination is independent of them.
      parameters:
      - name: region_id
        in: query
        required: false
        schema:
          $ref: ./identifiers.yaml#/components/schemas/RegionID
      - name: q
        in: query
        required: false
        description: Search text matched against line names and descriptions; combined with the other filters using
          AND.
        schema:
          type: string
          minLength: 1
          maxLength: 255
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
  /api/v1/elastic-ip-lines/{elasticIpLineId}:
    get:
      operationId: get-elastic-ip-line
      summary: Get an elastic IP line
      tags:
      - elastic-ip-lines
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElasticIPLine'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
      description: Includes lines off sale that existing elastic IPs are on. No inventory or gateway facts are
        returned.
      parameters:
      - name: elasticIpLineId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/ElasticIPLineID
components:
  schemas:
    ElasticIPLine:
      description: |-
        The network an elastic IP is bought on: the bandwidth that can be chosen, and the two Billing Plans every elastic IP of the line is paid under in one order. The address subscription is always used and meters the address while it is held idle, associated with nothing; the network subscription pays the bandwidth, prepaid or used while associated, or the traffic sent. Contains no supply ranges, gateways or backend execution state.
      type: object
      properties:
        id:
          $ref: ./identifiers.yaml#/components/schemas/ElasticIPLineID
        region_id:
          $ref: ./identifiers.yaml#/components/schemas/RegionID
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          minLength: 0
          maxLength: 255
        address_plan_id:
          description: The Billing Plan of the address subscription every elastic IP of this line has. It is always
            used, and meters the address while no network interface holds it. Read its prices from Billing.
          type: string
          format: uuid
          readOnly: true
        network_plan_id:
          description: The Billing Plan of the network subscription every elastic IP of this line has, which pays its
            bandwidth, prepaid or used while associated, or its traffic. Read its prices from Billing.
          type: string
          format: uuid
          readOnly: true
        min_bandwidth_mbps:
          description: The least bandwidth an elastic IP of this line can be bought with, in Mbps.
          type: integer
          format: int64
        max_bandwidth_mbps:
          description: The most bandwidth an elastic IP of this line can be bought with, in Mbps, at most 1000. An elastic
            IP associated with a virtual machine is also held to the machine type's `max_bandwidth_mbps`.
          type: integer
          format: int64
        bandwidth_step_mbps:
          description: Bandwidth is bought in multiples of this many Mbps, from `min_bandwidth_mbps` to
            `max_bandwidth_mbps`, both of which are multiples of it too.
          type: integer
          format: int64
        sale_status:
          description: '`on_sale` is offered for new elastic IPs; `off_sale` takes none, while the elastic IPs already
            on it keep working.'
          type: string
          enum:
          - on_sale
          - off_sale
        traffic_sale_status:
          description: Whether an elastic IP of this line can be bought with `internet_charge_type` `traffic`, billed by
            the bytes it sends. `off_sale` refuses that with `ELASTIC_IP_TRAFFIC_UNAVAILABLE`.
          type: string
          enum:
          - on_sale
          - off_sale
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - region_id
      - name
      - description
      - address_plan_id
      - network_plan_id
      - min_bandwidth_mbps
      - max_bandwidth_mbps
      - bandwidth_step_mbps
      - sale_status
      - traffic_sale_status
      - created_at
      - updated_at
      additionalProperties: false
    ElasticIPLineListResponseBody:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ElasticIPLine'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
      additionalProperties: false
