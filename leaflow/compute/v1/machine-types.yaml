paths:
  /api/v1/machine-types:
    get:
      summary: List machine types on sale
      description: Only machine types currently on sale are listed. A withdrawn one disappears from here
        and can no longer be ordered, while the virtual machines already running it keep running.
      operationId: list-machine-types
      tags:
      - machine-types
      parameters:
      - name: region_id
        in: query
        required: false
        explode: false
        schema:
          $ref: ./identifiers.yaml#/components/schemas/RegionID
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineTypeListResponseBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
  /api/v1/machine-types/{machineTypeId}:
    get:
      summary: Get a machine type
      description: Returns only an on-sale machine type, under the same access rules as listing. Off-sale, retired
        or absent types return 404.
      operationId: get-machine-type
      tags:
      - machine-types
      parameters:
      - name: machineTypeId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/MachineTypeID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineType'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
components:
  schemas:
    MachineType:
      type: object
      properties:
        availability_zone_id:
          $ref: ./identifiers.yaml#/components/schemas/AvailabilityZoneID
        id:
          $ref: ./identifiers.yaml#/components/schemas/MachineTypeID
        max_bandwidth_mbps:
          description: |-
            The machine's network rate, in Mbps. **Each** network interface of the machine is limited to it in both directions — per interface rather than shared, so a machine with two interfaces has this rate on each of them; `max_network_interfaces` says how many it may have. Zero is no limit.

            An elastic IP bound to the machine cannot be bought faster than this rate; asking for more is refused with `INSTANCE_BANDWIDTH_CEILING`.
          type: integer
          format: int64
        max_elastic_ips:
          type: integer
          format: int64
        max_network_interfaces:
          type: integer
          format: int64
        name:
          type: string
        ram_mb:
          type: integer
          format: int64
        region_id:
          $ref: ./identifiers.yaml#/components/schemas/RegionID
        vcpus:
          type: integer
          format: int64
        plan_id:
          description: The actual Billing Plan associated with this resource. Read prices and commercial terms directly
            from Billing using this identifier.
          type: string
          format: uuid
          readOnly: true
      required:
      - id
      - name
      - vcpus
      - ram_mb
      - region_id
      - availability_zone_id
      - max_network_interfaces
      - max_elastic_ips
      - max_bandwidth_mbps
      - plan_id
      additionalProperties: false
    MachineTypeListResponseBody:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MachineType'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
      additionalProperties: false
