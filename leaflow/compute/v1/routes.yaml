paths:
  /api/v1/virtual-private-clouds/{virtualPrivateCloudId}/routes:
    get:
      summary: List static routes
      operationId: list-routes
      tags:
      - routes
      parameters:
      - name: virtualPrivateCloudId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/VirtualPrivateCloudID
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteListResponseBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    post:
      summary: Create a static route
      description: 'Three forms that would sever connectivity are rejected: a destination of `0.0.0.0/0`, which
        overrides the default route and takes every elastic IP offline immediately; a destination equal to the CIDR
        of a subnet, which overrides its directly connected route; and a next hop equal to the gateway of a subnet,
        which points back at the router itself.'
      operationId: create-route
      tags:
      - routes
      parameters:
      - name: virtualPrivateCloudId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/VirtualPrivateCloudID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRouteRequestBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteResource'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
  /api/v1/virtual-private-clouds/{virtualPrivateCloudId}/routes/{routeId}:
    delete:
      summary: Delete a static route
      operationId: delete-route
      tags:
      - routes
      parameters:
      - name: virtualPrivateCloudId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/VirtualPrivateCloudID
      - name: routeId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/RouteID
      responses:
        '204':
          description: No Content
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
components:
  schemas:
    RouteResource:
      type: object
      properties:
        peering_id:
          description: System-owned peering route. Delete the peering to remove this route.
          $ref: ./identifiers.yaml#/components/schemas/PeeringID
        created_at:
          type: string
          format: date-time
        description:
          type: string
        destination:
          type: string
        id:
          $ref: ./identifiers.yaml#/components/schemas/RouteID
        nexthop:
          description: Present for custom routes; peering routes expose peering_id instead.
          type: string
      required:
      - id
      - destination
      - description
      - created_at
      additionalProperties: false
    RouteListResponseBody:
      type: object
      properties:
        items:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/RouteResource'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
      additionalProperties: false
    CreateRouteRequestBody:
      type: object
      properties:
        description:
          type: string
          maxLength: 255
        destination:
          description: Destination CIDR. It cannot be `0.0.0.0/0`, nor the CIDR of a subnet of this network
          type: string
          minLength: 1
          maxLength: 32
        nexthop:
          description: Private address of a virtual machine; must fall inside a subnet of this virtual private cloud
          type: string
          minLength: 1
          maxLength: 64
      required:
      - destination
      - nexthop
      additionalProperties: false
