paths:
  /api/v1/regions/{regionId}/availability-zones:
    get:
      summary: List the availability zones of a region
      description: A disk and a virtual machine must reside in the same availability zone to be attached. Confirm
        the zone before creating either.
      operationId: list-availability-zones
      tags:
      - availability-zones
      parameters:
      - name: regionId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/RegionID
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneListResponseBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
components:
  schemas:
    ZoneResource:
      type: object
      properties:
        name:
          description: Display name for this zone, shown to tenants (Hong Kong A). The stable handle is code.
          type: string
        code:
          description: The zone's code within its region (hk-1-a). Stable and human-written; addressing is by id.
          type: string
        id:
          $ref: ./identifiers.yaml#/components/schemas/AvailabilityZoneID
      required:
      - code
      - name
      - id
      additionalProperties: false
    ZoneListResponseBody:
      type: object
      properties:
        items:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ZoneResource'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
      additionalProperties: false
