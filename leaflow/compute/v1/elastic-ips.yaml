paths:
  /api/v1/elastic-ips:
    get:
      summary: List elastic IPs
      operationId: list-elastic-ips
      tags:
      - elastic-ips
      parameters:
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElasticIPListResponseBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    post:
      summary: Allocate an elastic IP
      description: |-
        Select an elastic IP line. The elastic IP is bought through a Billing Checkout Session, and no address is allocated before its order is accepted.

        Returns the elastic IP as `pending` with its Checkout Session; `address` is null until the address is allocated after the order is accepted. A requested `address` is not held while pending; if it is no longer available then, the elastic IP ends `failed` with `provisioning_failed` and its charge is refunded.

        IPv6 is not requested through this endpoint. IPv6 addresses are assigned to virtual machines by the virtual private cloud; enable IPv6 on that network instead.

        Allocation does not select or create a virtual private cloud. A later association selects an assigned network-interface address; Compute then establishes the required network connectivity.

        The elastic IP shows the `create` operation from the moment its Checkout Session is created until it is delivered or its checkout or order ends. Every other operation on it is refused with `COMPUTE_RESOURCE_BUSY` meanwhile, and its deletion with `COMPUTE_PURCHASE_PENDING` while its purchase awaits checkout or payment.
      operationId: create-elastic-ip
      tags:
      - elastic-ips
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateElasticIPRequestBody'
      responses:
        '202':
          description: The elastic IP and its Checkout Session were created; no address is allocated yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateElasticIPResponseBody'
        '409':
          $ref: ./openapi.yaml#/components/responses/Conflict
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
  /api/v1/elastic-ips/{elasticIpId}:
    get:
      summary: Retrieve an elastic IP
      operationId: get-elastic-ip
      tags:
      - elastic-ips
      parameters:
      - name: elasticIpId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/ElasticIPID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElasticIP'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    patch:
      summary: Update an elastic IP
      description: |-
        Changes the bandwidth of this elastic IP. `bandwidth_mbps` is an operational field: it starts a change and cannot be combined with any other field in the same request. Such a request is refused with 422 `UPDATE_FIELDS_COMBINED`, because a change that committed beside another that was then refused would leave the request half applied. An elastic IP has no descriptive field today, so 200 is reserved for the fields that may be added to it and every accepted update answers 202. `checkout` and `proration_date` belong to the purchase of the `bandwidth_mbps` change and are accepted only together with it.

        No separate bandwidth resource is created, and the limit applies to inbound and outbound traffic alike. The new value must lie within the line's bandwidth range and step, otherwise the request is refused with `ELASTIC_IP_BANDWIDTH_RANGE`. How the change is paid follows the elastic IP's network subscription:

        - **Prepaid**: the change goes through a Checkout Session that changes the network subscription, priced for the rest of its period. It starts once Billing accepts the order; if checkout is not completed, the order is not accepted or the change fails, `bandwidth_mbps` keeps its value and Billing shows the outcome.
        - **Pay-as-you-go**: there is no checkout. The change starts at once, `checkout_session_id` and `order_id` are null, and the new limit is metered from the instant it is applied; if it fails, the old limit stays in effect and metered. `checkout` and `proration_date` are refused with `ELASTIC_IP_CHECKOUT_UNUSED`.

        The elastic IP shows the `update_bandwidth` operation until the change is applied or ends, so other operations and a second change are refused with `COMPUTE_RESOURCE_BUSY` meanwhile. The current limit stays in effect until the change is applied.

        While the address is associated with a virtual machine, the limit must not exceed the `max_bandwidth_mbps` of that virtual machine's type; a higher limit is refused with `VIRTUAL_MACHINE_BANDWIDTH_CEILING`. The limit of an address that is not associated is checked when the address is associated with a virtual machine.
      operationId: update-elastic-ip
      tags:
      - elastic-ips
      parameters:
      - name: elasticIpId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/ElasticIPID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateElasticIPRequestBody'
      responses:
        '200':
          description: Only descriptive fields changed; no operation started. `checkout_session_id` and `order_id` are null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateElasticIPResponseBody'
        '202':
          description: The elastic IP, and the Checkout Session for the change of a prepaid network subscription; the
            new limit is not yet in effect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateElasticIPResponseBody'
        '409':
          $ref: ./openapi.yaml#/components/responses/Conflict
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    delete:
      summary: Release an elastic IP
      description: |-
        Releases the elastic IP after dissociating it. The elastic IP shows the `delete` operation until cleanup is confirmed; the address then immediately returns to available inventory, with no cooldown period. Deleting the association or replacing it alone does not release the address.

        Refused with `COMPUTE_RESOURCE_SUBSCRIBED` while a subscription pays for it, including a pay-as-you-go subscription, which every elastic IP has for its address. `meta.resource_id` names the elastic IP. It is released by canceling the subscriptions listed in `meta.subscription_ids` through Billing, the same set as its `release_set`: the address's and the network's together.

        Refused with `COMPUTE_PURCHASE_PENDING` while the purchase that created it still awaits checkout or payment; `meta.checkout_session_id` names its Checkout Session and `meta.order_id` its order once checkout created one. Expire the session or cancel the order in Billing instead.
      operationId: delete-elastic-ip
      tags:
      - elastic-ips
      parameters:
      - name: elasticIpId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/ElasticIPID
      responses:
        '409':
          $ref: ./openapi.yaml#/components/responses/Conflict
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
        '202':
          description: The release was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElasticIP'
  /api/v1/elastic-ips/{elasticIpId}/association:
    get:
      summary: Retrieve the association of an elastic IP
      description: |-
        The private address of a network interface this elastic IP currently points at. Returns the stored state; it does not query the cloud.

        An elastic IP that points at nothing has no association: the request is refused with 404 `ELASTIC_IP_NOT_ASSOCIATED`.
      operationId: get-elastic-ip-association
      tags:
      - elastic-ips
      parameters:
      - name: elasticIpId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/ElasticIPID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElasticIPAssociation'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    put:
      summary: Associate an elastic IP with a target
      description: |-
        Points the elastic IP at a target: a virtual machine, which means the primary private IPv4 address of its primary network interface, or a network interface address (`network_interface_address_id`) given directly. Exactly one of `virtual_machine_id` and `network_interface_address_id`. A network interface address must be an assigned, unreleased IPv4 address on a network interface in this project and region; IPv6 addresses are rejected.

        The target becomes what the elastic IP points at. Repeating the request for the target it already points at changes nothing; an elastic IP associated with another target is refused with `ELASTIC_IP_ALREADY_ASSOCIATED` (409), and is moved by deleting the association first, so that the moment traffic stops reaching the old target is one the caller chose. The elastic IP shows the `associate` operation until the association is confirmed, and with a virtual machine as the target that virtual machine shows the `associate_elastic_ip` operation as well, so the virtual machine must not have another operation in progress.

        The elastic IP must be in the same region as the target. With a virtual machine as the target, the elastic IP's `bandwidth_mbps` must not exceed the `max_bandwidth_mbps` of that virtual machine's type; a higher limit is refused with `VIRTUAL_MACHINE_BANDWIDTH_CEILING`.
      operationId: put-elastic-ip-association
      tags:
      - elastic-ips
      parameters:
      - name: elasticIpId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/ElasticIPID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutElasticIPAssociationRequestBody'
      responses:
        '202':
          description: The association was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElasticIP'
        '409':
          $ref: ./openapi.yaml#/components/responses/Conflict
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    delete:
      summary: Remove the association of an elastic IP
      description: The address remains held by the project and simply no longer points at any network interface.
        The elastic IP shows the `disassociate` operation until the change is confirmed, and a virtual machine whose primary
        interface it pointed at shows the `disassociate_elastic_ip` operation. Removing an association that does not exist is
        refused with 404 `ELASTIC_IP_NOT_ASSOCIATED`.
      operationId: delete-elastic-ip-association
      tags:
      - elastic-ips
      parameters:
      - name: elasticIpId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/ElasticIPID
      responses:
        '202':
          description: The removal was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElasticIP'
        '409':
          $ref: ./openapi.yaml#/components/responses/Conflict
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
components:
  schemas:
    InternetChargeType:
      type: string
      description: What the network subscription of an elastic IP charges for. `bandwidth` charges for the bandwidth
        ceiling, prepaid for a period or by the Mbit/s-second while the address is associated. `traffic` charges for the
        bytes the address sends; it is reserved and refused with `ELASTIC_IP_TRAFFIC_UNAVAILABLE` until traffic is
        metered.
      enum:
      - bandwidth
      - traffic
    IPv4HostAddress:
      type: string
      minLength: 7
      maxLength: 15
      pattern: '^(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}$'
    ElasticIP:
      description: |-
        One public IP resource, including its bandwidth configuration. Bandwidth has no separate Compute resource ID.
        Two subscriptions of one order pay for it: the address subscription, always pay-as-you-go, charges for the
        address while it is not associated with anything, and the network subscription, on the terms chosen at
        purchase, charges for the bandwidth or the traffic. Changing bandwidth updates this same resource, not another
        allocation.
      type: object
      properties:
        internet_charge_type:
          $ref: '#/components/schemas/InternetChargeType'
        address:
          description: The held IPv4 address; null before actual claim. Holding identity is not exposed.
          anyOf:
          - $ref: '#/components/schemas/IPv4HostAddress'
          - type: 'null'
        allocated_at:
          description: The actual address holding start time; null before actual claim.
          type:
          - string
          - 'null'
          format: date-time
        released_at:
          description: The confirmed holding release time; null while held or before actual claim.
          type:
          - string
          - 'null'
          format: date-time
        bandwidth_mbps:
          type:
          - integer
          - 'null'
          format: int64
        created_at:
          type: string
          format: date-time
        id:
          $ref: ./identifiers.yaml#/components/schemas/ElasticIPID
        line_id:
          $ref: ./identifiers.yaml#/components/schemas/ElasticIPLineID
        region_id:
          $ref: ./identifiers.yaml#/components/schemas/RegionID
        status:
          description: '`pending` until the address is created, with no address allocated before the order is
            accepted and the `create` operation shown while it is created; then `available`. `failed` means no address
            was allocated; `failure_reason` states why.'
          type: string
          enum:
          - pending
          - available
          - deleted
          - failed
          - error
        checkout_session_id:
          description: The Billing Checkout Session that bought this resource; `order_id` and the order items stay null
            until its checkout completes. Null when the resource was not bought through one.
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
        order_id:
          type:
          - string
          - 'null'
          format: uuid
        address_order_item_id:
          description: The Billing order item of the address, always pay-as-you-go.
          type:
          - string
          - 'null'
          format: uuid
        address_subscription_id:
          description: The Billing subscription of the address. It may still be pending; its presence does not imply
            delivery or metering.
          type:
          - string
          - 'null'
          format: uuid
        network_order_item_id:
          description: The Billing order item of the bandwidth or traffic.
          type:
          - string
          - 'null'
          format: uuid
        network_subscription_id:
          description: The Billing subscription of the bandwidth or traffic. It may still be pending; its presence does
            not imply delivery or metering.
          type:
          - string
          - 'null'
          format: uuid
        release_set:
          description: The subscriptions a cancellation through Billing has to cover to release this elastic IP, both
            the address's and the network's, each with the resource it pays for, so that each line of a cancellation
            can name what it releases. A subscription that has ended is not listed, and the set is empty when no
            subscription pays for the elastic IP.
          type: array
          items:
            $ref: ./release-sets.yaml#/components/schemas/ReleaseSetItem
        access_state:
          type:
          - string
          - 'null'
          enum:
          - pending
          - enabled
          - suspended
          - reclaimed
          - null
        failure_reason:
          description: Why creation failed; null unless `status` is `failed`. `checkout_expired` means checkout was
            not completed before its Checkout Session expired. `provisioning_failed` means creation failed after the
            order was accepted, and the charge for this elastic IP is refunded.
          type:
          - string
          - 'null'
          enum:
          - order_declined
          - order_canceled
          - order_expired
          - checkout_expired
          - provisioning_failed
          - null
        operation:
          description: The operation in progress on this elastic IP, or null when none is.
          anyOf:
          - $ref: '#/components/schemas/ElasticIPOperation'
          - type: 'null'
          readOnly: true
        association:
          anyOf:
          - $ref: '#/components/schemas/ElasticIPAssociation'
          - type: 'null'
      required:
      - internet_charge_type
      - id
      - line_id
      - region_id
      - address
      - allocated_at
      - released_at
      - status
      - bandwidth_mbps
      - created_at
      - checkout_session_id
      - order_id
      - address_order_item_id
      - address_subscription_id
      - network_order_item_id
      - network_subscription_id
      - release_set
      - access_state
      - failure_reason
      - operation
      - association
      additionalProperties: false
    ElasticIPListResponseBody:
      type: object
      properties:
        items:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ElasticIP'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
      additionalProperties: false
    CreateElasticIPRequestBody:
      type: object
      properties:
        internet_charge_type:
          $ref: '#/components/schemas/InternetChargeType'
          default: bandwidth
        address:
          description: The IPv4 address to allocate. Selected by the platform when omitted.
          $ref: '#/components/schemas/IPv4HostAddress'
        bandwidth_mbps:
          description: |-
            The bandwidth ceiling of this address, in Mbit/s, applied to both directions.

            Required, and there is no "unlimited": an address with no ceiling runs at line rate and is
            charged nothing for the traffic, while the address itself bills normally — so the invoice
            looks correct and nothing anywhere reports it.

            It must lie within the line's `min_bandwidth_mbps` and `max_bandwidth_mbps` and be a multiple of its
            `bandwidth_step_mbps`, otherwise the request is refused with `ELASTIC_IP_BANDWIDTH_RANGE`. Changing it
            later updates the same elastic IP through `update-elastic-ip`, not an independent bandwidth resource.
          type: integer
          format: int64
          minimum: 1
          maximum: 1000
        line_id:
          $ref: ./identifiers.yaml#/components/schemas/ElasticIPLineID
        billing:
          description: The terms of the network subscription, which pays for the bandwidth or the traffic. The address
            subscription is always pay-as-you-go and takes no terms. Traffic is only sold pay-as-you-go.
          $ref: ./billing-terms.yaml#/components/schemas/BillingChoice
        checkout:
          $ref: ./billing-terms.yaml#/components/schemas/CheckoutOptions
      required:
      - bandwidth_mbps
      - line_id
      - billing
      additionalProperties: false
    UpdateElasticIPRequestBody:
      description: |-
        The mutable fields of the elastic IP identified by the path, all optional, at least one required. `bandwidth_mbps`
        is an operational field and cannot be combined with any other field; such a request is refused with 422
        `UPDATE_FIELDS_COMBINED`. This is a configuration change of that resource, not an independent bandwidth resource.
        Checkout is handled by Billing.
      type: object
      properties:
        bandwidth_mbps:
          description: Applied to both directions
          type: integer
          format: int64
          minimum: 1
        proration_date:
          description: The `proration_date` of the Billing quote for this change, so that the order is priced from
            the same instant. Only with `bandwidth_mbps` on a prepaid network subscription, and only for automatic
            checkout; deferred checkout is priced when the customer completes it. Defaults to the time of the request; it must be a whole second, not in the
            future and at most 10 minutes old, otherwise the request is refused with `BILLING_CHANGE_INVALID`.
          type: string
          format: date-time
        checkout:
          description: How the purchase of the `bandwidth_mbps` change is checked out. Only with `bandwidth_mbps` on a
            prepaid network subscription; a pay-as-you-go one has nothing to check out and refuses it with
            `ELASTIC_IP_CHECKOUT_UNUSED`.
          $ref: ./billing-terms.yaml#/components/schemas/CheckoutOptions
      minProperties: 1
      additionalProperties: false
    PutElasticIPAssociationRequestBody:
      description: The target an elastic IP points at. Exactly one of the two forms.
      oneOf:
      - $ref: '#/components/schemas/VirtualMachineAssociationTarget'
      - $ref: '#/components/schemas/NetworkInterfaceAddressAssociationTarget'
    VirtualMachineAssociationTarget:
      description: A virtual machine; the elastic IP points at the primary private IPv4 address of its primary network
        interface.
      type: object
      properties:
        virtual_machine_id:
          $ref: ./identifiers.yaml#/components/schemas/VirtualMachineID
      required:
      - virtual_machine_id
      additionalProperties: false
    NetworkInterfaceAddressAssociationTarget:
      description: One private address of a network interface. One interface may hold several private addresses, each
        with its own elastic IP.
      type: object
      properties:
        network_interface_address_id:
          description: An assigned, unreleased IPv4 address on a network interface in this project and region. IPv6
            addresses are rejected.
          $ref: ./identifiers.yaml#/components/schemas/NetworkInterfaceAddressID
      required:
      - network_interface_address_id
      additionalProperties: false
    CreateElasticIPResponseBody:
      description: |-
        The new elastic IP, `pending` until its order is accepted, and its Checkout Session. `address` is null until
        the address is allocated.
      type: object
      properties:
        elastic_ip:
          $ref: '#/components/schemas/ElasticIP'
        checkout_session_id:
          description: The Billing Checkout Session of this purchase. With deferred checkout, the customer completes it
            in Billing.
          type: string
          format: uuid
        order_id:
          description: The order created when checkout completes, at once for automatic checkout; null until then.
          type:
          - string
          - 'null'
          format: uuid
      required:
      - elastic_ip
      - checkout_session_id
      - order_id
      additionalProperties: false
    UpdateElasticIPResponseBody:
      description: The elastic IP and, when the update placed a Billing order, the Checkout Session for it. After a
        bandwidth change the elastic IP is still at its current bandwidth until the change is applied. Returned with
        200 when only descriptive fields changed and with 202 when an operation started.
      type: object
      properties:
        elastic_ip:
          $ref: '#/components/schemas/ElasticIP'
        checkout_session_id:
          description: The Billing Checkout Session of the purchase; null when the update placed no order. With deferred
            checkout, the customer completes it in Billing.
          type:
          - string
          - 'null'
          format: uuid
        order_id:
          description: The order created when checkout completes, at once for automatic checkout; null until then and
            when the update placed no order.
          type:
          - string
          - 'null'
          format: uuid
      required:
      - elastic_ip
      - checkout_session_id
      - order_id
      additionalProperties: false
    ElasticIPAssociation:
      type: object
      properties:
        id:
          $ref: ./identifiers.yaml#/components/schemas/ElasticIPAssociationID
        elastic_ip_id:
          description: The commercial ElasticIP identity. This is not an internal holding ID.
          $ref: ./identifiers.yaml#/components/schemas/ElasticIPID
        network_interface_address_id:
          $ref: ./identifiers.yaml#/components/schemas/NetworkInterfaceAddressID
        address:
          $ref: '#/components/schemas/IPv4HostAddress'
        fixed_ip:
          $ref: '#/components/schemas/IPv4HostAddress'
        state:
          type: string
          enum:
          - associated
          - released
        associated_at:
          type:
          - string
          - 'null'
          format: date-time
        disassociated_at:
          type:
          - string
          - 'null'
          format: date-time
        released_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - elastic_ip_id
      - network_interface_address_id
      - address
      - fixed_ip
      - state
      - associated_at
      - disassociated_at
      - released_at
      additionalProperties: false
    ElasticIPOperation:
      description: An operation still running on this elastic IP. It is not a separate resource; once it finishes,
        the elastic IP's `operation` is null again and the elastic IP shows the result.
      type: object
      properties:
        type:
          type: string
          enum:
          - create
          - associate
          - disassociate
          - update_bandwidth
          - suspend
          - resume
          - delete
        started_at:
          type: string
          format: date-time
      required:
      - type
      - started_at
      additionalProperties: false
