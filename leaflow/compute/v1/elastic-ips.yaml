paths:
  /api/v1/elastic-ips:
    get:
      summary: List elastic IPs
      operationId: list-elastic-ips
      tags:
      - elastic-ips
      parameters:
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElasticIPListResponseBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    post:
      summary: Allocate an elastic IP
      description: |-
        Select a public elastic IP type. The elastic IP is bought through a Billing Checkout Session, and no address is allocated before its order is accepted.

        Returns the elastic IP as `pending` with its Checkout Session; `address` is null until the address is allocated after the order is accepted. A requested `address` is not held while pending; if it is no longer available then, the elastic IP ends `failed` with `provisioning_failed` and its charge is refunded.

        IPv6 is not requested through this endpoint. IPv6 addresses are assigned to virtual machines by the virtual private cloud; enable IPv6 on that network instead.

        Allocation does not select or create a virtual private cloud. A later association selects an assigned network-interface address; Compute then establishes the required network connectivity.

        The elastic IP shows the `create` operation from the moment its Checkout Session is created until it is delivered or its checkout or order ends. Every other operation on it is refused with `COMPUTE_RESOURCE_BUSY` meanwhile, and its deletion with `COMPUTE_PURCHASE_PENDING` while its purchase awaits checkout or payment.
      operationId: create-elastic-ip
      tags:
      - elastic-ips
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateElasticIPRequestBody'
      responses:
        '202':
          description: The elastic IP and its Checkout Session were created; no address is allocated yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateElasticIPResponseBody'
        '409':
          $ref: ./openapi.yaml#/components/responses/Conflict
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
  /api/v1/elastic-ips/{elasticIpId}:
    get:
      summary: Retrieve an elastic IP
      operationId: get-elastic-ip
      tags:
      - elastic-ips
      parameters:
      - name: elasticIpId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/ElasticIPID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElasticIP'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    delete:
      summary: Release an elastic IP
      description: |-
        Releases the elastic IP after unbinding it. The elastic IP shows the `delete` operation until cleanup is confirmed; the address then immediately returns to available inventory, with no cooldown period. Unbinding or moving a binding alone does not release the address.

        Refused with `COMPUTE_RESOURCE_SUBSCRIBED` while a subscription pays for the address, including a pay-as-you-go subscription. `meta.resource_id` names the elastic IP. It is released by canceling the subscriptions listed in `meta.subscription_ids` through Billing, the same set as its `release_subscription_ids`.

        Refused with `COMPUTE_PURCHASE_PENDING` while the purchase that created it still awaits checkout or payment; `meta.checkout_session_id` names its Checkout Session and `meta.order_id` its order once checkout created one. Expire the session or cancel the order in Billing instead.
      operationId: release-elastic-ip
      tags:
      - elastic-ips
      parameters:
      - name: elasticIpId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/ElasticIPID
      responses:
        '409':
          $ref: ./openapi.yaml#/components/responses/Conflict
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
        '202':
          description: The release was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElasticIP'
  /api/v1/elastic-ips/{elasticIpId}/bandwidth:
    put:
      summary: Set the bandwidth limit
      description: |-
        Changes the bandwidth of this elastic IP through a Checkout Session that keeps its usage type and period; no separate bandwidth resource is created. The limit applies to inbound and outbound traffic alike. The elastic IP shows the `set_bandwidth` operation until the change is applied, its Checkout Session expires or its order is canceled, so other operations and a second change are refused with `COMPUTE_RESOURCE_BUSY` meanwhile. The current limit stays in effect until the change is applied. If checkout is not completed, the order is not accepted or the change fails, `bandwidth_mbps` keeps its value and Billing shows the outcome.

        While the address is bound to a virtual machine, the limit must not exceed the `max_bandwidth_mbps` of that virtual machine's type; a higher limit is refused with `INSTANCE_BANDWIDTH_CEILING`. The limit of an address that is not bound is checked when the address is bound to a virtual machine.
      operationId: set-elastic-ip-bandwidth
      tags:
      - elastic-ips
      parameters:
      - name: elasticIpId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/ElasticIPID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetElasticIPBandwidthRequestBody'
      responses:
        '202':
          description: The elastic IP and the Checkout Session for the change; the new limit is not yet in effect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetElasticIPBandwidthResponseBody'
        '409':
          $ref: ./openapi.yaml#/components/responses/Conflict
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
  /api/v1/elastic-ips/{elasticIpId}/binding:
    put:
      summary: Bind an elastic IP to a network interface
      description: The elastic IP shows the `bind` operation until the binding is confirmed.
      operationId: bind-elastic-ip
      tags:
      - elastic-ips
      parameters:
      - name: elasticIpId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/ElasticIPID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindElasticIPRequestBody'
      responses:
        '202':
          description: The binding was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElasticIP'
        '409':
          $ref: ./openapi.yaml#/components/responses/Conflict
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    delete:
      summary: Unbind an elastic IP
      description: The address remains held by the project and simply no longer points at any network interface.
        The elastic IP shows the `unbind` operation until the change is confirmed.
      operationId: unbind-elastic-ip
      tags:
      - elastic-ips
      parameters:
      - name: elasticIpId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/ElasticIPID
      responses:
        '202':
          description: The unbinding was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElasticIP'
        '409':
          $ref: ./openapi.yaml#/components/responses/Conflict
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
components:
  schemas:
    InternetChargeType:
      type: string
      description: Bandwidth billing is available. Traffic billing is reserved and cannot currently be selected for creation.
      enum:
      - bandwidth
      - traffic
    IPv4HostAddress:
      type: string
      minLength: 7
      maxLength: 15
      pattern: '^(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}$'
    ElasticIP:
      description: |-
        One public IP resource, including its bandwidth configuration. Bandwidth has no
        separate Compute resource ID; one subscription pays for the address and its bandwidth.
        Changing bandwidth updates this same resource, not another allocation.
      type: object
      properties:
        internet_charge_type:
          $ref: '#/components/schemas/InternetChargeType'
        address:
          description: The held IPv4 address; null before actual claim. Holding identity is not exposed.
          anyOf:
          - $ref: '#/components/schemas/IPv4HostAddress'
          - type: 'null'
        allocated_at:
          description: The actual address holding start time; null before actual claim.
          type:
          - string
          - 'null'
          format: date-time
        released_at:
          description: The confirmed holding release time; null while held or before actual claim.
          type:
          - string
          - 'null'
          format: date-time
        bandwidth_mbps:
          type:
          - integer
          - 'null'
          format: int64
        created_at:
          type: string
          format: date-time
        id:
          $ref: ./identifiers.yaml#/components/schemas/ElasticIPID
        type_id:
          $ref: ./identifiers.yaml#/components/schemas/ElasticIPTypeID
        region_id:
          $ref: ./identifiers.yaml#/components/schemas/RegionID
        status:
          description: '`pending` until the order is accepted, with no address allocated; `provisioning` while the
            address is allocated; then `available`. `failed` means no address was allocated; `failure_reason` states
            why. `missing` means the address no longer exists in the cloud.'
          type: string
          enum:
          - pending
          - provisioning
          - available
          - deleted
          - failed
          - error
          - unknown
          - missing
        checkout_session_id:
          description: The Billing Checkout Session that bought this resource; `order_id` and `order_item_id` stay null
            until its checkout completes. Null when the resource was not bought through one.
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
        order_id:
          type:
          - string
          - 'null'
          format: uuid
        order_item_id:
          description: The Billing order item for this resource.
          type:
          - string
          - 'null'
          format: uuid
        subscription_id:
          description: |-
            The Billing subscription associated with this resource. It may still be pending; its
            presence does not imply delivery or metering. Null when no subscription is associated.
          type:
          - string
          - 'null'
          format: uuid
        release_subscription_ids:
          description: The subscription a cancellation through Billing has to cover to release this elastic IP.
            A subscription that has ended is not listed, and the list is empty when no subscription pays for the
            elastic IP.
          type: array
          items:
            type: string
            format: uuid
        release_set:
          description: The subscriptions of `release_subscription_ids`, in the same order, each with the resource
            it pays for, so that each line of a cancellation can name what it releases.
          type: array
          items:
            $ref: ./release-sets.yaml#/components/schemas/ReleaseSetItem
        access_state:
          type:
          - string
          - 'null'
          enum:
          - pending
          - enabled
          - suspended
          - reclaimed
          - null
        failure_reason:
          description: Why creation failed; null unless `status` is `failed`. `checkout_expired` means checkout was
            not completed before its Checkout Session expired. `provisioning_failed` means creation failed after the
            order was accepted, and the charge for this elastic IP is refunded.
          type:
          - string
          - 'null'
          enum:
          - order_declined
          - order_canceled
          - order_expired
          - checkout_expired
          - provisioning_failed
          - null
        operation:
          description: The operation in progress on this elastic IP, or null when none is.
          anyOf:
          - $ref: '#/components/schemas/ElasticIPOperation'
          - type: 'null'
          readOnly: true
        binding:
          anyOf:
          - $ref: '#/components/schemas/IPv4Binding'
          - type: 'null'
      required:
      - internet_charge_type
      - id
      - type_id
      - region_id
      - address
      - allocated_at
      - released_at
      - status
      - bandwidth_mbps
      - created_at
      - checkout_session_id
      - order_id
      - order_item_id
      - subscription_id
      - release_subscription_ids
      - release_set
      - access_state
      - failure_reason
      - operation
      - binding
      additionalProperties: false
    ElasticIPListResponseBody:
      type: object
      properties:
        items:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ElasticIP'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
      additionalProperties: false
    CreateElasticIPRequestBody:
      type: object
      properties:
        internet_charge_type:
          $ref: '#/components/schemas/InternetChargeType'
          default: bandwidth
        address:
          description: The IPv4 address to allocate. Selected by the platform when omitted.
          $ref: '#/components/schemas/IPv4HostAddress'
        bandwidth_mbps:
          description: |-
            The bandwidth ceiling of this address, in Mbit/s, applied to both directions.

            Required, and there is no "unlimited": an address with no ceiling runs at line rate and is
            charged nothing for the traffic, while the address itself bills normally — so the invoice
            looks correct and nothing anywhere reports it.

            It is part of this elastic IP resource and uses the same commercial terms,
            selected from Billing's catalog. Changing it later updates the
            same elastic IP through its bandwidth endpoint, not an independent bandwidth resource.
          type: integer
          format: int64
          minimum: 1
          maximum: 1000
        type_id:
          $ref: ./identifiers.yaml#/components/schemas/ElasticIPTypeID
        billing:
          $ref: ./billing-terms.yaml#/components/schemas/BillingChoice
        checkout:
          $ref: ./billing-terms.yaml#/components/schemas/CheckoutOptions
      required:
      - bandwidth_mbps
      - type_id
      - billing
      additionalProperties: false
    SetElasticIPBandwidthRequestBody:
      description: |-
        Change bandwidth on the elastic IP identified by the path. This is a configuration change
        of that resource, not an independent bandwidth resource. Checkout is handled by Billing.
      type: object
      properties:
        bandwidth_mbps:
          description: Applied to both directions
          type: integer
          format: int64
          minimum: 1
        proration_date:
          description: The `proration_date` of the Billing quote for this change, so that the order is priced from
            the same instant. Only for automatic checkout; deferred checkout is priced when the customer completes it.
            Defaults to the time of the request; it must be a whole second, not in the future and at most 10 minutes
            old, otherwise the request is refused with `BILLING_CHANGE_INVALID`.
          type: string
          format: date-time
        checkout:
          $ref: ./billing-terms.yaml#/components/schemas/CheckoutOptions
      required:
      - bandwidth_mbps
      additionalProperties: false
    BindElasticIPRequestBody:
      type: object
      properties:
        network_interface_address_id:
          description: An assigned, unreleased IPv4 address on a network interface in this project and region. IPv6
            addresses are rejected.
          $ref: ./identifiers.yaml#/components/schemas/NetworkInterfaceAddressID
      required:
      - network_interface_address_id
      additionalProperties: false
    AttachElasticIPRequestBody:
      type: object
      properties:
        elastic_ip_id:
          $ref: ./identifiers.yaml#/components/schemas/ElasticIPID
      required:
      - elastic_ip_id
      additionalProperties: false
    CreateElasticIPResponseBody:
      description: |-
        The new elastic IP, `pending` until its order is accepted, and its Checkout Session. `address` is null until
        the address is allocated.
      type: object
      properties:
        elastic_ip:
          $ref: '#/components/schemas/ElasticIP'
        checkout_session_id:
          description: The Billing Checkout Session of this purchase. With deferred checkout, the customer completes it
            in Billing.
          type: string
          format: uuid
        order_id:
          description: The order created when checkout completes, at once for automatic checkout; null until then.
          type:
          - string
          - 'null'
          format: uuid
      required:
      - elastic_ip
      - checkout_session_id
      - order_id
      additionalProperties: false
    SetElasticIPBandwidthResponseBody:
      description: The elastic IP, still at its current bandwidth, and the Checkout Session for the change.
      type: object
      properties:
        elastic_ip:
          $ref: '#/components/schemas/ElasticIP'
        checkout_session_id:
          description: The Billing Checkout Session of this purchase. With deferred checkout, the customer completes it
            in Billing.
          type: string
          format: uuid
        order_id:
          description: The order created when checkout completes, at once for automatic checkout; null until then.
          type:
          - string
          - 'null'
          format: uuid
      required:
      - elastic_ip
      - checkout_session_id
      - order_id
      additionalProperties: false
    IPv4Binding:
      type: object
      properties:
        id:
          $ref: ./identifiers.yaml#/components/schemas/ElasticIPAssociationID
        elastic_ip_id:
          description: The commercial ElasticIP identity. This is not an internal holding ID.
          $ref: ./identifiers.yaml#/components/schemas/ElasticIPID
        network_interface_address_id:
          $ref: ./identifiers.yaml#/components/schemas/NetworkInterfaceAddressID
        address:
          $ref: '#/components/schemas/IPv4HostAddress'
        fixed_ip:
          $ref: '#/components/schemas/IPv4HostAddress'
        state:
          type: string
          enum:
          - bound
          - released
          - unknown
        bound_at:
          type:
          - string
          - 'null'
          format: date-time
        unbound_at:
          type:
          - string
          - 'null'
          format: date-time
        released_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - elastic_ip_id
      - network_interface_address_id
      - address
      - fixed_ip
      - state
      - bound_at
      - unbound_at
      - released_at
      additionalProperties: false
    ElasticIPOperation:
      description: An operation still running on this elastic IP. It is not a separate resource; once it finishes,
        the elastic IP's `operation` is null again and the elastic IP shows the result.
      type: object
      properties:
        type:
          type: string
          enum:
          - create
          - bind
          - unbind
          - set_bandwidth
          - suspend
          - resume
          - delete
        started_at:
          type: string
          format: date-time
      required:
      - type
      - started_at
      additionalProperties: false
