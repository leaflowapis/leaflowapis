openapi: 3.2.1
info:
  title: Leaflow Compute API
  version: 1.0.0
  description: |-
    Leaflow Compute user API for managing virtual machines, disks, snapshots, backups, images, virtual private clouds, subnets, routes, security groups, network interfaces and elastic IPs.

    ## Authentication

    Every request carries a scoped token; see the `scopedTokenAuth` security scheme.

    ## Conventions

    - **Create resources.** Requests that require an order record the typed resource configuration and return the pending resource with a PlacedOrder. Changes record the requested configuration and return the existing resource with the order, without applying it. Compute creates only deferred Billing orders and never quotes or performs checkout. Pending resources are readable, but nothing exists in the cloud, no inventory such as an address is held, and fields known only after allocation, such as addresses, are null. Provisioning or applying a change starts only after Compute receives an `orderAccepted` event and verifies the order with Billing. A new resource then becomes `provisioning` and reaches its usual status, such as `active` or `available`. When the order is declined, canceled or expires, or creation fails, the resource ends `failed` and `failure_reason` states why; the charge for a resource that failed after acceptance is refunded.
    - **Commercial terms.** Compute catalogs describe technical specifications, not prices or currency. Select commercial terms directly from Billing's catalog. To preview the returned order, use Billing's single `POST /api/v1/quotes` with `order_id`; Compute has no quote or price proxy endpoint.
    - **Checkout.** Preview and confirm checkout through Billing using the returned order reference; do not submit the Compute creation or change again after payment. Resources remain pending, and changes remain unapplied, until Billing acceptance is verified. Billing may confirm a zero-total order without payment, but Compute must still verify the accepted order before provisioning or applying a change.
    - **Projects.** Resource ownership and project identifiers refer to IAM platform projects, not OpenStack tenants. Virtual machines, images and networks share one infrastructure OpenStack project; the platform project remains the authorization and ownership boundary.
    - **Operations.** Requests such as starting, stopping, attaching or deleting return HTTP 202 with the resource as it is when the request is accepted. While an operation runs, the resource's `operation` field names it; the field is null once the operation has finished, and the resource then shows the result. A resource with an operation in progress refuses another operation with HTTP 409 `COMPUTE_RESOURCE_BUSY`; an operation involving two resources, such as attaching a disk, is refused when either has one. An ordered change, such as a resize, is an operation from the moment its order is placed until it is applied or its order is canceled, including while it awaits checkout. Renaming and replacing labels or notes are not operations and are accepted at any time.
    - **Billing relationships.** Commercial terms, orders and subscriptions are managed by Billing. Resource creation verifies accepted orders before allocating infrastructure.
    - **Availability zones.** A disk and a virtual machine must reside in the same availability zone to be attached. Virtual machine types and disk types are each bound to one availability zone, so choosing a type determines the zone.
    - **IPv6 is routed, not translated.** VPC IPv6 prefix delegation and security groups require no EIP or NAT gateway. EIP and NATGateway are IPv4 products; IPv6 EIP, NAT66 and IPv6 port forwarding are not supported.
    - **Elastic IP release.** A released address returns to available inventory as soon as its cleanup is confirmed, with no cooldown period. Unbinding or moving a binding keeps the address held by the project and does not release it.
    - **Passwords are returned once.** A password generated by the platform during creation or rebuild appears only in that response. Store it immediately.

    ## Resource identifiers

    Compute resource IDs use the fixed TypeID prefix declared in their schema. UUID text is not accepted for these resource IDs. Project, order, subscription and Billing Plan identifiers remain UUIDs. Historical operation-log subject IDs are audit facts and are not rewritten.

