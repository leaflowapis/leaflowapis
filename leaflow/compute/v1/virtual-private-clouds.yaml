paths:
  /api/v1/virtual-private-clouds:
    get:
      summary: List virtual private clouds
      operationId: list-virtual-private-clouds
      tags:
      - virtual-private-clouds
      parameters:
      - name: region_id
        in: query
        required: false
        description: Returns every region when omitted
        explode: false
        schema:
          $ref: ./identifiers.yaml#/components/schemas/RegionID
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualPrivateCloudListResponseBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    post:
      summary: Create a virtual private cloud
      description: Creates a virtual private cloud definition and its default security group. The default security
        group denies all inbound traffic and permits all outbound traffic.
      operationId: create-virtual-private-cloud
      tags:
      - virtual-private-clouds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVirtualPrivateCloudRequestBody'
      responses:
        '202':
          description: The virtual private cloud definition was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualPrivateCloud'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
  /api/v1/virtual-private-clouds/{virtualPrivateCloudId}:
    get:
      summary: Retrieve a virtual private cloud
      operationId: get-virtual-private-cloud
      tags:
      - virtual-private-clouds
      parameters:
      - name: virtualPrivateCloudId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/VirtualPrivateCloudID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualPrivateCloud'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    patch:
      summary: Rename a virtual private cloud
      description: Changes the display name only. The CIDR, the routes and the internet gateway are immutable.
      operationId: rename-virtual-private-cloud
      tags:
      - virtual-private-clouds
      parameters:
      - name: virtualPrivateCloudId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/VirtualPrivateCloudID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameVirtualPrivateCloudRequestBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualPrivateCloud'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    delete:
      summary: Release a virtual private cloud
      description: Deletion is rejected while virtual machines or network interfaces remain in the network. Its
        subnets, routes, security groups and IPv6 configuration are removed with it.
      operationId: delete-virtual-private-cloud
      tags:
      - virtual-private-clouds
      parameters:
      - name: virtualPrivateCloudId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/VirtualPrivateCloudID
      responses:
        '202':
          description: Deletion was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualPrivateCloud'
        '409':
          $ref: ./openapi.yaml#/components/responses/Conflict
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
  /api/v1/virtual-private-clouds/{virtualPrivateCloudId}/ipv6:
    get:
      summary: Retrieve the IPv6 prefix enabled on a virtual private cloud
      description: Returns the business prefix and enabled state, not backend provisioning or routing diagnostics.
      operationId: get-virtual-private-cloud-ipv6
      tags:
      - virtual-private-clouds
      parameters:
      - name: virtualPrivateCloudId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/VirtualPrivateCloudID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IPv6ResponseBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    post:
      summary: Enable IPv6 on a virtual private cloud
      description: |-
        Delegates and routes an IPv6 prefix to the virtual private cloud. It requires no elastic IP or NAT gateway. Addresses are assigned to virtual machines by the network and use its security groups; they cannot be requested or released individually.

        If the virtual private cloud is not yet connected to the internet, connectivity is established as part of this call.
      operationId: enable-virtual-private-cloud-ipv6
      tags:
      - virtual-private-clouds
      parameters:
      - name: virtualPrivateCloudId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/VirtualPrivateCloudID
      responses:
        '202':
          description: Enabling IPv6 was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IPv6ResponseBody'
        '409':
          $ref: ./openapi.yaml#/components/responses/Conflict
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    delete:
      summary: Disable IPv6 on a virtual private cloud
      description: A released prefix is not re-allocated immediately.
      operationId: disable-virtual-private-cloud-ipv6
      tags:
      - virtual-private-clouds
      parameters:
      - name: virtualPrivateCloudId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/VirtualPrivateCloudID
      responses:
        '202':
          description: Disabling IPv6 was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IPv6ResponseBody'
        '409':
          $ref: ./openapi.yaml#/components/responses/Conflict
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
components:
  schemas:
    VirtualPrivateCloud:
      type: object
      properties:
        cidr:
          type: string
        created_at:
          type: string
          format: date-time
        id:
          $ref: ./identifiers.yaml#/components/schemas/VirtualPrivateCloudID
        name:
          type: string
        region_id:
          $ref: ./identifiers.yaml#/components/schemas/RegionID
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - region_id
      - cidr
      - created_at
      - updated_at
      additionalProperties: false
    VirtualPrivateCloudListResponseBody:
      type: object
      properties:
        items:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/VirtualPrivateCloud'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
      additionalProperties: false
    CreateVirtualPrivateCloudRequestBody:
      type: object
      properties:
        cidr:
          description: Must be an RFC 1918 private CIDR with a prefix length between /8 and /24, for example `10.0.0.0/16`
          type: string
          minLength: 1
          maxLength: 32
        name:
          type: string
          minLength: 1
          maxLength: 128
        region_id:
          $ref: ./identifiers.yaml#/components/schemas/RegionID
      required:
      - name
      - region_id
      - cidr
      additionalProperties: false
    RenameVirtualPrivateCloudRequestBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - name
      additionalProperties: false
    IPv6ResponseBody:
      type: object
      properties:
        cidr:
          description: The allocated /64 prefix; empty while IPv6 is disabled
          type: string
        enabled:
          type: boolean
      required:
      - enabled
      - cidr
      additionalProperties: false
