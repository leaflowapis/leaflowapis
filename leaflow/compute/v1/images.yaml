paths:
  /api/v1/images:
    get:
      summary: List images
      description: |-
        Lists the public images on sale together with the private images of this project. `visibility` narrows the list to one of the two.

        A public image is offered to every project. Only public images currently on sale are listed: one the platform withdraws disappears from here and can no longer install new virtual machines, while the virtual machines already running it keep running and can still be rebuilt onto it.

        A private image belongs to this project, which captured it from one of its virtual machines, and is listed in every status, including while its capture is in progress and after the capture failed.

        An image can only be used in the region that holds it. An image whose `min_ram_mb` exceeds the memory of the selected machine type cannot boot; filter the options accordingly.
      operationId: list-images
      tags:
      - images
      parameters:
      - name: region_id
        in: query
        required: false
        description: Return only the images of this region
        explode: false
        schema:
          $ref: ./identifiers.yaml#/components/schemas/RegionID
      - name: visibility
        in: query
        description: Return only public or only private images. Both are returned when omitted
        explode: false
        schema:
          $ref: '#/components/schemas/ImageVisibility'
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageListResponseBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    post:
      summary: Capture a virtual machine as a private image
      description: "Creates a project image from the virtual machine system disk, excluding data disks. Stop the virtual
        machine first for file-system consistency. The virtual machine cannot be released while its source disk is being
        captured. Compute project quotas are enforced independently of billing.\n\nRecords the pending resource before
        creating its deferred postpaid Billing order. Source ownership and Compute project quotas are checked before
        placement. No storage is allocated until the order is read back, verified and accepted. Unknown placement leaves
        the resource pending for recovery rather than treating it as rejected."
      operationId: create-image
      tags:
      - images
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateImageRequestBody'
      responses:
        '202':
          description: "Pending resource and deferred Billing order."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateImageResponseBody'
        '409':
          $ref: ./openapi.yaml#/components/responses/Conflict
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
  /api/v1/images/{imageId}:
    get:
      summary: Retrieve an image
      description: Returns a public image, or a private image of this project; any other image is reported as not 
        found. Use this endpoint to poll capture progress. When `status` is `failed`, `failure` describes the 
        outcome.
      operationId: get-image
      tags:
      - images
      parameters:
      - name: imageId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/ImageID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResource'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    patch:
      summary: Rename a private image
      description: Only a private image of this project can be renamed; any other image is reported as not found.
      operationId: rename-image
      tags:
      - images
      parameters:
      - name: imageId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/ImageID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameImageRequestBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResource'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    delete:
      summary: Delete a private image
      description: "Only a private image of this project can be deleted; any other image is reported as not found.\n\n\
        Deletion is rejected while virtual machines created from the image still exist, as they need it in order to be
        rebuilt.\n\nAn image whose capture has not finished can be deleted; the capture is aborted. This is the one operation
        accepted while the `create` operation is in progress.\n\nQuota capacity and storage metering are released only
        after cleanup is confirmed. Billing determines whether its commercial subscription must be canceled first.\n\n\
        A resource with a pending order must have that order canceled through Billing first. A subscribed resource is
        released through its subscription cancellation. Cleanup must be confirmed before metering is stopped; unknown
        cleanup is not proof of release."
      operationId: delete-image
      tags:
      - images
      parameters:
      - name: imageId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/ImageID
      responses:
        '409':
          $ref: ./openapi.yaml#/components/responses/Conflict
        '202':
          description: Deletion was accepted. The image shows the `delete` operation until it is deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageResource'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
components:
  schemas:
    ImageVisibility:
      description: Who can see and use an image. `public` — offered to every project by the platform. `private` — 
        usable only by the project that owns it.
      type: string
      enum:
      - public
      - private
    ImageResource:
      description: "An image used to install a virtual machine. Platform and project images retain their respective visibility
        and ownership rules. Project image storage is billed only to its owner."
      type: object
      properties:
        id:
          $ref: ./identifiers.yaml#/components/schemas/ImageID
        region_id:
          $ref: ./identifiers.yaml#/components/schemas/RegionID
        visibility:
          $ref: '#/components/schemas/ImageVisibility'
        name:
          type: string
        os_family:
          type: string
        os_version:
          type: string
        architecture:
          type: string
        login_username:
          description: The account this image lets you log in as. The password set at creation belongs to this 
            account
          type: string
          maxLength: 32
        min_disk_gb:
          description: The system disk of a virtual machine created from this image cannot be smaller than this
          type: integer
          format: int64
        min_ram_mb:
          description: The machine type of a virtual machine created from this image must have at least this much 
            memory
          type: integer
          format: int64
        supports_password_reset:
          description: False means a new password can only be set by rebuilding a virtual machine created from this
            image
          type: boolean
        status:
          description: Only available images can install virtual machines. A public image is available; a private 
            capture starts pending, then provisioning and uploading before available. Failed means no usable image 
            was produced; failure describes the outcome. Missing means a private image is absent from the 
            infrastructure.
          type: string
          enum:
          - pending
          - provisioning
          - uploading
          - available
          - deleted
          - failed
          - error
          - missing
        failure:
          description: Details of why the capture failed; non-empty only when `status` is `failed`
          type:
          - string
          - 'null'
        size_bytes:
          description: "Storage occupied by the project image, in bytes. Zero until the capture reports its size."
          type: integer
          format: int64
        source_virtual_machine_id:
          description: The virtual machine a private image was captured from. The image remains usable after that 
            virtual machine is released. Null for public images
          anyOf:
          - $ref: ./identifiers.yaml#/components/schemas/VirtualMachineID
          - type: 'null'
        created_at:
          type: string
          format: date-time
        operation:
          description: The operation in progress on this image, or null when none is.
          anyOf:
          - $ref: '#/components/schemas/ImageOperation'
          - type: 'null'
          readOnly: true
        generation:
          type: integer
          format: int64
          minimum: 1
        observed_at:
          type:
          - string
          - 'null'
          format: date-time
        order_id:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
          description: The Billing order creating this resource.
        order_item_id:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
          description: The Billing order item for this resource.
        subscription_id:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
          description: The subscription for this resource; its presence alone does not imply delivery.
      required:
      - id
      - region_id
      - visibility
      - name
      - os_family
      - os_version
      - architecture
      - login_username
      - min_disk_gb
      - min_ram_mb
      - supports_password_reset
      - status
      - failure
      - size_bytes
      - source_virtual_machine_id
      - created_at
      - operation
      - generation
      - observed_at
      - order_id
      - order_item_id
      - subscription_id
      additionalProperties: false
    ImageListResponseBody:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImageResource'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
      additionalProperties: false
    CreateImageRequestBody:
      type: object
      properties:
        virtual_machine_id:
          $ref: ./identifiers.yaml#/components/schemas/VirtualMachineID
          description: Captured from the system disk of this virtual machine; data disks are not included
        name:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - virtual_machine_id
      - name
      additionalProperties: false
      description: "Creation configuration for this resource. Compute project quotas and Billing authorization are checked
        independently."
    RenameImageRequestBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - name
      additionalProperties: false
    CreateImageResponseBody:
      type: object
      description: The pending resource and its deferred Billing order. Confirm the order through Billing; 
        infrastructure is allocated only after verified acceptance.
      properties:
        image:
          $ref: '#/components/schemas/ImageResource'
        order:
          $ref: ./billing-terms.yaml#/components/schemas/PlacedOrder
      required:
      - image
      - order
      additionalProperties: false
    ImageOperation:
      description: An operation still running on this image. It is not a separate resource; once it finishes, the 
        image's `operation` is null again and the image shows the result.
      type: object
      properties:
        type:
          description: '`create` is the capture of a private image.'
          type: string
          enum:
          - create
          - suspend
          - resume
          - delete
        started_at:
          type: string
          format: date-time
      required:
      - type
      - started_at
      additionalProperties: false
