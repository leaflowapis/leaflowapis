paths:
  /api/v1/disks:
    get:
      summary: List disks
      description: When both `region_id` and `availability_zone_id` are supplied, only disks attachable to a virtual
        machine at that location are returned.
      operationId: list-disks
      tags:
      - disks
      parameters:
      - name: region_id
        in: query
        required: false
        explode: false
        schema:
          $ref: ./identifiers.yaml#/components/schemas/RegionID
      - name: availability_zone_id
        in: query
        description: Supplied together with `region_id` to filter attachable disks
        explode: false
        schema:
          $ref: ./identifiers.yaml#/components/schemas/AvailabilityZoneID
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskListResponseBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    post:
      summary: Create a disk
      description: |-
        The disk is created in the availability zone of the selected disk type, and a virtual machine must reside in the same zone to attach it. Choosing the disk type therefore determines the zone.

        The disk is empty, or is restored from exactly one source: `snapshot_id` or `disk_backup_id`. Giving both is refused with 422 `DISK_SOURCE_CONFLICT`. A restore is a purchase of a **new** disk; the source disk is unaffected and need not still exist.

        - **From a snapshot**, the disk type must be in the availability zone of the snapshot (`availability_zone_id` of the snapshot), because a snapshot lives in the same storage pool as its source and restores only into its own zone. `size_gb` is required and must be no smaller than the snapshot.
        - **From a disk backup**, the disk type may belong to another availability zone of the same region, because a backup is an independent copy in different storage. `size_gb` matches the size of the backup when omitted, and when given it must not be smaller than the backup. The disk cannot be attached until it is `available`.

        A disk type that is off sale is rejected with `DISK_TYPE_OFF_SALE`, even though its identifier still resolves. Types that are off sale do not appear in the disk type listing; disks already bought on one keep working and can still be resized.

        A disk bought on its own is licensed: `billing.usage_type` `metered` is refused with `DISK_USAGE_TYPE_UNAVAILABLE`. A disk created with a virtual machine follows the machine's terms instead and may be metered.

        The disk shows the `create` operation from the moment its Checkout Session is created until it is delivered or its checkout or order ends. Every other operation on it is refused with `COMPUTE_RESOURCE_BUSY` meanwhile, and its deletion with `COMPUTE_PURCHASE_PENDING` while its purchase awaits checkout or payment.
      operationId: create-disk
      tags:
      - disks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDiskRequestBody'
      responses:
        '202':
          description: The disk and its Checkout Session were created; the disk does not exist in the cloud yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDiskResponseBody'
        '409':
          $ref: ./openapi.yaml#/components/responses/Conflict
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
  /api/v1/disks/{diskId}:
    get:
      summary: Retrieve a disk
      description: Returns the stored state of the disk; it does not query the cloud.
      operationId: get-disk
      tags:
      - disks
      parameters:
      - name: diskId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/DiskID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskResource'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    patch:
      summary: Update a disk
      description: |-
        Changes the name, or the capacity. Type and availability zone are immutable.

        `size_gb` is an operational field: it starts a resize and cannot be combined with any other field in the same request. Such a request is refused with 422 `UPDATE_FIELDS_COMBINED`, because a rename that committed beside a change that was then refused would leave the request half applied. `checkout` and `proration_date` belong to the purchase of the `size_gb` change and are accepted only together with it.

        **Renaming** is not an operation and is accepted at any time. It returns 200 with `checkout_session_id` and `order_id` null.

        **Resizing** accepts only an increase; a smaller `size_gb` is refused with `DISK_CANNOT_SHRINK` (422), since a file system cannot be shrunk from outside the virtual machine. It returns 202 with the disk and the Checkout Session for the resize, which keeps the disk's usage type and period. The disk shows the `resize` operation until the resize is applied, its Checkout Session expires or its order is canceled, so other operations and a second resize are refused with `COMPUTE_RESOURCE_BUSY` meanwhile. The disk keeps its current size until the resize is applied; once `size_gb` shows the new size, extend the file system inside the virtual machine. If checkout is not completed, the order is not accepted or the resize fails, the disk keeps its size and Billing shows the outcome.

        An attached disk, including a system disk, can be resized. The capacity is usable at once, and the disk's `performance` shows what its type gives the new size. **That performance applies from the disk's next attachment, or the next start of its stopped virtual machine**: the storage reads a disk's limits only while connecting it. Until then the attachment's `performance` shows what is in effect.
      operationId: update-disk
      tags:
      - disks
      parameters:
      - name: diskId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/DiskID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDiskRequestBody'
      responses:
        '200':
          description: Only descriptive fields changed; no operation started. `checkout_session_id` and `order_id` are null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateDiskResponseBody'
        '202':
          description: The disk and the Checkout Session for the resize; the new size is not yet in effect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateDiskResponseBody'
        '409':
          $ref: ./openapi.yaml#/components/responses/Conflict
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    delete:
      summary: Delete a disk
      description: |-
        Deletion is rejected while the disk is attached, or while snapshots created from it still exist.

        Refused with `COMPUTE_RESOURCE_SUBSCRIBED` while a subscription pays for the disk, including a pay-as-you-go subscription. `meta.resource_id` names the disk. It is released by canceling the subscriptions listed in `meta.subscription_ids` through Billing, the same set as its `release_set`.

        Refused with `COMPUTE_PURCHASE_PENDING` while the purchase that created it still awaits checkout or payment; `meta.checkout_session_id` names its Checkout Session and `meta.order_id` its order once checkout created one. Expire the session or cancel the order in Billing instead.
      operationId: delete-disk
      tags:
      - disks
      parameters:
      - name: diskId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/DiskID
      responses:
        '409':
          $ref: ./openapi.yaml#/components/responses/Conflict
        '202':
          description: Deletion was accepted. The disk shows the `delete` operation until it is deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskResource'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
  /api/v1/disks/{diskId}/reverts:
    post:
      summary: Revert a disk to a snapshot
      description: |-
        Restores the contents of the disk to the moment the snapshot was taken. **All data written after that moment is lost and cannot be recovered.**

        Three restrictions apply: only the most recent snapshot of the disk can be reverted to; the disk must be detached from its virtual machine first; and a disk resized since the snapshot was taken cannot be reverted. To return to an earlier point in time, or to keep the existing disk, create a new disk from the snapshot instead.

        The revert is a request of its own rather than a state of the disk: the response is the disk, which shows the `revert` operation until the revert is complete.
      operationId: create-disk-revert
      tags:
      - disks
      parameters:
      - name: diskId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/DiskID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDiskRevertRequestBody'
      responses:
        '202':
          description: The revert was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskResource'
        '409':
          $ref: ./openapi.yaml#/components/responses/Conflict
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
components:
  schemas:
    DiskResource:
      type: object
      properties:
        availability_zone_id:
          description: Availability zone the disk actually resides in. A virtual machine must be in the same zone
            to attach it
          $ref: ./identifiers.yaml#/components/schemas/AvailabilityZoneID
        created_at:
          type: string
          format: date-time
        disk_type_id:
          $ref: ./identifiers.yaml#/components/schemas/DiskTypeID
        id:
          $ref: ./identifiers.yaml#/components/schemas/DiskID
        name:
          type: string
        region_id:
          $ref: ./identifiers.yaml#/components/schemas/RegionID
        size_gb:
          type: integer
          format: int64
        performance:
          $ref: '#/components/schemas/DiskPerformance'
        status:
          description: '`pending` until the disk is created, with no storage allocated before the order is accepted
            and the `create` operation shown while it is created; then `available`, or `in_use` once attached.
            `failed` means the disk was not created; `failure_reason` states why. `error` means the cloud reports the
            disk broken.'
          type: string
          enum:
          - pending
          - available
          - in_use
          - deleted
          - failed
          - error
        checkout_session_id:
          description: The Billing Checkout Session that bought this resource; `order_id` and `order_item_id` stay null
            until its checkout completes. Null when the resource was not bought through one.
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
        order_id:
          type:
          - string
          - 'null'
          format: uuid
        order_item_id:
          description: The Billing order item for this resource.
          type:
          - string
          - 'null'
          format: uuid
        subscription_id:
          description: |-
            The Billing subscription associated with this resource. It may still be pending; its
            presence does not imply delivery or metering. Null when no subscription is associated.
          type:
          - string
          - 'null'
          format: uuid
        release_set:
          description: 'The subscriptions a cancellation through Billing has to cover to release this disk: its
            own, each with the resource it pays for, so that each line of a cancellation can name what it releases.
            Snapshots have no individual subscriptions. A system disk is released only with its virtual machine,
            so for a system disk the set is that of the virtual machine. Subscriptions that have ended are not
            listed, and the set is empty when no subscription pays for any of them.'
          type: array
          items:
            $ref: ./release-sets.yaml#/components/schemas/ReleaseSetItem
        access_state:
          type:
          - string
          - 'null'
          enum:
          - pending
          - enabled
          - suspended
          - reclaimed
          - null
        failure_reason:
          description: Why creation failed; null unless `status` is `failed`. `checkout_expired` means checkout was
            not completed before its Checkout Session expired. `provisioning_failed` means creation failed after the
            order was accepted, and the charge for this disk is refunded.
          type:
          - string
          - 'null'
          enum:
          - order_declined
          - order_canceled
          - order_expired
          - checkout_expired
          - provisioning_failed
          - null
        operation:
          description: The operation in progress on this disk, or null when none is.
          anyOf:
          - $ref: '#/components/schemas/DiskOperation'
          - type: 'null'
          readOnly: true
        attachment:
          anyOf:
          - $ref: '#/components/schemas/DiskAttachment'
          - type: 'null'
      required:
      - id
      - name
      - region_id
      - availability_zone_id
      - disk_type_id
      - size_gb
      - performance
      - status
      - created_at
      - checkout_session_id
      - order_id
      - order_item_id
      - subscription_id
      - release_set
      - access_state
      - failure_reason
      - operation
      - attachment
      additionalProperties: false
    DiskListResponseBody:
      type: object
      properties:
        items:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DiskResource'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
      additionalProperties: false
    CreateDiskRequestBody:
      type: object
      properties:
        disk_type_id:
          description: A data disk type currently on sale, one whose `purpose` is `data`; a system disk type is rejected
            here too. A withdrawn one is rejected even though its identifier still resolves
          $ref: ./identifiers.yaml#/components/schemas/DiskTypeID
        name:
          type: string
          minLength: 1
          maxLength: 128
        size_gb:
          description: Required unless `disk_backup_id` is given. With `snapshot_id` it need only be no smaller than the
            snapshot; with `disk_backup_id` it defaults to the size of the backup and must not be smaller than it
          type: integer
          format: int64
          minimum: 1
        snapshot_id:
          description: Restore from this snapshot. The disk type must be in the snapshot's availability zone. Mutually
            exclusive with `disk_backup_id`, otherwise refused with 422 `DISK_SOURCE_CONFLICT`
          $ref: ./identifiers.yaml#/components/schemas/SnapshotID
        disk_backup_id:
          description: Restore from this disk backup, which need not still have its source disk. The disk type may be in
            another availability zone of the backup's region. Mutually exclusive with `snapshot_id`, otherwise refused
            with 422 `DISK_SOURCE_CONFLICT`
          $ref: ./identifiers.yaml#/components/schemas/DiskBackupID
        billing:
          $ref: ./billing-terms.yaml#/components/schemas/BillingChoice
        checkout:
          $ref: ./billing-terms.yaml#/components/schemas/CheckoutOptions
      required:
      - disk_type_id
      - name
      - billing
      additionalProperties: false
    UpdateDiskRequestBody:
      description: The mutable fields of a disk, all optional, at least one required. `size_gb` is an operational field
        and cannot be combined with `name`; such a request is refused with 422 `UPDATE_FIELDS_COMBINED`.
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        size_gb:
          description: The new capacity. Must be larger than the current capacity
          type: integer
          format: int64
          minimum: 1
        proration_date:
          description: The `proration_date` of the Billing quote for this change, so that the order is priced from
            the same instant. Only with `size_gb`, and only for automatic checkout; deferred checkout is priced when
            the customer completes it. Defaults to the time of the request; it must be a whole second, not in the
            future and at most 10 minutes old, otherwise the request is refused with `BILLING_CHANGE_INVALID`.
          type: string
          format: date-time
        checkout:
          description: How the purchase of the `size_gb` change is checked out. Only with `size_gb`.
          $ref: ./billing-terms.yaml#/components/schemas/CheckoutOptions
      minProperties: 1
      additionalProperties: false
    CreateDiskRevertRequestBody:
      type: object
      properties:
        snapshot_id:
          description: Must be the most recent snapshot of the disk
          $ref: ./identifiers.yaml#/components/schemas/SnapshotID
      required:
      - snapshot_id
      additionalProperties: false
    AttachDiskRequestBody:
      type: object
      properties:
        disk_id:
          $ref: ./identifiers.yaml#/components/schemas/DiskID
      required:
      - disk_id
      additionalProperties: false
    CreateDiskResponseBody:
      description: |-
        The new disk, `pending` until its order is accepted, and its Checkout Session. Also returned for a disk restored
        from a snapshot or a disk backup.
      type: object
      properties:
        disk:
          $ref: '#/components/schemas/DiskResource'
        checkout_session_id:
          description: The Billing Checkout Session of this purchase. With deferred checkout, the customer completes it
            in Billing.
          type: string
          format: uuid
        order_id:
          description: The order created when checkout completes, at once for automatic checkout; null until then.
          type:
          - string
          - 'null'
          format: uuid
      required:
      - disk
      - checkout_session_id
      - order_id
      additionalProperties: false
    UpdateDiskResponseBody:
      description: The disk and, when the update placed a Billing order, the Checkout Session for it. After a resize the
        disk is still at its current size until the change is applied. Returned with 200 when only descriptive fields
        changed and with 202 when an operation started.
      type: object
      properties:
        disk:
          $ref: '#/components/schemas/DiskResource'
        checkout_session_id:
          description: The Billing Checkout Session of the purchase; null when the update placed no order. With deferred
            checkout, the customer completes it in Billing.
          type:
          - string
          - 'null'
          format: uuid
        order_id:
          description: The order created when checkout completes, at once for automatic checkout; null until then and
            when the update placed no order.
          type:
          - string
          - 'null'
          format: uuid
      required:
      - disk
      - checkout_session_id
      - order_id
      additionalProperties: false
    DiskAttachment:
      type: object
      properties:
        id:
          $ref: ./identifiers.yaml#/components/schemas/VirtualMachineDiskID
        virtual_machine_id:
          $ref: ./identifiers.yaml#/components/schemas/VirtualMachineID
        disk_id:
          $ref: ./identifiers.yaml#/components/schemas/DiskID
        role:
          type: string
          enum:
          - boot
          - data
        delete_with_virtual_machine:
          type: boolean
        state:
          type: string
          enum:
          - reserved
          - attached
          - released
        attached_at:
          type:
          - string
          - 'null'
          format: date-time
        detached_at:
          type:
          - string
          - 'null'
          format: date-time
        released_at:
          type:
          - string
          - 'null'
          format: date-time
        device:
          type:
          - string
          - 'null'
        performance:
          description: The disk's performance in effect on this attachment, as it was when the attachment was made.
            Null until the attachment is made.
          anyOf:
          - $ref: '#/components/schemas/DiskPerformance'
          - type: 'null'
      required:
      - id
      - virtual_machine_id
      - disk_id
      - role
      - delete_with_virtual_machine
      - state
      - attached_at
      - detached_at
      - released_at
      - device
      - performance
      additionalProperties: false
    DiskPerformance:
      description: A disk's limits.
      type: object
      properties:
        iops:
          type: integer
          format: int64
        throughput_bytes_per_second:
          type: integer
          format: int64
      required:
      - iops
      - throughput_bytes_per_second
      additionalProperties: false
    DiskAttachmentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DiskAttachment'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
      additionalProperties: false
    DiskOperation:
      description: An operation still running on this disk. It is not a separate resource; once it finishes, the
        disk's `operation` is null again and the disk shows the result.
      type: object
      properties:
        type:
          description: '`attach` and `detach` accompany the virtual machine''s `attach_disk` and `detach_disk` operations.
            `delete` includes release through a Billing cancellation and deletion with a virtual machine.'
          type: string
          enum:
          - create
          - resize
          - revert
          - attach
          - detach
          - suspend
          - resume
          - delete
        started_at:
          type: string
          format: date-time
      required:
      - type
      - started_at
      additionalProperties: false
