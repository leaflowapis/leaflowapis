paths:
  /api/v1/disk-backups:
    get:
      summary: List disk backups
      operationId: list-disk-backups
      tags:
      - disk-backups
      parameters:
      - name: disk_id
        in: query
        description: Return only the backups of this disk
        explode: false
        schema:
          description: Return only the backups of this disk
          $ref: ./identifiers.yaml#/components/schemas/DiskID
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskBackupListResponseBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    post:
      summary: Create a disk backup
      description: "Creates a backup of the disk. It remains restorable after the source disk is deleted and may be restored
        to another availability zone in the same region, by creating a disk with `disk_backup_id` (`create-disk`). A running virtual machine may produce a file-system-inconsistent
        backup. Pending backups count toward Compute project quotas until cleanup is confirmed.\n\nIt is metered by the hour on a subscription of its own and takes no billing choice. It is bought through a
        Billing Checkout Session: automatic checkout completes at once for metered pricing and the backup is taken as soon
        as the order is accepted; with deferred checkout it stays `pending` until the customer completes checkout in
        Billing. The source and project quotas are checked before the Checkout Session is created, and a refused
        request creates nothing.\n\nThe backup shows the `create` operation from the moment its Checkout Session is created until it is delivered or its checkout or order ends. Every other operation on it is refused with `COMPUTE_RESOURCE_BUSY` meanwhile, and its deletion with `COMPUTE_PURCHASE_PENDING` while its purchase awaits checkout or payment."
      operationId: create-disk-backup
      tags:
      - disk-backups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDiskBackupRequestBody'
      responses:
        '202':
          description: The backup and its Checkout Session were created; the backup is not taken yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDiskBackupResponseBody'
        '409':
          $ref: ./openapi.yaml#/components/responses/Conflict
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
  /api/v1/disk-backups/{diskBackupId}:
    get:
      summary: Retrieve a disk backup
      description: Returns the stored state of the backup; it does not query the cloud. Use it to poll creation 
        progress.
      operationId: get-disk-backup
      tags:
      - disk-backups
      parameters:
      - name: diskBackupId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/DiskBackupID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskBackupResource'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    patch:
      summary: Update a disk backup
      description: Changes the name only. A backup's source disk and capacity cannot be changed.
      operationId: update-disk-backup
      tags:
      - disk-backups
      parameters:
      - name: diskBackupId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/DiskBackupID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDiskBackupRequestBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskBackupResource'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    delete:
      summary: Delete a disk backup
      description: "Independent of the source disk: deletion succeeds whether or not that disk still exists. Metering
        of the backup ends once it is deleted.\n\nQuota capacity and storage metering are released only after cleanup
        is confirmed. Billing determines whether its commercial subscription must be canceled first.\n\nA resource whose purchase still awaits checkout or payment is refused with `COMPUTE_PURCHASE_PENDING`; `meta.checkout_session_id` names its Checkout Session and `meta.order_id` its order once checkout created one. Expire the session or cancel the order in Billing instead. A subscribed resource is released through
        its subscription cancellation. Cleanup must be confirmed before metering is stopped; unknown cleanup is not proof
        of release."
      operationId: delete-disk-backup
      tags:
      - disk-backups
      parameters:
      - name: diskBackupId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/DiskBackupID
      responses:
        '409':
          $ref: ./openapi.yaml#/components/responses/Conflict
        '202':
          description: Deletion was accepted. The backup shows the `delete` operation until it is deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskBackupResource'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
components:
  schemas:
    DiskBackupResource:
      description: "A retained copy of a disk, restorable after its source disk is deleted. Compute project quotas constrain
        its count; retained storage is metered independently."
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        id:
          $ref: ./identifiers.yaml#/components/schemas/DiskBackupID
        name:
          type: string
        region_id:
          $ref: ./identifiers.yaml#/components/schemas/RegionID
        size_gb:
          description: Capacity of the source disk when the backup was created. A restored disk cannot be smaller 
            than this
          type: integer
          format: int64
        capacity_gib:
          description: 'The capacity metered for this backup, in GiB: the size of the source disk when the backup was
            taken. Usage is this capacity multiplied by the time the backup is retained.'
          type: integer
          format: int64
        source_disk_id:
          description: The disk this backup was taken from. The backup remains usable after that disk is deleted
          $ref: ./identifiers.yaml#/components/schemas/DiskID
        status:
          description: '`provisioning` while the backup is taken, then `available`. `failed` means the backup was not
            created. `missing` means the backup no longer exists in the cloud.'
          type: string
          enum:
          - pending
          - provisioning
          - available
          - deleted
          - failed
          - error
          - missing
        operation:
          description: The operation in progress on this backup, or null when none is.
          anyOf:
          - $ref: '#/components/schemas/DiskBackupOperation'
          - type: 'null'
          readOnly: true
        source_availability_zone_id:
          description: Availability zone of the source disk. A restore may target another zone in the same region
          $ref: ./identifiers.yaml#/components/schemas/AvailabilityZoneID
        failure_reason:
          description: Why creation failed; null unless `status` is `failed`. `checkout_expired` means checkout was
            not completed before its Checkout Session expired. `provisioning_failed` means creation failed after the
            order was accepted, and the charge for this backup is refunded.
          type:
          - string
          - 'null'
          enum:
          - order_declined
          - order_canceled
          - order_expired
          - checkout_expired
          - provisioning_failed
          - null
        checkout_session_id:
          description: The Billing Checkout Session that bought this resource; `order_id` and `order_item_id` stay null
            until its checkout completes. Null when the resource was not bought through one.
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
        order_id:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
          description: The Billing order that bought this resource; null until checkout completes.
        order_item_id:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
          description: The Billing order item for this resource.
        subscription_id:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
          description: The subscription for this resource; its presence alone does not imply delivery.
        release_set:
          description: The subscription that pays for this disk backup, with the resource it pays for, so that a
            cancellation through Billing can name what it releases. Empty when no subscription pays for it, and
            once it is released.
          type: array
          items:
            $ref: ./release-sets.yaml#/components/schemas/ReleaseSetItem
      required:
      - id
      - source_disk_id
      - name
      - size_gb
      - capacity_gib
      - status
      - region_id
      - source_availability_zone_id
      - created_at
      - operation
      - failure_reason
      - checkout_session_id
      - order_id
      - order_item_id
      - subscription_id
      - release_set
      additionalProperties: false
    DiskBackupListResponseBody:
      type: object
      properties:
        items:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DiskBackupResource'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
      additionalProperties: false
    CreateDiskBackupRequestBody:
      type: object
      properties:
        disk_id:
          $ref: ./identifiers.yaml#/components/schemas/DiskID
        name:
          type: string
          minLength: 1
          maxLength: 128
        checkout:
          $ref: ./billing-terms.yaml#/components/schemas/CheckoutOptions
      required:
      - disk_id
      - name
      additionalProperties: false
    UpdateDiskBackupRequestBody:
      description: The mutable fields of a disk backup. At least one must be given.
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
      minProperties: 1
      additionalProperties: false
    DiskBackupOperation:
      description: An operation still running on this backup. It is not a separate resource; once it finishes, the 
        backup's `operation` is null again and the backup shows the result.
      type: object
      properties:
        type:
          description: '`restore`: a disk is being created from this backup with `disk_backup_id` on `create-disk`.'
          type: string
          enum:
          - create
          - restore
          - delete
        started_at:
          type: string
          format: date-time
      required:
      - type
      - started_at
      additionalProperties: false
    CreateDiskBackupResponseBody:
      type: object
      description: The new backup, `pending` until its order is accepted, and its Checkout Session.
      properties:
        disk_backup:
          $ref: '#/components/schemas/DiskBackupResource'
        checkout_session_id:
          description: The Billing Checkout Session of this purchase. With deferred checkout, the customer completes it
            in Billing.
          type: string
          format: uuid
        order_id:
          description: The order created when checkout completes, at once for automatic checkout; null until then.
          type:
          - string
          - 'null'
          format: uuid
      required:
      - disk_backup
      - checkout_session_id
      - order_id
      additionalProperties: false
