components:
  schemas:
    BillingPeriod:
      type: object
      properties:
        unit:
          type: string
          enum:
          - month
          - year
        count:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
      required:
      - unit
      - count
      additionalProperties: false
    BillingChoice:
      description: The commercial terms for one newly created component. Prepaid requires period and termination_policy;
        postpaid refuses both. Components in one virtual machine order must use the same mode and period, while
        their termination policies may differ.
      type: object
      properties:
        mode:
          type: string
          enum:
          - prepaid
          - postpaid
        period:
          $ref: '#/components/schemas/BillingPeriod'
        termination_policy:
          $ref: '#/components/schemas/TerminationPolicy'
      required:
      - mode
      additionalProperties: false
    TerminationPolicy:
      description: Immediate ends service when cancellation takes effect, with refunds governed by the selected
        commercial terms. Period-end keeps service until the paid period ends.
      type: string
      enum:
      - immediate
      - period_end
    PlacedOrder:
      description: The Billing order created for this request. Continue checkout in Billing; payment and resource delivery are separate steps.
      type: object
      properties:
        order_id:
          type: string
          format: uuid
        invoice_id:
          description: Null until Billing creates an invoice for this order.
          type:
          - string
          - 'null'
          format: uuid
      required:
      - order_id
      - invoice_id
      additionalProperties: false
