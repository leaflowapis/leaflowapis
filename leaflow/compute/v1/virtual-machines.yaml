paths:
  /api/v1/virtual-machines:
    get:
      summary: List virtual machines
      description: Every virtual machine in the project, newest first, in their stored state.
      operationId: list-virtual-machines
      tags:
      - virtual-machines
      parameters:
      - name: label
        in: query
        description: Only virtual machines carrying this label, written as `key:value` — for example `env:prod`.
          Both halves are matched exactly
        explode: false
        schema:
          description: A label to filter by, written as `key:value`
          type: string
          maxLength: 128
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualMachineListResponseBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    post:
      summary: Create virtual machines
      description: |-
        Creates a Billing Checkout Session, including for metered terms, and returns one `pending` virtual machine per requested virtual machine with it. Each new component carries its own commercial terms; their usage type and period must match. A pending virtual machine has no server, system disk or address, and is not metered.

        Creation starts once Billing accepts the order: the virtual machine stays `pending` with the `create` operation while it is created, then becomes `active`. With automatic checkout, insufficient funds refuse the request and nothing is created. With deferred checkout, the virtual machines stay `pending` until the customer completes checkout in Billing and the order is paid; an expired Checkout Session, or a canceled or expired order, leaves them `failed` with `checkout_expired`, `order_canceled` or `order_expired`. Do not submit another creation request after paying. After an uncertain response, look the Checkout Session up in Billing before submitting again.

        The virtual machines are created in `availability_zone_id`, which the machine type has to be sold in (`availability_zones` of the machine type; otherwise 404 `MACHINE_TYPE_AVAILABILITY_ZONE_NOT_FOUND`), and so does the disk type of a new system disk (404 `DISK_TYPE_AVAILABILITY_ZONE_NOT_FOUND`). The zone has to have room for all of them, checked before anything is ordered: refused with 409 `MACHINE_TYPE_SOLD_OUT` or `DISK_TYPE_SOLD_OUT` when the type takes no new orders there for now, `MACHINE_TYPE_CAPACITY_REACHED` or `DISK_TYPE_CAPACITY_REACHED` when what is sold there is used up, `MACHINE_TYPE_NO_HOST_ROOM` when no host there can take the machine, and `DISK_TYPE_NO_POOL_ROOM` when the storage there cannot take the system disk. Two orders placed at the same moment can both pass; a virtual machine that finds the zone full when its order is accepted is not created and is refunded, ending `failed` with `provisioning_failed`.

        Choose an image or existing disk through boot_disk, and exactly one of network_interface_id or subnet_id. Existing network interfaces, boot disks or elastic IPs require count=1. They are not held while the virtual machine is pending; if one is no longer usable when the order is accepted, the virtual machine ends `failed` with `provisioning_failed`. Image boots require boot_disk; existing disks retain their own subscription. Virtual machines, disks and public IPs keep their own subscription items on the same order.

        Virtual machines of one request succeed or fail individually. Each virtual machine, with its system disk, network interface and elastic IP, is created or fails as a whole. Virtual machines that were created are kept; each failed virtual machine ends `failed` with `provisioning_failed`, its part of the order is refunded, and the order then ends `partially_completed`. A virtual machine is delivered whole or not at all: when the customer cancels any of its order items before the order is accepted, it is not created, its remaining items are canceled and refunded, and it ends `failed` with `order_canceled`. Each virtual machine is named after this request with a number appended.

        The network is checked before the Checkout Session is created, and a request it refuses orders and charges nothing. It is refused with `VIRTUAL_PRIVATE_CLOUD_UNAVAILABLE` when the virtual private cloud's `status` is not `available`, `SUBNET_UNAVAILABLE` or `SECURITY_GROUP_UNAVAILABLE` when the subnet or a security group is not ready, `SECURITY_GROUP_OTHER_VIRTUAL_PRIVATE_CLOUD` when a security group belongs to another virtual private cloud, and `NETWORK_INTERFACE_UNAVAILABLE` when the port's `status` is not `available`. `meta` names the resource.

        Each virtual machine shows the `create` operation from the moment the Checkout Session is created until it is delivered or the checkout or order ends. Every other operation on it is refused with `COMPUTE_RESOURCE_BUSY` meanwhile, and its release with `COMPUTE_PURCHASE_PENDING` while its purchase awaits checkout or payment.
      operationId: create-virtual-machine
      tags:
      - virtual-machines
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVirtualMachineRequestBody'
      responses:
        '202':
          description: The virtual machines and their order were created; no virtual machine exists in the cloud
            yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVirtualMachineResponseBody'
        '409':
          $ref: ./openapi.yaml#/components/responses/Conflict
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
  /api/v1/virtual-machines/{virtualMachineId}:
    get:
      summary: Retrieve a virtual machine
      description: Returns the stored state of the virtual machine; it does not query the cloud. Use it to poll
        creation progress.
      operationId: get-virtual-machine
      tags:
      - virtual-machines
      parameters:
      - name: virtualMachineId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/VirtualMachineID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualMachine'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    patch:
      summary: Update a virtual machine
      description: |-
        Changes the descriptive fields (`name`, `labels`, `notes`) or one operational field (`power_state` or `machine_type_id`). All fields are optional and at least one is required.

        `power_state` and `machine_type_id` are operational fields: each starts a workflow, and neither can be combined with any other field in the same request, including the other one. Such a request is refused with 422 `UPDATE_FIELDS_COMBINED`, because a rename that committed beside a change that was then refused would leave the request half applied. `checkout` and `proration_date` belong to the purchase of the `machine_type_id` change and are accepted only together with it.

        **Descriptive fields** are not operations and are accepted at any time, whatever the virtual machine is doing. The request returns 200 with `checkout_session_id` and `order_id` null.

        - `name` changes the display name only. The hostname inside the virtual machine is unchanged; it equals the virtual machine id.
        - `labels` records what this virtual machine is for, as key-value pairs. Nothing on the platform reads them. **The whole set is replaced**: whatever is absent from the request is removed, and an empty object clears them all. Do not put credentials here. Labels are visible to platform operators.
        - `notes` is a free-text note about this virtual machine: what it runs, and what to be careful about before touching it. **The whole note is replaced**; send an empty string to clear it. Do not put credentials here. The note is visible to platform operators.

        **`power_state`** is the state the virtual machine should be in, and the request returns 202 with the virtual machine as it is when the request is accepted.

        - `stopped` stops it and **releases its host**, as on AWS and Alibaba Cloud: a stopped virtual machine keeps its disks, network interfaces, addresses and quota, holds no vCPU or memory, and is not charged for compute. It shows the `stop` operation until it is stopped.
        - `running` starts it, placing it on a host of its availability zone again; outstanding restrictions can prevent starting. When no host of the zone has room for it now, the request is refused with 409 `VIRTUAL_MACHINE_START_NO_HOST_ROOM` and the virtual machine stays stopped; try again later. Another start can take the room after the request was accepted, and the start then ends with the virtual machine still stopped. It shows the `start` operation until it is running or the start has failed.
        - Starting connects its disks afresh, so a disk grown while attached runs at the performance of its new size from the next start after a stop. A virtual machine powered off from inside its operating system keeps its host and starts on it again; stop it with `power_state` first for its disks to be connected afresh.
        - A stopped virtual machine holds no host, so changing `machine_type_id`, rebuilding it, rescuing it and attaching or detaching a network interface are refused with 409 `VIRTUAL_MACHINE_NOT_RUNNING` until it is started. Disks can be attached and detached while it is stopped.

        **`machine_type_id`** resizes a running virtual machine, which restarts once during the resize, and returns 202 with the virtual machine and the Checkout Session for the change, including for metered terms. The virtual machine keeps its usage type and period, priced with the target type's matching option; a target type without that option is refused with 409 `BILLING_OPTION_UNAVAILABLE`. The resize starts once Billing accepts the order. Do not submit the change again after paying. After an uncertain response, look the Checkout Session up in Billing before submitting again.

        The virtual machine shows the `resize` operation until the resize is applied, its Checkout Session expires or its order is canceled, so other operations and a second resize are refused with `COMPUTE_RESOURCE_BUSY` meanwhile. It keeps its current type until the resize is applied; the new type takes effect, and is billed from then on, when `machine_type_id` shows it. If checkout is not completed, the order is not accepted or the resize fails, the virtual machine keeps its current type and Billing shows the outcome. A completed resize is final and cannot be reverted; to return to the previous type, submit another resize.
      operationId: update-virtual-machine
      tags:
      - virtual-machines
      parameters:
      - name: virtualMachineId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/VirtualMachineID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVirtualMachineRequestBody'
      responses:
        '200':
          description: Only descriptive fields changed; no operation started. `checkout_session_id` and `order_id` are null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateVirtualMachineResponseBody'
        '202':
          description: An operation started. For a start or stop the virtual machine as it is now; for a resize the virtual
            machine, still on its current type, and the Checkout Session for the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateVirtualMachineResponseBody'
        '409':
          $ref: ./openapi.yaml#/components/responses/Conflict
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    delete:
      summary: Release a virtual machine
      description: |-
        The system disk is deleted with the virtual machine, and **snapshots created from the system disk are deleted with it**. Data disks are detached and kept, and their snapshots and backups are unaffected. The primary network interface is released with the virtual machine.

        A virtual machine being captured as a private image cannot be released. Wait for the capture to finish, or delete that image first.

        Refused with `COMPUTE_RESOURCE_SUBSCRIBED` while a subscription pays for the virtual machine, or for a disk that is deleted with it, including a pay-as-you-go subscription. `meta.resource_id` names that resource. The virtual machine is released by canceling the subscriptions listed in `meta.subscription_ids` through Billing, the same set as its `release_set`.

        Refused with `COMPUTE_PURCHASE_PENDING` while the purchase that created it still awaits checkout or payment; `meta.checkout_session_id` names its Checkout Session and `meta.order_id` its order once checkout created one. Expire the session or cancel the order in Billing instead.
      operationId: delete-virtual-machine
      tags:
      - virtual-machines
      parameters:
      - name: virtualMachineId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/VirtualMachineID
      responses:
        '409':
          $ref: ./openapi.yaml#/components/responses/Conflict
        '202':
          description: Release was accepted. The virtual machine shows the `delete` operation until it is released.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualMachine'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
  /api/v1/virtual-machines/{virtualMachineId}/commands:
    post:
      summary: Run a command on a virtual machine
      description: |-
        Runs one command over SSH and returns what it wrote. **This is not a shell.** There is no terminal, no standard input and no way to answer a prompt: a command that waits for input produces nothing and is killed at the timeout. Chain steps with `&&`, or write a script and run that.

        **A command that fails is still a 200.** Its failure is its own result, not this endpoint's: read `exit_code` for what it exited with and `stderr` for what it said, and decide from those. A `grep` that matches nothing exits 1 and is a perfectly successful call.

        The status therefore answers a different question — did the command run at all. A non-2xx means it did not, and nothing about the virtual machine was changed by this request: it was suspended, not running or had no elastic IP associated; or it refused the platform key; or the connection could not be opened. Retrying is meaningful in those cases and is not for a non-zero `exit_code`.

        Three conditions must hold; the virtual machine is unreachable otherwise:

        - it is `active`
        - an elastic IP is associated with it, since this endpoint connects over the public internet
        - its security group permits inbound TCP 22

        Authentication uses the key the platform attaches to every virtual machine at creation, so nothing has to be set up first. The virtual machine must have applied that key at first boot, which images without a full cloud-init do not do.

        **Do not pass secrets in the command.** Read them from a file on the virtual machine instead: neither the command nor its output is a confidential channel.

        Each stream is capped at 1 MiB. Beyond that the rest is discarded and `truncated` is true.
      operationId: create-virtual-machine-command
      tags:
      - virtual-machines
      parameters:
      - name: virtualMachineId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/VirtualMachineID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVirtualMachineCommandRequestBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVirtualMachineCommandResponseBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
  /api/v1/virtual-machines/{virtualMachineId}/console:
    get:
      summary: Retrieve a remote console
      description: |-
        Operates the virtual machine directly from a browser and does not require the virtual machine to be reachable over the network, which makes it usable when a network misconfiguration prevents login.

        The returned address is single-use and expires within minutes. Every request issues a new address, so request one before each use and do not cache the response.
      operationId: get-virtual-machine-console
      tags:
      - virtual-machines
      parameters:
      - name: virtualMachineId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/VirtualMachineID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleResponseBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
  /api/v1/virtual-machines/{virtualMachineId}/password:
    put:
      summary: Reset the login password
      description: |-
        Sets the password of the login account (`login_username`) without a reboot; root is never given one. The virtual machine must be running.

        **Not every image supports this.** Images whose `supports_password_reset` is false cannot, and a new password can then only be set by rebuilding the virtual machine, which erases all data on the system disk.

        The request is also rejected when the image is marked as supported but the corresponding component has been removed or stopped inside the virtual machine.
      operationId: put-virtual-machine-password
      tags:
      - virtual-machines
      parameters:
      - name: virtualMachineId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/VirtualMachineID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChoice'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutVirtualMachinePasswordResponseBody'
        '409':
          $ref: ./openapi.yaml#/components/responses/Conflict
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
  /api/v1/virtual-machines/{virtualMachineId}/reboots:
    post:
      summary: Reboot a virtual machine
      description: |-
        A reboot defaults to soft, in which the operating system shuts down normally before starting again.

        A soft reboot has no effect once the system is unresponsive. Set `force` to reboot forcibly: a forced reboot does not wait for the operating system to shut down, so **unwritten data is lost**.

        A forced reboot is accepted while a soft reboot is in progress, which is the way out of a soft reboot the virtual machine never carried out. Any other request for an operation, including a second soft reboot, is refused with `COMPUTE_RESOURCE_BUSY` while the reboot is in progress.

        A virtual machine suspended by the platform must be unsuspended first.

        The virtual machine shows the `reboot` operation until the reboot has finished.
      operationId: create-virtual-machine-reboot
      tags:
      - virtual-machines
      parameters:
      - name: virtualMachineId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/VirtualMachineID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVirtualMachineRebootRequestBody'
      responses:
        '202':
          description: The reboot was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualMachine'
        '409':
          $ref: ./openapi.yaml#/components/responses/Conflict
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
  /api/v1/virtual-machines/{virtualMachineId}/rebuilds:
    post:
      summary: Rebuild a virtual machine
      description: |-
        **All data on the system disk is erased and cannot be recovered.** Attached data disks are unaffected.

        The virtual machine has to be running; a stopped one holds no host and is refused with 409 `VIRTUAL_MACHINE_NOT_RUNNING`. Start it first; a virtual machine whose operating system no longer boots still starts.

        The image this virtual machine already runs is accepted even after the platform has withdrawn it, since rebuilding is the only way back into a virtual machine broken from the inside. Any *other* withdrawn image is rejected with `IMAGE_RETIRED`, which is a change of image and therefore a new order.

        The virtual machine shows the `rebuild` operation until the rebuild has finished.
      operationId: create-virtual-machine-rebuild
      tags:
      - virtual-machines
      parameters:
      - name: virtualMachineId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/VirtualMachineID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVirtualMachineRebuildRequestBody'
      responses:
        '202':
          description: The rebuild was accepted. The virtual machine shows the `rebuild` operation until it has
            finished.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVirtualMachineRebuildResponseBody'
        '409':
          $ref: ./openapi.yaml#/components/responses/Conflict
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
  /api/v1/virtual-machines/{virtualMachineId}/disks:
    get:
      summary: List the disks attached to a virtual machine
      operationId: list-virtual-machine-disks
      tags:
      - virtual-machines
      parameters:
      - name: virtualMachineId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/VirtualMachineID
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./disks.yaml#/components/schemas/DiskAttachmentList
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    post:
      summary: Attach a disk
      description: The disk must be in the same region and availability zone as the virtual machine. Returns the
        disk; the virtual machine shows the `attach_disk` operation and the disk the `attach` operation until the
        attachment is confirmed. Partition the disk and mount the file system inside the virtual machine once it
        is attached.
      operationId: attach-virtual-machine-disk
      tags:
      - virtual-machines
      parameters:
      - name: virtualMachineId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/VirtualMachineID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./disks.yaml#/components/schemas/AttachDiskRequestBody
      responses:
        '202':
          description: The attachment was accepted.
          content:
            application/json:
              schema:
                $ref: ./disks.yaml#/components/schemas/DiskResource
        '409':
          $ref: ./openapi.yaml#/components/responses/Conflict
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
  /api/v1/virtual-machines/{virtualMachineId}/disks/{diskId}:
    delete:
      summary: Detach a disk
      description: |-
        Unmount the device inside the virtual machine before calling this endpoint. Forcibly detaching a file system that is being written to corrupts data.

        The disk the virtual machine boots from cannot be detached, whether it is the system disk bought with the virtual machine or a disk supplied as the existing boot_disk at launch. Such a request is refused with `VIRTUAL_MACHINE_BOOT_DISK_LOCKED` and changes nothing; releasing the virtual machine is what frees that disk.

        Returns the disk; the virtual machine shows the `detach_disk` operation and the disk the `detach` operation until the disk is detached.
      operationId: detach-virtual-machine-disk
      tags:
      - virtual-machines
      parameters:
      - name: virtualMachineId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/VirtualMachineID
      - name: diskId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/DiskID
      responses:
        '202':
          description: The detachment was accepted.
          content:
            application/json:
              schema:
                $ref: ./disks.yaml#/components/schemas/DiskResource
        '409':
          $ref: ./openapi.yaml#/components/responses/Conflict
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
  /api/v1/virtual-machines/{virtualMachineId}/network-interfaces:
    get:
      summary: List the network interfaces of a virtual machine
      operationId: list-virtual-machine-network-interfaces
      tags:
      - virtual-machines
      parameters:
      - name: virtualMachineId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/VirtualMachineID
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./network-interfaces.yaml#/components/schemas/NetworkInterfaceAttachmentList
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    post:
      summary: Attach a network interface
      description: Returns the network interface; the virtual machine shows the `attach_network_interface` operation
        and the interface the `attach` operation until the attachment is confirmed. The virtual machine has to be running;
        a stopped one holds no host and is refused with 409 `VIRTUAL_MACHINE_NOT_RUNNING`.
      operationId: attach-virtual-machine-network-interface
      tags:
      - virtual-machines
      parameters:
      - name: virtualMachineId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/VirtualMachineID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./network-interfaces.yaml#/components/schemas/AttachNetworkInterfaceRequestBody
      responses:
        '202':
          description: The attachment was accepted.
          content:
            application/json:
              schema:
                $ref: ./network-interfaces.yaml#/components/schemas/NetworkInterface
        '409':
          $ref: ./openapi.yaml#/components/responses/Conflict
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
  /api/v1/virtual-machines/{virtualMachineId}/network-interfaces/{networkInterfaceId}:
    delete:
      summary: Detach a network interface
      description: |-
        The primary network interface cannot be detached; the virtual machine would lose its network address. The virtual machine has to be running; a stopped one holds no host and is refused with 409 `VIRTUAL_MACHINE_NOT_RUNNING`.

        Returns the network interface; the virtual machine shows the `detach_network_interface` operation and the interface the `detach` operation until it is detached.
      operationId: detach-virtual-machine-network-interface
      tags:
      - virtual-machines
      parameters:
      - name: virtualMachineId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/VirtualMachineID
      - name: networkInterfaceId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/NetworkInterfaceID
      responses:
        '202':
          description: The detachment was accepted.
          content:
            application/json:
              schema:
                $ref: ./network-interfaces.yaml#/components/schemas/NetworkInterface
        '409':
          $ref: ./openapi.yaml#/components/responses/Conflict
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
  /api/v1/virtual-machines/{virtualMachineId}/rescue:
    put:
      summary: Put a virtual machine into rescue mode
      description: |-
        Boots a temporary rescue environment while retaining the original system disk. Changing `power_state` or `machine_type_id`, rebuilding and putting a password are unavailable in rescue mode. A stopped virtual machine holds no host and is refused with 409 `VIRTUAL_MACHINE_NOT_RUNNING`; start it first, which works even when its operating system no longer boots.

        The request does not name an image. The rescue image is the region's enabled rescue image for the architecture of the virtual machine's system disk. A region and architecture with no enabled rescue image is refused with `RESCUE_IMAGE_NOT_CONFIGURED` (409).
      operationId: put-virtual-machine-rescue
      tags:
      - virtual-machines
      parameters:
      - name: virtualMachineId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/VirtualMachineID
      responses:
        '202':
          description: Operation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutVirtualMachineRescueResponseBody'
        '409':
          $ref: ./openapi.yaml#/components/responses/Conflict
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutVirtualMachineRescueRequestBody'
    delete:
      summary: Take a virtual machine out of rescue mode
      description: Restores boot from the original system disk. Completion is shown by the virtual machine state, and
        the virtual machine shows the `unrescue` operation until then.
      operationId: delete-virtual-machine-rescue
      tags:
      - virtual-machines
      parameters:
      - name: virtualMachineId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/VirtualMachineID
      responses:
        '202':
          description: Operation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualMachine'
        '409':
          $ref: ./openapi.yaml#/components/responses/Conflict
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
  /api/v1/virtual-machines/{virtualMachineId}/console-output:
    get:
      summary: Retrieve the console output
      description: |-
        The raw text the virtual machine wrote to its serial console during boot and from the kernel. Consult it first when login fails or the remote console shows nothing: it shows where boot stopped, whether the system disk was mounted, and whether initialisation reported errors.

        A virtual machine in `error` and one suspended by the platform can be read as well. Refused with `VIRTUAL_MACHINE_CONSOLE_UNAVAILABLE` while the cloud has no server for it.
      operationId: get-virtual-machine-console-output
      tags:
      - virtual-machines
      parameters:
      - name: virtualMachineId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/VirtualMachineID
      - name: lines
        in: query
        description: How many trailing lines to return. Absent or 0 returns the whole output, which for a virtual machine that has run for weeks can be megabytes.
        schema:
          type: integer
          format: int64
          minimum: 0
          maximum: 100000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleOutputResponseBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
components:
  schemas:
    ConsoleOutputResponseBody:
      type: object
      properties:
        output:
          description: The console output as raw text, in the order the virtual machine wrote it.
          type: string
      required:
      - output
      additionalProperties: false
    VirtualMachine:
      type: object
      properties:
        availability_zone_id:
          $ref: ./identifiers.yaml#/components/schemas/AvailabilityZoneID
        created_at:
          type: string
          format: date-time
        hostname:
          description: Hostname inside the virtual machine; equals the virtual machine id
          type: string
        id:
          $ref: ./identifiers.yaml#/components/schemas/VirtualMachineID
        image_id:
          description: Non-empty when the virtual machine was created from an image, public or private. `image_type`
            says which collection holds it
          anyOf:
          - $ref: ./identifiers.yaml#/components/schemas/ImageID
          - type: 'null'
        image_type:
          description: Which collection `image_id` belongs to. `public` means `/public-images`, `private` means
            `/private-images`. Null when the virtual machine boots from a disk and therefore has no image
          type:
          - string
          - 'null'
          enum:
          - public
          - private
          - null
        machine_type_id:
          description: The machine type in effect, and the basis for billing
          $ref: ./identifiers.yaml#/components/schemas/MachineTypeID
        ipv6_address:
          description: IPv6 address of the primary network interface. Assigned automatically once IPv6 is enabled
            on the virtual private cloud
          type:
          - string
          - 'null'
        labels:
          description: Your own classification of this virtual machine, as key-value pairs. Empty when never set
          type: object
          maxProperties: 20
          additionalProperties:
            type: string
            maxLength: 63
        login_username:
          description: The account to log in as over SSH. The password set at creation belongs to this account
          type: string
          maxLength: 32
        name:
          type: string
        notes:
          description: A free-text note about this virtual machine. Empty when never set
          type: string
          maxLength: 4096
        private_ip:
          description: Private address of the virtual machine
          type:
          - string
          - 'null'
        virtual_private_cloud_id:
          anyOf:
          - $ref: ./identifiers.yaml#/components/schemas/VirtualPrivateCloudID
          - type: 'null'
        elastic_ip_addresses:
          description: Elastic IPv4 addresses associated with the primary network interface; an empty array when none
            are associated
          type:
          - array
          - 'null'
          items:
            type: string
        region_id:
          $ref: ./identifiers.yaml#/components/schemas/RegionID
        status:
          description: '`pending` until the virtual machine is created: before the order is accepted no virtual
            machine exists and addresses are null, and while it is created it shows the `create` operation. Then
            `active`. `failed` means the virtual machine was not created; `failure_reason` states why. The other
            values are the state of the virtual machine in the cloud; an operation in progress appears in
            `operation`, not here.'
          type: string
          enum:
          - pending
          - active
          - stopped
          - paused
          - suspended
          - rescued
          - deleted
          - failed
          - error
        subnet_id:
          anyOf:
          - $ref: ./identifiers.yaml#/components/schemas/SubnetID
          - type: 'null'
        updated_at:
          type: string
          format: date-time
        restrictions:
          type: array
          items:
            $ref: '#/components/schemas/VirtualMachineRestriction'
        failure_reason:
          description: Why creation failed; null unless `status` is `failed`. `checkout_expired` means checkout was
            not completed before its Checkout Session expired. `provisioning_failed` means creation failed after the
            order was accepted, and the charge for this virtual machine is refunded.
          type:
          - string
          - 'null'
          enum:
          - order_declined
          - order_canceled
          - order_expired
          - checkout_expired
          - provisioning_failed
          - null
        operation:
          description: The operation in progress on this virtual machine, or null when none is.
          anyOf:
          - $ref: '#/components/schemas/VirtualMachineOperation'
          - type: 'null'
          readOnly: true
        checkout_session_id:
          description: The Billing Checkout Session that bought this resource; `order_id` and `order_item_id` stay null
            until its checkout completes. Null when the resource was not bought through one.
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
        order_id:
          type:
          - string
          - 'null'
          format: uuid
        order_item_id:
          description: The Billing order item for this resource.
          type:
          - string
          - 'null'
          format: uuid
        subscription_id:
          description: |-
            The Billing subscription associated with this resource. It may still be pending; its
            presence does not imply delivery or metering. Null when no subscription is associated.
          type:
          - string
          - 'null'
          format: uuid
        release_set:
          description: Subscriptions required to release this virtual machine and disks deleted with it, each
            with the resource it pays for, so that each line of a cancellation can name what it releases. Billing
            determines cancellation terms. An empty set does not establish refund eligibility.
          type: array
          items:
            $ref: ./release-sets.yaml#/components/schemas/ReleaseSetItem
        access_state:
          type:
          - string
          - 'null'
          enum:
          - pending
          - enabled
          - suspended
          - reclaimed
          - null
        source_disk_id:
          description: Non-empty when the virtual machine was created from a disk you already had, instead of from
            an image
          anyOf:
          - $ref: ./identifiers.yaml#/components/schemas/DiskID
          - type: 'null'
      required:
      - id
      - name
      - hostname
      - login_username
      - labels
      - notes
      - region_id
      - availability_zone_id
      - virtual_private_cloud_id
      - subnet_id
      - private_ip
      - elastic_ip_addresses
      - ipv6_address
      - machine_type_id
      - image_id
      - image_type
      - source_disk_id
      - status
      - created_at
      - updated_at
      - checkout_session_id
      - order_id
      - restrictions
      - order_item_id
      - subscription_id
      - release_set
      - access_state
      - failure_reason
      - operation
      additionalProperties: false
    VirtualMachineListResponseBody:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VirtualMachine'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
      additionalProperties: false
    CreateVirtualMachineRequestBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        count:
          description: Number of virtual machines to create; 1 when omitted. Names are numbered automatically for
            several
          type: integer
          format: int64
          default: 1
          minimum: 1
          maximum: 20
        availability_zone_id:
          description: The availability zone of the machine type's region the virtual machines are created in. An existing
            boot disk has to be in it already
          $ref: ./identifiers.yaml#/components/schemas/AvailabilityZoneID
        compute:
          $ref: '#/components/schemas/NewCompute'
        boot_disk:
          $ref: '#/components/schemas/BootDisk'
        data_disks:
          description: Data disks created with each virtual machine in its order and attached to it at boot, after the
            boot disk in the order given. A virtual machine and its disks are delivered together or not at all.
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/NewDataDisk'
        network_interface:
          $ref: '#/components/schemas/PrimaryNetworkInterface'
        elastic_ip:
          description: |-
            An elastic IP associated with the primary network interface **inside the creation**: if association
            fails, no virtual machine is created. Associating afterwards is still possible
            (`put-elastic-ip-association`), but then it is two operations and a failure in between leaves a virtual
            machine you cannot reach. Omitted, the virtual machine has no public address.
          $ref: '#/components/schemas/VirtualMachineElasticIP'
        password:
          description: The login account's password. Omitted, only the SSH public keys of the project log in.
          $ref: '#/components/schemas/PasswordChoice'
        checkout:
          $ref: ./billing-terms.yaml#/components/schemas/CheckoutOptions
      required:
      - name
      - compute
      - availability_zone_id
      - boot_disk
      - network_interface
      additionalProperties: false
    UpdateVirtualMachineRequestBody:
      description: |-
        The mutable fields of a virtual machine, all optional, at least one required. `power_state` and `machine_type_id`
        are operational fields: each starts a workflow and cannot be combined with any other field, including the other;
        such a request is refused with 422 `UPDATE_FIELDS_COMBINED`.
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        labels:
          description: The complete set of labels. Whatever is absent here is removed; send an empty object to clear
            them all. A key may not contain a colon, whitespace or control characters
          type: object
          maxProperties: 20
          additionalProperties:
            type: string
            maxLength: 63
        notes:
          description: The complete note. Send an empty string to clear it
          type: string
          maxLength: 4096
        power_state:
          description: The state the virtual machine should be in. `running` starts it and `stopped` stops it. Operational
            field.
          type: string
          enum:
          - running
          - stopped
        machine_type_id:
          description: The machine type to resize to. It has to be on sale, in the virtual machine's region and sold in
            its availability zone (404 `MACHINE_TYPE_AVAILABILITY_ZONE_NOT_FOUND`), and the zone has to have room for one
            more machine of it (409 `MACHINE_TYPE_SOLD_OUT`, `MACHINE_TYPE_CAPACITY_REACHED` or `MACHINE_TYPE_NO_HOST_ROOM`).
            Operational field; the change is purchased through Billing.
          $ref: ./identifiers.yaml#/components/schemas/MachineTypeID
        proration_date:
          description: The `proration_date` of the Billing quote for this change, so that the order is priced from
            the same instant. Only with `machine_type_id`, and only for automatic checkout; deferred checkout is priced
            when the customer completes it. Defaults to the time of the request; it must be a whole second, not in the
            future and at most 10 minutes old, otherwise the request is refused with `BILLING_CHANGE_INVALID`.
          type: string
          format: date-time
        checkout:
          description: How the purchase of the `machine_type_id` change is checked out. Only with `machine_type_id`.
          $ref: ./billing-terms.yaml#/components/schemas/CheckoutOptions
      minProperties: 1
      additionalProperties: false
    CreateVirtualMachineRebootRequestBody:
      type: object
      properties:
        force:
          description: A forced reboot does not wait for the operating system to shut down and unwritten data is
            lost; use it when the system is unresponsive. False when omitted
          type: boolean
      required: []
      additionalProperties: false
    CreateVirtualMachineCommandRequestBody:
      type: object
      properties:
        command:
          description: Run by the login shell, so pipes, redirection and `&&` work. It cannot read standard input
          type: string
          minLength: 1
          maxLength: 65536
        timeout_seconds:
          description: Kill the command after this long. 60 when omitted
          type: integer
          format: int64
          minimum: 1
          maximum: 300
      required:
      - command
      additionalProperties: false
    CreateVirtualMachineCommandResponseBody:
      type: object
      properties:
        exit_code:
          description: What the command exited with, 0 being success. Any other value is the command's own verdict
            and still arrives as a 200. Null when it was killed rather than exiting on its own, which includes the
            timeout — null is the absence of a verdict, not a successful one
          type:
          - integer
          - 'null'
          format: int64
        stderr:
          type: string
        stdout:
          type: string
        timed_out:
          description: True when the command was still running at the timeout and was killed
          type: boolean
        truncated:
          description: True when either stream hit the 1 MiB cap and the rest was discarded
          type: boolean
      required:
      - exit_code
      - stdout
      - stderr
      - truncated
      - timed_out
      additionalProperties: false
    ConsoleResponseBody:
      type: object
      properties:
        console_url:
          description: Connection address of the remote console; single-use and expires within minutes
          type: string
      required:
      - console_url
      additionalProperties: false
    PutVirtualMachinePasswordResponseBody:
      type: object
      properties:
        password:
          description: The password the platform generated, returned only in this response; null when the password
            was supplied.
          type:
          - string
          - 'null'
      required:
      - password
      additionalProperties: false
    CreateVirtualMachineRebuildRequestBody:
      type: object
      properties:
        image_id:
          description: A public image (`/public-images`), which must be on sale unless it is the one this virtual machine
            already runs, or an available private image of this project (`/private-images`)
          $ref: ./identifiers.yaml#/components/schemas/ImageID
        password:
          description: The login account's password on the reinstalled system. Omitted, only the SSH public keys of
            the project log in.
          $ref: '#/components/schemas/PasswordChoice'
      required:
      - image_id
      additionalProperties: false
    CreateVirtualMachineRebuildResponseBody:
      type: object
      properties:
        virtual_machine:
          $ref: '#/components/schemas/VirtualMachine'
        password:
          description: The password the platform generated, returned only in this response; store it immediately.
            Null when the password was supplied or none was asked for.
          type:
          - string
          - 'null'
      required:
      - virtual_machine
      - password
      additionalProperties: false
    PasswordChoice:
      description: |-
        The password of the login account (`login_username`). `generated` has the platform generate a strong random
        password, returned once in the response and stored nowhere; `supplied` sets the one given. Password login
        over SSH is enabled with it, so it answers on port 22 once a security group admits it. Root never gets a
        password: where the login account is not root, root logs in by key only.
      oneOf:
      - $ref: '#/components/schemas/GeneratedPassword'
      - $ref: '#/components/schemas/SuppliedPassword'
      discriminator:
        propertyName: type
        mapping:
          generated: '#/components/schemas/GeneratedPassword'
          supplied: '#/components/schemas/SuppliedPassword'
    GeneratedPassword:
      type: object
      properties:
        type:
          type: string
          enum:
          - generated
      required:
      - type
      additionalProperties: false
    SuppliedPassword:
      type: object
      properties:
        type:
          type: string
          enum:
          - supplied
        value:
          description: 12 to 128 characters with at least three of lowercase letters, uppercase letters, digits and
            symbols, otherwise refused with `VIRTUAL_MACHINE_PASSWORD_TOO_WEAK`.
          type: string
          minLength: 12
          maxLength: 128
      required:
      - type
      - value
      additionalProperties: false
    NewCompute:
      description: The compute capacity requested for each virtual machine in this order.
      type: object
      properties:
        machine_type_id:
          description: A machine type currently on sale.
          $ref: ./identifiers.yaml#/components/schemas/MachineTypeID
        billing:
          $ref: ./billing-terms.yaml#/components/schemas/BillingChoice
      required:
      - machine_type_id
      - billing
      additionalProperties: false
    BootDisk:
      description: Create a boot disk from an image, or use a prepared disk already held by this project. Using
        an existing disk does not buy it again and always keeps it when the virtual machine is released.
      oneOf:
      - $ref: '#/components/schemas/NewBootDisk'
      - $ref: '#/components/schemas/ExistingBootDisk'
      discriminator:
        propertyName: type
        mapping:
          image: '#/components/schemas/NewBootDisk'
          disk: '#/components/schemas/ExistingBootDisk'
    ExistingBootDisk:
      type: object
      properties:
        type:
          type: string
          enum:
          - disk
        disk_id:
          description: A prepared boot disk owned by this project, available, unattached and in `availability_zone_id`.
            Only one virtual machine may be created when used.
          $ref: ./identifiers.yaml#/components/schemas/DiskID
        login_username:
          description: The existing account used to log in to this disk's operating system.
          type: string
          minLength: 1
          maxLength: 32
      required:
      - type
      - disk_id
      - login_username
      additionalProperties: false
    UpdateVirtualMachineResponseBody:
      description: |-
        The virtual machine and, when the update placed a Billing order, the Checkout Session for it. After a resize the
        virtual machine is still on its current type, keeps its ID, and its current subscription remains in force until
        the resize is applied. Returned with 200 when only descriptive fields changed and with 202 when an operation started.
      type: object
      properties:
        virtual_machine:
          $ref: '#/components/schemas/VirtualMachine'
        checkout_session_id:
          description: The Billing Checkout Session of the purchase; null when the update placed no order. With deferred
            checkout, the customer completes it in Billing.
          type:
          - string
          - 'null'
          format: uuid
        order_id:
          description: The order created when checkout completes, at once for automatic checkout; null until then and
            when the update placed no order.
          type:
          - string
          - 'null'
          format: uuid
      required:
      - virtual_machine
      - checkout_session_id
      - order_id
      additionalProperties: false
    NewBootDisk:
      description: A system disk created from an image and recorded in the virtual machine order. Its commercial
        terms are explicit and its release policy does not override them.
      type: object
      properties:
        type:
          type: string
          enum:
          - image
        image_id:
          description: A public image on sale (`/public-images`), or an available private image of this project (`/private-images`).
          $ref: ./identifiers.yaml#/components/schemas/ImageID
        disk_type_id:
          description: A disk type on sale and sold in the virtual machine's availability zone; any disk type boots a
            virtual machine
          $ref: ./identifiers.yaml#/components/schemas/DiskTypeID
        size_gb:
          type: integer
          format: int64
          minimum: 1
        on_virtual_machine_release:
          description: What releasing the virtual machine does to this disk. `delete` deletes it with the virtual
            machine; `detach` keeps it, still billed on its own terms, for you to attach elsewhere or delete.
          type: string
          enum:
          - delete
          - detach
          default: delete
        billing:
          $ref: ./billing-terms.yaml#/components/schemas/BillingChoice
      required:
      - type
      - image_id
      - billing
      - disk_type_id
      - size_gb
      additionalProperties: false
    NewDataDisk:
      description: An empty data disk created in the virtual machine's availability zone. Its terms follow the rule
        shared by every component of the purchase, so a pay-as-you-go virtual machine gets pay-as-you-go data disks,
        which stay pay-as-you-go once detached.
      type: object
      properties:
        disk_type_id:
          description: A disk type on sale and sold in the virtual machine's availability zone.
          $ref: ./identifiers.yaml#/components/schemas/DiskTypeID
        size_gb:
          description: Within the disk type's `min_size_gb` and `max_size_gb` and a multiple of its `step_gb`.
          type: integer
          format: int64
          minimum: 1
        on_virtual_machine_release:
          description: What releasing the virtual machine does to this disk. `delete` deletes it with the virtual
            machine; `detach` keeps it, still billed on its own terms, for you to attach elsewhere or delete.
          type: string
          enum:
          - delete
          - detach
          default: delete
        billing:
          $ref: ./billing-terms.yaml#/components/schemas/BillingChoice
      required:
      - disk_type_id
      - size_gb
      - billing
      additionalProperties: false
    PrimaryNetworkInterface:
      description: The virtual machine's primary network interface, its network location. `new` creates one in a
        subnet, deleted with the virtual machine; `existing` uses one you already hold, detached and kept when the
        virtual machine is released.
      oneOf:
      - $ref: '#/components/schemas/NewPrimaryNetworkInterface'
      - $ref: '#/components/schemas/ExistingPrimaryNetworkInterface'
      discriminator:
        propertyName: type
        mapping:
          new: '#/components/schemas/NewPrimaryNetworkInterface'
          existing: '#/components/schemas/ExistingPrimaryNetworkInterface'
    NewPrimaryNetworkInterface:
      type: object
      properties:
        type:
          type: string
          enum:
          - new
        subnet_id:
          description: The subnet the interface is created in, in the machine type's region.
          $ref: ./identifiers.yaml#/components/schemas/SubnetID
        security_group_ids:
          description: The security groups of the interface, of the subnet's virtual private cloud. The default
            security group is not applied automatically.
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: ./identifiers.yaml#/components/schemas/SecurityGroupID
      required:
      - type
      - subnet_id
      - security_group_ids
      additionalProperties: false
    ExistingPrimaryNetworkInterface:
      type: object
      properties:
        type:
          type: string
          enum:
          - existing
        network_interface_id:
          description: An unattached network interface of this project in the machine type's region. It keeps its
            security groups and any elastic IP associated with it. Only one virtual machine may be created when used.
          $ref: ./identifiers.yaml#/components/schemas/NetworkInterfaceID
      required:
      - type
      - network_interface_id
      additionalProperties: false
    VirtualMachineElasticIP:
      description: '`new` buys an elastic IP in the virtual machine''s order; `existing` associates one you already
        hold. One address is associated with one interface, so either creates only one virtual machine.'
      oneOf:
      - $ref: '#/components/schemas/NewElasticIP'
      - $ref: '#/components/schemas/ExistingElasticIP'
      discriminator:
        propertyName: type
        mapping:
          new: '#/components/schemas/NewElasticIP'
          existing: '#/components/schemas/ExistingElasticIP'
    NewElasticIP:
      description: One IPv4 elastic IP created with this bandwidth configuration in the virtual machine's order.
      type: object
      properties:
        type:
          type: string
          enum:
          - new
        line_id:
          $ref: ./identifiers.yaml#/components/schemas/ElasticIPLineID
        bandwidth_mbps:
          description: Within the line's `min_bandwidth_mbps` and `max_bandwidth_mbps` and a multiple of its
            `bandwidth_step_mbps`, otherwise refused with `ELASTIC_IP_BANDWIDTH_RANGE`.
          type: integer
          format: int64
          minimum: 1
          maximum: 1000
        internet_charge_type:
          $ref: ./elastic-ips.yaml#/components/schemas/InternetChargeType
          default: bandwidth
        billing:
          description: The terms of the elastic IP's network subscription, which follow the rule shared by every
            component of the purchase. Its address subscription is always pay-as-you-go and is exempt from that rule.
          $ref: ./billing-terms.yaml#/components/schemas/BillingChoice
      required:
      - type
      - line_id
      - bandwidth_mbps
      - billing
      additionalProperties: false
    ExistingElasticIP:
      type: object
      properties:
        type:
          type: string
          enum:
          - existing
        elastic_ip_id:
          description: An idle elastic IP of this project in the same region. It keeps its own bandwidth and
            subscriptions; changing its bandwidth is a separate operation.
          $ref: ./identifiers.yaml#/components/schemas/ElasticIPID
      required:
      - type
      - elastic_ip_id
      additionalProperties: false
    VirtualMachineRestriction:
      description: |-
        One hold on the virtual machine. While any holds it, the virtual machine is stopped and refuses being started,
        rebooted, rebuilt, resized, rescued, having its password reset and running commands, with 409
        `VIRTUAL_MACHINE_SUSPENDED`. Holds are independent: lifting one never lifts another, and once none remains
        the virtual machine is started again only if a hold stopped it, never one its user stopped.
      type: object
      properties:
        reason:
          description: |-
            Why it is held. `operator_suspended` is a suspension by the platform. `billing_suspended` is the virtual
            machine's own subscription suspended for non-payment, and `billing_reclaimed` that subscription ending,
            after which the virtual machine is released. `boot_disk_suspended` and `boot_disk_reclaimed` are the same
            for the subscription of the disk the virtual machine boots from: that disk is billed apart, and the
            virtual machine cannot run without it, so renewing the disk's subscription lifts the hold, and a reclaimed
            boot disk is released together with its virtual machine.
          type: string
          enum:
          - operator_suspended
          - billing_suspended
          - billing_reclaimed
          - boot_disk_suspended
          - boot_disk_reclaimed
        subscription_id:
          description: The Billing subscription whose state holds the virtual machine; null for `operator_suspended`.
          type:
          - string
          - 'null'
          format: uuid
        disk_id:
          description: The disk the virtual machine boots from, for `boot_disk_suspended` and `boot_disk_reclaimed`;
            null otherwise.
          anyOf:
          - $ref: ./identifiers.yaml#/components/schemas/DiskID
          - type: 'null'
        started_at:
          description: When the hold began; null when that instant was not recorded.
          type:
          - string
          - 'null'
          format: date-time
      required:
      - reason
      - subscription_id
      - disk_id
      - started_at
      additionalProperties: false
    CreateVirtualMachineResponseBody:
      description: The new virtual machines, `pending` until their order is accepted, and the Checkout Session they share.
      type: object
      properties:
        virtual_machines:
          description: |-
            One virtual machine per requested virtual machine, in request order. Their IDs stay the same through checkout and
            creation.
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/VirtualMachine'
        checkout_session_id:
          description: The Billing Checkout Session of this purchase. With deferred checkout, the customer completes it
            in Billing.
          type: string
          format: uuid
        order_id:
          description: The order created when checkout completes, at once for automatic checkout; null until then.
          type:
          - string
          - 'null'
          format: uuid
        password:
          description: Generated login password, returned only by this response. Null when no password was generated.
          type:
          - string
          - 'null'
      required:
      - checkout_session_id
      - order_id
      - virtual_machines
      - password
      additionalProperties: false
    VirtualMachineOperation:
      description: An operation still running on this virtual machine. It is not a separate resource; once it finishes,
        the virtual machine's `operation` is null again and the virtual machine shows the result.
      type: object
      properties:
        type:
          description: '`create` runs from acceptance of the order until the virtual machine is `active` or `failed`.
            `suspend` and `resume` impose and lift a suspension by the platform or for non-payment. `capture_image` holds the machine while a private image is captured from the disk it boots from; the machine cannot be resized, rebuilt or released meanwhile. `delete` includes
            release through a Billing cancellation.'
          type: string
          enum:
          - create
          - start
          - stop
          - reboot
          - rebuild
          - rescue
          - unrescue
          - resize
          - reset_password
          - attach_disk
          - detach_disk
          - attach_network_interface
          - detach_network_interface
          - associate_elastic_ip
          - disassociate_elastic_ip
          - capture_image
          - suspend
          - resume
          - delete
        started_at:
          type: string
          format: date-time
      required:
      - type
      - started_at
      additionalProperties: false
    PutVirtualMachineRescueRequestBody:
      type: object
      properties:
        password:
          description: Password for the rescue environment. Generate and retain a strong
            password before calling.
          type: string
          minLength: 12
          maxLength: 128
      required:
      - password
      additionalProperties: false
    PutVirtualMachineRescueResponseBody:
      type: object
      properties:
        login_username:
          description: Login account in the temporary rescue environment.
          type: string
        virtual_machine:
          $ref: '#/components/schemas/VirtualMachine'
      required:
      - login_username
      - virtual_machine
      additionalProperties: false
