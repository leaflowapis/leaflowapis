  description: Public network products; prices and checkout belong to Billing.
- name: elastic-ips
  description: Elastic IP resources, bandwidth and associations.
- name: launch-templates
  description: Launch templates, reusable descriptions of how to create virtual machines.
- name: machine-types
  description: Virtual machine specifications and their Billing Plan references.
- name: network-interfaces
  description: Network interfaces, addresses and attachments.
- name: operation-logs
  description: Historical records of Compute operations.
- name: peerings
  description: Peerings resources and operations.
- name: private-images
  description: Images this project captured from its own virtual machines, and their billed storage.
- name: public-images
  description: Platform images offered to every project.
- name: quotas
  description: Effective per-project resource and capacity limits.
- name: regions
  description: Compute regions.
- name: routes
  description: Routes resources and operations.
- name: security-group-rules
  description: Security group rules.
- name: security-groups
  description: Security groups resources and operations.
- name: snapshots
  description: Snapshots resources and operations.
- name: subnets
  description: Subnets resources and operations.
- name: virtual-machines
  description: Virtual machines, their power state, size and attachments.
- name: virtual-private-clouds
  description: Virtual private clouds and regional connectivity.
