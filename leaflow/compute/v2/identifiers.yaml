components:
  schemas:
    VirtualMachineID:
      description: The public vm resource identifier. Only this fixed TypeID prefix is accepted; UUID text is not
        an alternative representation.
      type: string
      minLength: 29
      maxLength: 29
      pattern: ^vm_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
    NetworkInterfaceID:
      description: The public eni resource identifier. Only this fixed TypeID prefix is accepted; UUID text is not
        an alternative representation.
      type: string
      minLength: 30
      maxLength: 30
      pattern: ^eni_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
    LaunchTemplateID:
      description: The public lt resource identifier. Only this fixed TypeID prefix is accepted; UUID text is not an
        alternative representation.
      type: string
      minLength: 29
      maxLength: 29
      pattern: ^lt_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
    VirtualPrivateCloudID:
      description: The public vpc resource identifier. Only this fixed TypeID prefix is accepted; UUID text is not
        an alternative representation.
      type: string
      minLength: 30
      maxLength: 30
      pattern: ^vpc_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
    VirtualPrivateCloudIDOrWildcard:
      description: A virtual private cloud identifier, or `-` to read across every virtual private cloud of the
        project (AIP-159).
      type: string
      pattern: ^(?:-|vpc_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25})$
      example: '-'
    ElasticIPID:
      description: The public eip resource identifier. Only this fixed TypeID prefix is accepted; UUID text is not
        an alternative representation.
      type: string
      minLength: 30
      maxLength: 30
      pattern: ^eip_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
    ElasticIPLineID:
      type: string
      minLength: 34
      maxLength: 34
      pattern: ^eipline_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
      description: Compute ElasticIPLine TypeID. UUID text is not accepted.
    RegionID:
      type: string
      minLength: 33
      maxLength: 33
      pattern: ^region_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
      description: Compute Region TypeID. UUID text is not accepted.
    MachineTypeID:
      type: string
      minLength: 32
      maxLength: 32
      pattern: ^mtype_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
      description: Compute MachineType TypeID. UUID text is not accepted.
    AvailabilityZoneID:
      type: string
      minLength: 31
      maxLength: 31
      pattern: ^zone_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
      description: Compute AvailabilityZone TypeID. UUID text is not accepted.
    DiskID:
      type: string
      minLength: 31
      maxLength: 31
      pattern: ^disk_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
      description: Compute Disk TypeID. UUID text is not accepted.
    DiskBackupID:
      type: string
      minLength: 33
      maxLength: 33
      pattern: ^backup_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
      description: Compute DiskBackup TypeID. UUID text is not accepted.
    DiskTypeID:
      type: string
      minLength: 35
      maxLength: 35
      pattern: ^disktype_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
      description: Compute DiskType TypeID. UUID text is not accepted.
    DiskSnapshotID:
      type: string
      minLength: 35
      maxLength: 35
      pattern: ^disksnapshot_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
      description: Compute Snapshot TypeID. UUID text is not accepted.
    VirtualMachineDiskID:
      type: string
      minLength: 33
      maxLength: 33
      pattern: ^vmdisk_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
      description: Compute VirtualMachineDisk TypeID. UUID text is not accepted.
    NetworkInterfaceAddressID:
      type: string
      minLength: 34
      maxLength: 34
      pattern: ^eniaddr_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
      description: Compute NetworkInterfaceAddress TypeID. UUID text is not accepted.
    ElasticIPAssociationID:
      type: string
      minLength: 35
      maxLength: 35
      pattern: ^eipassoc_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
      description: Compute ElasticIPAssociation TypeID. UUID text is not accepted.
    ImageID:
      type: string
      minLength: 32
      maxLength: 32
      pattern: ^image_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
      description: Compute Image TypeID. UUID text is not accepted.
    SecurityGroupID:
      type: string
