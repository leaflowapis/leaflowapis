paths:
  /api/v2/snapshots:
    get:
      summary: List snapshots
      operationId: list-snapshots
      tags:
      - snapshots
      parameters:
      - name: disk_id
        in: query
        description: Return only the snapshots of this disk
        explode: false
        schema:
          description: Return only the snapshots of this disk
          $ref: ./identifiers.yaml#/components/schemas/DiskID
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotListResponseBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    post:
      summary: Create a snapshot
      description: "Creates a snapshot of the disk. A running virtual machine may produce a file-system-inconsistent
        snapshot; flush pending writes first. A system disk cannot be reverted while attached. Pending snapshots count
        toward Compute project quotas until creation fails and cleanup is confirmed.\n\nIt is metered by the hour on a subscription of its own and takes no billing choice. It is bought through a
        Billing Checkout Session: automatic checkout completes at once for metered pricing and the snapshot is taken as soon
        as the order is accepted; with deferred checkout it stays `pending` until the customer completes checkout in
        Billing. The source and project quotas are checked before the Checkout Session is created, and a refused
        request creates nothing.\n\nThe snapshot shows the `create` operation from the moment its Checkout Session is created until it is delivered or its checkout or order ends. Every other operation on it is refused with `COMPUTE_RESOURCE_BUSY` meanwhile, and its deletion with `COMPUTE_PURCHASE_PENDING` while its purchase awaits checkout or payment."
      operationId: create-snapshot
      tags:
      - snapshots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSnapshotRequestBody'
      responses:
        '202':
          description: The snapshot and its Checkout Session were created; the snapshot is not taken yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSnapshotResponseBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
        '409':
          $ref: ./openapi.yaml#/components/responses/Conflict
  /api/v2/snapshots/{snapshotId}:
    get:
      summary: Retrieve a snapshot
      operationId: get-snapshot
      tags:
      - snapshots
      parameters:
      - name: snapshotId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/SnapshotID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResource'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    patch:
      summary: Update a snapshot
      description: Changes the name only. A snapshot's source disk and capacity cannot be changed.
      operationId: update-snapshot
      tags:
      - snapshots
      parameters:
      - name: snapshotId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/SnapshotID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSnapshotRequestBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResource'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    delete:
      summary: Delete a snapshot
      description: "Deletes this resource. Quota capacity and storage metering are released only after cleanup is confirmed.\n\
        \nA resource whose purchase still awaits checkout or payment is refused with `COMPUTE_PURCHASE_PENDING`; `meta.checkout_session_id` names its Checkout Session and `meta.order_id` its order once checkout created one. Expire the session or cancel the order in Billing instead. A subscribed resource
        is released through its subscription cancellation. Cleanup must be confirmed before metering is stopped; unknown
        cleanup is not proof of release.\n\nWhile subscriptions pay for the snapshot (those in its `release_set`), deleting it cancels them rather than being refused: Compute creates one Billing cancellation for the whole set and answers with it in `cancellation`. The cancellation is `immediate` when every subscription in the set allows that, a licensed one being refunded under its terms, and `period_end` when any of them ends only with its paid period; the snapshot then keeps working until `scheduled_at` and is released then. Asking again while that cancellation is pending answers with it again."
      operationId: delete-snapshot
      tags:
      - snapshots
      parameters:
      - name: snapshotId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/SnapshotID
      responses:
        '409':
          $ref: ./openapi.yaml#/components/responses/Conflict
        '202':
          description: Deletion was accepted. Without a subscription the snapshot shows the `delete` operation until it is deleted, and `cancellation` is null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSnapshotResponseBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
components:
  schemas:
    DeleteSnapshotResponseBody:
      description: The snapshot as it is when the deletion is accepted, and the Billing cancellation that releases it when
        subscriptions pay for it.
      type: object
      properties:
        snapshot:
          $ref: '#/components/schemas/SnapshotResource'
        cancellation:
          description: The cancellation Compute created for the snapshot's subscriptions; null when none pays for it.
          oneOf:
          - type: 'null'
          - $ref: ./billing-terms.yaml#/components/schemas/BillingCancellation
      required:
      - snapshot
      - cancellation
      additionalProperties: false
    SnapshotResource:
      description: "A snapshot of a disk. Compute project quotas constrain its count; retained storage is metered independently
        of that quota."
      type: object
      properties:
        availability_zone_id:
          description: A disk restored from this snapshot must reside in this availability zone
          $ref: ./identifiers.yaml#/components/schemas/AvailabilityZoneID
        created_at:
          type: string
          format: date-time
        disk_id:
          $ref: ./identifiers.yaml#/components/schemas/DiskID
        id:
          $ref: ./identifiers.yaml#/components/schemas/SnapshotID
        name:
          type: string
        region_id:
          $ref: ./identifiers.yaml#/components/schemas/RegionID
        size_gb:
          description: Capacity of the source disk when the snapshot was created. A disk restored from it cannot be
            smaller
          type: integer
          format: int64
        status:
          description: '`pending` once a quota slot is reserved and until the snapshot is taken, showing the `create`
            operation while it is taken; then `available`. `failed` means the snapshot was not created; its slot is
            released once no snapshot data remains. `error` means the cloud reports the snapshot broken.'
          type: string
          enum:
          - pending
          - available
          - deleted
          - failed
          - error
        operation:
          description: The operation in progress on this snapshot, or null when none is.
          anyOf:
          - $ref: '#/components/schemas/SnapshotOperation'
          - type: 'null'
          readOnly: true
        failure_reason:
          description: Why creation failed; null unless `status` is `failed`. `checkout_expired` means checkout was
            not completed before its Checkout Session expired. `provisioning_failed` means creation failed after the
            order was accepted, and the charge for this snapshot is refunded.
          type:
          - string
          - 'null'
          enum:
          - order_declined
          - order_canceled
          - order_expired
          - checkout_expired
          - provisioning_failed
          - null
        checkout_session_id:
          description: The Billing Checkout Session that bought this resource; `order_id` and `order_item_id` stay null
            until its checkout completes. Null when the resource was not bought through one.
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
        order_id:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
          description: The Billing order that bought this resource; null until checkout completes.
        order_item_id:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
          description: The Billing order item for this resource.
        subscription_id:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
          description: The subscription for this resource; its presence alone does not imply delivery.
        release_set:
          description: The subscription that pays for this snapshot, with the resource it pays for, so that a
            cancellation through Billing can name what it releases. Empty when no subscription pays for it, and
            once it is released.
          type: array
          items:
            $ref: ./release-sets.yaml#/components/schemas/ReleaseSetItem
      required:
      - id
      - disk_id
      - name
      - size_gb
      - status
      - availability_zone_id
      - region_id
      - created_at
      - operation
      - failure_reason
      - checkout_session_id
      - order_id
      - order_item_id
      - subscription_id
      - release_set
      additionalProperties: false
    SnapshotListResponseBody:
      type: object
      properties:
        items:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SnapshotResource'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
      additionalProperties: false
    CreateSnapshotRequestBody:
      description: "Creation configuration for this resource. Compute project quotas and Billing authorization are checked
        independently."
      type: object
      properties:
        disk_id:
          $ref: ./identifiers.yaml#/components/schemas/DiskID
        name:
          type: string
          minLength: 1
          maxLength: 128
        checkout:
          $ref: ./billing-terms.yaml#/components/schemas/CheckoutOptions
      required:
      - disk_id
      - name
      additionalProperties: false
    UpdateSnapshotRequestBody:
      description: The mutable fields of a snapshot. At least one must be given.
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
      minProperties: 1
      additionalProperties: false
    SnapshotOperation:
      description: An operation still running on this snapshot. It is not a separate resource; once it finishes, 
        the snapshot's `operation` is null again and the snapshot shows the result.
      type: object
      properties:
        type:
          description: '`restore`: a disk is being reverted to this snapshot (`create-disk-revert`) or created from it (`create-disk` with `snapshot_id`).'
          type: string
          enum:
          - create
          - restore
          - delete
        started_at:
          type: string
          format: date-time
      required:
      - type
      - started_at
      additionalProperties: false
    CreateSnapshotResponseBody:
      type: object
      description: The new snapshot, `pending` until its order is accepted, and its Checkout Session.
      properties:
        snapshot:
          $ref: '#/components/schemas/SnapshotResource'
        checkout_session_id:
          description: The Billing Checkout Session of this purchase. With deferred checkout, the customer completes it
            in Billing.
          type: string
          format: uuid
        order_id:
          description: The order created when checkout completes, at once for automatic checkout; null until then.
          type:
          - string
          - 'null'
          format: uuid
      required:
      - snapshot
      - checkout_session_id
      - order_id
      additionalProperties: false
