paths:
  /api/v2/subnets:
    get:
      summary: List subnets
      description: IPv6 subnets are included, with `ip_version` 6. One is created when IPv6 is enabled on its virtual
        private cloud and goes away when IPv6 is disabled; it cannot be created or deleted on its own.
      operationId: list-subnets
      tags:
      - subnets
      parameters:
      - name: virtual_private_cloud_id
        in: query
        description: Only subnets of this virtual private cloud.
        schema:
          $ref: ./identifiers.yaml#/components/schemas/VirtualPrivateCloudID
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubnetListResponseBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    post:
      summary: Create a subnet
      description: Creates an IPv4 subnet. The CIDR must fall inside the virtual private cloud's CIDR and must not
        overlap another subnet of it. To find a free CIDR, read the virtual private cloud's `free-subnet-cidr`.
      operationId: create-subnet
      tags:
      - subnets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubnetRequestBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subnet'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
  /api/v2/subnets/{subnetId}:
    parameters:
    - name: subnetId
      in: path
      required: true
      schema:
        $ref: ./identifiers.yaml#/components/schemas/SubnetID
    get:
      summary: Get a subnet
      operationId: get-subnet
      tags:
      - subnets
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subnet'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    patch:
      summary: Update a subnet
      description: Only the name can change. The CIDR is fixed for the subnet's life, because addresses already handed
        out inside it would fall outside a changed range.
      operationId: update-subnet
      tags:
      - subnets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubnetRequestBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subnet'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    delete:
      summary: Delete a subnet
      description: Refused while network interfaces remain in the subnet, or while a static route has a next hop
        inside its CIDR. An IPv6 subnet is removed by disabling IPv6 on its virtual private cloud.
      operationId: delete-subnet
      tags:
      - subnets
      responses:
        '204':
          description: No Content
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
components:
  schemas:
    Subnet:
      type: object
      properties:
        id:
          $ref: ./identifiers.yaml#/components/schemas/SubnetID
        virtual_private_cloud_id:
          $ref: ./identifiers.yaml#/components/schemas/VirtualPrivateCloudID
        name:
          type: string
        ip_version:
          type: integer
          format: int64
          enum:
          - 4
          - 6
        cidr:
          type: string
        gateway_ip:
          description: The subnet's gateway address, null for an IPv6 subnet, which is routed rather than gatewayed.
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - virtual_private_cloud_id
      - name
      - ip_version
      - cidr
      - gateway_ip
      - created_at
      - updated_at
      additionalProperties: false
    SubnetListResponseBody:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Subnet'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
      additionalProperties: false
    CreateSubnetRequestBody:
      type: object
      properties:
        virtual_private_cloud_id:
          $ref: ./identifiers.yaml#/components/schemas/VirtualPrivateCloudID
        name:
          type: string
          minLength: 1
          maxLength: 128
        cidr:
          description: An IPv4 CIDR inside the virtual private cloud's CIDR, overlapping no other subnet of it.
          type: string
          minLength: 1
          maxLength: 32
      required:
      - virtual_private_cloud_id
      - name
      - cidr
      additionalProperties: false
    UpdateSubnetRequestBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
      minProperties: 1
      additionalProperties: false
