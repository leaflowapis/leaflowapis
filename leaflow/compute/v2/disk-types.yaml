paths:
  /api/v2/disk-types:
    get:
      summary: List disk types on sale
      description: Only disk types currently on sale are listed. Any of them boots a virtual machine, holds data or takes
        a restore. A withdrawn one disappears from here and can no longer be bought, while the disks already on it keep
        working and can still be resized.
      operationId: list-disk-types
      security:
      - {}
      - scopedTokenAuth: []
      tags:
      - disk-types
      parameters:
      - name: region_id
        in: query
        required: false
        explode: false
        schema:
          $ref: ./identifiers.yaml#/components/schemas/RegionID
      - name: availability_zone_id
        in: query
        required: false
        description: Return only the types sold in this availability zone, sold out there or not.
        explode: false
        schema:
          $ref: ./identifiers.yaml#/components/schemas/AvailabilityZoneID
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskTypeListResponseBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
  /api/v2/disk-types/{diskTypeId}:
    get:
      summary: Get a disk type
      description: Retrieve capacity and performance constraints for an existing disk, including types withdrawn from
        sale.
      operationId: get-disk-type
      security:
      - {}
      - scopedTokenAuth: []
      tags:
      - disk-types
      parameters:
      - name: diskTypeId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/DiskTypeID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskTypeResource'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
components:
  schemas:
    DiskTypeResource:
      type: object
      properties:
        availability_zones:
          description: The availability zones of its region the type is sold in. A disk is created in one of them, and
            only a virtual machine in the same zone can attach it.
          type: array
          items:
            $ref: ./availability-zones.yaml#/components/schemas/OfferedAvailabilityZone
        id:
          $ref: ./identifiers.yaml#/components/schemas/DiskTypeID
        max_size_gb:
          type: integer
          format: int64
        media:
          type: string
          enum:
          - ssd
          - hdd
          - nvme
        min_size_gb:
          type: integer
          format: int64
        name:
          type: string
        region_id:
          $ref: ./identifiers.yaml#/components/schemas/RegionID
        step_gb:
          type: integer
          format: int64
        performance:
          $ref: '#/components/schemas/DiskTypePerformance'
        billing:
          description: The line a disk of this type is, whether bought on its own or as the system disk or a data disk
            of a virtual machine. A disk bought on its own is licensed only.
          allOf:
          - $ref: ./billing-terms.yaml#/components/schemas/BillingComponent
      required:
      - id
      - name
      - media
      - region_id
      - availability_zones
      - min_size_gb
      - max_size_gb
      - step_gb
      - performance
      - billing
      additionalProperties: false
    PerformanceFormula:
      description: One performance metric of a disk type for a disk of `size_gb`, `max(min, min(max, base + size_gb ×
        per_gib))`. A `per_gib` of zero is a fixed performance, and a `min` of zero is no floor.
      type: object
      properties:
        min:
          type: integer
          format: int64
        base:
          type: integer
          format: int64
        per_gib:
          type: integer
          format: int64
        max:
          type: integer
          format: int64
      required:
      - min
      - base
      - per_gib
      - max
      additionalProperties: false
    DiskTypePerformance:
      description: |-
        How fast a disk of this type runs for its size. Alibaba Cloud's ESSD disks have this shape: PL1 is IOPS `min(50000, 1800 + 50 × size_gb)`, and AutoPL's baseline adds a floor, `max(3000, min(50000, 1800 + 50 × size_gb))`.

        A disk's own performance, computed from these for its size, is on the disk. Growing a disk raises it, and the new performance applies from the disk's next attachment or the next start of its stopped virtual machine.
      type: object
      properties:
        iops:
          $ref: '#/components/schemas/PerformanceFormula'
        throughput_bytes_per_second:
          $ref: '#/components/schemas/PerformanceFormula'
      required:
      - iops
      - throughput_bytes_per_second
      additionalProperties: false
    DiskTypeListResponseBody:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DiskTypeResource'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
      additionalProperties: false
