paths:
  /api/v2/elastic-ips:
    get:
      summary: List elastic IPs
      operationId: list-elastic-ips
      tags:
        - elastic-ips
      parameters:
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElasticIpListResponseBody"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    post:
      summary: Allocate an elastic IP
      description:
        Creates an address and optionally an independent bandwidth service. Address holding is always
        metered; bandwidth uses its selected price.
      operationId: create-elastic-ip
      tags:
        - elastic-ips
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateElasticIpRequestBody"
      responses:
        "202":
          description: The elastic IP and its Checkout Session were created; no address is allocated yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateElasticIpResponseBody"
        "409":
          $ref: ./openapi.yaml#/components/responses/Conflict
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
  /api/v2/elastic-ips/{elasticIpId}:
    get:
      summary: Retrieve an elastic IP
      operationId: get-elastic-ip
      tags:
        - elastic-ips
      parameters:
        - name: elasticIpId
          in: path
          required: true
          schema:
            $ref: ./identifiers.yaml#/components/schemas/ElasticIpId
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElasticIp"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
      description: Returns the address holding, association intent and independent bandwidth service identity.
    delete:
      summary: Release an elastic IP
      description:
        "Releases the elastic IP after dissociating it. The elastic IP is `deleting` until cleanup is
        confirmed; the address then immediately returns to available inventory, with no cooldown period. Deleting
        the association or replacing it alone does not release the address.


        Refused with `COMPUTE_PURCHASE_PENDING` while the purchase that created it still awaits checkout or payment;
        `meta.checkout_session_id` names its Checkout Session and `meta.order_id` its order once checkout created
        one. Expire the session or cancel the order in Billing instead.


        While subscription items pay for the elastic IP (those in its `release_set`), deleting it cancels them rather
        than being refused: Compute creates one Billing cancellation for the whole set and answers with it in `cancellation`.
        `cancellation_mode` chooses when: `immediate` cancels the set now, a licensed item being refunded under
        its terms, and `period_end` keeps the elastic IP working until `scheduled_at` and releases it then. Asking
        again while that cancellation is pending answers with it again, whatever mode is asked for."
      operationId: delete-elastic-ip
      tags:
        - elastic-ips
      parameters:
        - name: elasticIpId
          in: path
          required: true
          schema:
            $ref: ./identifiers.yaml#/components/schemas/ElasticIpId
        - $ref: ./openapi.yaml#/components/parameters/CancellationMode
      responses:
        "409":
          $ref: ./openapi.yaml#/components/responses/Conflict
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
        "202":
          description:
            The release was accepted. Every elastic IP has a subscription item for its address, so `cancellation`
            names the cancellation that releases it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteElasticIpResponseBody"
  /api/v2/elastic-ips/{elasticIpId}/association:
    get:
      summary: Retrieve the association of an elastic IP
      description:
        "The private address of a network interface this elastic IP currently points at. Returns the
        stored state; it does not query the cloud.


        An elastic IP that points at nothing has no association: the request is refused with 404 `ELASTIC_IP_NOT_ASSOCIATED`."
      operationId: get-elastic-ip-association
      tags:
        - elastic-ips
      parameters:
        - name: elasticIpId
          in: path
          required: true
          schema:
            $ref: ./identifiers.yaml#/components/schemas/ElasticIpId
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElasticIpAssociation"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
  /api/v2/elastic-ips/{elasticIpId}:associate:
    post:
      summary: Associate an elastic IP with a target
      description:
        "Points the elastic IP at a target: an instance, which means the primary private IPv4 address
        of its primary network interface, or a network interface address (`network_interface_address_id`) given
        directly. Exactly one of `instance_id` and `network_interface_address_id`. A network interface address must
        be an assigned, unreleased IPv4 address on a network interface in this project and region; IPv6 addresses
        are rejected.


        The target becomes what the elastic IP points at. Repeating the request for the target it already points
        at changes nothing; an elastic IP associated with another target is refused with `ELASTIC_IP_ALREADY_ASSOCIATED`
        (409), and is moved by disassociating it first, so that the moment traffic stops reaching the old target
        is one the caller chose. The elastic IP is `associating` until the association is confirmed, and with an
        instance as the target that instance is `associating_elastic_ip` as well, so the instance must not have
        another operation in progress. An instance still being created after its order was accepted can be the target:
        the association is accepted and made once the instance is created, and fails with `COMPUTE_RESOURCE_CREATION_FAILED`
        if the instance's creation fails. An instance whose purchase still awaits checkout or payment is refused
        with `COMPUTE_PURCHASE_PENDING`.


        The elastic IP must be in the same region as the target. With an instance as the target, the elastic IP's
        `bandwidth_mbps` must not exceed the `max_bandwidth_mbps` of that instance's type; a higher limit is refused
        with `INSTANCE_BANDWIDTH_CEILING`."
      operationId: associate-elastic-ip
      tags:
        - elastic-ips
      parameters:
        - name: elasticIpId
          in: path
          required: true
          schema:
            $ref: ./identifiers.yaml#/components/schemas/ElasticIpId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssociateElasticIpRequestBody"
      responses:
        "202":
          description: The association was accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElasticIp"
        "409":
          $ref: ./openapi.yaml#/components/responses/Conflict
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
  /api/v2/elastic-ips/{elasticIpId}:disassociate:
    post:
      summary: Remove the association of an elastic IP
      description:
        The address remains held by the project and simply no longer points at any network interface.
        The elastic IP is `disassociating` until the change is confirmed, and an instance whose primary interface
        it pointed at is `disassociating_elastic_ip`. Removing an association that does not exist is refused with
        404 `ELASTIC_IP_NOT_ASSOCIATED`.
      operationId: disassociate-elastic-ip
      tags:
        - elastic-ips
      parameters:
        - name: elasticIpId
          in: path
          required: true
          schema:
            $ref: ./identifiers.yaml#/components/schemas/ElasticIpId
      responses:
        "202":
          description: The removal was accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElasticIp"
        "409":
          $ref: ./openapi.yaml#/components/responses/Conflict
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
components:
  schemas:
    DeleteElasticIpResponseBody:
      description:
        The elastic IP as it is when the deletion is accepted, and the Billing cancellation that releases
        it when subscription items pay for it.
      type: object
      properties:
        elastic_ip:
          $ref: "#/components/schemas/ElasticIp"
        cancellation:
          description:
            The cancellation Compute created for the elastic IP's subscription items; null when none
            pays for it.
          oneOf:
            - type: "null"
            - $ref: ./billing-terms.yaml#/components/schemas/BillingCancellation
      required:
        - elastic_ip
        - cancellation
      additionalProperties: false
    Ipv4HostAddress:
      type: string
      minLength: 7
      maxLength: 15
      pattern: ^(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}$
    ElasticIp:
      description:
        An IPv4 address holding and association intent. Address holding is billed independently of association
        and bandwidth. Public forwarding requires an enabled InternetBandwidth service.
      type: object
      properties:
        address:
          description: The held IPv4 address; null before actual claim. Holding identity is not exposed.
          anyOf:
            - $ref: "#/components/schemas/Ipv4HostAddress"
            - type: "null"
        allocated_at:
          description: The actual address holding start time; null before actual claim.
          type:
            - string
            - "null"
          format: date-time
        released_at:
          description: The confirmed holding release time; null while held or before actual claim.
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
        id:
          $ref: ./identifiers.yaml#/components/schemas/ElasticIpId
        line_id:
          $ref: ./identifiers.yaml#/components/schemas/InternetLineId
        region_id:
          $ref: ./identifiers.yaml#/components/schemas/RegionId
        status:
          description:
            Pending until allocated, then available; operation states describe association or release
            in progress.
          type: string
          enum:
            - pending
            - available
            - deleted
            - failed
            - error
            - associating
            - disassociating
            - suspending
            - resuming
            - deleting
        checkout_session_id:
          description:
            The Billing Checkout Session that bought this resource; `order_id` and the order items stay
            null until its checkout completes. Null when the resource was not bought through one.
          type:
            - string
            - "null"
          format: uuid
          readOnly: true
        order_id:
          type:
            - string
            - "null"
          format: uuid
        address_order_item_id:
          description: The Billing order item of the address, always pay-as-you-go.
          type:
            - string
            - "null"
          format: uuid
        subscription_id:
          description: The independent address subscription, billed for the full holding duration.
          type:
            - string
            - "null"
          format: uuid
        address_subscription_item_id:
          description: The subscription item of the address, always pay-as-you-go.
          type:
            - string
            - "null"
          format: uuid
        release_set:
          description: The subscription items required to release this address and its dependent bandwidth service.
          type: array
          items:
            $ref: ./release-sets.yaml#/components/schemas/ReleaseSetItem
        access_state:
          type:
            - string
            - "null"
          enum:
            - pending
            - enabled
            - suspended
            - reclaimed
            - null
        failure_reason:
          description:
            Why creation failed; null unless `status` is `failed`. `checkout_expired` means checkout
            was not completed before its Checkout Session expired. `provisioning_failed` means creation failed after
            the order was accepted, and the charge for this elastic IP is refunded.
          type:
            - string
            - "null"
          enum:
            - order_declined
            - order_canceled
            - order_expired
            - checkout_expired
            - provisioning_failed
            - null
        association:
          anyOf:
            - $ref: "#/components/schemas/ElasticIpAssociation"
            - type: "null"
        latest_operation:
          description: The most recent operation started on the elastic IP; null when none has been recorded.
          anyOf:
            - $ref: ./latest-operations.yaml#/components/schemas/LatestOperation
            - type: "null"
        internet_bandwidth_id:
          anyOf:
            - $ref: ./identifiers.yaml#/components/schemas/InternetBandwidthId
            - type: "null"
      required:
        - id
        - line_id
        - region_id
        - address
        - allocated_at
        - released_at
        - status
        - created_at
        - checkout_session_id
        - order_id
        - address_order_item_id
        - subscription_id
        - address_subscription_item_id
        - release_set
        - access_state
        - failure_reason
        - association
        - latest_operation
        - internet_bandwidth_id
      additionalProperties: false
    ElasticIpListResponseBody:
      type: object
      properties:
        items:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/ElasticIp"
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
        - items
        - pagination
      additionalProperties: false
    CreateElasticIpRequestBody:
      type: object
      properties:
        address:
          description: The IPv4 address to allocate. Selected by the platform when omitted.
          $ref: "#/components/schemas/Ipv4HostAddress"
        line_id:
          $ref: ./identifiers.yaml#/components/schemas/InternetLineId
        checkout:
          $ref: ../../billing/type/v1/checkout.yaml#/components/schemas/CheckoutOptions
        instance_id:
          description: Buy the elastic IP for this instance of the project; see the operation.
          $ref: ./identifiers.yaml#/components/schemas/InstanceId
        bandwidth:
          $ref: ./internet-bandwidths.yaml#/components/schemas/InternetBandwidthPurchase
      required:
        - line_id
      additionalProperties: false
      description:
        Buy an address holding, optionally with a separately subscribed bandwidth service in the same
        checkout.
    AssociateElasticIpRequestBody:
      description: The target an elastic IP points at. Exactly one of the two forms.
      oneOf:
        - $ref: "#/components/schemas/InstanceAssociationTarget"
        - $ref: "#/components/schemas/NetworkInterfaceAddressAssociationTarget"
    InstanceAssociationTarget:
      description:
        An instance; the elastic IP points at the primary private IPv4 address of its primary network
        interface.
      type: object
      properties:
        instance_id:
          $ref: ./identifiers.yaml#/components/schemas/InstanceId
      required:
        - instance_id
      additionalProperties: false
    NetworkInterfaceAddressAssociationTarget:
      description:
        One private address of a network interface. One interface may hold several private addresses,
        each with its own elastic IP.
      type: object
      properties:
        network_interface_address_id:
          description:
            An assigned, unreleased IPv4 address on a network interface in this project and region. IPv6
            addresses are rejected.
          $ref: ./identifiers.yaml#/components/schemas/NetworkInterfaceAddressId
      required:
        - network_interface_address_id
      additionalProperties: false
    CreateElasticIpResponseBody:
      description:
        "The new elastic IP, `pending` until its order is accepted, and its Checkout Session. `address`
        is null until

        the address is allocated."
      type: object
      properties:
        elastic_ip:
          $ref: "#/components/schemas/ElasticIp"
        checkout_session_id:
          description:
            The Billing Checkout Session of this purchase. With deferred checkout, the customer completes
            it in Billing.
          type: string
          format: uuid
        order_id:
          description: The order created when checkout completes, at once for automatic checkout; null until then.
          type:
            - string
            - "null"
          format: uuid
      required:
        - elastic_ip
        - checkout_session_id
        - order_id
      additionalProperties: false
    ElasticIpAssociation:
      type: object
      properties:
        id:
          $ref: ./identifiers.yaml#/components/schemas/ElasticIpAssociationId
        elastic_ip_id:
          description: The commercial ElasticIp identity. This is not an internal holding ID.
          $ref: ./identifiers.yaml#/components/schemas/ElasticIpId
        network_interface_address_id:
          $ref: ./identifiers.yaml#/components/schemas/NetworkInterfaceAddressId
        public_address:
          $ref: "#/components/schemas/Ipv4HostAddress"
        private_address:
          $ref: "#/components/schemas/Ipv4HostAddress"
        state:
          type: string
          enum:
            - reserved
            - associated
            - disassociating
            - released
        associated_at:
          type:
            - string
            - "null"
          format: date-time
        disassociated_at:
          type:
            - string
            - "null"
          format: date-time
        released_at:
          type:
            - string
            - "null"
          format: date-time
      required:
        - id
        - elastic_ip_id
        - network_interface_address_id
        - public_address
        - private_address
        - state
        - associated_at
        - disassociated_at
        - released_at
      additionalProperties: false
