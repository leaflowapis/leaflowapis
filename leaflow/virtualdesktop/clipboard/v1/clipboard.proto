syntax = "proto3";

package leaflow.virtualdesktop.clipboard.v1;

import "google/rpc/status.proto";
import "leaflow/virtualdesktop/filetransfer/v1/filetransfer.proto";

option go_package = "github.com/leaflowapis/leaflow-go/leaflow/virtualdesktop/clipboard/v1;clipboardv1";

// The clipboard shared between the viewer and the session, with delayed
// rendering: an owner announces what it holds by media type and sends the
// content only when someone pastes it (after MS-RDPECLIP; X11 selections per
// ICCCM).
//
// Channel types:
//   - "leaflow.virtualdesktop.clipboard.v1", lane "interactive": opened by the
//     viewer, one per connection. ClientHello and ServerHello first, then
//     offers and their responses in both directions.
//   - "leaflow.virtualdesktop.clipboard.v1.content", lane "bulk": opened by
//     whoever pastes, one per paste. It sends ClipboardDataRequest; the owner
//     answers with ClipboardData messages and one ClipboardDataEnd. Flow
//     control is the channel's credit. Closing the channel with CANCELLED
//     abandons the paste.
//   - "leaflow.virtualdesktop.clipboard.v1.ClipboardService", lane
//     "interactive": opened by an automation client, which has no clipboard
//     of its own, to read and write the session's clipboard.
//
// Order. Every offer of a side carries sequence from one counter of that side
// on the connection, starting at 1. An offer replaces the earlier offers of
// both sides for its selection. The receiver answers each offer with
// ClipboardOfferResponse once it has applied it; for an offer of the viewer
// that is when the session owns the selection. Until then, input that may
// paste names the offer's sequence (see the input channel), so that a paste
// never overtakes the content it pastes.
//
// Content is at most 256 MiB. Files travel as a file transfer offer and are
// fetched like any other.

// A message from the viewer.
message ClientMessage {
  // The message.
  oneof message {
    // What the viewer takes part in. The first message of the clipboard
    // channel.
    ClientHello client_hello = 1;
    // On the clipboard channel: the viewer's clipboard changed.
    ClipboardOffer offer = 2;
    // On the clipboard channel: the viewer applied an offer of the session.
    ClipboardOfferResponse offer_response = 3;
    // On a content channel the viewer opened.
    ClipboardDataRequest data_request = 4;
    // On a content channel the session opened.
    ClipboardData data = 5;
    // On a content channel the session opened.
    ClipboardDataEnd data_end = 6;
  }
}

// A message from the session.
message ServerMessage {
  // The message.
  oneof message {
    // What the session allows. The first message of the clipboard channel.
    ServerHello server_hello = 1;
    // On the clipboard channel: the session's clipboard changed.
    ClipboardOffer offer = 2;
    // On the clipboard channel: the session owns the selection of an offer of
    // the viewer.
    ClipboardOfferResponse offer_response = 3;
    // On a content channel the session opened.
    ClipboardDataRequest data_request = 4;
    // On a content channel the viewer opened.
    ClipboardData data = 5;
    // On a content channel the viewer opened.
    ClipboardDataEnd data_end = 6;
  }
}

// An X11 selection (ICCCM §2.6.1).
enum Selection {
  SELECTION_UNSPECIFIED = 0;
  // The clipboard of copy and paste.
  SELECTION_CLIPBOARD = 1;
  // The text selected last, pasted with the middle button.
  SELECTION_PRIMARY = 2;
}

// What the viewer takes part in.
message ClientHello {
  // The selections the viewer shares. Only CLIPBOARD unless the viewer has a
  // primary selection of its own.
  repeated Selection selections = 1;
}

// What the session allows this viewer. A direction that is not allowed is
// not used: the session sends no offers it may not read, and refuses offers
// it may not write with PERMISSION_DENIED.
message ServerHello {
  // The viewer receives the session's offers and pastes from them.
  bool read_allowed = 1;
  // The viewer's offers are applied to the session.
  bool write_allowed = 2;
  // The selections shared: those of ClientHello the session supports.
  repeated Selection selections = 3;
}

// The sender's clipboard changed. Small content travels along, so that a
// paste of it needs no round trip.
message ClipboardOffer {
  // The selection.
  Selection selection = 1;
  // The position of the offer in the sender's order.
  uint64 sequence = 2;
  // The media types available, most faithful first, such as "text/html",
  // "text/plain;charset=utf-8" or "image/png". Empty: the selection is now
  // empty.
  repeated string mime_types = 3;
  // Content sent along, at most 64 KiB in total, for some of mime_types.
  repeated ClipboardItem items = 4;
  // Files copied, such as in a file manager. The receiver fetches them like
  // any file transfer offer and puts them on its clipboard as its platform
  // represents files, such as "text/uri-list".
  leaflow.virtualdesktop.filetransfer.v1.FileTransferOffer file_offer = 5;
}

// Content of one media type.
message ClipboardItem {
  // The media type.
  string mime_type = 1;
  // The content.
  bytes data = 2;
}

// The receiver applied an offer.
message ClipboardOfferResponse {
  // The selection.
  Selection selection = 1;
  // ClipboardOffer.sequence.
  uint64 sequence = 2;
  // Why the receiver could not apply it. Unset on success.
  google.rpc.Status error = 3;
}

// Asks the owner for content. The first message of a content channel.
message ClipboardDataRequest {
  // The selection.
  Selection selection = 1;
  // The offer pasted from. A request for an offer that has since been
  // replaced ends with ClipboardDataEnd and FAILED_PRECONDITION.
  uint64 sequence = 2;
  // One of the offer's mime_types.
  string mime_type = 3;
}

// The next bytes of the content, in order.
message ClipboardData {
  // At most 256 KiB.
  bytes data = 1;
}

// The end of the content.
message ClipboardDataEnd {
  // Why the owner could not provide it. Unset on success.
  google.rpc.Status error = 1;
}

// Reads and writes the session's clipboard for automation clients. Reading
// needs read_allowed and writing write_allowed in the viewer's
// ClipboardPolicy; otherwise calls fail with PERMISSION_DENIED.
service ClipboardService {
  // Returns the media types the clipboard holds and, if asked, the content of
  // one of them.
  rpc ReadClipboard(ReadClipboardRequest) returns (ReadClipboardResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Replaces the clipboard. The session owns the selection until something
  // else takes it.
  rpc WriteClipboard(WriteClipboardRequest) returns (WriteClipboardResponse);
}

// The request of ReadClipboard.
message ReadClipboardRequest {
  // The selection. Unset: CLIPBOARD.
  Selection selection = 1;
  // The media type to return the content of. Empty: none, only the types.
  // One the clipboard does not hold fails with NOT_FOUND.
  string mime_type = 2;
}

// The response of ReadClipboard.
message ReadClipboardResponse {
  // The media types available, most faithful first. Empty: the clipboard is
  // empty.
  repeated string mime_types = 1;
  // The content of the type asked for. Content larger than 16 MiB fails with
  // RESOURCE_EXHAUSTED.
  ClipboardItem item = 2;
}

// The request of WriteClipboard.
message WriteClipboardRequest {
  // The selection. Unset: CLIPBOARD.
  Selection selection = 1;
  // The content, one item per media type, at most 16 MiB in total. Files of
  // the session are written as "text/uri-list" with file URIs. Empty: clears
  // the selection.
  repeated ClipboardItem items = 2;
}

// The response of WriteClipboard.
message WriteClipboardResponse {
  // The session revision at which the session took the selection.
  uint64 revision = 1;
}

// What a viewer may do with the clipboard. Carried in the viewer's signed
// authorization; without it the viewer shares no clipboard.
message ClipboardPolicy {
  // The viewer may read the session's clipboard.
  bool read_allowed = 1;
  // The viewer may write the session's clipboard.
  bool write_allowed = 2;
}
