syntax = "proto3";

package leaflow.virtualdesktop.accessibility.v1;

import "google/protobuf/duration.proto";
import "leaflow/virtualdesktop/display/v1/display.proto";

option go_package = "github.com/leaflowapis/leaflow-go/leaflow/virtualdesktop/accessibility/v1;accessibilityv1";

// The accessibility trees the applications of the session expose, and the
// actions they offer through them.
//
// Channel type "leaflow.virtualdesktop.accessibility.v1.AccessibilityService",
// lane "interactive": opened by the viewer.
//
// Model. Applications expose their user interface as a tree of nodes through
// the platform's accessibility API, AT-SPI2 on Linux. The session presents
// these trees as one, with roles, states and names as WAI-ARIA 1.2 defines
// them and as W3C Core Accessibility API Mappings 1.2 maps the platform's to
// them, after the Chrome DevTools Protocol Accessibility domain. The root has
// one child per application exposing a tree; an application's children are
// its windows. The session turns on the platform's accessibility support
// when it starts and never changes how applications are launched, so an
// application that does not follow that setting exposes no tree. It is then
// absent, and its windows remain reachable through capture and input only.
//
// Identifiers. node_id is chosen by the session, is never 0 and is never
// reused in the session. It names the same platform object for as long as
// the application keeps it. A call that names a node that is gone fails with
// NOT_FOUND and reason NODE_GONE; one that names a window that is gone fails
// with NOT_FOUND and reason WINDOW_GONE; one that names a window whose
// application exposes no tree fails with FAILED_PRECONDITION and reason
// TREE_UNAVAILABLE.
//
// Coordinates. Every Rectangle here is in canvas coordinates, where input goes.
//
// Changes. PerformAction, SetValue, SetTextSelection and InvokeMenuItem act
// on the applications, so they need what input needs: a viewer that is not
// read-only, holding the input lease of the session channel. They fail like
// InputService calls otherwise. A call returns once the application accepted
// the request, with the session revision at which it did; whether it had the
// intended effect is for the caller to observe, such as with
// WaitForCondition or through the changes after that revision.

// Reads and operates the accessibility trees.
service AccessibilityService {
  // Returns part of the tree, breadth first.
  rpc GetTree(GetTreeRequest) returns (GetTreeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Returns the nodes of a subtree that match a rule (AT-SPI2
  // Collection.GetMatches).
  rpc FindNodes(FindNodesRequest) returns (FindNodesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Returns the deepest node at a point and its ancestors (AT-SPI2
  // Component.GetAccessibleAtPoint).
  rpc GetNodeAtPoint(GetNodeAtPointRequest) returns (GetNodeAtPointResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Returns the text of a node and its caret and selections (AT-SPI2 Text).
  rpc GetText(GetTextRequest) returns (GetTextResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Performs an action on a node.
  rpc PerformAction(PerformActionRequest) returns (PerformActionResponse);
  // Replaces the text or the numeric value of a node and reads it back.
  rpc SetValue(SetValueRequest) returns (SetValueResponse);
  // Moves the caret or selects text in a node (AT-SPI2 Text.SetSelection,
  // Text.SetCaretOffset).
  rpc SetTextSelection(SetTextSelectionRequest) returns (SetTextSelectionResponse);
  // Opens the menus of a window's menu bar along a path of item names and
  // activates the last item.
  rpc InvokeMenuItem(InvokeMenuItemRequest) returns (InvokeMenuItemResponse);
  // Waits until conditions on the trees hold, or a timeout passes.
  rpc WaitForCondition(WaitForConditionRequest) returns (WaitForConditionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// One node of an accessibility tree (CDP Accessibility.AXNode).
message Node {
  // The node.
  uint64 node_id = 1;
  // Its parent. 0 for the root.
  uint64 parent_id = 2;
  // Its children in order, all of them, whether returned or not.
  repeated uint64 child_ids = 3;
  // The WAI-ARIA 1.2 role, such as "button" or "menuitem", mapped from the
  // platform role as Core-AAM 1.2 maps it. Empty when no WAI-ARIA role
  // corresponds, such as for an application or a top-level window.
  string role = 4;
  // The role as the platform names it, such as the AT-SPI2 role name
  // "push button".
  string platform_role = 5;
  // The accessible name (W3C Accessible Name and Description Computation 1.2).
  string name = 6;
  // The accessible description.
  string description = 7;
  // The text of a text field or the value of a widget with one, such as the
  // selected option of a combo box. Password fields report no text.
  string value = 8;
  // The numeric value of a range widget, such as a slider. Unset for others.
  RangeValue range_value = 9;
  // Its states, in no particular order.
  repeated State states = 10;
  // The standard actions it offers.
  repeated Action actions = 11;
  // The actions it offers as the platform names them, such as the AT-SPI2
  // action names "click" or "activate".
  repeated string platform_actions = 12;
  // Where it is shown. Unset when it has no on-screen extent.
  leaflow.virtualdesktop.display.v1.Rectangle bounds = 13;
  // The window it is shown in. 0 when unknown.
  uint64 window_id = 14;
  // The process of its application. 0 when unknown.
  uint32 pid = 15;
  // The heading or tree level, from 1 (aria-level). 0: none.
  uint32 level = 16;
  // Its position among its siblings in a set, from 1 (aria-posinset). 0:
  // none.
  uint32 position_in_set = 17;
  // The number of items in its set (aria-setsize). 0: none.
  uint32 set_size = 18;
  // The row of a cell or a row, from 1 (aria-rowindex). 0: none.
  uint32 row_index = 19;
  // The column of a cell, from 1 (aria-colindex). 0: none.
  uint32 column_index = 20;
  // The relations to other nodes.
  repeated Relation relations = 21;
  // The object attributes the platform reports, such as "placeholder-text"
  // (AT-SPI2 Accessible.GetAttributes).
  map<string, string> attributes = 22;
}

// The value of a range widget (aria-valuenow, aria-valuemin, aria-valuemax;
// AT-SPI2 Value).
message RangeValue {
  // The current value.
  double current = 1;
  // The lowest value.
  double minimum = 2;
  // The highest value.
  double maximum = 3;
  // The smallest step. 0 when unknown.
  double step = 4;
}

// A state of a node, named after WAI-ARIA 1.2 states and properties where one
// exists, otherwise after AT-SPI2 states.
enum State {
  STATE_UNSPECIFIED = 0;
  // Can take the keyboard focus.
  STATE_FOCUSABLE = 1;
  // Has the keyboard focus.
  STATE_FOCUSED = 2;
  // Does not accept interaction (aria-disabled).
  STATE_DISABLED = 3;
  // Can be selected.
  STATE_SELECTABLE = 4;
  // Is selected (aria-selected).
  STATE_SELECTED = 5;
  // Can be checked.
  STATE_CHECKABLE = 6;
  // Is checked (aria-checked="true").
  STATE_CHECKED = 7;
  // Is partly checked or partly pressed (aria-checked or aria-pressed
  // "mixed"; AT-SPI2 INDETERMINATE).
  STATE_MIXED = 8;
  // A toggle button that is pressed (aria-pressed="true").
  STATE_PRESSED = 9;
  // Can be expanded or collapsed.
  STATE_EXPANDABLE = 10;
  // Is expanded (aria-expanded="true").
  STATE_EXPANDED = 11;
  // Its text can be edited.
  STATE_EDITABLE = 12;
  // Its value cannot be changed (aria-readonly).
  STATE_READ_ONLY = 13;
  // Must be filled in (aria-required).
  STATE_REQUIRED = 14;
  // Its value is invalid (aria-invalid; AT-SPI2 INVALID_ENTRY).
  STATE_INVALID = 15;
  // Is being updated (aria-busy).
  STATE_BUSY = 16;
  // Blocks interaction with the rest of its application (aria-modal).
  STATE_MODAL = 17;
  // Allows several of its children to be selected (aria-multiselectable).
  STATE_MULTI_SELECTABLE = 18;
  // A text field of several lines (aria-multiline).
  STATE_MULTI_LINE = 19;
  // Opens a menu or another popup (aria-haspopup).
  STATE_HAS_POPUP = 20;
  // Is drawn on the screen, though possibly covered (AT-SPI2 SHOWING).
  STATE_SHOWING = 21;
  // The active window, or the active item of a container (AT-SPI2 ACTIVE).
  STATE_ACTIVE = 22;
  // The default button of its window (AT-SPI2 IS_DEFAULT).
  STATE_DEFAULT = 23;
  // A link that was visited (AT-SPI2 VISITED).
  STATE_VISITED = 24;
}

// A standard action, mapped from the platform's actions (after AccessKit
// Action).
enum Action {
  ACTION_UNSPECIFIED = 0;
  // The default action, typically what a click does, such as the AT-SPI2
  // action "click", "press", "activate", "toggle" or "jump".
  ACTION_CLICK = 1;
  // Moves the keyboard focus to it (AT-SPI2 Component.GrabFocus).
  ACTION_FOCUS = 2;
  // Expands it.
  ACTION_EXPAND = 3;
  // Collapses it.
  ACTION_COLLAPSE = 4;
  // Opens its context menu.
  ACTION_SHOW_CONTEXT_MENU = 5;
  // Scrolls its ancestors until it is visible (AT-SPI2 Component.ScrollTo).
  ACTION_SCROLL_INTO_VIEW = 6;
  // Selects it in its container (AT-SPI2 Selection.SelectChild).
  ACTION_SELECT = 7;
  // Deselects it in its container (AT-SPI2 Selection.DeselectChild).
  ACTION_DESELECT = 8;
  // Raises its range value by one step.
  ACTION_INCREMENT = 9;
  // Lowers its range value by one step.
  ACTION_DECREMENT = 10;
}

// A relation from a node to others (AT-SPI2 Accessible.GetRelationSet).
message Relation {
  // The relation.
  RelationType type = 1;
  // The nodes it relates to.
  repeated uint64 target_ids = 2;
}

// The type of a relation, after the WAI-ARIA 1.2 relationship attributes.
enum RelationType {
  RELATION_TYPE_UNSPECIFIED = 0;
  // The targets name this node (aria-labelledby).
  RELATION_TYPE_LABELLED_BY = 1;
  // The targets describe this node (aria-describedby).
  RELATION_TYPE_DESCRIBED_BY = 2;
  // This node controls the targets (aria-controls).
  RELATION_TYPE_CONTROLS = 3;
  // Reading continues at the targets (aria-flowto).
  RELATION_TYPE_FLOWS_TO = 4;
}

// What nodes to match (after AT-SPI2 MatchRule). A node matches when it meets
// every field that is set.
message MatchRule {
  // The WAI-ARIA role.
  string role = 1;
  // The platform role.
  string platform_role = 2;
  // The accessible name, exactly.
  string name = 3;
  // A part of the accessible name, compared case-insensitively.
  string name_contains = 4;
  // The value, exactly.
  string value = 5;
  // States the node has, all of them.
  repeated State states = 6;
  // States the node has none of.
  repeated State excluded_states = 7;
}

// The request of GetTree.
message GetTreeRequest {
  // The root of the part returned: the node of this window. Set at most one
  // of window_id and node_id; neither: the root of all trees.
  uint64 window_id = 1;
  // The root of the part returned: this node.
  uint64 node_id = 2;
  // The levels below the root to return, at most 64. 0: 64.
  uint32 max_depth = 3;
  // The most nodes to return, at most 10000. 0: 1000.
  uint32 max_nodes = 4;
  // Also returns nodes that are not drawn on the screen and their subtrees.
  // By default the session skips them, so that hidden content does not use
  // up max_nodes.
  bool include_hidden = 5;
}

// The response of GetTree.
message GetTreeResponse {
  // The root first, then breadth first. Every node lists all its children,
  // so a caller fetches a subtree that was cut off with another GetTree.
  repeated Node nodes = 1;
  // Nodes were left out because of max_depth or max_nodes.
  bool truncated = 2;
  // The session revision the nodes belong to.
  uint64 revision = 3;
}

// The request of FindNodes.
message FindNodesRequest {
  // The subtree to search: that of this window. Set at most one of window_id
  // and node_id; neither: all trees.
  uint64 window_id = 1;
  // The subtree to search: that of this node.
  uint64 node_id = 2;
  // What to match.
  MatchRule rule = 3;
  // The most nodes to return, at most 1000. 0: 100.
  uint32 max_results = 4;
  // Also searches nodes that are not drawn on the screen.
  bool include_hidden = 5;
}

// The response of FindNodes.
message FindNodesResponse {
  // The matches, in tree order, without their subtrees.
  repeated Node nodes = 1;
  // More nodes matched than max_results.
  bool truncated = 2;
  // The session revision the nodes belong to.
  uint64 revision = 3;
}

// The request of GetNodeAtPoint.
message GetNodeAtPointRequest {
  // The point.
  sint32 x = 1;
  // See x.
  sint32 y = 2;
}

// The response of GetNodeAtPoint.
message GetNodeAtPointResponse {
  // The deepest node at the point first, then its ancestors up to its
  // window. Empty when the window there exposes no tree.
  repeated Node nodes = 1;
}

// The request of GetText.
message GetTextRequest {
  // A node with text.
  uint64 node_id = 1;
  // The first character to return. Offsets count Unicode code points, as
  // AT-SPI2 Text does.
  uint32 start_offset = 2;
  // The most characters to return, at most 1048576. 0: 65536.
  uint32 max_characters = 3;
}

// The response of GetText.
message GetTextResponse {
  // The text from start_offset.
  string text = 1;
  // The length of the whole text in characters.
  uint32 character_count = 2;
  // The caret. Unset when the node has none.
  optional uint32 caret_offset = 3;
  // The selected ranges.
  repeated TextRange selections = 4;
}

// A range of text, in characters.
message TextRange {
  // Its first character.
  uint32 start_offset = 1;
  // The character after its last.
  uint32 end_offset = 2;
}

// The request of PerformAction.
message PerformActionRequest {
  // The node.
  uint64 node_id = 1;
  // The standard action. Set exactly one of action and platform_action.
  Action action = 2;
  // An action the node lists in platform_actions.
  string platform_action = 3;
}

// The response of PerformAction. A node that does not offer the action fails
// with FAILED_PRECONDITION and reason ACTION_UNAVAILABLE; one whose
// application refuses it fails with ABORTED and reason ACTION_REFUSED.
message PerformActionResponse {
  // The session revision at which the application accepted the action.
  uint64 revision = 1;
}

// The request of SetValue.
message SetValueRequest {
  // The node, a text field or a range widget.
  uint64 node_id = 1;
  // The new value.
  oneof value {
    // Replaces the whole text of a text field (AT-SPI2
    // EditableText.SetTextContents).
    string text = 2;
    // Sets the value of a range widget (AT-SPI2 Value.CurrentValue).
    double number = 3;
  }
}

// The response of SetValue.
message SetValueResponse {
  // The node as read back after the change.
  Node node = 1;
  // The session revision at which the value was set.
  uint64 revision = 2;
}

// The request of SetTextSelection.
message SetTextSelectionRequest {
  // A node with text.
  uint64 node_id = 1;
  // The text to select, in characters. An empty range moves the caret to its
  // start.
  TextRange range = 2;
}

// The response of SetTextSelection.
message SetTextSelectionResponse {
  // The session revision at which the selection was set.
  uint64 revision = 1;
}

// The request of InvokeMenuItem. The session opens one menu level at a time,
// matching each name exactly after trimming surrounding white space, and
// waits for each menu to appear. It fails before activating anything: with
// NOT_FOUND and reason MENU_ITEM_NOT_FOUND when a name matches no item, with
// FAILED_PRECONDITION and reason MENU_ITEM_AMBIGUOUS when it matches several,
// and with FAILED_PRECONDITION and reason MENU_ITEM_DISABLED when an item is
// disabled. The ErrorInfo metadata "path_index" names the failing name. Menus
// it opened are closed again on failure.
message InvokeMenuItemRequest {
  // The window whose menu bar to use.
  uint64 window_id = 1;
  // Item names from the menu bar down, such as ["File", "Save As…"]. 1 to
  // 16 names.
  repeated string path = 2;
}

// The response of InvokeMenuItem.
message InvokeMenuItemResponse {
  // The session revision at which the last item was activated.
  uint64 revision = 1;
}

// The request of WaitForCondition. The session evaluates the conditions when
// the trees change and at least every 100 milliseconds, and answers as soon
// as all of them have held for stable_period, or when the timeout passes.
message WaitForConditionRequest {
  // 1 to 8 conditions, all of which must hold.
  repeated Condition conditions = 1;
  // How long all conditions must hold without interruption. Unset: once
  // they hold.
  google.protobuf.Duration stable_period = 2;
  // The longest wait, at most 10 seconds. 0 seconds: evaluate once. Unset: 3
  // seconds.
  google.protobuf.Duration timeout = 3;
}

// A condition on a subtree: a node matching the rule exists, or none does.
message Condition {
  // The subtree to search: that of this window. Set at most one of window_id
  // and node_id; neither: all trees.
  uint64 window_id = 1;
  // The subtree to search: that of this node.
  uint64 node_id = 2;
  // What to match.
  MatchRule rule = 3;
  // The condition holds when no node matches instead.
  bool absent = 4;
}

// The response of WaitForCondition.
message WaitForConditionResponse {
  // SATISFIED when all conditions held for stable_period; UNSATISFIED when
  // at least one was found not to hold; UNKNOWN otherwise. UNKNOWN is never
  // success.
  ConditionStatus status = 1;
  // The outcome of each condition, in the order of the request.
  repeated ConditionResult results = 2;
  // How long the session waited.
  google.protobuf.Duration elapsed = 3;
  // The session revision the outcome belongs to.
  uint64 revision = 4;
}

// The outcome of a condition.
enum ConditionStatus {
  CONDITION_STATUS_UNSPECIFIED = 0;
  // It holds.
  CONDITION_STATUS_SATISFIED = 1;
  // It does not hold.
  CONDITION_STATUS_UNSATISFIED = 2;
  // The session could not tell, such as because the window exposes no tree
  // or the search was incomplete. Absence is only proven by a complete
  // search.
  CONDITION_STATUS_UNKNOWN = 3;
}

// The outcome of one condition at the end of the wait.
message ConditionResult {
  // The outcome.
  ConditionStatus status = 1;
  // The matching nodes, at most 16, without their subtrees.
  repeated Node nodes = 2;
  // Why the status is UNKNOWN, as an ErrorInfo reason such as
  // TREE_UNAVAILABLE, WINDOW_GONE, NODE_GONE or SEARCH_INCOMPLETE, or
  // NOT_STABLE when the condition held but not for stable_period. Empty
  // otherwise.
  string reason = 3;
}
