syntax = "proto3";

package leaflow.virtualdesktop.terminal.v1;

import "google/protobuf/timestamp.proto";
import "google/rpc/status.proto";

option go_package = "github.com/leaflowapis/leaflow-go/virtualdesktop/terminal/v1;terminalv1";

// Interactive terminals running the login shell of the session's user, with
// its groups, home directory and shell, never as another account (RFC 4254
// §6.2 "pty-req" with §6.5 "shell"; viewers cannot choose the command). A
// terminal belongs to the session and outlives the connections that show it:
// its output is one byte stream numbered from 0, of which the session keeps
// the last 1 to 4 MiB, so that a viewer that attaches again continues where
// it left off. Client input is never replayed.
//
// Channel types:
//   - "leaflow.virtualdesktop.terminal.v1", lane "interactive": opened by the
//     viewer, one per terminal it shows. The viewer sends ClientMessage,
//     starting with TerminalOpen or TerminalAttach; the session answers
//     TerminalAttached, or an error and closes the channel, then sends the
//     output from that offset on. Closing the channel only detaches; the
//     terminal keeps running. When the shell exits the session sends
//     TerminalExit and closes the channel.
//   - "leaflow.virtualdesktop.terminal.v1.TerminalService", lane
//     "interactive": opened by the viewer to list and close terminals.
//
// Bytes. Input and output are raw bytes: keys, committed text, pastes,
// terminal mouse reports and answers to terminal queries go in, in one
// ordered stream; the viewer's preedit text does not. Neither side buffers
// lines, strips control or escape sequences, translates newlines or
// re-encodes; message boundaries may split characters and escape sequences.
//
// Pacing. Several viewers may attach to one terminal and all may type. The
// session stops reading the terminal only while every attached viewer is out
// of channel credit, so the shell runs at the pace of the fastest; a viewer
// that falls behind by more than half the kept output is detached with
// CANCELLED and attaches again. While nobody is attached the session keeps
// reading into the kept output.
//
// Needs TerminalPolicy; read-only viewers open neither channel.

// A message from the viewer on the terminal channel.
message ClientMessage {
  // The message.
  oneof message {
    // Starts a new terminal. The first message, or TerminalAttach.
    TerminalOpen open = 1;
    // Shows a terminal of the session. The first message, or TerminalOpen.
    TerminalAttach attach = 2;
    // Input for the terminal.
    TerminalInput input = 3;
    // The viewer's terminal changed size. The latest size of any viewer
    // applies, and the shell gets SIGWINCH.
    TerminalSize resize = 4;
  }
}

// A message from the session on the terminal channel.
message ServerMessage {
  // The message.
  oneof message {
    // The terminal the channel shows. The first message.
    TerminalAttached attached = 1;
    // Output of the terminal, continuing the stream.
    TerminalOutput output = 2;
    // Another viewer changed the size.
    TerminalSize resize = 3;
    // The shell ended. The last message.
    TerminalExit exit = 4;
    // The terminal could not be opened or attached: RESOURCE_EXHAUSTED when
    // no pseudo-terminal is left or there are too many, NOT_FOUND for a
    // terminal that is gone, PERMISSION_DENIED without TerminalPolicy, or
    // INTERNAL when the shell could not start. The only message.
    google.rpc.Status error = 5;
  }
}

// Starts a new terminal.
message TerminalOpen {
  // The TERM environment variable. Empty: "xterm-256color".
  string term = 1;
  // The size.
  TerminalSize size = 2;
  // Terminal modes encoded as in RFC 4254 §8: opcode and argument pairs
  // ending with TTY_OP_END. Empty: the session's defaults. Unsupported
  // opcodes are ignored.
  bytes modes = 3;
}

// Shows a terminal of the session.
message TerminalAttach {
  // The terminal.
  uint64 terminal_id = 1;
  // The output offset the viewer has applied up to. 0: nothing yet.
  uint64 offset = 2;
}

// The terminal the channel shows.
message TerminalAttached {
  // The terminal, chosen by the session, never 0 and never reused in the
  // session.
  uint64 terminal_id = 1;
  // The offset of the first output that follows: the requested one when it
  // is still kept, otherwise the current end, and nothing is replayed.
  uint64 offset = 2;
  // The requested offset is no longer kept. The viewer resets its terminal
  // (ECMA-48 RIS) before applying what follows, and the session makes the
  // program redraw by changing the size and back (SIGWINCH).
  bool reset = 3;
  // The size the terminal has now.
  TerminalSize size = 4;
}

// Input for the terminal.
message TerminalInput {
  // The bytes, at most 64 KiB.
  bytes data = 1;
}

// Output of the terminal.
message TerminalOutput {
  // The bytes, at most 64 KiB.
  bytes data = 1;
}

// The size of a terminal (RFC 4254 §6.7 "window-change"; struct winsize).
message TerminalSize {
  // Columns, 1 to 65535.
  uint32 columns = 1;
  // Rows, 1 to 65535.
  uint32 rows = 2;
  // The width of the text area in pixels. 0 when unknown.
  uint32 width_px = 3;
  // The height of the text area in pixels. 0 when unknown.
  uint32 height_px = 4;
}

// How the shell ended (RFC 4254 §6.10).
message TerminalExit {
  // How it ended. Unset when the terminal ended without its shell exiting.
  oneof status {
    // It exited with this code, 0 to 255 ("exit-status").
    uint32 exit_code = 1;
    // A signal ended it, named without "SIG", such as "TERM" or "HUP", or
    // in the form "name@domain" ("exit-signal").
    string signal_name = 2;
  }
  // The signal dumped core.
  bool core_dumped = 3;
}

// Lists and ends terminals. Needs TerminalPolicy.
service TerminalService {
  // Lists the terminals of the session, oldest first: the running ones, and
  // ended ones whose last output the session still keeps for a while so that
  // a viewer can read it.
  rpc ListTerminals(ListTerminalsRequest) returns (ListTerminalsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Hangs up a terminal, as when its person closes it: the session closes
  // the pseudo-terminal, the shell gets SIGHUP, and every channel showing it
  // ends with TerminalExit once the shell exited. An unknown terminal fails
  // with NOT_FOUND.
  rpc CloseTerminal(CloseTerminalRequest) returns (CloseTerminalResponse);
}

// A terminal of the session.
message Terminal {
  // The terminal.
  uint64 terminal_id = 1;
  // Its size.
  TerminalSize size = 2;
  // When it started.
  google.protobuf.Timestamp created_at = 3;
  // The viewers showing it now, across all connections.
  uint32 viewer_count = 4;
  // The offset its output has reached.
  uint64 offset = 5;
  // How it ended. Unset while it runs.
  TerminalExit exit = 6;
}

// The request of ListTerminals.
message ListTerminalsRequest {}

// The response of ListTerminals.
message ListTerminalsResponse {
  // The terminals, oldest first.
  repeated Terminal terminals = 1;
}

// The request of CloseTerminal.
message CloseTerminalRequest {
  // The terminal.
  uint64 terminal_id = 1;
}

// The response of CloseTerminal.
message CloseTerminalResponse {}

// Allows a viewer to use terminals. Carried in the viewer's signed
// authorization.
message TerminalPolicy {}
