syntax = "proto3";

package leaflow.virtualdesktop.input.v1;

import "google/rpc/status.proto";
import "leaflow/virtualdesktop/display/v1/display.proto";

option go_package = "github.com/leaflowapis/leaflow-go/leaflow/virtualdesktop/input/v1;inputv1";

// Keyboard, pointer and text input.
//
// Channel types:
//   - "leaflow.virtualdesktop.input.v1", lane "input": opened by the viewer,
//     one per connection. It carries the input of a person and the state of
//     the focused text field. PointerMotion travels as a Datagram of this
//     channel.
//   - "leaflow.virtualdesktop.input.v1.InputService", lane "input": opened by
//     an automation client to inject input and learn where it went.
//
// The session ignores input from read-only viewers. All input goes through
// the input lease of the session channel: the viewer holding it is served,
// and input from others is refused until the lease ends.
//
// Order. Every message of the viewer on the input channel carries input_seq
// from one counter of the connection, starting at 1. Everything but
// PointerMotion travels in order on the channel; PointerMotion travels as a
// datagram and may overtake or trail it. The session therefore drops a
// motion whose input_seq is below the highest it has applied, and a motion
// whose after_input_seq names input it has not applied yet. After sending
// other input the viewer sends one motion with the current position in the
// next animation frame, so that hover effects catch up.
//
// Driver. A press of a key or button, a wheel turn or inserted text from a
// viewer that has a viewport makes it the driver (see the window channel).
// Releases belong to the press they end and never change the driver; neither
// does pointer motion.
//
// Coordinates. A pointer position is a window and a point relative to it, so
// that the viewer may lay windows out differently from the session. In a
// desktop session the window is the one carrying the whole canvas. Points
// may lie outside the window during a pointer grab.
//
// Clipboard before paste. The clipboard travels on its own channel, so a
// paste could overtake its content. KeyEvent and PointerButton therefore name
// the clipboard content they need, and the session holds them until the
// session owns the selection with that content. Later input waits behind
// them in order. When it fails, is replaced or takes more than 2 seconds the
// dependent input is dropped with InputError and older content is never
// pasted; releases of keys and buttons pressed before are still applied.
//
// Text input. The viewer's own input method composes text, as its person
// knows it, and the session hands the result to the native input context of
// the focused editor in the session (IBus or another input method
// framework). The session reports the focused editor with TextInputState.
// Plain text goes as InsertText. A composition in progress goes as
// Composition messages, so that the application shows the preedit text, and
// the real keys the input method consumes while composing go along as its
// KEY phases. An editor is identified by window_id, input_context_id and
// focus_serial; text bound to an editor that has since changed is cancelled,
// never redirected to another one.
//
// Keys. A KeyEvent is a physical key the person pressed. Applications and the
// native input method interpret it; missing caret geometry or an uncertain
// text delivery never suppresses it.

// A message from the viewer on the input channel.
message ClientMessage {
  // The message.
  oneof message {
    // A key was pressed or released.
    KeyEvent key_event = 1;
    // The pointer moved. Sent as a Datagram.
    PointerMotion pointer_motion = 2;
    // A pointer button was pressed or released.
    PointerButton pointer_button = 3;
    // The wheel or touchpad scrolled.
    PointerWheel pointer_wheel = 4;
    // Text to insert.
    InsertText insert_text = 5;
    // A step of a composition of the viewer's input method.
    Composition composition = 6;
  }
}

// A message from the session on the input channel.
message ServerMessage {
  // The message.
  oneof message {
    // The focused text field changed.
    TextInputState text_input_state = 1;
    // Key, pointer or wheel input was dropped.
    InputError input_error = 2;
    // Inserted or composed text was dropped.
    TextInputError text_input_error = 3;
  }
}

// A physical key was pressed or released (RFC 6143 KeyEvent). The session
// turns off X auto-repeat; the viewer sends its repeated key presses as
// further presses, and releases every pressed key when it loses focus.
message KeyEvent {
  // The position in the input order.
  uint64 input_seq = 1;
  // A press or a release.
  bool pressed = 2;
  // The X keysym, such as 0x61 for "a" or 0xff0d for Return, or 0x01000000
  // plus the code point for other characters. A release carries the keysym
  // of its press. 0 when unknown; the session then uses code.
  uint32 keysym = 3;
  // The physical key as a W3C UI Events KeyboardEvent code value, such as
  // "KeyA". Empty when unknown.
  string code = 4;
  // The lock keys after the event, so a Caps Lock press carries the new
  // state. The session sets its lock modifiers to match before typing the key,
  // compensating Shift for the letters Caps Lock inverts, and applies a lock
  // key press as state instead of typing it. Unset: every lock is off.
  LockKeyState lock_key_state = 5;
  // The window the viewer shows focused. When another window has the X focus
  // the session activates this one first, because a WindowActivate sent on
  // the window channel may arrive later. 0: the window with the X focus. For
  // a window that is gone, presses are dropped and releases still typed.
  uint64 window_id = 6;
  // The sequence of the latest clipboard content this viewer offered, until
  // the session confirmed it. See "Clipboard before paste".
  optional uint64 clipboard_sequence = 7;
}

// The state of the lock keys (MS-RDPBCGR TS_SYNC_EVENT; W3C UI Events
// getModifierState).
message LockKeyState {
  // Caps Lock is on.
  bool caps_lock = 1;
  // Num Lock is on.
  bool num_lock = 2;
  // Scroll Lock is on.
  bool scroll_lock = 3;
}

// The pointer moved (RFC 6143 PointerEvent; Xpra pointer-motion). Only the
// latest position matters; at most one per animation frame.
message PointerMotion {
  // The position in the input order.
  uint64 input_seq = 1;
  // The window the point is relative to.
  uint64 window_id = 2;
  // The point.
  sint32 x = 3;
  // See x.
  sint32 y = 4;
  // input_seq of the last other input the viewer sent before this motion; 0
  // when none.
  uint64 after_input_seq = 5;
}

// A pointer button was pressed or released. It carries its own position, and
// the session moves the pointer there first, so a lost motion never moves a
// click.
message PointerButton {
  // The position in the input order.
  uint64 input_seq = 1;
  // The window the point is relative to.
  uint64 window_id = 2;
  // The point.
  sint32 x = 3;
  // See x.
  sint32 y = 4;
  // The X button number from 1: 1 left, 2 middle, 3 right, 8 back, 9
  // forward. Scrolling uses PointerWheel.
  uint32 button = 5;
  // A press or a release.
  bool pressed = 6;
  // The sequence of the latest clipboard content this viewer offered, until
  // the session confirmed it. See "Clipboard before paste".
  optional uint64 clipboard_sequence = 7;
}

// The wheel or touchpad scrolled. The viewer adds up the deltas of an
// animation frame into one message; the session turns every 120 units into
// one X button 4 to 7 click and keeps the remainder.
message PointerWheel {
  // The position in the input order.
  uint64 input_seq = 1;
  // The window the point is relative to.
  uint64 window_id = 2;
  // The point.
  sint32 x = 3;
  // See x.
  sint32 y = 4;
  // Horizontal scroll in value120 units (Wayland wl_pointer axis_value120);
  // positive scrolls right.
  sint32 delta_x = 5;
  // Vertical scroll in value120 units; positive scrolls down.
  sint32 delta_y = 6;
}

// The focused editor of the session, as its native input method context
// reports it. Sent when the input channel opens and whenever the focus, the
// caret or the editor changes.
message TextInputState {
  // The window of the focused editor. 0 when no window has focus.
  uint64 window_id = 1;
  // An editable control or a terminal has focus and accepts text, whether
  // or not its caret is known. The viewer keeps a local text field focused
  // while it is set, so that its own input method can start.
  bool enabled = 2;
  // The caret, relative to the window, for placing the input method's
  // candidate window. Unset when the application does not report it
  // reliably; text input still works.
  leaflow.virtualdesktop.display.v1.Rectangle cursor_rectangle = 3;
  // Window.resize_counter the rectangles belong to. The viewer does not apply
  // rectangles of an earlier window size.
  uint64 resize_counter = 4;
  // Where cursor_rectangle came from. UNSPECIFIED when it is unset.
  CursorSource cursor_source = 5;
  // Identifies the focused editor within the session, opaque. Different
  // editors of one window differ; moving the caret or resizing does not change
  // it. Empty when nothing editable has focus or it cannot be verified.
  string input_context_id = 6;
  // Grows whenever editing focus moves, is lost or comes back; not when the
  // caret moves. Compositions and composed text are bound to it.
  uint64 focus_serial = 7;
  // The bounds of the focused control, relative to the window (AT-SPI2
  // Component.GetExtents; EditContext controlBounds). The viewer may anchor
  // its candidate window there when cursor_rectangle is unset; it never
  // treats it as the caret.
  leaflow.virtualdesktop.display.v1.Rectangle control_rectangle = 8;
  // The editor's native input context takes Composition messages: preedit
  // text and the real keys consumed while composing. Otherwise the viewer
  // sends only InsertText.
  bool composition_supported = 9;
}

// Where a caret rectangle came from.
enum CursorSource {
  CURSOR_SOURCE_UNSPECIFIED = 0;
  // The native input context reported it, such as by IBus
  // SetCursorLocation.
  CURSOR_SOURCE_INPUT_CONTEXT = 1;
  // An empty accessibility text range at the insertion point.
  CURSOR_SOURCE_TEXT_RANGE = 2;
  // The bounds of the character boundary at the accessibility caret offset.
  // The extent of the preceding character never stands in for it.
  CURSOR_SOURCE_CHARACTER_BOUNDARY = 3;
}

// Text to insert (W3C Input Events inputType).
message InsertText {
  // The position in the input order.
  uint64 input_seq = 1;
  // The text, UTF-8. Not empty.
  string text = 2;
  // The window of the editor, from TextInputState. A window that is gone or
  // no longer focused cancels the insertion; it is never activated for it.
  uint64 window_id = 3;
  // TextInputState.input_context_id of the editor.
  string input_context_id = 4;
  // TextInputState.focus_serial when the composition began. Checked for
  // INSERT_FROM_COMPOSITION only.
  uint64 focus_serial = 5;
  // What the insertion is.
  InputType input_type = 6;
}

// What an insertion is (W3C Input Events inputType).
enum InputType {
  INPUT_TYPE_UNSPECIFIED = 0;
  // Ordinary text ("insertText"), such as from a virtual keyboard. It goes to
  // the editor focused once the input before it has been applied.
  INPUT_TYPE_INSERT_TEXT = 1;
  // The result of a composition ("insertFromComposition"). It goes only to
  // the editor the composition began in, and is cancelled when that editor
  // lost focus since.
  INPUT_TYPE_INSERT_FROM_COMPOSITION = 2;
}

// A step of a composition of the viewer's input method (W3C UI Events
// CompositionEvent; EditContext). Sent only while
// TextInputState.composition_supported is set.
message Composition {
  // The position in the input order.
  uint64 input_seq = 1;
  // The window of the editor.
  uint64 window_id = 2;
  // TextInputState.input_context_id of the editor.
  string input_context_id = 3;
  // TextInputState.focus_serial when the composition began.
  uint64 focus_serial = 4;
  // Window.resize_counter when the composition began.
  uint64 resize_counter = 5;
  // Chosen by the viewer at BEGIN, unique on the connection; the later
  // phases repeat it.
  uint64 composition_id = 6;
  // The step.
  CompositionPhase phase = 7;
  // UPDATE and COMMIT: the preedit or committed text, UTF-8, at most 64 KiB.
  // May be empty to end an empty composition. Empty for the other phases.
  string text = 8;
  // UPDATE and COMMIT: the start of the preedit selection, in UTF-16 code
  // units as EditContext counts them, on a code point boundary. 0 for the
  // other phases.
  uint32 selection_start = 9;
  // The end of the preedit selection, not before selection_start.
  uint32 selection_end = 10;
  // KEY only: the key.
  CompositionKey key = 11;
}

// A step of a composition.
enum CompositionPhase {
  COMPOSITION_PHASE_UNSPECIFIED = 0;
  // A composition begins ("compositionstart").
  COMPOSITION_PHASE_BEGIN = 1;
  // The preedit text changed ("compositionupdate").
  COMPOSITION_PHASE_UPDATE = 2;
  // A real key the input method consumed while composing. The session hands
  // it to the editor's native input context and waits until that context
  // consumed it.
  COMPOSITION_PHASE_KEY = 3;
  // The composition ended with text ("compositionend").
  COMPOSITION_PHASE_COMMIT = 4;
  // The composition was abandoned.
  COMPOSITION_PHASE_CANCEL = 5;
}

// A real key consumed while composing. Never made up from text.
message CompositionKey {
  // A press or a release.
  bool pressed = 1;
  // The W3C UI Events KeyboardEvent code value of the actual event, at most
  // 64 bytes. A key without a code is not sent.
  string code = 2;
  // The lock keys, as in KeyEvent.
  LockKeyState lock_key_state = 3;
}

// The session dropped a KeyEvent, PointerButton or PointerWheel. Its
// google.rpc.ErrorInfo reason is one of:
//   CLIPBOARD_INPUT_DEPENDENCY_FAILED  the clipboard content it named was not
//                                      in place in time;
//   INPUT_LEASE_HELD                   another viewer holds the input lease.
message InputError {
  // input_seq of the dropped input.
  uint64 input_seq = 1;
  // Its window.
  uint64 window_id = 2;
  // Why.
  google.rpc.Status error = 3;
}

// The session dropped an InsertText or a Composition. Its
// google.rpc.ErrorInfo reason is one of:
//   TEXT_INPUT_CONTEXT_CHANGED    the editor of the text changed;
//   TEXT_INPUT_NOT_DELIVERED      the text could not be handed over;
//   TEXT_INPUT_UNCONFIRMED        the application did not confirm the text
//                                 (see paused);
//   NATIVE_COMPOSITION_CANCELLED  the native input context ended the
//                                 composition;
//   INPUT_LEASE_HELD              another viewer holds the input lease.
message TextInputError {
  // input_seq of the dropped input.
  uint64 input_seq = 1;
  // Its window.
  uint64 window_id = 2;
  // The editor it was bound to, as when it was sent.
  string input_context_id = 3;
  // Its focus_serial, as when it was sent.
  uint64 focus_serial = 4;
  // The composition cancelled with it. 0: none. The viewer ends only this
  // composition; new ones may begin in the same editor.
  uint64 composition_id = 5;
  // Text input of this viewer is paused: the session dropped text whose
  // delivery the application did not confirm, without replaying it. Pointer,
  // key and window input go on. Text is accepted again once a TextInputState
  // names an editor with a larger focus_serial.
  bool paused = 6;
  // Why.
  google.rpc.Status error = 7;
}

// Input for automation clients, after the Chrome DevTools Protocol Input
// domain. A call returns once the input was injected; whether it had the
// intended effect is for the caller to observe. Calls that inject input fail
// with FAILED_PRECONDITION and reason INPUT_LEASE_HELD while another viewer
// holds the input lease, and with PERMISSION_DENIED for a read-only viewer.
service InputService {
  // Presses, releases or moves the pointer, or scrolls.
  rpc DispatchPointerEvent(DispatchPointerEventRequest) returns (DispatchPointerEventResponse);
  // Presses or releases a key.
  rpc DispatchKeyEvent(DispatchKeyEventRequest) returns (DispatchKeyEventResponse);
  // Inserts text into the focused text field without typing keys.
  rpc InsertText(InsertTextRequest) returns (InsertTextResponse);
  // Returns where the pointer is (X11 QueryPointer).
  rpc GetPointerPosition(GetPointerPositionRequest) returns (GetPointerPositionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// What a pointer event does.
enum PointerEventType {
  POINTER_EVENT_TYPE_UNSPECIFIED = 0;
  // A button goes down.
  POINTER_EVENT_TYPE_PRESSED = 1;
  // A button goes up.
  POINTER_EVENT_TYPE_RELEASED = 2;
  // The pointer moves.
  POINTER_EVENT_TYPE_MOVED = 3;
  // The wheel turns.
  POINTER_EVENT_TYPE_WHEEL = 4;
}

// The request of DispatchPointerEvent.
message DispatchPointerEventRequest {
  // What the event does.
  PointerEventType type = 1;
  // Where. The pointer moves there first.
  sint32 x = 2;
  // See x.
  sint32 y = 3;
  // PRESSED and RELEASED: the X button number, as in PointerButton.
  uint32 button = 4;
  // WHEEL: the horizontal scroll in value120 units.
  sint32 delta_x = 5;
  // WHEEL: the vertical scroll in value120 units.
  sint32 delta_y = 6;
  // The window x and y are relative to. 0: they are canvas coordinates. Fails
  // with NOT_FOUND and reason WINDOW_GONE when the window no longer exists,
  // before anything is injected.
  uint64 window_id = 7;
}

// The response of DispatchPointerEvent.
message DispatchPointerEventResponse {
  // The window under the point that received the event. 0: none.
  uint64 window_id = 1;
  // The session revision at which the event was injected.
  uint64 revision = 2;
}

// What a key event does.
enum KeyEventType {
  KEY_EVENT_TYPE_UNSPECIFIED = 0;
  // The key goes down.
  KEY_EVENT_TYPE_DOWN = 1;
  // The key goes up.
  KEY_EVENT_TYPE_UP = 2;
}

// The request of DispatchKeyEvent.
message DispatchKeyEventRequest {
  // Down or up.
  KeyEventType type = 1;
  // The X keysym, as in KeyEvent.
  uint32 keysym = 2;
  // The W3C UI Events code value, as in KeyEvent. Used when keysym is 0.
  string code = 3;
}

// The response of DispatchKeyEvent.
message DispatchKeyEventResponse {
  // The window with the X focus that received the key. 0: none.
  uint64 window_id = 1;
  // The session revision at which the key was injected.
  uint64 revision = 2;
}

// The request of InsertText.
message InsertTextRequest {
  // The text. Not empty.
  string text = 1;
}

// The response of InsertText.
message InsertTextResponse {
  // The window of the text field that received it.
  uint64 window_id = 1;
  // The session revision at which the text was inserted.
  uint64 revision = 2;
}

// The request of GetPointerPosition.
message GetPointerPositionRequest {}

// The response of GetPointerPosition.
message GetPointerPositionResponse {
  // The pointer, in canvas coordinates.
  sint32 x = 1;
  // See x.
  sint32 y = 2;
  // The window under the pointer. 0: none.
  uint64 window_id = 3;
}
