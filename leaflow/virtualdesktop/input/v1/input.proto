syntax = "proto3";

package leaflow.virtualdesktop.input.v1;

import "google/rpc/status.proto";
import "leaflow/virtualdesktop/display/v1/display.proto";

option go_package = "github.com/leaflowapis/leaflow-go/leaflow/virtualdesktop/input/v1;inputv1";

// Keyboard, pointer and text input.
//
// Channel types:
//   - "leaflow.virtualdesktop.input.v1", lane "input": opened by the viewer,
//     one per connection. It carries the input of a person and the state of
//     the focused text field. PointerMotion travels as a Datagram of this
//     channel.
//   - "leaflow.virtualdesktop.input.v1.InputService", lane "input": opened by
//     an automation client to inject input and learn where it went.
//
// The session ignores input from read-only viewers. All input goes through
// the input lease of the session channel: the viewer holding it is served,
// and input from others is refused until the lease ends.
//
// Order. Every message of the viewer on the input channel carries input_seq
// from one counter of the connection, starting at 1. Everything but
// PointerMotion travels in order on the channel; PointerMotion travels as a
// datagram and may overtake or trail it. The session therefore drops a
// motion whose input_seq is below the highest it has applied, and a motion
// whose after_input_seq names input it has not applied yet. After sending
// other input the viewer sends one motion with the current position in the
// next animation frame, so that hover effects catch up.
//
// Coordinates. A pointer position is a window and a point relative to it, so
// that the viewer may lay windows out differently from the session. In a
// desktop session the window is the one carrying the whole canvas. Points
// may lie outside the window during a pointer grab.
//
// Clipboard before paste. The clipboard travels on its own channel, so a
// paste could overtake its content. KeyEvent and PointerButton therefore name
// the clipboard content they need, and the session holds them until that
// content is in place. When it fails or takes more than 2 seconds the input
// is dropped with InputError; older content is never pasted.
//
// Text input. The session reports the focused text field of the applications
// (as Wayland text-input-v3 reports it to an input method) and the viewer,
// acting as the input method, answers with preedit and committed text (as
// Wayland input-method-v2 does).

// A message from the viewer on the input channel.
message ClientMessage {
  // The message.
  oneof message {
    // A key was pressed or released.
    KeyEvent key_event = 1;
    // The pointer moved. Sent as a Datagram.
    PointerMotion pointer_motion = 2;
    // A pointer button was pressed or released.
    PointerButton pointer_button = 3;
    // The wheel or touchpad scrolled.
    PointerWheel pointer_wheel = 4;
    // Preedit and committed text of the viewer's input method.
    TextInputCommit text_input_commit = 5;
  }
}

// A message from the session on the input channel.
message ServerMessage {
  // The message.
  oneof message {
    // The focused text field changed.
    TextInputState text_input_state = 1;
    // Input was dropped.
    InputError input_error = 2;
  }
}

// A key was pressed or released (RFC 6143 KeyEvent). The session turns off X
// auto-repeat; the viewer sends its repeated key presses as further presses,
// and releases every pressed key when it loses focus.
message KeyEvent {
  // The position in the input order.
  uint64 input_seq = 1;
  // A press or a release.
  bool pressed = 2;
  // The X keysym, such as 0x61 for "a" or 0xff0d for Return, or 0x01000000
  // plus the code point for other characters. A release carries the keysym
  // of its press. 0 when unknown; the session then uses code.
  uint32 keysym = 3;
  // The physical key as a W3C UI Events KeyboardEvent code value, such as
  // "KeyA". Empty when unknown.
  string code = 4;
  // The lock keys after the event, so a Caps Lock press carries the new
  // state. The session sets its lock keys to match before typing the key and
  // never types a lock key itself. Unset: every lock is off.
  LockKeyState lock_key_state = 5;
  // The window the viewer shows focused. When another window has the X focus
  // the session activates this one first, because a WindowActivate sent on
  // the window channel may arrive later. 0: the window with the X focus. For
  // a window that is gone, presses are dropped and releases still typed.
  uint64 window_id = 6;
  // The sequence of the latest clipboard content this viewer offered, until
  // the session confirmed it. See "Clipboard before paste".
  optional uint64 clipboard_sequence = 7;
}

// The state of the lock keys (MS-RDPBCGR TS_SYNC_EVENT; W3C UI Events
// getModifierState).
message LockKeyState {
  // Caps Lock is on.
  bool caps_lock = 1;
  // Num Lock is on.
  bool num_lock = 2;
  // Scroll Lock is on.
  bool scroll_lock = 3;
}

// The pointer moved (RFC 6143 PointerEvent; Xpra pointer-motion). Only the
// latest position matters; at most one per animation frame.
message PointerMotion {
  // The position in the input order.
  uint64 input_seq = 1;
  // The window the point is relative to.
  uint64 window_id = 2;
  // The point.
  sint32 x = 3;
  // See x.
  sint32 y = 4;
  // input_seq of the last other input the viewer sent before this motion; 0
  // when none.
  uint64 after_input_seq = 5;
}

// A pointer button was pressed or released. It carries its own position, and
// the session moves the pointer there first, so a lost motion never moves a
// click.
message PointerButton {
  // The position in the input order.
  uint64 input_seq = 1;
  // The window the point is relative to.
  uint64 window_id = 2;
  // The point.
  sint32 x = 3;
  // See x.
  sint32 y = 4;
  // The X button number from 1: 1 left, 2 middle, 3 right, 8 back, 9
  // forward. Scrolling uses PointerWheel.
  uint32 button = 5;
  // A press or a release.
  bool pressed = 6;
  // The sequence of the latest clipboard content this viewer offered, until
  // the session confirmed it. See "Clipboard before paste".
  optional uint64 clipboard_sequence = 7;
}

// The wheel or touchpad scrolled. The viewer adds up the deltas of an
// animation frame into one message; the session turns every 120 units into
// one X button 4 to 7 click and keeps the remainder.
message PointerWheel {
  // The position in the input order.
  uint64 input_seq = 1;
  // The window the point is relative to.
  uint64 window_id = 2;
  // The point.
  sint32 x = 3;
  // See x.
  sint32 y = 4;
  // Horizontal scroll in value120 units (Wayland wl_pointer axis_value120);
  // positive scrolls right.
  sint32 delta_x = 5;
  // Vertical scroll in value120 units; positive scrolls down.
  sint32 delta_y = 6;
}

// The focused text field, as an input method sees it (Wayland text-input-v3).
// Sent when the input channel opens and whenever focus, the caret or the
// field changes.
message TextInputState {
  // Grows by one with every TextInputState of the connection.
  // TextInputCommit names the state it answers.
  uint64 serial = 1;
  // A text field has focus and accepts text. The viewer keeps a local text
  // field focused so that its own input method can start.
  bool enabled = 2;
  // The window of the text field. 0 when none has focus.
  uint64 window_id = 3;
  // The caret, relative to the window, for placing the input method's
  // candidate window. Unset when the application does not report it; text
  // input still works.
  leaflow.virtualdesktop.display.v1.Rectangle cursor_rectangle = 4;
  // Window.resize_counter cursor_rectangle belongs to. The viewer does not
  // place the candidate window with a rectangle of an earlier window size.
  uint64 resize_counter = 5;
  // The application shows preedit text inside the field. Otherwise the
  // viewer shows it at the caret itself.
  bool inline_preedit = 6;
}

// The viewer's input method changed the preedit text, committed text, or
// both, applied at once (Wayland input-method-v2 commit). The session first
// inserts commit_text, then shows preedit. A commit whose serial names a
// field that has since lost focus is dropped with InputError; it never goes
// to another field.
message TextInputCommit {
  // The position in the input order.
  uint64 input_seq = 1;
  // TextInputState.serial this commit answers.
  uint64 serial = 2;
  // Text to insert. Empty: none.
  string commit_text = 3;
  // The preedit text to show now. Unset: no preedit.
  Preedit preedit = 4;
}

// Text an input method is still composing (Wayland input-method-v2
// set_preedit_string).
message Preedit {
  // The text.
  string text = 1;
  // The start of the highlighted part, as a byte offset into text in UTF-8.
  uint32 cursor_begin = 2;
  // Its end. Equal to cursor_begin for a plain caret.
  uint32 cursor_end = 3;
}

// The session dropped input. Its google.rpc.ErrorInfo reason is one of:
//   CLIPBOARD_NOT_READY  the clipboard content it named did not arrive in time;
//   TEXT_FIELD_CHANGED   the text field of the commit lost focus;
//   WINDOW_GONE          its window no longer exists;
//   INPUT_LEASE_HELD     another viewer holds the input lease.
message InputError {
  // input_seq of the dropped input.
  uint64 input_seq = 1;
  // Why.
  google.rpc.Status error = 2;
}

// Input for automation clients, after the Chrome DevTools Protocol Input
// domain. A call returns once the input was injected; whether it had the
// intended effect is for the caller to observe. Calls that inject input fail
// with FAILED_PRECONDITION and reason INPUT_LEASE_HELD while another viewer
// holds the input lease, and with PERMISSION_DENIED for a read-only viewer.
service InputService {
  // Presses, releases or moves the pointer, or scrolls.
  rpc DispatchPointerEvent(DispatchPointerEventRequest) returns (DispatchPointerEventResponse);
  // Presses or releases a key.
  rpc DispatchKeyEvent(DispatchKeyEventRequest) returns (DispatchKeyEventResponse);
  // Inserts text into the focused text field without typing keys.
  rpc InsertText(InsertTextRequest) returns (InsertTextResponse);
  // Returns where the pointer is (X11 QueryPointer).
  rpc GetPointerPosition(GetPointerPositionRequest) returns (GetPointerPositionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// What a pointer event does.
enum PointerEventType {
  POINTER_EVENT_TYPE_UNSPECIFIED = 0;
  // A button goes down.
  POINTER_EVENT_TYPE_PRESSED = 1;
  // A button goes up.
  POINTER_EVENT_TYPE_RELEASED = 2;
  // The pointer moves.
  POINTER_EVENT_TYPE_MOVED = 3;
  // The wheel turns.
  POINTER_EVENT_TYPE_WHEEL = 4;
}

// The request of DispatchPointerEvent.
message DispatchPointerEventRequest {
  // What the event does.
  PointerEventType type = 1;
  // Where. The pointer moves there first.
  sint32 x = 2;
  // See x.
  sint32 y = 3;
  // PRESSED and RELEASED: the X button number, as in PointerButton.
  uint32 button = 4;
  // WHEEL: the horizontal scroll in value120 units.
  sint32 delta_x = 5;
  // WHEEL: the vertical scroll in value120 units.
  sint32 delta_y = 6;
  // The window x and y are relative to. 0: they are canvas coordinates. Fails
  // with NOT_FOUND and reason WINDOW_GONE when the window no longer exists,
  // before anything is injected.
  uint64 window_id = 7;
}

// The response of DispatchPointerEvent.
message DispatchPointerEventResponse {
  // The window under the point that received the event. 0: none.
  uint64 window_id = 1;
  // The session revision at which the event was injected.
  uint64 revision = 2;
}

// What a key event does.
enum KeyEventType {
  KEY_EVENT_TYPE_UNSPECIFIED = 0;
  // The key goes down.
  KEY_EVENT_TYPE_DOWN = 1;
  // The key goes up.
  KEY_EVENT_TYPE_UP = 2;
}

// The request of DispatchKeyEvent.
message DispatchKeyEventRequest {
  // Down or up.
  KeyEventType type = 1;
  // The X keysym, as in KeyEvent.
  uint32 keysym = 2;
  // The W3C UI Events code value, as in KeyEvent. Used when keysym is 0.
  string code = 3;
}

// The response of DispatchKeyEvent.
message DispatchKeyEventResponse {
  // The window with the X focus that received the key. 0: none.
  uint64 window_id = 1;
  // The session revision at which the key was injected.
  uint64 revision = 2;
}

// The request of InsertText.
message InsertTextRequest {
  // The text. Not empty.
  string text = 1;
}

// The response of InsertText.
message InsertTextResponse {
  // The window of the text field that received it.
  uint64 window_id = 1;
  // The session revision at which the text was inserted.
  uint64 revision = 2;
}

// The request of GetPointerPosition.
message GetPointerPositionRequest {}

// The response of GetPointerPosition.
message GetPointerPositionResponse {
  // The pointer, in canvas coordinates.
  sint32 x = 1;
  // See x.
  sint32 y = 2;
  // The window under the pointer. 0: none.
  uint64 window_id = 3;
}
