syntax = "proto3";

package leaflow.virtualdesktop.rpc.v1;

import "google/protobuf/duration.proto";
import "google/rpc/status.proto";

option go_package = "github.com/leaflowapis/leaflow-go/leaflow/virtualdesktop/rpc/v1;rpcv1";

// Calls of protobuf service methods carried inside a VirtualDesktop
// connection instead of over gRPC's own HTTP/2 transport. The request and
// response types are those of the method; this package only frames them.
//
// Two carriers use it:
//   - A channel dedicated to one service. Its protocol name is the full name
//     of the service, such as
//     "leaflow.virtualdesktop.accessibility.v1.AccessibilityService". The
//     endpoint that opened the channel is the client: it sends ClientMessage
//     and receives ServerMessage.
//   - The control connection, where both ends call methods of each other and
//     carry Call, CallResult and CallCancel in their own envelopes.
//
// Each end numbers its own calls. A CallResult or a CallCancel refers to a
// Call that travelled in the opposite direction.
//
// Errors. CallResult.error is a google.rpc.Status. Its details carry a
// google.rpc.ErrorInfo whose domain is "virtualdesktop.leaflow.cloud" and
// whose reason is listed by the package that defines the method. A reason a
// receiver does not know is handled by the canonical code of the status.

// Invokes a method.
message Call {
  // Identifies the call among the calls the sender has made on this carrier;
  // CallResult and CallCancel echo it. A UUID (RFC 9562). It only correlates:
  // resending a Call with the same request_id starts another call, so a
  // method is retried safely only when the method itself is idempotent.
  string request_id = 1;
  // The method, in the form of a gRPC request path: "/" + full service name
  // + "/" + method name, such as
  // "/leaflow.virtualdesktop.capture.v1.CaptureService/CaptureScreen".
  string method = 2;
  // The serialized request message of the method.
  bytes payload = 3;
  // How long the callee may work on the call, counted from receipt. When it
  // passes the result is DEADLINE_EXCEEDED. Unset: the default the method
  // documents.
  google.protobuf.Duration timeout = 4;
}

// The result of a Call. Exactly one CallResult answers every Call, including
// a cancelled one. Calls still outstanding when the carrier closes have no
// result and are never resent.
message CallResult {
  // The request_id of the Call being answered.
  string request_id = 1;
  // Exactly one is set.
  oneof result {
    // The serialized response message of the method.
    bytes payload = 2;
    // Why the call failed.
    google.rpc.Status error = 3;
  }
}

// Asks the callee to stop working on a call. The CallResult still follows:
// CANCELLED when the callee stopped in time, otherwise the result it reached.
message CallCancel {
  // The request_id of the Call to cancel.
  string request_id = 1;
}

// A message from the client of a service channel.
message ClientMessage {
  // The message.
  oneof message {
    // Starts a call.
    Call call = 1;
    // Cancels a call.
    CallCancel call_cancel = 2;
  }
}

// A message from the server of a service channel.
message ServerMessage {
  // The message.
  oneof message {
    // Answers a call.
    CallResult call_result = 1;
  }
}
