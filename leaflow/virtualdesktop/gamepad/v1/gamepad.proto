syntax = "proto3";

package leaflow.virtualdesktop.gamepad.v1;

option go_package = "github.com/leaflowapis/leaflow-go/leaflow/virtualdesktop/gamepad/v1;gamepadv1";

// The viewer's gamepads as input devices of the session. Names follow the W3C
// Gamepad API.
//
// Channel type "leaflow.virtualdesktop.gamepad.v1", lane "input": opened by
// the viewer, one per gamepad it provides and at most four. The viewer sends
// ClientHello; the session creates a virtual device and answers with
// ServerHello, or closes the channel when it cannot. Then the viewer sends
// GamepadState whenever the gamepad changes. Closing the channel releases
// every button, centers the axes and removes the device.

// A message from the viewer.
message ClientMessage {
  // The message.
  oneof message {
    // The gamepad. The first message of the channel.
    ClientHello client_hello = 1;
    // The gamepad's state now.
    GamepadState state = 2;
  }
}

// A message from the session.
message ServerMessage {
  // The message.
  oneof message {
    // The virtual device exists.
    ServerHello server_hello = 1;
  }
}

// The gamepad the viewer provides.
message ClientHello {
  // Its name (Gamepad.id). Plain text, at most 256 bytes.
  string name = 1;
  // Its USB vendor ID. Unset when unknown.
  optional uint32 vendor_id = 2;
  // Its USB product ID. Unset when unknown.
  optional uint32 product_id = 3;
  // How its buttons and axes are laid out.
  GamepadMapping mapping = 4;
  // The number of buttons, at most 64.
  uint32 button_count = 5;
  // The resting value of each axis, at most 32 axes, each from -1 to 1.
  repeated float neutral_axes = 6;
}

// How a gamepad's buttons and axes are laid out (Gamepad.mapping).
enum GamepadMapping {
  GAMEPAD_MAPPING_UNSPECIFIED = 0;
  // The W3C standard gamepad layout ("standard").
  GAMEPAD_MAPPING_STANDARD = 1;
  // The device's own order ("").
  GAMEPAD_MAPPING_RAW = 2;
}

// The virtual device exists.
message ServerHello {}

// The full state of a gamepad. The viewer sends every button change; it may
// merge changes of axes only. The session applies states in order.
message GamepadState {
  // When the viewer read it, in microseconds on its own clock
  // (Gamepad.timestamp).
  int64 timestamp_us = 1;
  // The axes, each from -1 to 1, as many as ClientHello.neutral_axes.
  repeated float axes = 2;
  // The buttons, ClientHello.button_count of them.
  repeated GamepadButton buttons = 3;
}

// The state of a button (GamepadButton).
message GamepadButton {
  // It is pressed.
  bool pressed = 1;
  // It is touched, where the device can tell.
  bool touched = 2;
  // How far it is pressed, from 0 to 1.
  float value = 3;
}
