syntax = "proto3";

package leaflow.virtualdesktop.machine.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "leaflow/virtualdesktop/display/v1/display.proto";

option go_package = "github.com/leaflowapis/leaflow-go/virtualdesktop/machine/v1;machinev1";

// Machines that run the Agent, their sessions and the directory they serve:
// enrollment, what a machine reports, the sessions the service asks the
// Agent's daemon to open, and the accounts and groups of the platform users
// who may reach the machine. Every call travels on the daemon's control
// connection (leaflow.virtualdesktop.control.v1) and fails there with the
// reasons of each method in a google.rpc.ErrorInfo.
//
// Enrollment. A new daemon generates its machine key and connects with an
// enrollment credential. EnrollMachine registers the key and answers PENDING
// with a pairing code the daemon shows; the person who adds the machine finds
// the request by that code and approves or denies it. The daemon calls again
// after retry_after until a decision. On APPROVED it stores machine_id and
// connects with its machine credential from then on; on DENIED it stops.
// Nothing but an approval makes a machine usable, so installers carry no
// secret.
//
// Reconciliation. The daemon reports the whole machine with
// ReportMachineStatus after every connect and whenever its list of sessions
// or the state of its directory changes, and each change of a session with ReportSessionState.
// The full report is authoritative: a session the service holds open on the
// machine but missing from it has ended, and a changed boot_id means every
// earlier session ended. Nothing is replayed after a reconnect.
//
// Directory. Every platform user has one account, with the same name and uid
// on every machine of every project (after Google Cloud OS Login), and each
// project has its groups; the service allocates their ids. The service sends
// each machine its copy with SetDirectory: the accounts of the project's
// members and the project's groups, with for every account whether it may
// log in to this machine, whether it may become root through sudo and the SSH
// keys it logs in with. The daemon answers
// name service (NSS) lookups and PAM from that copy, and asks
// GetAccountAccess when an account logs in or elevates, so that withdrawn
// access ends at once; while the service is unreachable it decides from its
// copy. Directory accounts and groups never appear in /etc/passwd or
// /etc/group, and the local accounts and groups of the machine are left as
// they are. A person on a viewer approves elevation through sudo
// (leaflow.virtualdesktop.privilege.v1); no password is asked.
//
// Trust. The service accepts reports and calls only about the machine's own
// objects, and closes a connection that reports otherwise with
// POLICY_VIOLATION.

// Manages the sessions and the directory copy of a machine. Served by the
// daemon on its control connection; the service calls it.
service MachineService {
  // Opens a session for a platform user, as the user's directory account,
  // and returns once it is ready: its X server runs and its session process
  // started. An account has at most one session. Calling again with the session_id of an open session of the
  // same user returns that session.
  //
  // Fails with:
  //   - NOT_FOUND and reason USER_NOT_FOUND for an account the directory
  //     copy does not hold;
  //   - PERMISSION_DENIED and reason USER_NOT_ALLOWED for an account that
  //     may not log in to the machine (AccountAccess), one the machine does
  //     not serve (see SetDirectory) or one outside the groups the machine
  //     allows sessions;
  //   - PERMISSION_DENIED and reason ACCOUNT_EXPIRED when PAM reports the
  //     account expired (PAM_ACCT_EXPIRED);
  //   - PERMISSION_DENIED and reason PAM_PERMISSION_DENIED when PAM refuses
  //     the account or the session (PAM_PERM_DENIED), with metadata
  //     "pamMessage", the text PAM gave;
  //   - ALREADY_EXISTS and reason USER_HAS_SESSION when the user has a
  //     session with another id, with metadata "sessionId";
  //   - ALREADY_EXISTS and reason SESSION_ID_CONFLICT when another user's
  //     session has the id;
  //   - FAILED_PRECONDITION and reason SESSION_CONFLICT when the user has a
  //     graphical session the Agent did not open (logind);
  //   - RESOURCE_EXHAUSTED and reason DISPLAY_UNAVAILABLE when no X display
  //     number was free after 3 attempts;
  //   - INTERNAL and reason SESSION_START_FAILED when the X server or the
  //     session process failed to start; what had started was undone.
  rpc OpenSession(OpenSessionRequest) returns (OpenSessionResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Ends a session in order: its applications get SIGTERM and grace_period
  // to exit, then the session is terminated. Answers once the session is
  // CLOSED, and at once for one already closed.
  //
  // Fails with NOT_FOUND and reason SESSION_NOT_FOUND for a session that
  // never existed on the machine since it booted.
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Ends a session at once, killing every process in it (logind
  // TerminateSession). Answers once the session is CLOSED, and at once for
  // one already closed.
  //
  // Fails with NOT_FOUND and reason SESSION_NOT_FOUND for a session that
  // never existed on the machine since it booted.
  rpc TerminateSession(TerminateSessionRequest) returns (TerminateSessionResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Replaces the machine's copy of the directory. The daemon serves the
  // accounts and groups of the request through NSS and PAM from then on,
  // keeps the copy across restarts and answers from it while the service is
  // unreachable. A request with the revision the daemon holds changes
  // nothing.
  //
  // For each account:
  //   - its name, uid, primary group (its own group of the same name and
  //     id), GECOS name, home directory and shell resolve whatever its
  //     access, so that the files it owns keep their owner;
  //   - PAM admits it only while login_allowed is set; an account that loses
  //     it has its sessions terminated, which end with
  //     SESSION_CLOSE_REASON_ACCESS_REVOKED;
  //   - sshd(8) accepts its ssh_public_keys, through an
  //     AuthorizedKeysCommand, only while login_allowed is set;
  //   - sudo(8) lets it become root only while admin is set as well;
  //   - its home directory is created on its first session, owned by it, and
  //     never deleted.
  // Each group resolves with its members. An account or group missing from
  // the request no longer resolves; its files keep their ids.
  //
  // An account or group whose name or id a local account or group of the
  // machine already uses is not served, so that it can take over no local
  // file or right. So is one with an id outside 65536 to 2147483647 (below
  // are the system's and the local administrator's) or within the
  // subordinate ids of a local user (subuid(5), subgid(5)). The daemon
  // reports each with ReportMachineEvents when it begins.
  //
  // Fails with INVALID_ARGUMENT and reason INVALID_REQUEST, with metadata
  // "field" naming the first offending field, for a directory that breaks a
  // rule of Directory, Account or Group; nothing of it is served then.
  rpc SetDirectory(SetDirectoryRequest) returns (SetDirectoryResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

// Enrolls machines and takes their reports. Served by the service on daemon
// connections.
service MachineRegistryService {
  // Asks to enroll the key of the connection's enrollment credential, or
  // returns the decision on it. Only on a connection with an enrollment
  // credential; calling again with the same key continues the same request.
  //
  // Fails with UNAVAILABLE and reason ENROLLMENT_UNAVAILABLE when the
  // service cannot record the request now; call again with backoff.
  rpc EnrollMachine(EnrollMachineRequest) returns (EnrollMachineResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Reports the whole machine.
  rpc ReportMachineStatus(ReportMachineStatusRequest) returns (ReportMachineStatusResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Reports that a session changed state or its session process stopped or
  // started. Only for a session the service opened or saw in a full report.
  // CLOSED is final: later reports of the session are ignored.
  rpc ReportSessionState(ReportSessionStateRequest) returns (ReportSessionStateResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Records events the people who manage the machine should see, such as a
  // directory account the daemon does not serve. The daemon reports a
  // condition when it begins, not again while it lasts, and never reports
  // what happens inside sessions. An event whose event_id the service has
  // recorded is recorded once, so that a call can be repeated after its
  // answer was lost. The service ignores types it does not know and keeps
  // events for a limited time.
  //
  // Fails with RESOURCE_EXHAUSTED and reason MACHINE_EVENTS_LIMITED when the
  // machine reports more than the service accepts now; report them again
  // later.
  rpc ReportMachineEvents(ReportMachineEventsRequest) returns (ReportMachineEventsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

// Answers the daemon's questions about the directory. Served by the service
// on daemon connections.
service DirectoryService {
  // Returns what an account may do on the calling machine now, from the
  // platform's current permissions. The daemon asks when the account logs in
  // and when it asks to become root, and updates its copy with the answer.
  //
  // Fails with NOT_FOUND and reason ACCOUNT_NOT_FOUND for a name that is not
  // an account of the machine's directory.
  rpc GetAccountAccess(GetAccountAccessRequest) returns (GetAccountAccessResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// A desktop session on a machine.
message Session {
  // Chosen by the service: 1 to 40 characters of [a-z0-9-], such as a UUID.
  // The machine names files and sockets after it.
  string session_id = 1;
  // The platform user who owns the session, which logind records as its
  // RemoteUser.
  string user_id = 2;
  // The Linux user (PAM_USER).
  string username = 3;
  // The Linux user's id.
  uint32 uid = 4;
  // The X display, such as ":10" (X(7)).
  string display = 5;
  // How the session shows its windows.
  leaflow.virtualdesktop.display.v1.SessionMode mode = 6;
  // Where it is in its life.
  SessionState state = 7;
  // The logind session (XDG_SESSION_ID).
  string xdg_session_id = 8;
  // When it was opened.
  google.protobuf.Timestamp created_at = 9;
  // The last input of a person in the session. Informational.
  google.protobuf.Timestamp last_input_at = 10;
  // The session process runs. False while it restarts.
  bool session_process_running = 11;
  // Why the session ended. CLOSED only.
  SessionCloseReason close_reason = 12;
  // Plain text for logs about close_reason, at most 1024 bytes.
  string reason_phrase = 13;
}

// Where a session is in its life. ONLINE, ACTIVE and CLOSING are the logind
// session states (org.freedesktop.login1 Session.State).
enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  // The PAM session opens, and the X server and the session process start.
  SESSION_STATE_OPENING = 1;
  // Logged in but not in the foreground.
  SESSION_STATE_ONLINE = 2;
  // Logged in and active: a running session.
  SESSION_STATE_ACTIVE = 3;
  // Logged out; its processes are being cleaned up.
  SESSION_STATE_CLOSING = 4;
  // Gone.
  SESSION_STATE_CLOSED = 5;
}

// Why a session ended.
enum SessionCloseReason {
  SESSION_CLOSE_REASON_UNSPECIFIED = 0;
  // CloseSession was called.
  SESSION_CLOSE_REASON_CLOSE_REQUESTED = 1;
  // TerminateSession was called.
  SESSION_CLOSE_REASON_TERMINATE_REQUESTED = 2;
  // The user logged out.
  SESSION_CLOSE_REASON_LOGOUT = 3;
  // SessionPolicy.disconnected_timeout passed.
  SESSION_CLOSE_REASON_DISCONNECTED_TIMEOUT = 4;
  // SessionPolicy.no_client_timeout passed.
  SESSION_CLOSE_REASON_NO_CLIENT_TIMEOUT = 5;
  // SessionPolicy.max_lifetime passed.
  SESSION_CLOSE_REASON_MAX_LIFETIME = 6;
  // The X server exited unexpectedly.
  SESSION_CLOSE_REASON_DISPLAY_EXIT = 7;
  // The process that held the session died, and the daemon cleaned up what
  // was left.
  SESSION_CLOSE_REASON_HELPER_LOST = 8;
  // Opening failed and was undone.
  SESSION_CLOSE_REASON_OPEN_FAILED = 9;
  // The account may no longer log in to the machine.
  SESSION_CLOSE_REASON_ACCESS_REVOKED = 10;
}

// Timeouts and limits of a session, which the daemon enforces even while the
// service is unreachable. A timeout that is unset or zero is off.
message SessionPolicy {
  // Ends the session this long after its last viewer left (xrdp
  // DisconnectedTimeLimit).
  google.protobuf.Duration disconnected_timeout = 1;
  // Ends the session this long after it opened.
  google.protobuf.Duration max_lifetime = 2;
  // Ends the session when no viewer came this long after it opened.
  google.protobuf.Duration no_client_timeout = 3;
  // Limits on the user's resources.
  ResourceControl resource_control = 4;
}

// Limits on the resources of the user's slice (user-UID.slice), as
// systemd.resource-control(5) properties. 0: not set.
message ResourceControl {
  // MemoryHigh=, in bytes: where throttling starts.
  uint64 memory_high_bytes = 1;
  // MemoryMax=, in bytes: the hard limit.
  uint64 memory_max_bytes = 2;
  // CPUWeight=, 1 to 10000.
  uint32 cpu_weight = 3;
  // CPUQuota=, in percent of one CPU; above 100 on several CPUs.
  uint32 cpu_quota_percent = 4;
  // TasksMax=.
  uint32 tasks_max = 5;
}

// The request of OpenSession.
message OpenSessionRequest {
  // The id of the new session, in the format of Session.session_id.
  string session_id = 1;
  // The platform user who will own it.
  string user_id = 2;
  // The platform user's directory account. The daemon only checks that the
  // account may have a session.
  string username = 3;
  // How the session shows its windows.
  leaflow.virtualdesktop.display.v1.SessionMode mode = 4;
  // The first size of the canvas, normally the viewer's. Unset: the
  // daemon's default.
  leaflow.virtualdesktop.display.v1.Size size = 5;
  // The largest size the canvas may grow to. Unset: the daemon's default.
  leaflow.virtualdesktop.display.v1.Size max_size = 6;
  // SESSION_MODE_DESKTOP only: the desktop environment to start, one of
  // ReportMachineStatusRequest.session_desktops. Empty: the daemon's
  // default.
  string session_desktop = 7;
  // The address of the viewer that asked, for PAM_RHOST and logind's
  // RemoteHost. Empty: the service's host name, so that the session is
  // always remote.
  string remote_host = 8;
  // Timeouts and limits.
  SessionPolicy policy = 9;
}

// The response of OpenSession.
message OpenSessionResponse {
  // The session, ACTIVE.
  Session session = 1;
}

// The request of CloseSession.
message CloseSessionRequest {
  // The session.
  string session_id = 1;
  // How long applications get to exit after SIGTERM. Unset: the daemon's
  // default.
  google.protobuf.Duration grace_period = 2;
}

// The response of CloseSession.
message CloseSessionResponse {}

// The request of TerminateSession.
message TerminateSessionRequest {
  // The session.
  string session_id = 1;
}

// The response of TerminateSession.
message TerminateSessionResponse {}

// The directory of the machine's project, as the machine sees it.
message Directory {
  // Names this content: it changes whenever anything below changes. 1 to
  // 256 bytes without control characters.
  string revision = 1;
  // At most 10000.
  repeated Account accounts = 2;
  // At most 10000.
  repeated Group groups = 3;
}

// A directory account (passwd(5)).
message Account {
  // The login name, as useradd(8) accepts it by default: 1 to 32 characters
  // of [a-z0-9_-], starting with a letter or "_". No other account or group
  // of the directory has it.
  string username = 1;
  // The user id, from 65536 to 2147483647. No other account has it.
  uint32 uid = 2;
  // The primary group id: the account's own group, of the same name and id,
  // so equal to uid.
  uint32 gid = 3;
  // The full name for the GECOS field, plain text of at most 1024 bytes;
  // ':' and ',' show as spaces.
  string display_name = 4;
  // The home directory: an absolute path below /home without ".", ".." or
  // empty components, whitespace or ':', such as "/home/alice". No other
  // account has it.
  string home_directory = 5;
  // The login shell: an absolute path with the same rules, such as
  // "/bin/bash".
  string shell = 6;
  // The platform user of the account.
  string user_id = 7;
  // What the account may do on this machine.
  AccountAccess access = 8;
  // The SSH public keys the account logs in with, each an authorized_keys(5)
  // key without options, such as "ssh-ed25519 AAAAC3Nz...".
  repeated string ssh_public_keys = 9;
}

// What an account may do on one machine.
message AccountAccess {
  // The account may log in and have sessions.
  bool login_allowed = 1;
  // The account may become root through sudo(8).
  bool admin = 2;
}

// A directory group (group(5)).
message Group {
  // The group name, by the rules of Account.username; no account or other
  // group of the directory has it.
  string name = 1;
  // The group id, from 65536 to 2147483647; no other group and no account's
  // own group has it.
  uint32 gid = 2;
  // The usernames of its members, each an account of the directory.
  repeated string members = 3;
}

// The request of SetDirectory.
message SetDirectoryRequest {
  // The machine's whole directory.
  Directory directory = 1;
}

// The response of SetDirectory.
message SetDirectoryResponse {}

// The request of GetAccountAccess.
message GetAccountAccessRequest {
  // The account's login name.
  string username = 1;
}

// The response of GetAccountAccess.
message GetAccountAccessResponse {
  // What the account may do on the calling machine now.
  AccountAccess access = 1;
}

// The request of EnrollMachine.
message EnrollMachineRequest {
  // The host name (uname(2) nodename), the machine's first name.
  string hostname = 1;
}

// The decision on an enrollment.
enum EnrollmentState {
  ENROLLMENT_STATE_UNSPECIFIED = 0;
  // Not decided yet. The daemon shows the pairing code and calls again.
  ENROLLMENT_STATE_PENDING = 1;
  // Approved; machine_id is set.
  ENROLLMENT_STATE_APPROVED = 2;
  // Denied. Final for the key: the daemon stops and says so.
  ENROLLMENT_STATE_DENIED = 3;
}

// The response of EnrollMachine.
message EnrollMachineResponse {
  // The decision so far.
  EnrollmentState state = 1;
  // The machine. APPROVED only. The daemon keeps it with its private key,
  // readable by root only.
  string machine_id = 2;
  // A code that names the request, to show on the machine and to match
  // with the request on the service. Both sides derive it from the public
  // key: Crockford's Base32 of the first 50 bits of the SHA-256 of the ASCII
  // bytes "leaflow.virtualdesktop.machine.v1.EnrollMachineResponse.pairing_code",
  // one zero byte and the key, written "XXXXX-XXXXX". It is not a secret.
  string pairing_code = 3;
  // PENDING only: how long to wait before calling again.
  google.protobuf.Duration retry_after = 4;
}

// The operating system, from /etc/os-release (os-release(5)).
message OsRelease {
  // ID=, such as "debian".
  string id = 1;
  // VERSION_ID=, such as "13".
  string version_id = 2;
  // PRETTY_NAME=, such as "Debian GNU/Linux 13 (trixie)".
  string pretty_name = 3;
}

// The request of ReportMachineStatus.
message ReportMachineStatusRequest {
  // /proc/sys/kernel/random/boot_id, new on every boot.
  string boot_id = 1;
  // The host name (uname(2) nodename).
  string hostname = 2;
  // The operating system.
  OsRelease os_release = 3;
  // The kernel release (uname(2) release), such as "6.12.43+deb13-amd64".
  string kernel_release = 4;
  // The hardware (uname(2) machine), such as "x86_64".
  string architecture = 5;
  // What the machine can do, as dotted names; unknown names are ignored.
  // Such as "x11.xvfb", "x11.xorg-dummy", "audio.pipewire",
  // "audio.pulseaudio", "accessibility.at-spi", "privilege.pam" and
  // "privilege.polkit".
  repeated string capabilities = 6;
  // The desktop environments SESSION_MODE_DESKTOP can start: the
  // DesktopNames of the installed X sessions (XDG_SESSION_DESKTOP). Empty
  // when none is installed.
  repeated string session_desktops = 7;
  // Every session since the machine booted, closed ones included until the
  // service has seen them closed once.
  repeated Session sessions = 9;
  // Directory.revision of the copy the daemon serves. Empty before the
  // first SetDirectory.
  string directory_revision = 11;
}

// The response of ReportMachineStatus.
message ReportMachineStatusResponse {}

// The request of ReportSessionState.
message ReportSessionStateRequest {
  // The session as it is now. Its user_id must be the one the service holds
  // for it.
  Session session = 1;
}

// The response of ReportSessionState.
message ReportSessionStateResponse {}

// The request of ReportMachineEvents.
message ReportMachineEventsRequest {
  // The events, oldest first, at most 100.
  repeated MachineEvent events = 1;
}

// The response of ReportMachineEvents.
message ReportMachineEventsResponse {}

// Something that happened on the machine.
message MachineEvent {
  // Chosen by the daemon, unique on the machine, such as a UUID; at most 64
  // bytes.
  string event_id = 1;
  // What happened.
  MachineEventType type = 2;
  // When it happened, on the machine's clock.
  google.protobuf.Timestamp occurred_at = 3;
  // The values of the event, with the keys its type names. At most 16
  // entries; keys at most 64 bytes, values at most 256 bytes.
  map<string, string> metadata = 4;
}

// What happened on a machine.
enum MachineEventType {
  MACHINE_EVENT_TYPE_UNSPECIFIED = 0;
  // A directory account is not served because a local account uses its name
  // or its uid. Metadata "username", and "conflict": "name" or "uid".
  MACHINE_EVENT_TYPE_DIRECTORY_ACCOUNT_CONFLICT = 1;
  // A directory group is not served because a local group uses its name or
  // its gid. Metadata "groupName", and "conflict": "name" or "gid".
  MACHINE_EVENT_TYPE_DIRECTORY_GROUP_CONFLICT = 2;
}
