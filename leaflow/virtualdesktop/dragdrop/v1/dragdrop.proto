syntax = "proto3";

package leaflow.virtualdesktop.dragdrop.v1;

import "google/rpc/status.proto";
import "leaflow/virtualdesktop/filetransfer/v1/filetransfer.proto";

option go_package = "github.com/leaflowapis/leaflow-go/leaflow/virtualdesktop/dragdrop/v1;dragdropv1";

// Drag and drop between the viewer's own desktop and the session's windows.
// In the session the drags are XDND drags (freedesktop XDND protocol 5); on
// the viewer they are drags of its platform, such as HTML drag and drop.
//
// Channel types:
//   - "leaflow.virtualdesktop.dragdrop.v1", lane "interactive": opened by the
//     viewer, one per connection. It carries the drags in both directions.
//   - "leaflow.virtualdesktop.dragdrop.v1.content", lane "bulk": opened by the
//     side that receives a drop, one per media type it reads. It sends
//     DragDataRequest; the source answers with DragData messages and one
//     DragDataEnd. Flow control is the channel's credit.
//   - "leaflow.virtualdesktop.dragdrop.v1.DragDropService", lane
//     "interactive": opened by an automation client to drop data into a
//     window without a drag of its own.
//
// Into the session. The viewer's drag enters the canvas: the viewer sends
// DragStart, then DragPosition as the pointer moves over session windows, and
// DragLeave or DragDrop. The session drags into the window under the point as
// an XDND source, answers every position it processed with DragStatus, and
// ends the drag with DragFinish once the window has taken the drop or refused
// it. A browser learns the files of a drag only when they are dropped, so it
// announces files_available in DragStart and sends the offer with DragDrop.
//
// Out of the session. When a drag that the viewer's input drives in the
// session leaves the session's windows, the session sends DragStart, and the
// viewer continues it as a drag of its own platform. The viewer ends it with
// DragFinish once something took the drop or nothing did; the session sends
// DragCancel when the drag returns into a session window or ends there.
//
// Drags need what input needs: a viewer that is not read-only, holding the
// input lease. A viewer has at most one drag at a time in each direction.
// Files travel as a file transfer offer and are fetched like any other.

// A message from the viewer.
message ClientMessage {
  // The message.
  oneof message {
    // A drag of the viewer entered the canvas.
    DragStart start = 1;
    // The viewer's drag is over a point of a session window.
    DragPosition position = 2;
    // The viewer's drag left the session windows.
    DragLeave leave = 3;
    // The viewer's drag was dropped.
    DragDrop drop = 4;
    // The viewer's drag was abandoned.
    DragCancel cancel = 5;
    // A drag of the session ended on the viewer's side.
    DragFinish finish = 6;
    // On a content channel the viewer opened.
    DragDataRequest data_request = 7;
    // On a content channel the session opened.
    DragData data = 8;
    // On a content channel the session opened.
    DragDataEnd data_end = 9;
  }
}

// A message from the session.
message ServerMessage {
  // The message.
  oneof message {
    // A drag of the session left its windows.
    DragStart start = 1;
    // What the window under the viewer's drag would do with a drop.
    DragStatus status = 2;
    // The viewer's drag ended in the session.
    DragFinish finish = 3;
    // The session's drag ended in the session or returned into its windows.
    DragCancel cancel = 4;
    // On a content channel the session opened.
    DragDataRequest data_request = 5;
    // On a content channel the viewer opened.
    DragData data = 6;
    // On a content channel the viewer opened.
    DragDataEnd data_end = 7;
  }
}

// What can be done with dragged data (XDND actions; HTML dropEffect).
enum DragAction {
  DRAG_ACTION_UNSPECIFIED = 0;
  // The target copies the data.
  DRAG_ACTION_COPY = 1;
  // The target takes the data and the source deletes it.
  DRAG_ACTION_MOVE = 2;
  // The target links to the data.
  DRAG_ACTION_LINK = 3;
}

// A drag reaches the other side.
message DragStart {
  // Chosen by the source side, unique on the connection.
  string drag_id = 1;
  // The media types the source provides, most faithful first, at most 32.
  repeated string mime_types = 2;
  // The actions the source allows, most preferred first.
  repeated DragAction actions = 3;
  // The files dragged, as names and sizes; their content is fetched as for
  // any offer. Unset when no files are dragged or they are not known yet.
  leaflow.virtualdesktop.filetransfer.v1.FileTransferOffer file_offer = 4;
  // Files are dragged whose offer follows with DragDrop.
  bool files_available = 5;
}

// The viewer's drag is over a point of a session window. The viewer sends at
// most one per animation frame.
message DragPosition {
  // The drag.
  string drag_id = 1;
  // Grows by one with every position of the drag.
  uint64 sequence = 2;
  // The window the point is relative to.
  uint64 window_id = 3;
  // The point.
  sint32 x = 4;
  // See x.
  sint32 y = 5;
  // The action the viewer proposes, such as MOVE while Shift is held.
  DragAction action = 6;
}

// What the window under the viewer's drag would do with a drop (XdndStatus).
message DragStatus {
  // The drag.
  string drag_id = 1;
  // DragPosition.sequence this answers. The viewer ignores a status older
  // than one it already has.
  uint64 sequence = 2;
  // The window would take a drop there.
  bool accepted = 3;
  // The action it would perform.
  DragAction action = 4;
}

// The viewer's drag left the session windows (XdndLeave). It may come back
// with another DragPosition.
message DragLeave {
  // The drag.
  string drag_id = 1;
}

// The viewer's drag was dropped on the point of its last DragPosition
// (XdndDrop). The session drops only where the last status accepted.
message DragDrop {
  // The drag.
  string drag_id = 1;
  // The files dropped, when DragStart announced files_available.
  leaflow.virtualdesktop.filetransfer.v1.FileTransferOffer file_offer = 2;
}

// A drag ended without a drop.
message DragCancel {
  // The drag.
  string drag_id = 1;
}

// A drag ended (XdndFinished). Sent once per drag by the target side.
message DragFinish {
  // The drag.
  string drag_id = 1;
  // The action the target performed. UNSPECIFIED: nothing took the drop.
  DragAction action = 2;
  // Why the drop failed. Unset on success or when nothing took it.
  google.rpc.Status error = 3;
}

// Asks the source for the data of one media type. The first message of a
// content channel.
message DragDataRequest {
  // The drag.
  string drag_id = 1;
  // One of DragStart.mime_types.
  string mime_type = 2;
}

// The next bytes of the data, in order.
message DragData {
  // At most 256 KiB.
  bytes data = 1;
}

// The end of the data.
message DragDataEnd {
  // Why the source could not provide it. Unset on success.
  google.rpc.Status error = 1;
}

// Drops data into a session window for automation clients, as a drag from
// nowhere would. Calls need the input lease and DragDropPolicy.drop_allowed.
service DragDropService {
  // Drops data on a point of a window and returns once the window took the
  // drop or refused it.
  rpc DropData(DropDataRequest) returns (DropDataResponse);
}

// Data of one media type.
message DragItem {
  // The media type.
  string mime_type = 1;
  // The data.
  bytes data = 2;
}

// The request of DropData.
message DropDataRequest {
  // The window.
  uint64 window_id = 1;
  // The point, relative to the window.
  sint32 x = 2;
  // See x.
  sint32 y = 3;
  // The data, one item per media type, at most 16 MiB in total. Files of
  // the session are dropped as "text/uri-list" with file URIs.
  repeated DragItem items = 4;
  // The action to propose.
  DragAction action = 5;
}

// The response of DropData. A window that does not accept the drop fails
// with FAILED_PRECONDITION and reason DROP_REFUSED.
message DropDataResponse {
  // The action the window performed.
  DragAction action = 1;
  // The session revision at which the window took the drop.
  uint64 revision = 2;
}

// What a viewer may do with drag and drop. Carried in the viewer's signed
// authorization; without it the viewer drags nothing across. Dragging files
// also needs the matching direction of FileTransferPolicy.
message DragDropPolicy {
  // The viewer may drop data into the session.
  bool drop_allowed = 1;
  // The viewer may drag data out of the session.
  bool drag_out_allowed = 2;
}
