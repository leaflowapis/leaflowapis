openapi: 3.2.1
info:
  title: Order Types
  version: v1
  description: Order references returned by product purchases. Types only; this document declares no operations.
paths: {}
components:
  schemas:
    PlacedOrder:
      description: Identifies the purchase. Read the order for purchase progress and its invoice for amounts and
        payment status.
      type: object
      properties:
        invoice_id:
          type: string
          format: uuid
          description: The invoice Billing created with this order, a draft awaiting checkout or issued. Every order has
            one; a zero-total invoice is issued and paid automatically.
        order_id:
          description: The order, including for purchases without an immediate charge. Payment alone does not
            imply that the service has completed delivery.
          type: string
          format: uuid
      required:
      - order_id
      - invoice_id
      additionalProperties: false
