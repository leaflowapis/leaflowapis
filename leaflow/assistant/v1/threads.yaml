paths:
  /api/v1/dynamic-calls/{call}/result:
    post:
      summary: Report what an action produced
      description:
        "The assistant asks the client to run an action by adding a tool call to the conversation

        with the namespace `dynamic`; the client acts when that entry turns in_progress and reports

        back here.


        The first result is the one that counts. A later one is refused rather than replacing it."
      operationId: submit-dynamic-call-result
      tags:
        - Thread
      parameters:
        - name: call
          in: path
          required: true
          description: The id of the tool call entry in the conversation.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DynamicCallResultRequestBody"
      responses:
        "204":
          description: No Content
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/threads:
    get:
      summary: List conversations
      description:
        Lists root conversations with execution and usage summaries. Sorting is applied before
        cursor pagination. Keep identical sorting and filters for subsequent pages. ids requests are bounded
        batches without pagination.
      operationId: list-threads
      tags:
        - Thread
      parameters:
        - name: q
          in: query
          description: Search titles, case-insensitively. Leave it empty for the most recent conversations
          explode: false
          schema:
            description: Search titles, case-insensitively. Empty returns the most recent conversations
            type: string
            maxLength: 100
        - name: archived
          in: query
          description: When true, returns **only** archived conversations; otherwise only unarchived ones
          explode: false
          schema:
            description: When true, returns **only** archived conversations; otherwise only unarchived ones
            type: boolean
        - name: folder
          in: query
          description:
            'Narrow the list to one folder. Omitting it returns conversations from every folder
            and from none; a folder id returns that folder''s; the empty value (`?folder=`) returns the
            ones that are in no folder at all. Empty is not the same as omitted, and a sidebar needs both:
            "chats" is exactly the ungrouped set, and asking for everything would let filed conversations
            crowd it out of the limit.'
          explode: false
          schema:
            description: A folder id, or empty for the conversations in no folder
            type: string
            maxLength: 64
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Cursor
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Limit
        - in: query
          name: sort
          schema:
            type: string
            enum:
              - recent
              - attention
              - manual
            default: recent
        - in: query
          name: ids
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 200
            uniqueItems: true
            items:
              type: string
          description:
            Batch summaries for owned conversations, including subagents and archived threads.
            Cursor, folder and search cannot be combined with ids.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadListResponseBody"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
    post:
      summary: Create a conversation
      description:
        "Omit preferredModelId or set it to null to follow the platform default. A non-null
        preference is accepted only while model selection is enabled; otherwise the request fails with
        403 and code MODEL_SELECTION_DISABLED.


        A well-formed preference for a Canopy model that is no longer allowed or has been retired or removed
        is retained and uses the default when a turn starts. This also handles a catalogue change between
        displaying the selector and submitting the choice. Creating a conversation does not contact a
        model provider and remains possible when generation is unavailable."
      operationId: create-thread
      tags:
        - Thread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateThreadRequestBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadSummaryResource"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/threads/{thread}:
    get:
      summary: Fetch the conversation document
      description:
        The complete current state of a conversation, for the first render. Its `stream` gives
        the address and admission ticket for live output, and what that stream pushes are incremental
        edits to this same document, so the same rendering logic applies.
      operationId: get-thread
      tags:
        - Thread
      parameters:
        - name: thread
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResource"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
    patch:
      summary: Update conversation settings
      description:
        'Changes the title, folder, approval mode, model preference, and whether the conversation
        is archived. Approval and model preference changes take effect from the next turn; a turn already
        running keeps the settings it started with.


        Omit preferredModelId to leave the preference unchanged, or set it to null to follow the platform
        default. A non-null preference is accepted only while model selection is enabled; otherwise the
        whole request fails with 403 and code MODEL_SELECTION_DISABLED and none of its fields are changed.
        Clearing a preference remains allowed while selection is disabled. A well-formed preference for
        a disallowed, retired or removed Canopy model is retained and falls back to the default when used.


        Model switching is allowed on an existing conversation, including while a turn is generating or
        waiting for approval or an answer. The response immediately returns the saved preferredModelId,
        while model continues to identify the running turn''s effective model until it finishes. Messages
        queued into that running turn also keep its captured model choices. The next turn uses the latest
        saved preference.


        Changing the preference does not create a new conversation, start a turn, call a model provider,
        clear the transcript, or rewrite historical model attribution. Before the next turn sends its
        first request to the selected model, the service checks that model''s input capabilities and usable
        context budget. A switch to a smaller window may require compaction under the compaction policy
        above; saving the preference alone does not establish that the conversation fits.


        Archiving makes a conversation read-only: it stays in the list under "archived", stays readable,
        and the assistant can still find it when it searches past conversations — it just takes no new
        input. Unarchive it to continue. Archiving fails while a turn is running; stop it first.'
      operationId: update-thread
      tags:
        - Thread
      parameters:
        - name: thread
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateThreadRequestBody"
            examples:
              switchModel:
                summary: Switch this conversation to another model from the catalogue
                value:
                  preferredModelId: model-from-catalogue
              followDefault:
                summary: Return this conversation to following the platform default
                value:
                  preferredModelId: null
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadSummaryResource"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
    delete:
      summary: Delete a conversation
      description:
        "Removes the conversation from every list and makes it unreachable by id. The assistant
        can no longer find it either — neither by searching past conversations nor by reading one back.


        Deleting is not the same as archiving, and the two are not degrees of the same thing. An archived
        conversation is still there and still readable, it just takes no new input; a deleted one is gone
        from view. Archiving can be undone; this cannot.


        What survives is the record itself, because a conversation with this assistant is an account of
        what was done to real infrastructure — which machine was changed, which disk was removed. That
        record is kept even though nobody can reach it here.


        Fails while a turn is running: stop it first. Deleting an already deleted conversation succeeds
        and changes nothing."
      operationId: delete-thread
      tags:
        - Thread
      parameters:
        - name: thread
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/threads/{thread}/approvals/{batch}:
    post:
      summary: Approve or decline a batch of tool calls
      description:
        "The batch id comes from the conversation document's `wait`. This is idempotent: submitting
        the same batch again neither changes a decision already in effect nor reports an error. Returns
        404 when the batch does not belong to that conversation."
      operationId: decide-approval
      tags:
        - Thread
      parameters:
        - name: thread
          in: path
          required: true
          schema:
            type: string
        - name: batch
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideRequestBody"
      responses:
        "204":
          description: No Content
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/threads/{thread}/earlier:
    get:
      summary: Fetch earlier parts of a conversation
      description:
        The first render only carries the latest stretch of a conversation; anything above
        it is fetched here, one stretch at a time. Pass the document's earlier.before as `before`; the
        `earlier` in the response is the cursor for the stretch above that, and null means the top has
        been reached. The entries have the same shape and the same order (oldest first) as `items` in
        the document, so they can be prepended as they are.
      operationId: list-earlier-items
      tags:
        - Thread
      parameters:
        - name: thread
          in: path
          required: true
          schema:
            type: string
        - name: before
          in: query
          required: true
          description: From the document's earlier.before; returns entries before this ordinal
          explode: false
          schema:
            description: From the document's earlier.before; returns entries before this ordinal
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EarlierResponseBody"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/threads/{thread}/interrupt:
    post:
      summary: Interrupt a running turn
      description:
        Calling this on a conversation with no running turn also returns 204 rather than an
        error — the user pressing stop races with the turn finishing on its own, and both outcomes are
        the same. This operation remains available while the project is suspended or being cleaned up.
      operationId: interrupt-thread
      tags:
        - Thread
      parameters:
        - name: thread
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/threads/{thread}/messages:
    post:
      summary: Send a message and start a turn
      description:
        "Returns a turnId immediately without waiting for execution — a turn can run for tens
        of minutes. Progress arrives on the live stream the conversation document's `stream` points at,
        not in this response. Sending while the assistant is still working is allowed: the message is
        put in line and `queued` comes back true, to be read at the next step of the turn already running
        — so the editor should stay open rather than blocking on a busy conversation."
      operationId: send-message
      tags:
        - Thread
      parameters:
        - name: thread
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequestBody"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnIDResponseBody"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/threads/{thread}/questions/{item}:
    post:
      summary: Answer the assistant's questions
      description:
        The question id comes from the conversation document's `wait`. An already-answered
        question also returns 204 — another tab may have submitted first, or the auto-answer window may
        have expired, and in both cases the turn has already continued with an answer.
      operationId: answer-question
      tags:
        - Thread
      parameters:
        - name: thread
          in: path
          required: true
          schema:
            type: string
        - name: item
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerRequestBody"
      responses:
        "204":
          description: No Content
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/threads/{thread}/read:
    post:
      summary: Mark a conversation as read
      operationId: mark-thread-read
      tags:
        - Thread
      parameters:
        - name: thread
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/threads/{thread}/revert:
    post:
      summary: Revert from a given point
      description:
        Reverts the entry at `ordinal` and everything after it. Reverted entries stay in the
        transcript marked `reverted`, and ordinals are not renumbered. Returns how many were actually
        reverted.
      operationId: revert-thread
      tags:
        - Thread
      parameters:
        - name: thread
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevertRequestBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevertedCountResponseBody"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/threads/{thread}/subagents:
    post:
      operationId: create-subagent
      summary: Create subagent
      tags:
        - Subagent
      parameters:
        - name: thread
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubagentResource"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubagentRequestBody"
    get:
      operationId: list-subagents
      summary: List subagents
      tags:
        - Subagent
      parameters:
        - name: thread
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubagentListResponseBody"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/threads/{thread}/subagents/{subagent}:
    get:
      operationId: get-subagent
      summary: Get subagent
      tags:
        - Subagent
      parameters:
        - name: thread
          in: path
          required: true
          schema:
            type: string
        - name: subagent
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubagentResource"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
    patch:
      operationId: update-subagent
      summary: Update subagent
      tags:
        - Subagent
      parameters:
        - name: thread
          in: path
          required: true
          schema:
            type: string
        - name: subagent
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubagentResource"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubagentRequestBody"
    delete:
      operationId: delete-subagent
      summary: Delete subagent
      tags:
        - Subagent
      parameters:
        - name: thread
          in: path
          required: true
          schema:
            type: string
        - name: subagent
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/threads/{thread}/subagents/{subagent}/messages:
    post:
      operationId: send-subagent-message
      summary: Send subagent message
      tags:
        - Subagent
      parameters:
        - name: thread
          in: path
          required: true
          schema:
            type: string
        - name: subagent
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        default:
          $ref: ./openapi.yaml#/components/responses/Error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendSubagentRequestBody"
  /api/v1/threads/{thread}/subagents/{subagent}/interrupt:
    post:
      operationId: interrupt-subagent
      summary: Interrupt subagent
      tags:
        - Subagent
      parameters:
        - name: thread
          in: path
          required: true
          schema:
            type: string
        - name: subagent
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/threads/{thread}/move:
    post:
      operationId: move-thread
      summary: Move and reorder a conversation
      tags:
        - Thread
      parameters:
        - in: path
          name: thread
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveThreadRequestBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadSummaryResource"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
components:
  schemas:
    PartResource:
      type: object
      properties:
        attachmentId:
          description: For `file` parts. Points at one of this entry's `attachments`.
          type:
            - string
            - "null"
        id:
          description:
            "Addresses this part in the live stream — text arrives as `append` frames pointing
            at

            `/items/{item}/parts/{id}/text`.


            Not an array index. It looks like one today because parts are only ever appended, and a

            client that treats it as one keeps working right up until that stops being true."
          type: string
        text:
          description: For `text` parts. Grows as the answer is written.
          type:
            - string
            - "null"
        type:
          type: string
          enum:
            - text
            - file
      required:
        - id
        - type
      additionalProperties: false
    ThreadSummaryResource:
      type: object
      properties:
        executionState:
          type: string
        parentThreadId:
          type: string
        agentName:
          type: string
        approvalMode:
          type: string
          enum:
            - guardian
            - manual
            - yolo
        archived:
          type: boolean
        createdAt:
          type: string
          format: date-time
        folderId:
          description: The folder this conversation is filed under, or null when it is in none
          type:
            - string
            - "null"
        id:
          type: string
        model:
          description:
            The Canopy model id most recently captured by this conversation. Null before model
            selection. The next turn may select another model according to current policy.
          type:
            - string
            - "null"
        preferredModelId:
          description:
            The saved preferred Canopy model id, independent of the model actually used. Null
            follows the platform default. Kept when selection is disabled, the model is removed, or a
            request falls back.
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 128
        title:
          type:
            - string
            - "null"
        unread:
          type: boolean
        updatedAt:
          type: string
          format: date-time
        reasoningEffort:
          type:
            - string
            - "null"
        execution:
          $ref: "#/components/schemas/ExecutionSummaryResource"
        usage:
          $ref: "#/components/schemas/UsageResource"
        orderVersion:
          type: integer
          format: int64
          minimum: 0
      required:
        - id
        - title
        - model
        - preferredModelId
        - createdAt
        - updatedAt
        - archived
        - unread
        - approvalMode
        - folderId
        - reasoningEffort
        - execution
        - usage
        - orderVersion
      additionalProperties: false
    ThreadListResponseBody:
      type: object
      properties:
        nextCursor:
          description:
            Pass this back as `cursor` for the next page. Null means this was the last one
            — it is only set when there is genuinely more, so an empty final page never happens.
          type:
            - string
            - "null"
        threads:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/ThreadSummaryResource"
        counts:
          type: object
          properties:
            total:
              type: integer
              format: int64
              minimum: 0
            waiting:
              type: integer
              format: int64
              minimum: 0
            running:
              type: integer
              format: int64
              minimum: 0
            unread:
              type: integer
              format: int64
              minimum: 0
          required:
            - total
            - waiting
            - running
            - unread
          additionalProperties: false
      required:
        - threads
        - nextCursor
        - counts
      additionalProperties: false
    CreateThreadRequestBody:
      type: object
      properties:
        approvalMode:
          description: Absent uses the platform's default approval mode
          type: string
          enum:
            - guardian
            - manual
            - yolo
        preferredModelId:
          description:
            A Canopy model id to prefer. Omit or pass null to follow the platform default.
            The model must be available in Canopy and support Assistant conversations. A retired or removed
            id falls back to the default without clearing the preference.
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 128
        reasoningEffort:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 32
          description:
            Use a non-disabled tier declared by Canopy reasoning_tiers. Null uses the model
            default. Changes apply at the next model request boundary, including an active conversation.
      additionalProperties: false
    ContextResource:
      type: object
      properties:
        compactAt:
          type:
            - integer
            - "null"
          format: int64
        inputModalities:
          description:
            "What kinds of input the model behind this conversation accepts, as modality names:
            text, image.


            This governs images and nothing else. Text and binary attachments reach every model: a small
            text file is placed inline, a large one is read on demand, and a binary is downloaded onto
            a cloud instance — none of which asks the model to see a picture. So this decides whether
            pasting a screenshot does anything, not whether the attach control exists. Hiding file upload
            on a text-only model takes away something that would have worked.


            This describes the effective model, including a replacement chosen through fallback, rather
            than the saved preference. An empty list means no effective model is available to describe;
            it is not a claim that every model rejects files."
          type: array
          items:
            type: string
        model:
          description:
            The effective Canopy model id for the running turn or the next turn when idle.
            Null when no model can be selected; window and compactAt are then null and inputModalities
            is empty.
          type:
            - string
            - "null"
        used:
          type:
            - integer
            - "null"
          format: int64
        warnAt:
          type: integer
          format: int64
        window:
          type:
            - integer
            - "null"
          format: int64
      required:
        - model
        - used
        - window
        - compactAt
        - warnAt
        - inputModalities
      additionalProperties: false
    EarlierResource:
      type: object
      properties:
        before:
          type: integer
          format: int64
        foldedAbove:
          type: boolean
      required:
        - before
        - foldedAbove
      additionalProperties: false
    AttachmentResource:
      type: object
      properties:
        byteSize:
          type: integer
          format: int64
        filename:
          type: string
        height:
          description:
            Null unless kind is image. Width and height are here so a client can hold the space
            before the image itself has loaded.
          type:
            - integer
            - "null"
          format: int64
        id:
          type: string
        kind:
          description:
            What this attachment is. A client renders an image in place and everything else
            as a file to download.
          type: string
          enum:
            - image
            - text
            - binary
        width:
          description: Null unless kind is image.
          type:
            - integer
            - "null"
          format: int64
      required:
        - id
        - kind
        - filename
        - byteSize
        - width
        - height
      additionalProperties: false
    ItemResource:
      type: object
      properties:
        sourceKind:
          type: string
        sourceId:
          type: string
        sourceEventId:
          type: string
        approval:
          type:
            - string
            - "null"
          enum:
            - approved
            - declined
            - auto_approved
            - unreviewed
        approvalReason:
          type:
            - string
            - "null"
        arguments:
          type: string
        attachments:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/AttachmentResource"
        clientContext:
          description: "The context blocks the client attached to this message.


            **Not part of what the operator wrote** — `text` is. Render the message from `text` and

            leave these out of the bubble; they are here so a client that did not send them, or one

            that reloaded, can still read what the assistant was given.


            The actions declared alongside them are not returned: they are re-declared as they

            change and would make every fetch of the conversation carry them again."
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/ClientContextPart"
        createdAt:
          type: string
          format: date-time
        detail:
          type:
            - string
            - "null"
        presentation:
          anyOf:
            - $ref: "#/components/schemas/PresentationResource"
            - type: "null"
        durationMs:
          type:
            - integer
            - "null"
          format: int64
        id:
          type: string
        model:
          description:
            The Canopy model id that actually produced this entry, including after fallback.
            Never replaced by the conversation's preference or rewritten when the model is retired or
            removed from the allowlist. Null for messages the user sent.
          type:
            - string
            - "null"
        namespace:
          type:
            - string
            - "null"
        ordinal:
          type: integer
          format: int64
        reverted:
          type: boolean
        status:
          type: string
          enum:
            - pending
            - in_progress
            - completed
            - failed
            - declined
            - interrupted
        target:
          type:
            - string
            - "null"
        parts:
          description:
            "The content of this entry, in the order it was written. A message that is only
            text is a

            single part, which is most of them.


            An attachment belongs where it was written, so render these in order rather than putting

            them all at the end."
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/PartResource"
        tool:
          type:
            - string
            - "null"
        type:
          description: Determines which fields this entry carries
          type: string
          enum:
            - user_message
            - agent_message
            - reasoning
            - dynamic_tool_call
            - context_compaction
            - token_budget_reminder
            - turn_failure
        turnId:
          type:
            - string
            - "null"
      required:
        - id
        - ordinal
        - type
        - status
        - createdAt
        - reverted
        - model
      additionalProperties: false
    PresentationResource:
      description:
        "Structured detail produced by a tool call, in addition to the single-line `detail`.
        Null

        when the call produced none.


        `kind` determines which of the remaining fields is populated."
      type: object
      properties:
        fileDiff:
          anyOf:
            - $ref: "#/components/schemas/FileDiffResource"
            - type: "null"
        kind:
          description: Determines which of the remaining fields is populated
          type: string
          enum:
            - file_diff
      required:
        - kind
      additionalProperties: false
    FileDiffResource:
      description: "The change a tool call applied to a single file.


        Populated once the call has completed successfully. It is absent while the call is pending

        or awaiting approval, as the file's prior contents are read during execution. To preview an

        edit awaiting approval, derive it from the call's `old_string` and `new_string` arguments."
      type: object
      properties:
        added:
          description: Lines added. Complete even when `unified` is null
          type: integer
          format: int64
        path:
          description: Absolute path of the file on the instance
          type: string
        removed:
          description: Lines removed. Complete even when `unified` is null
          type: integer
          format: int64
        status:
          description: What the call did to the file
          type: string
          enum:
            - added
            - modified
            - deleted
        unified:
          description:
            "The change as a unified diff with three lines of context. A file created by the
            call is

            diffed against `/dev/null`.


            Null when the change exceeds the service's size limit. The diff is omitted in full

            rather than truncated; `added` and `removed` remain complete."
          type:
            - string
            - "null"
      required:
        - path
        - status
        - added
        - removed
      additionalProperties: false
    StreamResource:
      type: object
      properties:
        path:
          type: string
        ticket:
          type: string
      required:
        - path
        - ticket
      additionalProperties: false
    TurnResource:
      type: object
      properties:
        approvalMode:
          type: string
          enum:
            - guardian
            - manual
            - yolo
      required:
        - approvalMode
      additionalProperties: false
    Choice:
      type: object
      properties:
        description:
          type: string
        label:
          type: string
      required:
        - label
        - description
      additionalProperties: false
    Question:
      type: object
      properties:
        choices:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/Choice"
        header:
          type: string
        id:
          type: string
        question:
          type: string
      required:
        - id
        - header
        - question
        - choices
      additionalProperties: false
    WaitResource:
      type: object
      properties:
        autoResolutionMs:
          type: integer
          format: int64
        batchId:
          type: string
        itemId:
          type: string
        itemIds:
          type:
            - array
            - "null"
          items:
            type: string
        kind:
          type: string
          enum:
            - tool_approval
            - user_input
        questions:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/Question"
        turnId:
          type: string
      required:
        - kind
        - turnId
      additionalProperties: false
    DocumentResource:
      type: object
      properties:
        context:
          $ref: "#/components/schemas/ContextResource"
        cursor:
          type:
            - string
            - "null"
        earlier:
          anyOf:
            - $ref: "#/components/schemas/EarlierResource"
            - type: "null"
        items:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/ItemResource"
        status:
          type: string
        stream:
          anyOf:
            - $ref: "#/components/schemas/StreamResource"
            - type: "null"
        turn:
          anyOf:
            - $ref: "#/components/schemas/TurnResource"
            - type: "null"
        todos:
          description:
            The assistant's checklist for the work in this conversation, in the order it intends
            to do it. Empty when it has not written one — short tasks do not get a list. It is rewritten
            in full each time, so what is here is the current state.
          type: array
          items:
            $ref: "#/components/schemas/TodoResource"
        turnId:
          type:
            - string
            - "null"
        wait:
          anyOf:
            - $ref: "#/components/schemas/WaitResource"
            - type: "null"
        usage:
          $ref: "#/components/schemas/UsageResource"
        turnUsage:
          type: array
          items:
            $ref: "#/components/schemas/TurnUsageResource"
      required:
        - turnId
        - stream
        - status
        - cursor
        - earlier
        - context
        - items
        - wait
        - turn
        - usage
        - turnUsage
      additionalProperties: false
    UpdateThreadRequestBody:
      type: object
      properties:
        approvalMode:
          type: string
          enum:
            - guardian
            - manual
            - yolo
          description:
            Changes apply at the next relevant request boundary. In-flight model requests and
            existing approval batches retain their captured settings.
        archived:
          type: boolean
        preferredModelId:
          description:
            Changes apply at the next relevant request boundary. In-flight model requests and
            existing approval batches retain their captured settings.
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 128
        folderId:
          description:
            'File this conversation into a folder, or `null` to take it out of the one it is
            in. Omit the field to leave it where it is.


            Filing does not move the conversation in the list. The order answers "which conversation has
            something new in it", and putting one away is not that.'
          type:
            - string
            - "null"
          maxLength: 64
        title:
          description: 'Rename this conversation.


            A conversation names itself: the first message gives it a working title, and the assistant
            replaces that with a better one once it has answered. Setting this stops both — a name somebody
            chose is never overwritten by one that was generated.


            Renaming does not move the conversation in the list. The order answers "which conversation
            has something new in it", and editing a title is not that.'
          type: string
          minLength: 1
          maxLength: 255
        reasoningEffort:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 32
          description:
            Use a non-disabled tier declared by Canopy reasoning_tiers. Null uses the model
            default. Changes apply at the next model request boundary, including an active conversation.
      additionalProperties: false
    DecideRequestBody:
      type: object
      properties:
        approved:
          type: boolean
        reason:
          type: string
      required:
        - approved
      additionalProperties: false
    EarlierResponseBody:
      type: object
      properties:
        earlier:
          $ref: "#/components/schemas/EarlierResource"
        items:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/ItemResource"
        turnUsage:
          type: array
          items:
            $ref: "#/components/schemas/TurnUsageResource"
      required:
        - items
        - earlier
        - turnUsage
      additionalProperties: false
    SendMessageRequestBody:
      type: object
      properties:
        client:
          $ref: "#/components/schemas/ClientContextRequest"
        parts:
          description:
            "The message, in the order it was written. A message with nothing but text is a
            single

            text part; that is the ordinary case and nothing else is required."
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/MessagePart"
      required:
        - parts
      additionalProperties: false
    MessagePart:
      description:
        "One piece of a message. `type` says which of the fields below carries it:\n\n- `text`\
        \ — the words, in `text`\n- `file` — an attachment uploaded earlier, by id in `attachmentId`\n\
        - `data-<something>` — context from the client, in `data`. The name after `data-` is yours;\n\
        \  it is shown to the assistant so it can tell one kind of block from another.\n\nOrder matters:\
        \ an attachment belongs where it was written, not at the end."
      type: object
      properties:
        attachmentId:
          description:
            For `file` parts. The attachment must have been uploaded and not yet bound to another
            message.
          type:
            - string
            - "null"
        data:
          description: For `data-*` parts. Any object; its keys reach the assistant as they are.
          type:
            - object
            - "null"
          additionalProperties: true
        text:
          description: For `text` parts.
          type:
            - string
            - "null"
        type:
          type: string
          minLength: 1
          maxLength: 64
      required:
        - type
      additionalProperties: false
    ClientContextRequest:
      description:
        "Which client this is and what it can do, so the assistant can ask it to do those things

        while it answers. What the operator is looking at travels as `data-*` parts on the message.


        Send `actions` only when they differ from the last message on this conversation. Sending the

        block without `actions` keeps whatever was declared before."
      type: object
      properties:
        actions:
          description: "The actions on offer right now.


            Omit it when nothing changed since the last message. Send `[]` to say there is nothing

            on offer — those are different: a client that moves off the page it was attached to has

            to be able to say so, or the assistant keeps calling actions that no longer make sense."
          type:
            - array
            - "null"
          maxItems: 32
          items:
            $ref: "#/components/schemas/ClientActionRequest"
        clientId:
          description: Identifies this client while it stays open. Any stable string; one per tab or process.
          type: string
          minLength: 1
          maxLength: 128
        label:
          description: How the client calls itself, for example "Leaflow console (web)".
          type: string
          maxLength: 64
      required:
        - clientId
      additionalProperties: false
    ClientContextPart:
      description: A `data-*` part as it was sent.
      type: object
      properties:
        data:
          type: object
          additionalProperties: true
        type:
          type: string
      required:
        - type
        - data
      additionalProperties: false
    ClientActionRequest:
      description: The shape of a tool in the OpenAI Chat Completions API, plus `readOnly` and `timeoutMs`.
      type: object
      properties:
        function:
          $ref: "#/components/schemas/ClientFunctionRequest"
        readOnly:
          description:
            True when the action changes nothing outside the client. Anything else goes through
            this conversation's approval before it runs.
          type: boolean
        timeoutMs:
          description:
            How long the assistant should wait for this action. Omit for the default; longer
            values are capped.
          type: integer
          format: int64
          minimum: 0
        type:
          description: Only functions are supported.
          type: string
          enum:
            - function
          default: function
      required:
        - function
        - readOnly
      additionalProperties: false
    ClientFunctionRequest:
      description: The function object from the OpenAI tools format.
      type: object
      properties:
        description:
          description:
            "What the action does, written for the model. An action without one can only be
            guessed at from its name. The 1024 ceiling is OpenAI's own limit on `tools[].function.description`,
            not a number chosen here: over it the upstream call fails with `string_above_max_length`,
            and refusing at submission is the clearer of the two places to refuse. It was 500, which ran
            out at about six enumerated entries — an action that must list what it accepts had nowhere
            to put the list."
          type: string
          minLength: 1
          maxLength: 1024
        inputSchema:
          description: The MCP and Anthropic spelling of `parameters`. Give one or the other, not both.
          type:
            - object
            - "null"
          additionalProperties: true
        name:
          type: string
          minLength: 1
          maxLength: 64
        parameters:
          description: JSON Schema for the arguments. Omit for an action that takes none.
          type:
            - object
            - "null"
          additionalProperties: true
      required:
        - name
        - description
      additionalProperties: false
    DynamicCallResultRequestBody:
      type: object
      properties:
        clientId:
          description: The same value sent with the message. A result from a different client is refused.
          type: string
          minLength: 1
        error:
          description:
            Why it failed, when `ok` is false. It reaches the assistant, so write it for a
            reader who cannot see the screen.
          type: string
          maxLength: 2000
        nextCursor:
          description: Pass back when there is more to read. The assistant will call again with it.
          type: string
          maxLength: 500
        ok:
          type: boolean
        output:
          description: What the action produced. At most 64 KiB; use `nextCursor` for anything larger.
          type: string
      required:
        - clientId
        - ok
      additionalProperties: false
    TodoResource:
      type: object
      properties:
        activeForm:
          description:
            The same step phrased as happening now — "Installing nginx". Show this one while
            the item is in progress.
          type: string
        content:
          description: The step as an instruction — "Install nginx".
          type: string
        status:
          description: Where this step stands. At most one item is in_progress at any time.
          type: string
          enum:
            - pending
            - in_progress
            - completed
      required:
        - content
        - activeForm
        - status
      additionalProperties: false
    TurnIDResponseBody:
      type: object
      properties:
        queued:
          description:
            True when the assistant was already busy and this message was put in line instead
            of starting a turn. It is read at the next step of the turn already running, so there is nothing
            further to do — and turnId is empty in this case.
          type: boolean
        queuedAhead:
          description:
            How many messages were already waiting ahead of this one. Only meaningful when
            queued is true.
          type: integer
          format: int64
        turnId:
          description: The turn this message started. Empty when the message was queued instead.
          type: string
      required:
        - turnId
        - queued
      additionalProperties: false
    AnswerRequestBody:
      type: object
      properties:
        answers:
          description: A map from question id to the answer chosen
          type: object
          additionalProperties:
            type: string
      required:
        - answers
      additionalProperties: false
    RevertRequestBody:
      type: object
      properties:
        ordinal:
          description: The starting ordinal; that entry and everything after it is reverted
          type: integer
          format: int64
      required:
        - ordinal
      additionalProperties: false
    RevertedCountResponseBody:
      type: object
      properties:
        reverted:
          type: integer
          format: int64
      required:
        - reverted
      additionalProperties: false
    SubagentResource:
      type: object
      properties:
        id:
          type: string
        threadId:
          type: string
        name:
          type: string
        executionState:
          type: string
        lastTurnStatus:
          type: string
        parentThreadId:
          type: string
        modelId:
          type: string
      required:
        - id
        - threadId
        - name
        - executionState
        - lastTurnStatus
        - parentThreadId
        - modelId
      additionalProperties: false
    SubagentListResponseBody:
      type: object
      properties:
        subagents:
          type: array
          items:
            $ref: "#/components/schemas/SubagentResource"
      required:
        - subagents
      additionalProperties: false
    CreateSubagentRequestBody:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
        prompt:
          type: string
          minLength: 1
        forkMode:
          type: string
          enum:
            - all
            - none
          default: all
        modelId:
          type: string
          description: Optional allowed Canopy model ID. Defaults to the parent turn model.
      required:
        - name
        - prompt
      additionalProperties: false
    UpdateSubagentRequestBody:
      type: object
      properties:
        title:
          type: string
        archived:
          type: boolean
      required: []
      additionalProperties: false
    SendSubagentRequestBody:
      type: object
      properties:
        message:
          type: string
          minLength: 1
        requestId:
          type: string
          minLength: 1
          maxLength: 64
      required:
        - message
        - requestId
      additionalProperties: false
    UsageResource:
      type: object
      properties:
        inputTokens:
          type: integer
          format: int64
          minimum: 0
        outputTokens:
          type: integer
          format: int64
          minimum: 0
        cachedTokens:
          type: integer
          format: int64
          minimum: 0
        reasoningTokens:
          type: integer
          format: int64
          minimum: 0
        requests:
          type: integer
          format: int64
          minimum: 0
        unreportedRequests:
          type: integer
          format: int64
          minimum: 0
        runningRequests:
          type: integer
          format: int64
          minimum: 0
        complete:
          type: boolean
      required:
        - inputTokens
        - outputTokens
        - cachedTokens
        - reasoningTokens
        - requests
        - unreportedRequests
        - runningRequests
      additionalProperties: false
    ExecutionSummaryResource:
      type: object
      properties:
        state:
          type: string
        lastStatus:
          type:
            - string
            - "null"
        activity:
          type:
            - string
            - "null"
        recentMessage:
          type:
            - string
            - "null"
        completedSteps:
          type: integer
          format: int64
          minimum: 0
        totalSteps:
          type: integer
          format: int64
          minimum: 0
        childCount:
          type: integer
          format: int64
          minimum: 0
        runningChildren:
          type: integer
          format: int64
          minimum: 0
        pendingAction:
          description:
            The next human decision required by this conversation or one of its subagents.
            Resolve using the indicated thread, not necessarily the root.
          anyOf:
            - $ref: "#/components/schemas/PendingActionResource"
            - type: "null"
      required:
        - state
        - lastStatus
        - activity
        - recentMessage
        - completedSteps
        - totalSteps
        - childCount
        - runningChildren
        - pendingAction
      additionalProperties: false
    TurnUsageResource:
      type: object
      properties:
        turnId:
          type: string
        usage:
          $ref: "#/components/schemas/UsageResource"
      required:
        - turnId
        - usage
      additionalProperties: false
    MoveThreadRequestBody:
      type: object
      properties:
        folderId:
          type:
            - string
            - "null"
        beforeThreadId:
          type:
            - string
            - "null"
          description:
            Insert immediately before this conversation in the custom order. Null appends to
            the end. The target must belong to the same user, project, and archive state; it may be in
            a different folder. Moving does not change activity time.
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
        afterThreadId:
          description:
            Insert immediately after this conversation. Use either beforeThreadId or afterThreadId;
            when both are null the conversation is appended. This allows insertion after the last visible
            row without moving past unloaded pages.
          type:
            - string
            - "null"
      required:
        - folderId
        - beforeThreadId
        - expectedVersion
      additionalProperties: false
    PendingActionResource:
      type: object
      additionalProperties: false
      required:
        - threadId
        - kind
      properties:
        threadId:
          type: string
        kind:
          type: string
          enum:
            - tool_approval
            - user_input
