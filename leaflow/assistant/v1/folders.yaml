paths:
  /api/v1/folders:
    get:
      summary: List folders
      description:
        "The current account's folders in this project, oldest first. That order is fixed
        and does not react to what happens inside a folder: a folder is a place on the screen, and a place
        that moves whenever something is put into it is not one anybody can aim at. Not paginated — there
        is a cap on how many there can be, and all of them come back at once."
      operationId: list-folders
      tags:
        - Folder
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderListResponseBody"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
    post:
      summary: Create a folder
      description:
        "A folder groups conversations in the sidebar and does nothing else. The assistant
        is never told which folder a conversation is in, and a conversation behaves exactly the same inside
        one as outside: no shared instructions, no shared files, no shared memory.


        Names are unique within an account's folders in this project, because the only way to aim at
        a folder is to read its name."
      operationId: create-folder
      tags:
        - Folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFolderRequestBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderResource"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/folders/{folder}:
    get:
      summary: Fetch one folder
      description:
        "The list returns every folder at once, so this is for the case the list does not cover:
        a page opened straight at a folder, holding nothing but the id from the address bar. Its conversations
        are a separate request — `GET /api/v1/threads?folder=<id>`."
      operationId: get-folder
      tags:
        - Folder
      parameters:
        - name: folder
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderResource"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
    patch:
      summary: Rename a folder
      description:
        The conversations in it are untouched, and none of them move in the list — a folder's
        name is not part of what any conversation is about.
      operationId: update-folder
      tags:
        - Folder
      parameters:
        - name: folder
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFolderRequestBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderResource"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
    delete:
      summary: Delete a folder
      description:
        "The conversations inside are **not** deleted. They leave the folder and go back to
        the ungrouped list, where they can be filed again. Emptying a shelf is not the same as throwing
        out what was on it, and deleting a conversation is a different request.


        Idempotent: deleting a folder that is already gone succeeds and changes nothing."
      operationId: delete-folder
      tags:
        - Folder
      parameters:
        - name: folder
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/folders/{folder}/move:
    post:
      operationId: move-folder
      summary: Reorder a folder
      tags:
        - Folder
      parameters:
        - in: path
          name: folder
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveFolderRequestBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderResource"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
components:
  schemas:
    FolderResource:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        id:
          type: string
        name:
          type: string
        threadCount:
          description:
            How many conversations are filed here and would show up in the default list. Archived
            and deleted ones are not counted, so this is exactly what `GET /api/v1/threads?folder=<id>`
            returns.
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time
        orderVersion:
          type: integer
          format: int64
          minimum: 0
      required:
        - id
        - name
        - threadCount
        - createdAt
        - updatedAt
        - orderVersion
      additionalProperties: false
    FolderListResponseBody:
      type: object
      properties:
        folders:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/FolderResource"
      required:
        - folders
      additionalProperties: false
    CreateFolderRequestBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
      required:
        - name
      additionalProperties: false
    UpdateFolderRequestBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
      required:
        - name
      additionalProperties: false
    MoveFolderRequestBody:
      type: object
      properties:
        beforeFolderId:
          type:
            - string
            - "null"
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
      required:
        - beforeFolderId
        - expectedVersion
      additionalProperties: false
