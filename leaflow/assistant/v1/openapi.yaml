openapi: 3.2.1
info:
  title: Leaflow Assistant API
  version: 1.0.0
  description:
    "Assistant conversations, subagents, background tasks, schedules and uploaded files.


    Create a thread, send message parts, then follow its document and SSE stream. Subagents use the same
    turn engine, context compaction and approval controls. Temporal owns execution, waiting, retries and
    schedule runtime state.


    Canopy owns model metadata and reasoning tiers. The frontend reads Canopy directly. Assistant exposes
    only its selection policy through /api/v1/model-configuration. Model and reasoning changes apply at
    the next model request boundary; an in-flight request retains its captured settings. New approval
    batches use the current approval mode, while existing batches retain their reviewer and decisions.


    Read /api/v1/upload-configuration before creating an upload. Echo the policy ID, total limit and part
    size in the upload manifest. Stream exact-sized parts, then complete the upload and send its attachment
    ID. The whole-file default limit is 512 MiB and is configurable; chunking never bypasses it. Cancelled
    and expired parts are removed. The direct /attachments endpoint remains a convenience route for small
    files under the HTTP body limit.


    Images enter model history as file references and are read on demand. Text files can be paged or searched;
    other binaries can be fetched to an authorized instance for processing. Context compaction retains
    the latest user message verbatim and checks the resulting request against the target model window.
    Empty summaries do not replace history.


    Rewinding hides message history from subsequent model requests and invalidates affected compaction
    checkpoints. It does not undo executed tools or external changes. Original execution records remain
    available for audit and verification before retrying an operation.


    SSE paths and tickets come from the thread document. Resume with the supplied cursor or Last-Event-ID.
    Waiting for approval or user input does not imply completion; worker replacement resumes unfinished
    execution without resolving those waits."
servers:
  - url: https://assistant.leaflow.cloud
    description: Threads, messages and tool calls
