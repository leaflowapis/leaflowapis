paths:
  /api/v1/quotes:
    post:
      summary: Quote order checkout, renewals or a cancellation
      description: |-
        Computes a price preview without creating a resource or saving a quote. Nothing is charged,
        reserved or applied to an order, and no discount redemption is consumed. The response has no
        quote ID and does not guarantee a price or reserve a promotion code.

        With order_id, uses that order's recorded purchase terms and billing account. An optional
        promotion_code previews one code; without it, Billing selects an applicable account discount.
        An invalid or inapplicable explicit code is refused rather than silently replaced. Give total
        as expected_amount when confirming checkout; eligibility and availability are checked again.
        An order already checked out returns its confirmed amounts, without reapplying its discount;
        a different code is refused with BILLING_ORDER_CHECKOUT_CONFLICT.

        A renewal is priced exactly as renewing would charge it: at the agreed amount or the price
        named, with the discounts the account holds, and with tax. A renewal list does not accept a
        promotion code because its entries create separate orders. To use a new code on a renewal,
        first create a renewal order and quote its checkout by order_id. Prices and discount eligibility
        may change between preview and confirmation.

        A cancellation is quoted as creating it would compute the refund, as of now and under the refund
        terms agreed when each subscription was bought. It is quoted on its own: combined with another target
        the request is refused with HTTP 400 `BILLING_PURCHASE_INVALID` and `meta.field`
        `cancellation`. It is refused with the same errors as creating the cancellation, except that the
        amount is not checked. Give the returned `cancellation.proration_date` and
        `cancellation.refundable_amount` when creating it.

        Orders must belong to one of your billing accounts. Every subscription in a renewal or cancellation
        quote must be paid for by the same one of your billing accounts; otherwise the
        request is refused with HTTP 400 `BILLING_PURCHASE_INVALID`. Returns 404 when a subscription does
        not exist, and 403 `BILLING_ACCOUNT_FORBIDDEN` when it is paid for by an account you do not own.

        Returns a complete preview or a structured error. If any requested item cannot be priced, no partial preview is returned.

        With refund, estimates the refundable value of the specified order or items, without
        canceling the order, stopping service or creating a refund. A refund target is quoted alone.
        The response has zero checkout totals and reports the estimate in refund. Delivery whose
        outcome is unknown must be observed before refund eligibility can be established.
      operationId: create-quote
      tags:
        - quotes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountQuoteRequest"
            examples:
              order_checkout:
                summary: Preview one promotion code without applying it to the order.
                value:
                  order_id: 019c0000-0000-7000-8000-000000000001
                  promotion_code: WELCOME
              account_discount:
                summary: Preview the account discount selected for this order.
                value:
                  order_id: 019c0000-0000-7000-8000-000000000001
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/estimates:
    post:
      summary: Estimate a basket
      description: |-
        Uses public list prices. Nothing is reserved and nothing is recorded, so this may be
        called as often as required.

        `POST` is used because the set of items to price does not fit in a query string. There is
        no corresponding `GET`, and no estimate is stored to retrieve.

        An account holding a negotiated agreement may be charged less than this. Tax and
        discounts are not included.

        Returns a complete preview or a structured error. If any requested item cannot be priced, no partial preview is returned.
      operationId: create-estimate
      tags:
        - quotes
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstimateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estimate"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/projects/{projectId}/quotes:
    parameters:
      - $ref: ./openapi.yaml#/components/parameters/ProjectId
    post:
      summary: Quote for a project
      description: |-
        Computes a price preview without creating a resource or saving a quote. Nothing is charged,
        reserved or applied to an order, and no discount redemption is consumed. The response has no
        quote ID and does not guarantee a price or reserve a promotion code.

        New purchases use the project's current billing account and currency. With order_id, the order
        must belong to this project; its recorded purchase terms, billing account and currency are used.
        An optional promotion_code previews one code for the purchase or order. Without it, Billing
        selects an applicable account discount. An invalid or inapplicable explicit code is refused
        rather than silently replaced. Give total as expected_amount when confirming checkout through
        Billing; eligibility and availability are checked again. An order already checked out returns
        its confirmed amounts without reapplying its discount; a different code is refused with
        BILLING_ORDER_CHECKOUT_CONFLICT.

        Prices may change before an order is created; confirmed purchase terms are not repriced from
        today's catalog. Usage estimates describe future usage and are not checkout amounts. They do
        not accept a promotion code, including when mixed with fixed purchase lines.

        A renewal is priced exactly as renewing would charge it: at the agreed amount or the price
        named, with the discounts the account holds, and with tax. A renewal list does not accept a
        promotion code because its entries create separate orders. To use a new code on a renewal,
        first create a renewal order and quote its checkout by order_id.

        A cancellation is quoted as creating it would compute the refund, as of now and under the refund
        terms agreed when each subscription was bought. It is quoted on its own: combined with lines or
        renewals the request is refused with HTTP 400 `BILLING_PURCHASE_INVALID` and `meta.field`
        `cancellation`. It is refused with the same errors as creating the cancellation, except that the
        amount is not checked. Give the returned `cancellation.proration_date` and
        `cancellation.refundable_amount` when creating it.

        Returns 404 when the project has no billing account for a new purchase quote, or when the order
        or a subscription to be renewed or canceled does not belong to this project.

        Returns a complete preview or a structured error. If any requested item cannot be priced, no partial preview is returned.

        With refund, estimates the refundable value of the specified order or items, without
        canceling the order, stopping service or creating a refund. A refund target is quoted alone.
        The response has zero checkout totals and reports the estimate in refund. Delivery whose
        outcome is unknown must be observed before refund eligibility can be established.
      operationId: create-project-quote
      tags:
        - quotes
      security:
        - scopedTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectQuoteRequest"
            examples:
              purchase:
                summary: Preview a code for one proposed purchase without consuming it.
                value:
                  promotion_code: WELCOME
                  items:
                    - price_id: 019c0000-0000-7000-8000-000000000002
                      quantity: "1"
              order_checkout:
                summary: Preview checkout using the order's recorded purchase terms.
                value:
                  order_id: 019c0000-0000-7000-8000-000000000001
                  promotion_code: WELCOME
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
components:
  schemas:
    QuoteRenewal:
      description: |-
        Price renewing a prepaid subscription. Give `price_id`, or `interval` with
        `interval_count`, to renew for another term at the price currently sold for it. Naming
        the current term, or giving neither, renews at the agreed amount. A term sold at several
        prices that differ in termination policy is refused with 409
        `BILLING_RENEWAL_OPTION_AMBIGUOUS` unless `termination_policy` or `price_id` is given.
      type: object
      properties:
        subscription_id:
          type: string
          format: uuid
        price_id:
          type: string
          format: uuid
        interval:
          type: string
          enum:
            - day
            - month
            - year
        interval_count:
          type: integer
          minimum: 1
        termination_policy:
          description: With `interval` and `interval_count`, chooses among prices of that term that differ in termination policy.
          allOf:
            - $ref: ./prices.yaml#/components/schemas/TerminationPolicy
        periods:
          description: How many consecutive periods to renew for.
          type: integer
          default: 1
          minimum: 1
          maximum: 100
      required:
        - subscription_id
      additionalProperties: false
    QuoteRenewalResult:
      description: |-
        What renewing would charge. Renewing the same subscription for the same term and number
        of periods charges exactly `total`, unless prices or the discounts the account holds
        change in between.
      type: object
      properties:
        index:
          description: Which renewal of the request this answers.
          type: integer
        subscription_id:
          type: string
          format: uuid
        price_id:
          description: The price the renewal is charged under.
          type: string
          format: uuid
        interval:
          type: string
          enum:
            - day
            - month
            - year
        interval_count:
          type: integer
        periods:
          type: integer
        amount:
          description: |-
            The price of the periods before the discounts the account holds. A discount the
            subscription already carries is reflected here. Contains tax only where the price
            itself includes it.
          allOf:
            - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        discount_amount:
          description: The reduction from a discount the account holds.
          allOf:
            - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        tax_amount:
          description: Tax on the discounted amount.
          allOf:
            - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        tax_included_amount:
          description: The part of `tax_amount` already contained in `amount`.
          allOf:
            - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        total:
          description: |-
            What renewing would charge: `amount` less `discount_amount`, plus `tax_amount`, less
            `tax_included_amount`.
          allOf:
            - $ref: ../../type/v1/money.yaml#/components/schemas/Money
      required:
        - index
        - subscription_id
        - price_id
        - interval
        - interval_count
        - periods
        - amount
        - discount_amount
        - tax_amount
        - tax_included_amount
        - total
    QuoteItem:
      description: One calculated purchase item or recorded order item. Amounts use the account currency and are rounded as checkout rounds them. An item with no immediate charge has zero checkout amounts.
      type: object
      properties:
        tax_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: Tax on the discounted amount, including any tax already contained in that amount.
        tax_included_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: The part of tax_amount already contained in amount minus discount_amount.
        index:
          description: Zero-based request line index, or the recorded order item's position for an order quote.
          type: integer
          minimum: 0
        order_item_id:
          description: Present for an existing order quote; identifies the recorded item being priced.
          type: string
          format: uuid
        price_id:
          description: The selected price, including when the request identified it indirectly.
          type: string
          format: uuid
        plan_name:
          type: string
        unit_amount:
          description: Unit price before discounts. Null when no single unit price applies, such as tiered or multiple-rate pricing.
          oneOf:
            - $ref: ../../type/v1/money.yaml#/components/schemas/Money
            - type: "null"
        quantity:
          description: The quantity priced.
          type: string
        amount:
          description: Amount before discounts, including setup charges and any included tax. Zero when there is no immediate charge.
          allOf:
            - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        discount_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: Total reduction on this line, including any committed recurring discount.
        total:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: amount minus discount_amount plus tax_amount minus tax_included_amount.
        currency:
          type: string
      required:
        - index
        - price_id
        - plan_name
        - quantity
        - amount
        - currency
        - discount_amount
        - tax_amount
        - tax_included_amount
        - total
        - unit_amount
    Quote:
      description: A complete price preview, without saving a quote or reserving funds or discount redemptions. Amounts use currency and exclude payment from credit grants or balance. The request fails if any item cannot be priced.
      type: object
      properties:
        subtotal:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: Sum before discounts, excluding tax already included in the item amounts. Zero for a cancellation-only quote.
        discount_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: Total item discounts. Zero for a cancellation-only quote.
        tax_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: Total tax on the discounted amounts. Zero for a cancellation-only quote.
        discount:
          description: The discount evaluated for a purchase or order, without applying it. Null when none is selected or when quoting renewals or a cancellation. A confirmed order reports its recorded discount.
          oneOf:
            - $ref: "#/components/schemas/QuotedDiscount"
            - type: "null"
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuoteItem"
        renewals:
          type: array
          items:
            $ref: "#/components/schemas/QuoteRenewalResult"
        cancellation:
          description: What the cancellation requested would return. Present only when one was requested.
          allOf:
            - $ref: "#/components/schemas/CancellationRefundPreview"
        total:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: |-
            subtotal minus discount_amount plus tax_amount, before applying credit grants or balance.
            For an order quote, pass this as expected_amount when confirming checkout. A renewal list
            sums separate orders; use each renewal's total when confirming that order. Refunds are not
            netted off: a cancellation-only quote has zero totals and its refund is in cancellation.
        currency:
          type: string
        refund:
          description: Present only when an order refund was requested. Nothing is collectible for this target.
          allOf:
            - $ref: "#/components/schemas/OrderRefundQuote"
      required:
        - subtotal
        - discount_amount
        - tax_amount
        - total
        - discount
        - currency
        - items
        - renewals
    QuotedDiscount:
      description: |-
        The discount selected for this calculation. Its presence in a quote does not apply it or
        reserve a redemption. Discount amounts are reported on the quote and its lines.
      type: object
      properties:
        type:
          type: string
          enum:
            - promotion_code
            - account_discount
        name:
          type: string
        promotion_code:
          description: Code text for a promotion_code discount; null for an account_discount.
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 64
      required:
        - type
        - name
        - promotion_code
      additionalProperties: false
    QuoteCancellation:
      description: |-
        A cancellation to quote: what ending these subscriptions together would return. One mode per
        request; to compare, quote `immediate` and `period_end` separately.
      type: object
      properties:
        subscription_ids:
          description: The subscriptions to end together, all of one service. Every subscription released with a resource must be included.
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            format: uuid
        mode:
          $ref: ./prices.yaml#/components/schemas/TerminationPolicy
      required:
        - subscription_ids
        - mode
      additionalProperties: false
    CancellationRefundPreview:
      description: |-
        What the cancellation would return, subscription by subscription and in total, as of now. Give
        `proration_date` and `refundable_amount` when creating the cancellation.

        - `unused_amount`: before tax, the amount paid for the current periods minus the value of the
          time used, valued as refund policy `prorated` describes, whatever the refund terms say.
        - `refundable_amount`: what is returned the way it was paid, including the tax paid on it;
          `refund_amount` plus `credit_amount`.
        - `refund_amount`: the part returned to the balance or to the payment method.
        - `credit_amount`: the part restored to the credit grants that paid.
        - `tax_amount`: the tax included in `refundable_amount`.
        - `forfeited_amount`: before tax, the part of `unused_amount` the refund terms do not return.

        Postpaid and one-time subscriptions show zero; usage until release is charged as usual.
      type: object
      properties:
        mode:
          $ref: ./prices.yaml#/components/schemas/TerminationPolicy
        scheduled_at:
          description: For `period_end`, when release begins, the end of the paid terms.
          type: string
          format: date-time
        proration_date:
          description: For `immediate`, the second the refund is computed as of. Give it when creating the cancellation.
          type: string
          format: date-time
        currency:
          type: string
        unused_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        refundable_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        refund_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        credit_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        tax_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        forfeited_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        items:
          type: array
          items:
            $ref: "#/components/schemas/CancellationRefundPreviewItem"
      required:
        - mode
        - currency
        - unused_amount
        - refundable_amount
        - refund_amount
        - credit_amount
        - tax_amount
        - forfeited_amount
        - items
    CancellationRefundPreviewItem:
      description: One subscription of the quoted cancellation. The amounts mean what they mean in the total.
      type: object
      properties:
        subscription_id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
        plan_name:
          type: string
        project:
          description: The project and its current name, for display. Absent for a purchase at account level, and when the project details cannot be read at the moment.
          oneOf:
            - $ref: ../../type/v1/identity.yaml#/components/schemas/NamedIdentity
            - type: "null"
        billing_type:
          type: string
          enum:
            - postpaid
            - prepaid
            - one_time
        auto_renew:
          description: |-
            Whether automatic renewal is on now. Creating the cancellation turns it off, and withdrawing
            the cancellation does not turn it back on. Always false for a subscription that is not
            `prepaid`.
          type: boolean
        unused_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        refundable_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        refund_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        credit_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        tax_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        forfeited_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
      required:
        - subscription_id
        - plan_id
        - plan_name
        - billing_type
        - auto_renew
        - unused_amount
        - refundable_amount
        - refund_amount
        - credit_amount
        - tax_amount
        - forfeited_amount
    AccountQuoteRequest:
      description: |-
        Quote exactly one target: an existing `order_id`, `renewals` or a `cancellation`. Giving none or
        more than one, or a `promotion_code` with `renewals` or a `cancellation`, fails with HTTP 400
        `BILLING_PURCHASE_INVALID` and `meta.field` naming the offending field. Without a code, an
        applicable account discount is selected. An explicit code is evaluated without reserving or
        consuming a redemption and must be supplied again when confirming checkout through Billing.

        A refund target is quoted on its own and cannot be combined with items, order_id, renewals,
        cancellation, at or promotion_code. The order must belong to the caller's account or project.
        The result estimates a refund without granting eligibility or creating one.
      type: object
      properties:
        order_id:
          description: |-
            Preview checkout of this existing order. Its recorded purchase terms supply every line, and a
            confirmed order returns its recorded amounts. A preview does not change the order.
          type: string
          format: uuid
        renewals:
          description: |-
            Preview renewing these subscriptions, each at most once. Each entry represents a separate
            renewal order. To preview a new promotion code, create a renewal order and quote it by order_id.
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/QuoteRenewal"
        cancellation:
          $ref: "#/components/schemas/QuoteCancellation"
        promotion_code:
          type: string
          minLength: 1
          maxLength: 64
        refund:
          $ref: "#/components/schemas/OrderRefundQuoteInput"
      additionalProperties: false
    EstimateRequest:
      type: object
      properties:
        currency:
          description: Must be one the catalogue publishes.
          type: string
          minLength: 3
          maxLength: 3
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/EstimateItemInput"
      required:
        - currency
        - items
      additionalProperties: false
    EstimateItemInput:
      description: |-
        Identify a price directly, or select a price for a plan. For each resource give its ID or lookup key, never both. Lookup keys require product_id.

        A line that gives a meter, `dimensions` or `duration_seconds` estimates usage and is
        priced only at a postpaid price. Such a line is refused with HTTP 400
        `BILLING_PURCHASE_INVALID` when `price_type` is `prepaid` or `one_time`, or when the price
        it names is not postpaid; `meta.field` is `price_type`, `price_id` or `price_lookup_key`
        accordingly. When the plan has no applicable postpaid price, the estimate fails with a structured error.
      type: object
      properties:
        price_lookup_key:
          type: string
          minLength: 1
          maxLength: 128
        plan_lookup_key:
          type: string
          minLength: 1
          maxLength: 128
        meter_lookup_key:
          type: string
          minLength: 1
          maxLength: 128
        price_id:
          type: string
          format: uuid
        product_id:
          $ref: ./products.yaml#/components/schemas/ProductID
        plan_id:
          type: string
          format: uuid
        meter_id:
          type: string
          format: uuid
        dimensions:
          description: |-
            The attributes the price depends on — region, instance type, token class.

            Required when the price draws its rates from a price list, which is how anything
            sold by region or by machine type is priced. A price that carries a single unit
            amount, or a ladder, has no attributes to give and takes none.

            Every attribute the meter declares must be present. A combination with no rate
            covering it is refused rather than priced at zero.
          type: object
          additionalProperties:
            type: string
        price_type:
          description: Narrows the selection when a plan offers more than one billing type.
          type: string
          enum:
            - postpaid
            - prepaid
            - one_time
        interval:
          type: string
          enum:
            - none
            - day
            - month
            - year
        interval_count:
          type: integer
          minimum: 1
        quantity:
          type: string
          pattern: ^(?:(?:[1-9][0-9]{0,27}|0(?:[1-9][0-9]{0,26}|0(?:[1-9][0-9]{0,25}|0(?:[1-9][0-9]{0,24}|0(?:[1-9][0-9]{0,23}|0(?:[1-9][0-9]{0,22}|0(?:[1-9][0-9]{0,21}|0(?:[1-9][0-9]{0,20}|0(?:[1-9][0-9]{0,19}|0(?:[1-9][0-9]{0,18}|0(?:[1-9][0-9]{0,17}|0(?:[1-9][0-9]{0,16}|0(?:[1-9][0-9]{0,15}|0(?:[1-9][0-9]{0,14}|0(?:[1-9][0-9]{0,13}|0(?:[1-9][0-9]{0,12}|0(?:[1-9][0-9]{0,11}|0(?:[1-9][0-9]{0,10}|0(?:[1-9][0-9]{0,9}|0(?:[1-9][0-9]{0,8}|0(?:[1-9][0-9]{0,7}|0(?:[1-9][0-9]{0,6}|0(?:[1-9][0-9]{0,5}|0(?:[1-9][0-9]{0,4}|0(?:[1-9][0-9]{0,3}|0(?:[1-9][0-9]{0,2}|0(?:[1-9][0-9]{0,1}|0[1-9])))))))))))))))))))))))))))([.][0-9]{1,10})?|0{1,28}[.](?:[1-9][0-9]{0,9}|0(?:[1-9][0-9]{0,8}|0(?:[1-9][0-9]{0,7}|0(?:[1-9][0-9]{0,6}|0(?:[1-9][0-9]{0,5}|0(?:[1-9][0-9]{0,4}|0(?:[1-9][0-9]{0,3}|0(?:[1-9][0-9]{0,2}|0(?:[1-9][0-9]{0,1}|0[1-9]))))))))))$
        duration_seconds:
          description: |-
            For metered items, how long to price for. This allows an estimate such as "about
            this much per month" to be shown before anything exists. The priced quantity is
            `quantity` multiplied by this duration.
          type: integer
          format: int64
      required:
        - quantity
      additionalProperties: false
    EstimateItem:
      description: One calculated public list-price estimate item. Account discounts and tax are not evaluated.
      type: object
      properties:
        tax_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: Tax included in the account quote. Absent in public catalogue estimates.
        tax_included_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: Tax already included in the displayed price. Absent in public catalogue estimates.
        index:
          description: Which line of the request this answers.
          type: integer
        price_id:
          description: The selected price, including when the request identified it indirectly.
          type: string
          format: uuid
        plan_name:
          type: string
        unit_amount:
          description: Unit price before discounts. Null when no single unit price applies, such as tiered or multiple-rate pricing.
          oneOf:
            - $ref: ../../type/v1/money.yaml#/components/schemas/Money
            - type: "null"
        quantity:
          description: |-
            The quantity actually priced. When `duration_seconds` is given, it is the requested
            `quantity` multiplied by that duration.
          type: string
        amount:
          description: Public list-price amount including any setup charges, before account discounts. Not rounded; round only for display.
          allOf:
            - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        currency:
          type: string
      required:
        - index
        - price_id
        - plan_name
        - quantity
        - amount
        - currency
        - unit_amount
    Estimate:
      description: A complete public list-price estimate, before account discounts and tax. Nothing is saved, charged or reserved. The request fails if any item cannot be priced.
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EstimateItem"
        total:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: Sum of public list-price amounts, before account discounts and tax. This is an estimate, not an expected checkout amount.
        currency:
          type: string
      required:
        - items
        - total
        - currency
    QuoteItemInput:
      description: |-
        Identify a price directly, or select a price for a plan. For each resource give its ID or lookup key, never both. Lookup keys require product_id.

        Charges for future usage are not estimated here; the service that sells the product quotes
        them with its purchase.
      type: object
      properties:
        price_lookup_key:
          type: string
          minLength: 1
          maxLength: 128
        plan_lookup_key:
          type: string
          minLength: 1
          maxLength: 128
        price_id:
          type: string
          format: uuid
        product_id:
          $ref: ./products.yaml#/components/schemas/ProductID
        plan_id:
          type: string
          format: uuid
        price_type:
          description: Narrows the selection when a plan offers more than one billing type.
          type: string
          enum:
            - postpaid
            - prepaid
            - one_time
        interval:
          type: string
          enum:
            - none
            - day
            - month
            - year
        interval_count:
          type: integer
          minimum: 1
        quantity:
          type: string
          pattern: ^(?:(?:[1-9][0-9]{0,27}|0(?:[1-9][0-9]{0,26}|0(?:[1-9][0-9]{0,25}|0(?:[1-9][0-9]{0,24}|0(?:[1-9][0-9]{0,23}|0(?:[1-9][0-9]{0,22}|0(?:[1-9][0-9]{0,21}|0(?:[1-9][0-9]{0,20}|0(?:[1-9][0-9]{0,19}|0(?:[1-9][0-9]{0,18}|0(?:[1-9][0-9]{0,17}|0(?:[1-9][0-9]{0,16}|0(?:[1-9][0-9]{0,15}|0(?:[1-9][0-9]{0,14}|0(?:[1-9][0-9]{0,13}|0(?:[1-9][0-9]{0,12}|0(?:[1-9][0-9]{0,11}|0(?:[1-9][0-9]{0,10}|0(?:[1-9][0-9]{0,9}|0(?:[1-9][0-9]{0,8}|0(?:[1-9][0-9]{0,7}|0(?:[1-9][0-9]{0,6}|0(?:[1-9][0-9]{0,5}|0(?:[1-9][0-9]{0,4}|0(?:[1-9][0-9]{0,3}|0(?:[1-9][0-9]{0,2}|0(?:[1-9][0-9]{0,1}|0[1-9])))))))))))))))))))))))))))([.][0-9]{1,10})?|0{1,28}[.](?:[1-9][0-9]{0,9}|0(?:[1-9][0-9]{0,8}|0(?:[1-9][0-9]{0,7}|0(?:[1-9][0-9]{0,6}|0(?:[1-9][0-9]{0,5}|0(?:[1-9][0-9]{0,4}|0(?:[1-9][0-9]{0,3}|0(?:[1-9][0-9]{0,2}|0(?:[1-9][0-9]{0,1}|0[1-9]))))))))))$
      required:
        - quantity
      additionalProperties: false
    ProjectQuoteRequest:
      description: |-
        Quote exactly one target: purchase `lines`, an existing `order_id`, `renewals` or a `cancellation`. Giving none or
        more than one, or a `promotion_code` with `renewals` or a `cancellation`, fails with HTTP 400
        `BILLING_PURCHASE_INVALID` and `meta.field` naming the offending field. Without a code, an
        applicable account discount is selected. An explicit code is evaluated without reserving or
        consuming a redemption and must be supplied again when confirming checkout through Billing.

        A refund target is quoted on its own and cannot be combined with items, order_id, renewals,
        cancellation, at or promotion_code. The order must belong to the caller's account or project.
        The result estimates a refund without granting eligibility or creating one.
      type: object
      properties:
        items:
          description: |-
            A proposed purchase, priced with the project's current billing account. Future usage
            estimates cannot be combined with a promotion code or used as a checkout amount.
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/QuoteItemInput"
        order_id:
          description: |-
            Preview checkout of this existing order. Its recorded purchase terms supply every line, and a
            confirmed order returns its recorded amounts. A preview does not change the order.
          type: string
          format: uuid
        renewals:
          description: |-
            Preview renewing these subscriptions, each at most once. Each entry represents a separate
            renewal order. To preview a new promotion code, create a renewal order and quote it by order_id.
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/QuoteRenewal"
        cancellation:
          $ref: "#/components/schemas/QuoteCancellation"
        promotion_code:
          type: string
          minLength: 1
          maxLength: 64
        refund:
          $ref: "#/components/schemas/OrderRefundQuoteInput"
      additionalProperties: false
    OrderRefundQuoteInput:
      description: An estimate of the refundable value of one order or selected items. This does not cancel the order, stop service or create a refund.
      type: object
      properties:
        order_id:
          type: string
          format: uuid
        order_item_ids:
          description: Estimate only these items. Omit to estimate the whole order. Every item must belong to the order.
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
      required:
        - order_id
      additionalProperties: false
    OrderRefundQuote:
      description: |-
        An estimated refund to original payment sources. Before acceptance, cancellation returns the
        collected amount. For delivered service, only value funded by this order is included; renewals
        are evaluated under their own orders and the agreed termination terms apply. An unknown
        delivery outcome is not evidence that a refund is eligible. This calculation does not create
        a refund; the amount returned is determined when cancellation or termination is confirmed.
      type: object
      properties:
        order_id:
          type: string
          format: uuid
        refundable_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: refund_amount plus credit_amount.
        refund_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: Amount returned to the balance or original payment method.
        credit_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: Amount restored to the credit grants that paid.
        currency:
          type: string
      required:
        - order_id
        - refundable_amount
        - refund_amount
        - credit_amount
        - currency
      additionalProperties: false
