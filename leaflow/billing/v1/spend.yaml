paths:
  /api/v1/projects/{projectId}/spend:
    parameters:
      - $ref: ./openapi.yaml#/components/parameters/ProjectId
    get:
      summary: List project spend
      description: |-
        Covers a closed time range. Both bounds are required: a total without a stated period
        cannot be reconciled against an invoice.

        Includes usage that has not been invoiced yet.
      operationId: list-project-spend
      tags:
        - spend
      security:
        - scopedTokenAuth: []
      parameters:
        - $ref: ./openapi.yaml#/components/parameters/FromRequired
        - $ref: ./openapi.yaml#/components/parameters/ToRequired
        - name: group_by
          in: query
          required: false
          description: |-
            `resource` groups by the resource each charge names. Items billed under their own
            identifier — a disk, a public address — appear as their own rows rather than under
            the machine they are attached to, since the relationship between them is known to
            the owning service and not here.
          schema:
            type: string
            enum:
              - product
              - plan
              - resource
            default: product
        - name: product_id
          in: query
          required: false
          description: Filter by the fixed platform service ID.
          schema:
            $ref: ./products.yaml#/components/schemas/ProductID
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpendRowList"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
components:
  schemas:
    SpendRow:
      type: object
      properties:
        product:
          $ref: ./products.yaml#/components/schemas/Product
        plan_id:
          type: string
          format: uuid
        plan_name:
          type: string
        resource_id:
          description: Present only when grouped by resource.
          type: string
        amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        currency:
          type: string
      required:
        - amount
        - currency
    SpendRowList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SpendRow"
        total:
          description: The sum over the whole period, not only the page returned.
          allOf:
            - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        currency:
          type: string
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
        - items
        - total
        - currency
        - pagination
