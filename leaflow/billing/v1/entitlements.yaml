paths:
  /api/v1/entitlements:
    get:
      summary: List entitlements
      description: |-
        Capabilities that come with what has been bought. A capability that is not held simply
        does not appear, so that "this does not exist" and "this has not been bought" cannot be
        confused.

        Derived from live subscriptions rather than stored, so this always agrees with what is
        being paid for. It stops being listed as soon as the subscription providing it ends.
      operationId: list-entitlements
      tags:
        - entitlements
      parameters:
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
        - $ref: ./openapi.yaml#/components/parameters/AccountIdQuery
        - name: project_id
          in: query
          required: false
          description: |-
            Restrict to one project. Anything bought at account level, such as a membership,
            appears regardless.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitlementList"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/projects/{projectId}/entitlements:
    parameters:
      - $ref: ./openapi.yaml#/components/parameters/ProjectId
    get:
      summary: List project entitlements
      description: |-
        Includes capabilities bought for this project and those the project's billing account holds at
        account level.

        Where a capability counts uses, `remaining_quantity` states how much is left. Whether
        exceeding it refuses the request or simply continues to be charged for is decided by
        the service that owns the capability.
      operationId: list-project-entitlements
      tags:
        - entitlements
      security:
        - scopedTokenAuth: []
      parameters:
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
        - name: product_id
          in: query
          required: false
          description: Filter by ID or lookup key. A lookup key is scoped to the product.
          schema:
            $ref: ./products.yaml#/components/schemas/ProductID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitlementList"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
components:
  schemas:
    Entitlement:
      type: object
      properties:
        product:
          $ref: ./products.yaml#/components/schemas/Product
        feature:
          $ref: ./openapi.yaml#/components/schemas/ObjectIdentity
        name:
          type: string
        enabled:
          type: boolean
        expires_at:
          description: |-
            When the subscription providing it ends. Absent for a metered subscription, which
            has no end date.
          type:
            - string
            - "null"
          format: date-time
      required:
        - product
        - feature
        - enabled
    EntitlementList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Entitlement"
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
        - items
        - pagination
